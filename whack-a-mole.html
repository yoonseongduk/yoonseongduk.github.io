<title>두더지 잡기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* 레이아웃: 위에 점수/시간/최고점, 가운데 3x3 구멍판, 아래 시작 버튼 */
:root {
  --bg: #e9f1df;
  --surface: #ffffff;
  --fg: #26301f;
  --muted: #67735c;
  --line: #cfdcc0;
  --accent: #d9482b;
  --accent-fg: #ffffff;
  --grass: #8cc063;
  --hole: #4a3426;
  --hole-in: #2b1d14;
  --font-display: "Do Hyeon", "Noto Sans KR", sans-serif;
  --font-body: "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #172013; --surface: #223019; --fg: #eaf2df; --muted: #9db08c; --line: #34472a;
    --accent: #ff7a50; --accent-fg: #172013; --grass: #4f7a34; --hole: #2f2118; --hole-in: #150e09;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #172013; --surface: #223019; --fg: #eaf2df; --muted: #9db08c; --line: #34472a;
  --accent: #ff7a50; --accent-fg: #172013; --grass: #4f7a34; --hole: #2f2118; --hole-in: #150e09;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.5;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  user-select: none; -webkit-user-select: none;
}
main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 2rem; margin: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.stat small { display: block; color: var(--muted); font-size: 0.75rem; letter-spacing: 0.08em; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .1s linear; }
.board {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 14px;
  background: var(--grass); border-radius: 18px; touch-action: manipulation;
}
.hole {
  position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 65%, var(--hole-in) 0 55%, var(--hole) 56% 100%);
  overflow: hidden; cursor: pointer;
}
.mole {
  position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(2rem, 13vw, 3.6rem);
  transform: translateY(105%); transition: transform .09s ease-out; pointer-events: none;
}
.hole.up .mole { transform: translateY(8%); }
.hole.hit .mole { transform: translateY(40%) scale(.8); filter: grayscale(.4); }
.hole:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.start {
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 14px; padding: 14px;
  font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 0.04em; cursor: pointer;
}
.start:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.msg { text-align: center; color: var(--muted); margin: 0; min-height: 3em; }
.msg strong { color: var(--fg); }
.hole.gold { box-shadow: 0 0 0 3px #f2b705, 0 0 16px 4px rgba(242,183,5,.7); }
.hole.gold .mole { filter: sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.15); }
.hole.bomb { box-shadow: 0 0 0 3px var(--accent); }
.board.shake { animation: shake .35s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.level {
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 4px; font: inherit; font-weight: 700; cursor: pointer; line-height: 1.3;
}
.level small { display: block; font-weight: 400; color: var(--muted); font-size: 0.72rem; }
.level.active { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.level.active small { color: var(--accent-fg); opacity: .85; }
.level:disabled:not(.active) { opacity: .5; cursor: default; }
.level:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toggle {
  background: var(--surface); color: var(--fg); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 0.9rem; cursor: pointer;
}
.toggle:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin: 0; font-size: 0.9rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .mole { transition: none; } .board.shake { animation: none; } }
</style>

<main>
  <div class="head">
    <h1>두더지 잡기 🐹</h1>
    <button class="toggle" id="sound" type="button">🔊 소리 켬</button>
  </div>
  <div class="levels" id="levels" role="radiogroup" aria-label="난이도"></div>
  <div class="stats">
    <div class="stat"><small>점수</small><b id="score">0</b></div>
    <div class="stat"><small>남은 시간</small><b id="time">30</b></div>
    <div class="stat"><small>최고 점수</small><b id="best">0</b></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="board" id="board"></div>
  <p class="legend"><span>🐹 +1점</span><span>🌟 황금 두더지 +3점</span><span>💣 폭탄 −3점 (건드리지 마세요)</span></p>
  <p class="msg" id="msg">시작 버튼을 누르고, 튀어나오는 두더지를 터치하세요.</p>
  <button class="start" id="start">게임 시작</button>
</main>

<script>
const DURATION = 30;           // 게임 시간(초)
const BEST_KEY = "mole-best-v1";
const $ = id => document.getElementById(id);
const holes = [];
const SOUND_KEY = "mole-sound-v1";
const FACE = { mole: "🐹", gold: "🐹", bomb: "💣" };   // 종류별 모양
let running = false, score = 0, active = -1, kind = "mole", endAt = 0, nextTimer = 0, tickTimer = 0, best = 0;
let soundOn = true, audio = null;
try { soundOn = localStorage.getItem(SOUND_KEY) !== "off"; } catch (e) {}

// 효과음: 파일 없이 브라우저가 직접 만든 소리. [높이(Hz), 길이(초), 파형, 시작 지연(초)]
function beep(notes) {
  if (!soundOn || !audio) return;
  try {
    notes.forEach(([freq, dur, type, delay]) => {
      const t = audio.currentTime + (delay || 0);
      const osc = audio.createOscillator(), gain = audio.createGain();
      osc.type = type || "sine"; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.18, t); gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain); gain.connect(audio.destination);
      osc.start(t); osc.stop(t + dur);
    });
  } catch (e) {}
}
function vibrate(p) { try { if (soundOn && navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function showSound() { $("sound").textContent = soundOn ? "🔊 소리 켬" : "🔇 소리 끔"; }
$("sound").onclick = () => {
  soundOn = !soundOn; showSound();
  try { localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off"); } catch (e) {}
};
showSound();

// 난이도: start/end = 두더지가 머무는 시간(ms, 처음→마지막), gold/bomb = 나올 확률
const LEVELS = {
  easy:   { label: "쉬움",   hint: "느리고 폭탄 적음",   start: 1200, end: 700, gold: 0.15, bomb: 0.10 },
  normal: { label: "보통",   hint: "기본",               start: 900,  end: 450, gold: 0.12, bomb: 0.18 },
  hard:   { label: "어려움", hint: "빠르고 폭탄 많음",   start: 650,  end: 300, gold: 0.10, bomb: 0.28 }
};
const LEVEL_KEY = "mole-level-v1";
let level = "normal";
try { const s = localStorage.getItem(LEVEL_KEY); if (LEVELS[s]) level = s; } catch (e) {}

// 난이도마다 최고 점수를 따로 저장한다 (보통은 예전 기록 키를 그대로 사용)
const bestKey = l => l === "normal" ? BEST_KEY : BEST_KEY + "-" + l;
function loadBest() {
  best = 0;
  try { best = Number(localStorage.getItem(bestKey(level))) || 0; } catch (e) {}
  $("best").textContent = best;
}
function setLevel(l) {
  if (running) return;
  level = l;
  try { localStorage.setItem(LEVEL_KEY, l); } catch (e) {}
  loadBest(); showLevels();
  $("msg").textContent = "난이도: " + LEVELS[l].label + " (" + LEVELS[l].hint + ")";
}
function showLevels() {
  const box = $("levels"); box.innerHTML = "";
  Object.keys(LEVELS).forEach(l => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "level" + (l === level ? " active" : "");
    b.setAttribute("role", "radio"); b.setAttribute("aria-checked", l === level);
    b.disabled = running;
    b.innerHTML = LEVELS[l].label + "<small>" + LEVELS[l].hint + "</small>";
    b.onclick = () => setLevel(l);
    box.append(b);
  });
}
loadBest(); showLevels();

// 구멍 9개 만들기
for (let i = 0; i < 9; i++) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "hole"; b.setAttribute("aria-label", "구멍 " + (i + 1));
  b.innerHTML = '<span class="mole">🐹</span>';
  b.addEventListener("pointerdown", e => { e.preventDefault(); whack(i); });
  b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); whack(i); } });
  $("board").append(b); holes.push(b);
}

function hideAll() { holes.forEach(h => h.classList.remove("up", "hit", "gold", "bomb")); active = -1; }

function popUp() {
  if (!running) return;
  const prev = active;
  hideAll();
  let i; do { i = Math.floor(Math.random() * 9); } while (i === prev);
  // 난이도에 따라 황금/폭탄 확률이 다르고, 나머지는 보통 두더지
  const L = LEVELS[level], r = Math.random();
  kind = r < L.gold ? "gold" : r < L.gold + L.bomb ? "bomb" : "mole";
  active = i;
  holes[i].querySelector(".mole").textContent = FACE[kind];
  holes[i].classList.add("up");
  if (kind !== "mole") holes[i].classList.add(kind);
  // 시간이 갈수록 빨라진다 (start → end). 황금은 더 빨리 사라진다.
  const elapsed = 1 - (endAt - performance.now()) / (DURATION * 1000);
  let stay = L.start - (L.start - L.end) * Math.min(1, Math.max(0, elapsed));
  if (kind === "gold") stay *= 0.7;
  nextTimer = setTimeout(popUp, stay);
}

function whack(i) {
  if (!running || i !== active) return;
  if (kind === "bomb") {
    score = Math.max(0, score - 3);
    beep([[110, 0.35, "sawtooth"], [70, 0.35, "square", 0.05]]); vibrate([120, 60, 200]);
    const b = $("board"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
  } else if (kind === "gold") {
    score += 3;
    beep([[660, 0.1, "triangle"], [880, 0.1, "triangle", 0.09], [1320, 0.18, "triangle", 0.18]]); vibrate(40);
  } else {
    score += 1;
    beep([[520, 0.09, "sine"]]); vibrate(25);
  }
  $("score").textContent = score;
  holes[i].classList.remove("up"); holes[i].classList.add("hit");
  active = -1;
  clearTimeout(nextTimer);
  nextTimer = setTimeout(popUp, 160);   // 잡으면 잠깐 쉬고 다음 두더지
}

function tick() {
  const left = Math.max(0, endAt - performance.now());
  $("time").textContent = Math.ceil(left / 1000);
  $("bar").style.width = (left / (DURATION * 1000) * 100) + "%";
  if (left <= 0) finish();
}

function start() {
  clearTimeout(nextTimer); clearInterval(tickTimer);
  // 소리는 사용자가 버튼을 누른 순간에만 시작할 수 있어서 여기서 준비한다
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  beep([[440, 0.12, "sine"], [660, 0.12, "sine", 0.12]]);
  running = true; score = 0; $("score").textContent = 0; showLevels();
  endAt = performance.now() + DURATION * 1000;
  $("start").disabled = true; $("start").textContent = "진행 중…";
  $("msg").textContent = "두더지를 잡아라!";
  tickTimer = setInterval(tick, 100); tick();
  nextTimer = setTimeout(popUp, 500);
}

function finish() {
  running = false; clearTimeout(nextTimer); clearInterval(tickTimer); hideAll(); showLevels();
  $("time").textContent = 0; $("bar").style.width = "0%";
  let text = "[" + LEVELS[level].label + "] <strong>" + score + "점</strong>을 얻었어요!";
  if (score > best) {
    best = score; $("best").textContent = best; text += " 🎉 최고 기록이에요!";
    try { localStorage.setItem(bestKey(level), String(best)); } catch (e) {}
  }
  $("msg").innerHTML = text;
  beep([[523, 0.15, "sine"], [392, 0.15, "sine", 0.15], [330, 0.3, "sine", 0.3]]);
  $("start").disabled = false; $("start").textContent = "다시 하기";
}

$("start").onclick = start;
</script>
