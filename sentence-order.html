<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문장 순서 맞추기</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(62 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(62 22% 86%);--accent:hsl(62 65% 46%);--accent-fg:#fff;--soft:hsl(62 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(62 22% 10%);--surface:hsl(62 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(62 16% 25%);--accent:hsl(62 75% 68%);--accent-fg:#10131c;--soft:hsl(62 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.line{min-height:56px;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.bank{display:flex;flex-wrap:wrap;gap:8px}.w{padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:1.02rem}.w.on{border-color:var(--accent);background:var(--soft)}.w:disabled{opacity:.3}
</style>
</head>
<body>
<main>
  <h1>문장 순서 맞추기 🧩</h1>
  <div class="stats"><div class="stat"><small>문제</small><b id="no">1/10</b></div><div class="stat"><small>맞힌 수</small><b id="score">0</b></div><div class="stat"><small>최고</small><b id="best">0</b></div></div>
  <div class="card"><small class="muted">내가 만든 문장</small><div class="line" id="line"></div></div>
  <div class="bank" id="bank"></div>
  <div class="row"><button class="btn ghost" id="undo" type="button">⌫ 하나 지우기</button><button class="btn" id="check" type="button">확인</button></div>
  <p class="center" id="msg" style="min-height:1.5em;font-weight:700"></p>
  <button class="btn" id="next" type="button" hidden>다음 문제</button>
  <div class="res" id="res" hidden></div>
  <p class="muted">뒤죽박죽 섞인 <b>낱말 조각을 순서대로 눌러서</b> 올바른 문장을 만들어 보세요. 잘못 눌렀다면 아래 문장에서 조각을 눌러 빼거나, ⌫ 버튼으로 하나씩 지울 수 있어요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "sentence-order-best-v1";
const S = ["나는 오늘 학교에 갔어요", "우리 가족은 주말에 공원에서 놀았어요", "엄마가 맛있는 김치찌개를 끓여 주셨어요", "하늘에 하얀 구름이 둥실 떠 있어요", "동생이 마당에서 강아지와 함께 뛰어놀아요", "할머니께서 시장에서 사과를 사 오셨어요", "비가 오는 날에는 우산을 써야 해요", "나는 친구와 함께 도서관에서 책을 읽었어요", "봄에는 예쁜 꽃이 많이 피어요", "아빠는 매일 아침 일찍 일어나세요", "우리 반 친구들은 운동장에서 축구를 해요", "겨울에는 눈이 내려서 눈사람을 만들 수 있어요", "바닷가에서 조개를 줍고 모래성을 쌓았어요", "선생님께서 숙제를 내 주셨어요", "토끼는 당근을 좋아하고 호랑이는 고기를 좋아해요", "주말에 가족과 함께 영화를 보러 갔어요", "나는 저녁에 샤워를 하고 일찍 잠자리에 들어요", "내일은 소풍을 가는 날이라서 설레요", "세종대왕께서 한글을 만드셨어요", "여름 방학에는 시원한 수박을 먹어요", "버스를 타고 할머니 댁에 갔어요", "우리나라의 수도는 서울이에요", "달은 지구 둘레를 돌고 있어요", "책상 위에 필통과 공책이 놓여 있어요", "오늘 저녁 메뉴는 불고기와 잡채예요", "교실에서는 큰 소리로 떠들면 안 돼요", "강아지가 꼬리를 흔들며 달려와요", "생일 케이크에 초를 꽂고 노래를 불렀어요", "나는 커서 멋진 과학자가 되고 싶어요", "지하철에서는 어른께 자리를 양보해요"];
let qs = [], i = 0, score = 0, best = ld(KEY) || 0, picked = [], words = [], locked = false;
function newRound() { qs = shuf(S).slice(0, 10); i = 0; score = 0; $("res").hidden = true; show(); }
function show() { const s = qs[i]; locked = false; picked = []; words = s.split(" "); let order; do { order = shuf(words.map((w, k) => k)); } while (order.every((v, k) => v === k) && words.length > 1); bank = order; $("msg").textContent = ""; $("next").hidden = true; $("check").hidden = false; $("undo").disabled = false; render(); $("no").textContent = (i + 1) + "/10"; $("score").textContent = score; $("best").textContent = best; }
let bank = [];
function render() {
  $("line").innerHTML = picked.length ? picked.map((k, n) => `<button type="button" class="w on" data-p="${n}">${esc(words[k])}</button>`).join("") : '<span class="muted">아래 조각을 순서대로 눌러 보세요</span>';
  $("bank").innerHTML = bank.map(k => `<button type="button" class="w" data-k="${k}" ${picked.includes(k) ? "disabled" : ""}>${esc(words[k])}</button>`).join("");
}
function check() {
  if (locked) return; if (picked.length < words.length) { $("msg").textContent = "조각을 모두 놓아 주세요"; $("msg").style.color = ""; return; }
  locked = true; const ok = picked.map(k => words[k]).join(" ") === qs[i]; if (ok) score++;
  $("msg").textContent = ok ? "⭕ 정답!" : "❌ 정답: " + qs[i]; $("msg").style.color = ok ? "var(--ok)" : "var(--bad)"; $("score").textContent = score; $("check").hidden = true; $("undo").disabled = true; $("next").textContent = i === 9 ? "결과 보기" : "다음 문제"; $("next").hidden = false;
}
function finish() { let note = ""; if (score > best) { best = score; sv(KEY, best); note = " 🏆 최고 기록이에요!"; } $("next").hidden = true; $("line").textContent = "끝!"; $("bank").innerHTML = ""; $("res").innerHTML = `<b>10문제 중 ${score}개 정답</b><p class="muted">${note}</p><button class="btn" id="again" type="button" style="margin-top:10px;width:100%">다시 하기</button>`; $("res").hidden = false; $("best").textContent = best; $("again").onclick = newRound; }
$("bank").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b && !locked) { picked.push(+b.dataset.k); render(); } });
$("line").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (b && !locked) { picked.splice(+b.dataset.p, 1); render(); } });
$("undo").onclick = () => { if (!locked) { picked.pop(); render(); } }; $("check").onclick = check; $("next").onclick = () => { if (i === 9) finish(); else { i++; show(); } }; newRound();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
