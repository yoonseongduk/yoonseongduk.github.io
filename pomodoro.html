<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뽀모도로 타이머</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(8 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(8 22% 86%);--accent:hsl(8 65% 46%);--accent-fg:#fff;--soft:hsl(8 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(8 22% 10%);--surface:hsl(8 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(8 16% 25%);--accent:hsl(8 75% 68%);--accent-fg:#10131c;--soft:hsl(8 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dial{position:relative;width:min(300px,100%);margin:0 auto}.dial svg{width:100%;transform:rotate(-90deg)}.dial circle{fill:none;stroke-width:8}.dial .bg{stroke:var(--line)}.dial .fg{stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:0;transition:stroke-dashoffset .3s linear}.inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.mode{font-family:var(--font-display);font-size:1.4rem}.time{font-family:var(--font-display);font-size:clamp(3.2rem,18vw,4.4rem);font-variant-numeric:tabular-nums;line-height:1}
</style>
</head>
<body>
<main>
  <h1>뽀모도로 타이머 🍅</h1>
  <div class="seg" id="pre" role="radiogroup" aria-label="시간 설정"></div>
  <div class="dial"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" class="bg"/><circle cx="60" cy="60" r="52" class="fg" id="ring"/></svg><div class="inner"><div class="mode" id="mode">집중</div><div class="time" id="time">25:00</div><div class="muted" id="cnt"></div></div></div>
  <div class="row"><button class="btn" id="go" type="button">시작</button><button class="btn ghost" id="reset" type="button">처음으로</button></div>
  <p class="muted">집중하는 시간과 쉬는 시간을 번갈아 타이머로 알려 줘요. 집중이 끝나면 쉬는 시간이 자동으로 시작돼요. 시작 버튼을 눌러야 소리가 나요. 화면을 켜 두면 가장 정확해요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "pomodoro-v1";
const PRE = { a: { f: 25, b: 5, label: "25 / 5", hint: "기본" }, b: { f: 50, b: 10, label: "50 / 10", hint: "길게" }, c: { f: 15, b: 3, label: "15 / 3", hint: "짧게" } };
let pre = (ld(KEY) in PRE) ? ld(KEY) : "a", mode = "f", left = PRE[pre].f * 60, running = false, endAt = 0, timer = 0, done = 0, audio = null, tempo = 1;
const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");
function beep() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); [660, 880, 660].forEach((f, k) => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = f; g.gain.setValueAtTime(.2, audio.currentTime + k * .22); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + k * .22 + .2); o.connect(g); g.connect(audio.destination); o.start(audio.currentTime + k * .22); o.stop(audio.currentTime + k * .22 + .2); }); navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
const total = () => PRE[pre][mode] * 60;
function tick() { left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000 / tempo)); if (left <= 0) return next(); draw(); }
function next() { beep(); if (mode === "f") done++; mode = mode === "f" ? "b" : "f"; left = total(); endAt = Date.now() + left * 1000 * tempo; draw(); }
function toggle() {
  if (running) { running = false; clearInterval(timer); } else { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {} running = true; endAt = Date.now() + left * 1000 * tempo; timer = setInterval(tick, 250); }
  draw();
}
function reset() { running = false; clearInterval(timer); mode = "f"; left = total(); draw(); }
function draw() {
  $("time").textContent = fmt(left); $("mode").textContent = mode === "f" ? "🍅 집중" : "☕ 휴식"; $("ring").style.strokeDashoffset = 326.7 * (1 - left / total()); $("ring").style.stroke = mode === "f" ? "var(--accent)" : "#2fa05a";
  $("cnt").textContent = done ? `오늘 ${done}번 집중했어요` : ""; $("go").textContent = running ? "일시정지" : (left < total() ? "계속" : "시작"); document.title = running ? fmt(left) + " · 뽀모도로" : "뽀모도로 타이머";
  $("pre").style.setProperty("--n", 3); $("pre").innerHTML = Object.keys(PRE).map(k => `<button type="button" class="${k === pre ? "on" : ""}" data-p="${k}" role="radio" aria-checked="${k === pre}" ${running ? "disabled" : ""}>${PRE[k].label}<small>${PRE[k].hint} (분)</small></button>`).join("");
}
$("pre").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (b && !b.disabled) { pre = b.dataset.p; sv(KEY, pre); reset(); } });
$("go").onclick = toggle; $("reset").onclick = reset; draw();
</script>
</body>
</html>
