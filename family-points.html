<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="person.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가족 포인트</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(45 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(45 22% 86%);--accent:hsl(45 65% 46%);--accent-fg:#fff;--soft:hsl(45 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(45 22% 10%);--surface:hsl(45 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(45 16% 25%);--accent:hsl(45 75% 68%);--accent-fg:#10131c;--soft:hsl(45 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}.note{font-size:.85rem;color:var(--muted)}.rk{font-family:var(--font-display);font-size:1.3rem;min-width:2ch}.pt{font-family:var(--font-display);font-size:1.3rem}.me{background:var(--soft);border-radius:10px;padding:8px 6px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tbl{width:100%;border-collapse:collapse;font-size:.9rem}.tbl td{padding:4px 2px;border-bottom:1px solid var(--line)}.tbl td:last-child{text-align:right;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>가족 포인트 ⭐</h1>
  <div class="card"><b>🏆 가족 포인트 순위</b><div id="rank"></div><div class="note" id="rnote"></div></div>
  <div class="card"><b id="whot">👤 내 포인트</b><div class="g3"><div class="stat"><small>합계</small><b id="s-total">0</b></div><div class="stat"><small>오늘</small><b id="s-today">0</b></div><div class="stat"><small>연속 출석</small><b id="s-streak">0일</b></div></div><div id="log"></div></div>
  <div class="card"><b>📘 포인트는 이렇게 얻어요</b><table class="tbl"><tbody id="rules"></tbody></table><div class="note">게임을 10초 이상 하면 한 판으로 쳐요. 같은 게임은 하루에 몇 번까지만 받아요. 포인트는 이 폰에만 저장되고, 놀이용 숫자라 다른 것으로 바꿀 수 없어요.</div></div>
  <p class="muted">게임을 하면 기본 점수와 가산 점수가 쌓여요. 위쪽 칩에서 누가 하는지 고르면 그 사람의 포인트로 쌓여요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "fg-points-v1";

const P = window.fgPerson;
let titles = {};
const raw = () => { try { return JSON.parse(localStorage.getItem(P.pointsKey)); } catch (e) { return null; } };
const day = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const tname = f => titles[f] || f.replace(/\.html$/, "");
function render() {
  const data = (raw() || {}).p || {}, fam = (() => { try { const a = JSON.parse(localStorage.getItem("family-members-v1")); return Array.isArray(a) ? a : []; } catch (e) { return []; } })();
  const names = [...new Set([...fam, ...Object.keys(data), P.owner()].filter(Boolean))];
  const cur = P.player() || "(이 폰)";
  const rows = names.map(n => ({ n, t: data[n] ? data[n].total : 0 })).sort((a, b) => b.t - a.t);
  $("rank").innerHTML = rows.length ? rows.map((r, i) => `<div class="li${r.n === cur ? " me" : ""}"><span><span class="rk">${i === 0 && r.t > 0 ? "🥇" : i + 1}</span> ${esc(r.n)}</span><span class="pt">${r.t}p</span></div>`).join("") : '<div class="note">아직 포인트가 없어요. 게임을 해 보세요!</div>';
  $("rnote").textContent = P.player() ? "" : "맨 위 칩에서 '누가 하나요?'를 고르면 사람별로 쌓여요.";
  const u = data[cur] || { total: 0, today: {}, bonus: {}, log: [], streak: 0, day: "" };
  $("whot").textContent = "👤 " + cur + "의 포인트";
  const td = day(Date.now()), todayPts = (u.log || []).filter(l => day(l.t) === td).reduce((s, l) => s + l.p, 0);
  $("s-total").textContent = u.total + "p"; $("s-today").textContent = todayPts + "p"; $("s-streak").textContent = (u.day === td || u.lastDay === day(Date.now() - 86400000) ? u.streak : 0) + "일";
  $("log").innerHTML = (u.log || []).slice(-12).reverse().map(l => `<div class="li"><span>${esc(tname(l.f))}<br><span class="note">${esc(l.w)} · ${new Date(l.t).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "numeric", minute: "numeric" })}</span></span><span class="pt">+${l.p}</span></div>`).join("") || '<div class="note">아직 받은 포인트가 없어요.</div>';
}
(function rules() {
  const c = P.cfg;
  const r = [["게임 한 판 (기본)", "+" + c.base + "p"], ["같은 게임 하루 최대", c.perDay + "판"], ["이겼어요·클리어", "+" + c.win + "p"], ["최고 기록 세우기", "+" + c.best + "p"], ["처음 해 보는 게임", "+" + c.first + "p"], ["어려운 게임", "×" + c.hard], ["게임이 정해 주는 점수(맞고 승리)", "한 판 최대 " + c.grantMax + "p"], ["연속 출석(하루마다)", "+" + c.streakStep + "p씩, 최대 " + c.streakMax + "p"]];
  $("rules").innerHTML = r.map(x => `<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("");
})();
render();
fetch("index.html").then(r => r.text()).then(t => { for (const m of t.matchAll(/\["([^"]+\.html)", "[^"]*", "([^"]*)"/g)) titles[m[1]] = m[2]; render(); }).catch(() => {});

</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<script src="med-notify.js" defer></script>
<script src="home.js" defer></script>
</body>
</html>
