<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리듬 탭</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(350 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(350 22% 86%);--accent:hsl(350 65% 46%);--accent-fg:#fff;--soft:hsl(350 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(350 22% 10%);--surface:hsl(350 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(350 16% 25%);--accent:hsl(350 75% 68%);--accent-fg:#10131c;--soft:hsl(350 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lane{position:relative;height:min(52vh,420px);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;background-image:linear-gradient(to right,transparent 24.8%,var(--line) 25%,transparent 25.2%,transparent 49.8%,var(--line) 50%,transparent 50.2%,transparent 74.8%,var(--line) 75%,transparent 75.2%)}.line{position:absolute;left:0;right:0;top:86%;height:4px;margin-top:16px;background:var(--accent)}.note{position:absolute;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:var(--accent);box-shadow:0 2px 0 rgba(0,0,0,.25)}.taps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.taps button{padding:22px 0;border-radius:14px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font-size:1.5rem;touch-action:manipulation}.taps button.p{background:var(--accent);color:var(--accent-fg)}
</style>
</head>
<body>
<main>
  <h1>리듬 탭 🥁</h1>
  <div class="stats"><div class="stat"><small>점수</small><b id="score">0</b></div><div class="stat"><small>콤보</small><b id="combo">0</b></div><div class="stat"><small>하트</small><b id="hp">❤️❤️❤️</b></div></div>
  <div class="lane" id="lane"><div class="line"></div></div>
  <div class="taps" id="taps"><button type="button" data-l="0">●</button><button type="button" data-l="1">●</button><button type="button" data-l="2">●</button><button type="button" data-l="3">●</button></div>
  <p class="center" id="msg" style="min-height:1.5em;font-weight:700"></p>
  <div class="res" id="res" hidden></div>
  <button class="btn" id="start" type="button">시작</button>
  <p class="muted">위에서 <b>내려오는 동그라미가 아래 선에 닿을 때</b> 그 줄을 눌러 보세요. 정확할수록 높은 점수! 놓치면 하트가 줄고, 하트 3개를 모두 잃으면 끝이에요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "rhythmtap-best-v1";
const LANES = 4, FALL = 1.6;   // FALL: 위에서 아래 선까지 내려오는 시간(초)
let notes = [], score = 0, combo = 0, maxCombo = 0, hp = 3, run = false, last = 0, spawnT = 0, gapT = 0.7, best = ld(KEY) || 0, raf = 0, tempo = 1, el = {};
function reset() { notes = []; score = 0; combo = 0; maxCombo = 0; hp = 3; spawnT = 0.6; gapT = 0.75; $("lane").querySelectorAll(".note").forEach(n => n.remove()); upd(); }
function upd() { $("score").textContent = score; $("combo").textContent = combo; $("hp").textContent = "❤️".repeat(hp) + "🖤".repeat(3 - hp); }
function spawn() { const l = ri(0, LANES - 1), d = document.createElement("div"); d.className = "note"; d.style.left = (l * 25 + 12.5) + "%"; $("lane").appendChild(d); notes.push({ l, t: 0, d }); }
function update(dt) {
  if (!run) return; spawnT -= dt; if (spawnT <= 0) { spawn(); gapT = Math.max(0.32, gapT - 0.008); spawnT = gapT * (0.8 + Math.random() * 0.5); }
  for (const n of notes) { n.t += dt / FALL; n.d.style.top = (n.t * 86) + "%"; }
  for (let k = notes.length - 1; k >= 0; k--) if (notes[k].t > 1.18) { notes[k].d.remove(); notes.splice(k, 1); miss(); }
}
function miss() { combo = 0; hp--; flash("놓쳤어요!", false); upd(); if (hp <= 0) end(); }
function flash(t, ok) { $("msg").textContent = t; $("msg").style.color = ok ? "var(--ok)" : "var(--bad)"; }
function hit(l) {
  if (!run) return; const c = notes.filter(n => n.l === l).sort((a, b) => Math.abs(a.t - 1) - Math.abs(b.t - 1))[0]; if (!c) { combo = 0; flash("빈 줄!", false); upd(); return; }
  const diff = Math.abs(c.t - 1) * FALL;      // 초 단위 오차
  if (diff > 0.28) { combo = 0; flash("너무 일러요", false); upd(); return; }
  const pts = diff < 0.07 ? 100 : diff < 0.15 ? 60 : 30; combo++; maxCombo = Math.max(maxCombo, combo); score += pts + Math.min(combo, 20) * 2; flash(diff < 0.07 ? "완벽! ✨" : diff < 0.15 ? "좋아요!" : "조금 어긋났어요", true);
  c.d.remove(); notes.splice(notes.indexOf(c), 1); upd();
}
function loop(ts) { if (!run) return; const dt = Math.min(0.05, (ts - last) / 1000 * tempo); last = ts; update(dt); raf = requestAnimationFrame(loop); }
function start() { reset(); run = true; $("res").hidden = true; $("start").hidden = true; flash("", true); last = performance.now(); raf = requestAnimationFrame(loop); }
function end() { run = false; cancelAnimationFrame(raf); let note = ""; if (score > best) { best = score; sv(KEY, best); note = " 🏆 최고 기록이에요!"; } $("res").innerHTML = `<b>${score}점!</b><p class="muted">최고 콤보 ${maxCombo} · 최고 점수 ${best}${note}</p>`; $("res").hidden = false; $("start").hidden = false; $("start").textContent = "다시 하기"; }
$("taps").addEventListener("pointerdown", e => { const b = e.target.closest("[data-l]"); if (b) { e.preventDefault(); hit(+b.dataset.l); b.classList.add("p"); setTimeout(() => b.classList.remove("p"), 90); } });
$("start").onclick = start; upd();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
