<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구구단 스피드</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(48 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(48 22% 86%);--accent:hsl(48 65% 46%);--accent-fg:#fff;--soft:hsl(48 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(48 22% 10%);--surface:hsl(48 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(48 16% 25%);--accent:hsl(48 75% 68%);--accent-fg:#10131c;--soft:hsl(48 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pad button{padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-display);font-size:1.5rem;min-width:0}.pad .okb{background:var(--accent);color:var(--accent-fg);border:0}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.9rem}.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:700}
</style>
</head>
<body>
<main>
  <h1>구구단 스피드 ✖️</h1>
  <div class="chips" id="dans"></div>
  <div class="stats"><div class="stat"><small>남은 시간</small><b id="time">60</b></div><div class="stat"><small>맞힌 수</small><b id="score">0</b></div><div class="stat"><small>최고</small><b id="best">0</b></div></div>
  <div class="card center"><p class="big" id="q">준비</p><p class="big" id="ans" style="color:var(--accent);min-height:1.3em"></p></div>
  <div class="pad" id="pad"></div>
  <div class="res" id="res" hidden></div>
  <button class="btn" id="start" type="button">시작</button>
  <p class="muted">구구단 문제를 <b>60초 동안 최대한 많이</b> 풀어 보세요! 숫자 키패드로 답을 입력하고 ✔를 누르거나, 정답 자릿수가 다 차면 자동으로 넘어가요. 단을 골라서 연습할 수도 있어요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "timestable-best-v1";
let dans = new Set([2, 3, 4, 5, 6, 7, 8, 9]), a = 0, b = 0, typed = "", score = 0, sec = 60, run = false, timer = 0, best = ld(KEY) || 0, tempo = 1, tries = 0;
function chips() { $("dans").innerHTML = [2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button type="button" class="chip${dans.has(d) ? " on" : ""}" data-d="${d}">${d}단</button>`).join(""); }
function nextQ() { const ds = [...dans]; a = ds[ri(0, ds.length - 1)]; b = ri(1, 9); typed = ""; $("q").textContent = `${a} × ${b} = ?`; $("ans").textContent = ""; }
function start() { if (!dans.size) return; score = 0; tries = 0; sec = 60; run = true; $("res").hidden = true; $("start").hidden = true; nextQ(); upd(); clearInterval(timer); timer = setInterval(() => { sec--; upd(); if (sec <= 0) end(); }, 1000 * tempo); }
function upd() { $("score").textContent = score; $("time").textContent = sec; $("best").textContent = best; }
function key(v) {
  if (!run) return; if (v === "x") { typed = typed.slice(0, -1); } else if (v === "ok") { submit(); return; } else if (typed.length < 2) typed += v; $("ans").textContent = typed;
  if (typed.length === String(a * b).length) submit();
}
function submit() { if (!typed) return; tries++; const ok = +typed === a * b; if (ok) score++; $("ans").style.color = ok ? "var(--ok)" : "var(--bad)"; upd(); setTimeout(() => { $("ans").style.color = "var(--accent)"; if (run) nextQ(); }, 120 * tempo); typed = ""; }
function end() { run = false; clearInterval(timer); let note = ""; if (dans.size === 8 && score > best) { best = score; sv(KEY, best); note = " 🏆 최고 기록이에요!"; } $("res").innerHTML = `<b>${score}개 맞혔어요!</b><p class="muted">푼 문제 ${tries}개 · 정확도 ${tries ? Math.round(score / tries * 100) : 0}%${note}</p>`; $("res").hidden = false; $("start").hidden = false; $("start").textContent = "다시 하기"; $("q").textContent = "끝!"; $("ans").textContent = ""; upd(); }
$("pad").innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(n => `<button type="button" data-v="${n}">${n}</button>`).join("") + `<button type="button" data-v="x">⌫</button><button type="button" data-v="ok" class="okb">✔</button>`;
$("pad").addEventListener("pointerdown", e => { const t = e.target.closest("[data-v]"); if (t) { e.preventDefault(); key(t.dataset.v); } });
$("dans").addEventListener("click", e => { const t = e.target.closest("[data-d]"); if (t && !run) { const d = +t.dataset.d; dans.has(d) ? dans.delete(d) : dans.add(d); chips(); } });
$("start").onclick = start; chips(); upd();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
