<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>초성 퀴즈</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 점수 줄, 분류 힌트와 큰 초성, 정답 입력칸, 힌트·넘기기 버튼. 10문제를 풀면 결과가 나온다 */
:root{--bg:#f1f3f8;--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:#d8deea;--accent:#e8643f;--accent-fg:#fff;--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10131c;--surface:#1a1f2e;--fg:#e9edf7;--muted:#97a1b9;--line:#2c3448;--accent:#ff7f5a;--accent-fg:#10131c;--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:12px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.cat{display:inline-block;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:2px 14px;font-weight:700;font-size:.9rem}
.cho{font-family:var(--font-display);font-size:clamp(2.6rem,15vw,4rem);letter-spacing:.12em;margin:10px 0 2px;padding-left:.12em;line-height:1.2}
.len{color:var(--muted);font-size:.9rem}
input[type=text]{width:100%;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:1.3rem;text-align:center}
.fb{min-height:2.8em;font-weight:700}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
</style>
</head>
<body>
<main>
  <h1>초성 퀴즈 🔤</h1>
  <div class="stats"><div class="stat"><small>문제</small><b id="no">0/10</b></div><div class="stat"><small>점수</small><b id="score">0</b></div><div class="stat"><small>최고</small><b id="best">0</b></div></div>
  <div class="card" id="qcard"></div>
  <div id="play">
    <input type="text" id="ans" placeholder="정답을 쓰세요" autocomplete="off" aria-label="정답">
    <p class="fb" id="fb" aria-live="polite"></p>
    <div class="row"><button class="btn" id="ok" type="button">확인</button><button class="btn ghost" id="hint" type="button">💡 힌트 (첫 글자)</button></div>
    <button class="btn ghost" id="skip" type="button" style="margin-top:8px;width:100%">모르겠어요, 넘기기</button>
  </div>
  <div class="card res" id="res" hidden></div>
  <button class="btn" id="again" type="button" hidden>다시 하기</button>
  <p class="muted">초성(첫 자음)만 보고 분류에 맞는 단어를 맞혀 보세요. 맞히면 1점, 힌트를 쓰면 0.5점이에요. 띄어쓰기는 상관없어요.</p>
</main>
<script>
const WORDS = {
  "음식": "김치찌개 비빔밥 떡볶이 불고기 삼겹살 냉면 라면 짜장면 탕수육 김밥 순두부 된장찌개 잡채 치킨 피자 갈비탕 만두 햄버거",
  "동물": "코끼리 기린 호랑이 토끼 강아지 고양이 원숭이 다람쥐 펭귄 고래 독수리 하마 사자 거북이 얼룩말",
  "과일": "사과 바나나 딸기 수박 포도 복숭아 참외 파인애플 망고 오렌지 레몬 키위",
  "나라": "대한민국 일본 중국 미국 영국 프랑스 독일 이탈리아 호주 캐나다 브라질 인도 스페인 태국 이집트",
  "직업": "의사 선생님 경찰관 소방관 요리사 가수 화가 변호사 농부 간호사 운동선수 과학자 기자",
  "사물": "냉장고 세탁기 텔레비전 우산 연필 가방 시계 안경 자전거 청소기 가위 지우개 컴퓨터",
  "장소": "도서관 학교 병원 공원 놀이공원 박물관 시장 백화점 은행 영화관 수영장 동물원 공항"
};
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const cho = s => [...s].map(ch => { const c = ch.charCodeAt(0) - 0xAC00; return c >= 0 && c < 11172 ? CHO[Math.floor(c / 588)] : ch; }).join("");
const ALL = Object.entries(WORDS).flatMap(([cat, ws]) => ws.split(" ").map(w => ({ cat, w, c: cho(w) })));
const $ = id => document.getElementById(id), KEY = "chosung-best-v1";
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let qs = [], i = 0, score = 0, hinted = false, answered = false, best = ld(KEY) || 0;
const norm = s => s.replace(/\s+/g, "");

function start() {
  qs = [...ALL].sort(() => Math.random() - .5).slice(0, 10); i = 0; score = 0; $("res").hidden = true; $("again").hidden = true; $("play").hidden = false; show();
}
function show() {
  const q = qs[i]; hinted = false; answered = false; $("ans").value = ""; $("ans").disabled = false; $("fb").textContent = ""; $("fb").className = "fb";
  $("qcard").innerHTML = `<span class="cat">${q.cat}</span><div class="cho">${[...q.c].join(" ")}</div><div class="len">${[...q.w].length}글자</div>`;
  $("no").textContent = (i + 1) + "/10"; $("score").textContent = score; $("best").textContent = best; $("ans").focus();
}
function check() {
  if (answered) return next(); const q = qs[i], v = norm($("ans").value); if (!v) return;
  // 같은 분류에서 초성이 같은 다른 단어도 정답으로 인정한다
  const ok = v === q.w || ALL.some(x => x.cat === q.cat && x.c === q.c && x.w === v);
  answered = true; $("ans").disabled = true;
  if (ok) { score += hinted ? .5 : 1; $("fb").textContent = "🎉 정답! " + v; $("fb").className = "fb ok"; }
  else { $("fb").textContent = "아쉬워요. 정답은 " + q.w; $("fb").className = "fb bad"; }
  $("score").textContent = score; $("ok").textContent = i === 9 ? "결과 보기" : "다음 문제";
}
function next() { $("ok").textContent = "확인"; if (i === 9) return finish(); i++; show(); }
function finish() {
  $("play").hidden = true; let note = ""; if (score > best) { best = score; sv(KEY, best); note = " 🏆 최고 기록이에요!"; }
  $("qcard").innerHTML = ""; $("res").innerHTML = `<b>10문제 중 ${score}점</b><p class="muted">${score >= 9 ? "초성 박사님! 🎓" : score >= 6 ? "잘했어요 👍" : "다음엔 더 잘할 수 있어요 💪"}${note}</p>`; $("res").hidden = false; $("again").hidden = false; $("best").textContent = best;
}
$("ok").onclick = check;
$("ans").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); check(); } });
$("hint").onclick = () => { if (answered) return; const q = qs[i]; hinted = true; $("fb").textContent = `💡 첫 글자는 "${q.w[0]}" (이 문제는 0.5점)`; $("fb").className = "fb"; $("ans").focus(); };
$("skip").onclick = () => { if (answered) return next(); const q = qs[i]; answered = true; $("ans").disabled = true; $("fb").textContent = "정답은 " + q.w; $("fb").className = "fb bad"; $("ok").textContent = i === 9 ? "결과 보기" : "다음 문제"; };
$("again").onclick = start;
start();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
