<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사자성어 퀴즈</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
/* 레이아웃: (분류 버튼), 점수 줄, 문제 카드, 네 개의 보기. 고르면 정답이 바로 표시되고 10문제를 풀면 결과가 나온다 */
:root{--bg:hsl(20 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(20 22% 86%);--accent:hsl(20 60% 42%);--accent-fg:#fff;--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(20 22% 10%);--surface:hsl(20 20% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(20 18% 24%);--accent:hsl(20 75% 68%);--accent-fg:#10131c;--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.9rem}.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:12px;font-family:var(--font-display);font-size:1.3rem}
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 16px;text-align:center;font-family:var(--font-display);font-size:clamp(1.5rem,7vw,2.1rem);line-height:1.4;overflow-wrap:anywhere}
.q small{display:block;color:var(--accent);font-family:var(--font-body);font-weight:700;font-size:.85rem;margin-bottom:4px}
.q .hanja{display:block;font-size:clamp(2rem,11vw,3rem);color:var(--accent);font-weight:400;margin-top:6px;letter-spacing:.08em;line-height:1.25}
.q .note.eg{background:var(--soft);border-radius:10px;padding:8px 10px;color:var(--fg)}
.q .note.eg{background:var(--soft);border-radius:10px;padding:8px 10px;color:var(--fg)}
.q .note.eg{background:var(--soft);border-radius:10px;padding:8px 10px;color:var(--fg)}
.q .note{display:block;color:var(--muted);font-family:var(--font-body);font-size:.9rem;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts.one{grid-template-columns:1fr}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;min-height:58px;padding:8px 10px;font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}.opt:disabled{cursor:default}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
</style>
</head>
<body>
<main>
  <h1>사자성어 퀴즈 📖</h1>
  <div class="chips" id="cats" role="group" aria-label="분류" hidden></div>
  <div class="stats"><div class="stat"><small>문제</small><b id="no">0/10</b></div><div class="stat"><small>맞힌 수</small><b id="score">0</b></div><div class="stat"><small>최고</small><b id="best">0</b></div></div>
  <div class="q" id="q"></div>
  <div class="opts" id="opts"></div>
  <div class="res" id="res" hidden></div>
  <button class="btn" id="next" type="button" hidden>다음 문제</button>
  <p class="muted">사자성어의 뜻을 맞혀 보세요. 정답을 고르면 한자와 풀이, 쓰이는 예시가 나와요. 사자성어 306개가 들어 있어요.</p>
</main>
<script>
// [사자성어, 뜻, 틀린 보기(비우면 다른 성어의 뜻에서 뽑음), 분류, 한자·풀이, 쓰이는 예시]
const D = [["일석이조", "한 가지 일로 두 가지 이익을 얻음", [], "", "一石二鳥 · 한 개의 돌로 두 마리의 새를 잡는다는 뜻이에요.", "자전거로 학교에 다니면 운동도 되고 차비도 아낄 수 있어요. 일석이조네요."], ["유비무환", "미리 준비해 두면 걱정할 것이 없음", [], "", "有備無患 · 준비가 되어 있으면 근심이 없다는 뜻이에요.", "비 올 것에 대비해 우산을 챙겼더니 하나도 안 젖었어요. 유비무환이에요."], ["다다익선", "많을수록 더 좋음", [], "", "多多益善 · 많으면 많을수록 더 좋다는 뜻이에요.", "친구는 많을수록 좋다는 다다익선 정신으로 새 친구를 사귀었어요."], ["동문서답", "묻는 말과 상관없는 엉뚱한 대답", [], "", "東問西答 · 동쪽을 물었는데 서쪽으로 대답한다는 뜻이에요.", "\"몇 시야?\"라고 물었는데 \"배고파\"라고 대답해서 동문서답이었어요."], ["이심전심", "말하지 않아도 마음이 서로 통함", [], "", "以心傳心 · 마음으로 마음을 전한다는 뜻이에요.", "짝꿍과 같은 간식을 동시에 집었어요. 이심전심이네요."], ["작심삼일", "결심이 사흘을 가지 못함", [], "", "作心三日 · 마음먹은 것이 삼 일밖에 가지 못한다는 뜻이에요.", "새해에 세운 운동 결심이 작심삼일로 끝났어요."], ["고진감래", "고생 끝에 즐거움이 옴", [], "", "苦盡甘來 · 쓴 것이 다하면 단 것이 온다는 뜻이에요.", "힘든 훈련 끝에 우승했어요. 고진감래예요."], ["어부지리", "둘이 다투는 사이에 제삼자가 이익을 봄", [], "", "漁夫之利 · 도요새와 조개가 싸우는 사이 어부가 둘 다 잡았다는 이야기에서 나왔어요.", "두 형이 싸우는 사이에 내가 간식을 다 먹었어요. 어부지리죠."], ["우공이산", "꾸준히 노력하면 큰일도 이룰 수 있음", [], "", "愚公移山 · 우공이라는 노인이 산을 옮기려 했다는 이야기에서 나왔어요.", "매일 조금씩 연습해서 어려운 곡을 칠 수 있게 됐어요. 우공이산이에요."], ["설상가상", "어려운 일이 겹쳐서 일어남", [], "", "雪上加霜 · 눈 위에 서리가 더 내린다는 뜻이에요.", "비가 오는데 우산까지 고장 났어요. 설상가상이에요."], ["십시일반", "여럿이 조금씩 힘을 모아 한 사람을 도움", [], "", "十匙一飯 · 열 사람이 한 숟가락씩 덜면 밥 한 그릇이 된다는 뜻이에요.", "반 친구들이 조금씩 모아 아픈 친구를 도왔어요. 십시일반이에요."], ["자포자기", "스스로 희망을 버리고 포기함", [], "", "自暴自棄 · 스스로 해치고 스스로 버린다는 뜻이에요.", "한 번 졌다고 자포자기하지 말고 다시 도전해 봐요."], ["금상첨화", "좋은 일에 또 좋은 일이 더해짐", [], "", "錦上添花 · 비단 위에 꽃을 더한다는 뜻이에요.", "생일에 선물도 받고 깜짝 파티까지 했어요. 금상첨화예요."], ["백문불여일견", "백 번 듣는 것보다 한 번 보는 것이 낫다", [], "", "百聞不如一見 · 백 번 듣는 것은 한 번 보는 것만 못하다는 뜻이에요.", "설명만 들었을 땐 몰랐는데 직접 보니 바로 이해했어요. 백문불여일견이에요."], ["새옹지마", "인생의 좋고 나쁨은 예측할 수 없음", [], "", "塞翁之馬 · 변방 노인의 말이 복이 되었다가 화가 되었다가 한 이야기에서 나왔어요.", "넘어져서 다쳤지만 덕분에 푹 쉬었어요. 새옹지마라더니!"], ["오비이락", "우연히 일이 겹쳐 의심을 받음", [], "", "烏飛梨落 · 까마귀가 날자 배가 떨어졌다는 뜻이에요.", "내가 방을 나가자마자 컵이 깨져서 오해를 받았어요. 오비이락이에요."], ["적반하장", "잘못한 사람이 오히려 큰소리를 침", [], "", "賊反荷杖 · 도둑이 도리어 몽둥이를 든다는 뜻이에요.", "먼저 새치기해 놓고 오히려 화를 내니 적반하장이에요."], ["전화위복", "나쁜 일이 오히려 좋은 일이 됨", [], "", "轉禍爲福 · 재앙이 바뀌어 복이 된다는 뜻이에요.", "시험에 떨어진 덕분에 더 열심히 공부하게 됐어요. 전화위복이에요."], ["토사구팽", "쓸모가 있을 때는 쓰고 필요 없으면 버림", [], "", "兎死狗烹 · 토끼를 잡고 나면 사냥개를 삶아 먹는다는 뜻이에요.", "도움을 받을 땐 친한 척하더니 일이 끝나자 모른 척해요. 토사구팽이에요."], ["호가호위", "남의 힘을 빌려 위세를 부림", [], "", "狐假虎威 · 여우가 호랑이의 위세를 빌려 거드름을 피운다는 뜻이에요.", "형이 센 친구라고 동생이 자기가 센 척해요. 호가호위예요."], ["대기만성", "큰 인물은 늦게 이루어짐", [], "", "大器晩成 · 큰 그릇은 만드는 데 오래 걸린다는 뜻이에요.", "늦게 시작했지만 결국 훌륭한 화가가 되었어요. 대기만성이에요."], ["일취월장", "날마다 달마다 발전함", [], "", "日就月將 · 날로 나아가고 달로 나아간다는 뜻이에요.", "매일 연습하더니 피아노 실력이 일취월장했어요."], ["막상막하", "실력이 비슷해서 낫고 못함을 가리기 어려움", [], "", "莫上莫下 · 위도 아래도 없다는 뜻이에요.", "두 선수의 실력이 막상막하라 끝까지 승부를 알 수 없었어요."], ["권선징악", "착한 일은 권하고 악한 일은 벌줌", [], "", "勸善懲惡 · 착함을 권하고 악함을 벌한다는 뜻이에요.", "흥부와 놀부 이야기는 권선징악을 가르쳐 줘요."], ["두문불출", "집에만 있고 바깥출입을 하지 않음", [], "", "杜門不出 · 문을 닫고 나가지 않는다는 뜻이에요.", "감기에 걸려서 며칠 동안 두문불출했어요."], ["결자해지", "일을 저지른 사람이 해결해야 함", [], "", "結者解之 · 맺은 사람이 푼다는 뜻이에요.", "내가 어지럽힌 방은 내가 치워야죠. 결자해지예요."], ["오리무중", "짙은 안개 속처럼 방향을 알 수 없음", [], "", "五里霧中 · 오 리(약 2km)에 걸쳐 안개가 낀 속이라는 뜻이에요.", "잃어버린 지갑의 행방이 오리무중이에요."], ["죽마고우", "어릴 때부터 같이 놀며 자란 친구", [], "", "竹馬故友 · 대나무 말을 타고 놀던 옛 친구라는 뜻이에요.", "유치원 때부터 함께한 그 친구는 나의 죽마고우예요."], ["함흥차사", "심부름을 가서 소식이 없거나 아주 늦음", [], "", "咸興差使 · 함흥으로 보낸 사신이 돌아오지 않았다는 이야기에서 나왔어요.", "심부름 보낸 동생이 한 시간째 안 와요. 완전 함흥차사예요."], ["조삼모사", "눈앞의 차이에 속아 결과가 같은 것을 모름", [], "", "朝三暮四 · 아침에 세 개 저녁에 네 개를 준다는 원숭이 이야기에서 나왔어요.", "결국 같은 금액인데 이름만 바꿔 놓고 좋아하다니 조삼모사네요."], ["각골난망", "은혜를 뼛속 깊이 새겨 잊지 않음", [], "", "刻骨難忘 · 뼈에 새겨 잊기 어렵다는 뜻이에요.", "힘들 때 도와주신 선생님의 은혜는 각골난망이에요."], ["감탄고토", "자기 입맛에 맞으면 취하고 아니면 버림", [], "", "甘呑苦吐 · 달면 삼키고 쓰면 뱉는다는 뜻이에요.", "필요할 때만 찾다가 필요 없으면 모른 척하는 건 감탄고토예요."], ["개과천선", "잘못을 고치고 착해짐", [], "", "改過遷善 · 잘못을 고쳐 착하게 바뀐다는 뜻이에요.", "장난꾸러기였던 친구가 개과천선해서 모범생이 되었어요."], ["거두절미", "군더더기를 빼고 요점만 말함", [], "", "去頭截尾 · 머리와 꼬리를 잘라 버린다는 뜻이에요.", "시간이 없으니 거두절미하고 결론부터 말할게요."], ["견물생심", "물건을 보면 갖고 싶은 마음이 생김", [], "", "見物生心 · 물건을 보면 마음이 생긴다는 뜻이에요.", "가게 앞을 지나다 예쁜 인형을 보니 견물생심이 들었어요."], ["결초보은", "죽어서도 은혜를 갚음", [], "", "結草報恩 · 풀을 묶어 은혜를 갚는다는 이야기에서 나왔어요.", "도와주신 은혜를 결초보은하겠습니다."], ["경거망동", "가볍 }
