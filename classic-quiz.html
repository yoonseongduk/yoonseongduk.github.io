975·러시아)의 행진곡·무곡이에요. 1938에 만들었어요."], ["다음 중 ‘새뮤얼 바버’의 작품은?", "현을 위한 아다지오", ["교향곡 7번 '레닌그라드'", "자장가", "봄의 제전"], "근현대", "새뮤얼 바버(1910~1981·미국)의 관현악곡이에요. 1936에 만들었어요."], ["‘요한 제바스티안 바흐’은(는) 어느 나라의 작곡가일까요?", "독일", ["미국", "러시아", "영국"], "바로크", "요한 제바스티안 바흐(Johann Sebastian Bach, 1685~1750) — '음악의 아버지'라 불려요. 여러 선율이 겹치는 푸가와 오르간·건반 음악, 교회 음악을 많이 남겼어요."], ["‘안토니오 비발디’은(는) 어느 나라의 작곡가일까요?", "이탈리아", ["러시아", "폴란드", "미국"], "바로크", "안토니오 비발디(Antonio Vivaldi, 1678~1741) — '붉은 머리 사제'라 불린 바이올린의 명인이에요. 협주곡을 400곡 가까이 남겼어요."], ["‘요한 파헬벨’은(는) 어느 나라의 작곡가일까요?", "독일", ["프랑스", "체코", "이탈리아"], "바로크", "요한 파헬벨(Johann Pachelbel, 1653~1706) — 오르간 연주자이자 작곡가예요. 같은 흐름이 되풀이되는 '캐논'으로 가장 널리 알려졌어요."], ["‘요제프 하이든’은(는) 어느 나라의 작곡가일까요?", "오스트리아", ["영국", "독일", "이탈리아"], "고전", "요제프 하이든(Joseph Haydn, 1732~1809) — '교향곡의 아버지'라 불려요. 교향곡을 100곡 넘게 썼고 모차르트·베토벤과도 교류했어요."], ["‘볼프강 아마데우스 모차르트’은(는) 어느 나라의 작곡가일까요?", "오스트리아", ["핀란드", "헝가리", "프랑스"], "고전", "볼프강 아마데우스 모차르트(Wolfgang Amadeus Mozart, 1756~1791) — 어릴 때부터 천재로 이름났고 35년의 짧은 삶 동안 오페라·교향곡·협주곡 등 모든 갈래에 걸작을 남겼어요."], ["‘루트비히 판 베토벤’은(는) 어느 나라의 작곡가일까요?", "독일", ["핀란드", "헝가리", "프랑스"], "고전", "루트비히 판 베토벤(Ludwig van Beethoven, 1770~1827) — 귀가 들리지 않게 된 뒤에도 작곡을 이어 간 거장이에요. 고전 음악을 완성하고 낭만 음악의 문을 열었어요."], ["‘프란츠 슈베르트’은(는) 어느 나라의 작곡가일까요?", "오스트리아", ["핀란드", "이탈리아", "폴란드"], "낭만", "프란츠 슈베르트(Franz Schubert, 1797~1828) — 31살에 세상을 떠났지만 가곡을 600곡 넘게 남겨 '가곡의 왕'이라 불려요."], ["‘조아키노 로시니’은(는) 어느 나라의 작곡가일까요?", "이탈리아", ["체코", "독일", "영국"], "낭만", "조아키노 로시니(Gioachino Rossini, 1792~1868) — 경쾌하고 재치 있는 희극 오페라의 대가예요. 요리를 좋아한 미식가로도 유명해요."], ["‘펠릭스 멘델스존’은(는) 어느 나라의 작곡가일까요?", "독일", ["영국", "이탈리아", "폴란드"], "낭만", "펠릭스 멘델스존(Felix Mendelssohn, 1809~1847) — 부유한 집안에서 자란 신동으로, 17살에 '한여름 밤의 꿈' 서곡을 썼어요. 바흐의 음악을 다시 세상에 알렸어요."], ["‘프레데리크 쇼팽’은(는) 어느 나라의 작곡가일까요?", "폴란드", ["핀란드", "영국", "노르웨이"], "낭만", "프레데리크 쇼팽(Frédéric Chopin, 1810~1849) — '피아노의 시인'이라 불려요. 거의 피아노 곡만 썼고 폴란드의 정서를 담은 곡이 많아요."], ["‘로베르트 슈만’은(는) 어느 나라의 작곡가일까요?", "독일", ["영국", "미국", "이탈리아"], "낭만", "로베르트 슈만(Robert Schumann, 1810~1856) — 피아노 곡과 가곡이 뛰어나고 음악 평론가로도 활동했어요. 아내 클라라는 이름난 피아니스트였어요."], ["‘프란츠 리스트’은(는) 어느 나라의 작곡가일까요?", "헝가리", ["독일", "오스트리아", "핀란드"], "낭만", "프란츠 리스트(Franz Liszt, 1811~1886) — '피아노의 왕'이라 불린 연주가예요. 화려한 기교의 곡과 교향시를 새로 열었어요."], ["‘주세페 베르디’은(는) 어느 나라의 작곡가일까요?", "이탈리아", ["핀란드", "헝가리", "폴란드"], "낭만", "주세페 베르디(Giuseppe Verdi, 1813~1901) — 이탈리아 오페라의 최고 거장이에요. 극적인 이야기와 아름다운 선율의 오페라를 많이 남겼어요."], ["‘리하르트 바그너’은(는) 어느 나라의 작곡가일까요?", "독일", ["영국", "미국", "오스트리아"], "낭만", "리하르트 바그너(Richard Wagner, 1813~1883) — 음악과 극을 하나로 합친 '악극'을 만든 작곡가예요. 대본도 직접 썼어요."], ["‘요한 슈트라우스 2세’은(는) 어느 나라의 작곡가일까요?", "오스트리아", ["이탈리아", "영국", "헝가리"], "낭만", "요한 슈트라우스 2세(Johann Strauss II, 1825~1899) — '왈츠의 왕'이라 불려요. 빈의 무도회를 빛낸 왈츠와 폴카를 많이 썼어요."], ["‘베드르지흐 스메타나’은(는) 어느 나라의 작곡가일까요?", "체코", ["프랑스", "영국", "핀란드"], "국민악파", "베드르지흐 스메타나(Bedřich Smetana, 1824~1884) — 체코 음악의 아버지라 불려요. 고국의 강과 역사를 노래한 연작 '나의 조국'을 남겼어요."], ["‘조르주 비제’은(는) 어느 나라의 작곡가일까요?", "프랑스", ["폴란드", "체코", "오스트리아"], "낭만", "조르주 비제(Georges Bizet, 1838~1875) — 오페라 '카르멘'으로 이름을 남겼어요. 그러나 초연 때는 크게 인정받지 못했고 곧 세상을 떠났어요."], ["‘카미유 생상스’은(는) 어느 나라의 작곡가일까요?", "프랑스", ["이탈리아", "노르웨이", "폴란드"], "낭만", "카미유 생상스(Camille Saint-Saëns, 1835~1921) — 피아노·오르간의 명연주자이자 작곡가예요. 재치 있는 '동물의 사육제'가 유명해요."], ["‘요하네스 브람스’은(는) 어느 나라의 작곡가일까요?", "독일", ["헝가리", "폴란드", "오스트리아"], "낭만", "요하네스 브람스(Johannes Brahms, 1833~1897) — 고전의 형식을 지키면서 낭만의 깊은 감정을 담은 작곡가예요. 바흐·베토벤과 함께 '3B'로 불려요."], ["‘알렉산드르 보로딘’은(는) 어느 나라의 작곡가일까요?", "러시아", ["이탈리아", "체코", "미국"], "국민악파", "알렉산드르 보로딘(Alexander Borodin, 1833~1887) — 화학자와 작곡가를 함께 한 사람이에요. 러시아 '5인조'의 한 사람이에요."], ["‘모데스트 무소륵스키’은(는) 어느 나라의 작곡가일까요?", "러시아", ["프랑스", "오스트리아", "폴란드"], "국민악파", "모데스트 무소륵스키(Modest Mussorgsky, 1839~1881) — 러시아 '5인조'의 한 사람이에요. 러시아 민중의 소리를 담은 솔직한 음악을 썼어요."], ["‘표트르 일리치 차이콥스키’은(는) 어느 나라의 작곡가일까요?", "러시아", ["헝가리", "영국", "폴란드"], "낭만", "표트르 일리치 차이콥스키(Pyotr Ilyich Tchaikovsky, 1840~1893) — 러시아를 대표하는 작곡가예요. 세 편의 발레 음악으로 발레 음악의 수준을 높였어요."], ["‘안토닌 드보르자크’은(는) 어느 나라의 작곡가일까요?", "체코", ["미국", "프랑스", "오스트리아"], "국민악파", "안토닌 드보르자크(Antonín Dvořák, 1841~1904) — 체코의 민속 음악에 바탕을 둔 작곡가예요. 미국에 머물며 '신세계로부터'를 썼어요."], ["‘니콜라이 림스키코르사코프’은(는) 어느 나라의 작곡가일까요?", "러시아", ["독일", "노르웨이", "체코"], "국민악파", "니콜라이 림스키코르사코프(Nikolai Rimsky-Korsakov, 1844~1908) — 해군 장교 출신으로 러시아 '5인조'의 한 사람이에요. 화려한 관현악법의 대가예요."], ["‘가브리엘 포레’은(는) 어느 나라의 작곡가일까요?", "프랑스", ["폴란드", "영국", "노르웨이"], "낭만", "가브리엘 포레(Gabriel Fauré, 1845~1924) — 섬세하고 부드러운 화성이 특징인 프랑스의 작곡가예요."], ["‘에드바르 그리그’은(는) 어느 나라의 작곡가일까요?", "노르웨이", ["러시아", "독일", "미국"], "국민악파", "에드바르 그리그(Edvard Grieg, 1843~1907) — 노르웨이 민속 음악을 바탕으로 한 서정적인 곡을 남겼어요."], ["‘에드워드 엘가’은(는) 어느 나라의 작곡가일까요?", "영국", ["노르웨이", "이탈리아", "미국"], "낭만", "에드워드 엘가(Edward Elgar, 1857~1934) — 영국을 대표하는 작곡가예요. 행진곡과 관현악곡으로 이름이 높아요."], ["‘자코모 푸치니’은(는) 어느 나라의 작곡가일까요?", "이탈리아", ["프랑스", "영국", "핀란드"], "낭만", "자코모 푸치니(Giacomo Puccini, 1858~1924) — '라 보엠'·'토스카'·'나비 부인'처럼 아름다운 선율의 오페라로 사랑받는 이탈리아 작곡가예요."], ["‘리하르트 슈트라우스’은(는) 어느 나라의 작곡가일까요?", "독일", ["체코", "러시아", "이탈리아"], "낭만", "리하르트 슈트라우스(Richard Strauss, 1864~1949) — '왈츠의 왕' 슈트라우스와는 다른 사람이에요. 교향시와 오페라로 이름난 독일의 작곡가예요."], ["‘장 시벨리우스’은(는) 어느 나라의 작곡가일까요?", "핀란드", ["노르웨이", "헝가리", "미국"], "국민악파", "장 시벨리우스(Jean Sibelius, 1865~1957) — 핀란드의 국민 작곡가예요. '핀란디아'는 독립을 바라는 핀란드 사람들의 마음을 모았어요."], ["‘에릭 사티’은(는) 어느 나라의 작곡가일까요?", "프랑스", ["영국", "오스트리아", "이탈리아"], "근현대", "에릭 사티(Erik Satie, 1866~1925) — 단순하고 조용한 곡으로 이름난 괴짜 작곡가예요. 오늘날 분위기 음악의 선구자로 평가해요."], ["‘클로드 드뷔시’은(는) 어느 나라의 작곡가일까요?", "프랑스", ["폴란드", "핀란드", "영국"], "근현대", "클로드 드뷔시(Claude Debussy, 1862~1918) — 빛과 물, 분위기를 소리로 그린 '인상주의' 음악의 대표 작곡가예요."], ["‘구스타브 홀스트’은(는) 어느 나라의 작곡가일까요?", "영국", ["폴란드", "헝가리", "노르웨이"], "근현대", "구스타브 홀스트(Gustav Holst, 1874~1934) — 태양계의 행성을 음악으로 그린 '행성'으로 알려진 영국 작곡가예요."], ["‘세르게이 라흐마니노프’은(는) 어느 나라의 작곡가일까요?", "러시아", ["헝가리", "폴란드", "체코"], "낭만", "세르게이 라흐마니노프(Sergei Rachmaninoff, 1873~1943) — 뛰어난 피아니스트이자 작곡가예요. 크고 낭만적인 선율의 피아노 곡으로 유명해요."], ["‘모리스 라벨’은(는) 어느 나라의 작곡가일까요?", "프랑스", ["미국", "노르웨이", "러시아"], "근현대", "모리스 라벨(Maurice Ravel, 1875~1937) — 관현악 편곡의 마술사라 불려요. 정교하고 화려한 소리가 특징이에요."], ["‘벨러 버르토크’은(는) 어느 나라의 작곡가일까요?", "헝가리", ["프랑스", "오스트리아", "이탈리아"], "근현대", "벨러 버르토크(Béla Bartók, 1881~1945) — 동유럽 민속 음악을 직접 모아 연구하고 이를 바탕으로 작곡했어요."], ["‘조지 거슈윈’은(는) 어느 나라의 작곡가일까요?", "미국", ["핀란드", "영국", "체코"], "근현대", "조지 거슈윈(George Gershwin, 1898~1937) — 재즈와 클래식을 하나로 합친 미국의 작곡가예요."], ["‘드미트리 쇼스타코비치’은(는) 어느 나라의 작곡가일까요?", "러시아", ["영국", "헝가리", "독일"], "근현대", "드미트리 쇼스타코비치(Dmitri Shostakovich, 1906~1975) — 옛 소련 시대의 작곡가예요. 교향곡과 현악 사중주를 많이 남겼어요."], ["‘새뮤얼 바버’은(는) 어느 나라의 작곡가일까요?", "미국", ["폴란드", "러시아", "헝가리"], "근현대", "새뮤얼 바버(Samuel Barber, 1910~1981) — 미국의 작곡가예요. 느리고 애절한 '현을 위한 아다지오'가 가장 유명해요."], ["작곡가 ‘요한 제바스티안 바흐’이(가) 속한 음악사 시대는?", "바로크", ["근현대", "낭만", "고전"], "바로크", "요한 제바스티안 바흐(1685~1750) — '음악의 아버지'라 불려요. 여러 선율이 겹치는 푸가와 오르간·건반 음악, 교회 음악을 많이 남겼어요."], ["작곡가 ‘게오르크 프리드리히 헨델’이(가) 속한 음악사 시대는?", "바로크", ["근현대", "국민악파", "낭만"], "바로크", "게오르크 프리드리히 헨델(1685~1759) — 독일에서 태어나 영국에서 활동했어요. 오라토리오 '메시아'와 웅장한 야외 음악으로 유명해요."], ["작곡가 ‘안토니오 비발디’이(가) 속한 음악사 시대는?", "바로크", ["고전", "낭만", "국민악파"], "바로크", "안토니오 비발디(1678~1741) — '붉은 머리 사제'라 불린 바이올린의 명인이에요. 협주곡을 400곡 가까이 남겼어요."], ["작곡가 ‘요한 파헬벨’이(가) 속한 음악사 시대는?", "바로크", ["국민악파", "낭만", "고전"], "바로크", "요한 파헬벨(1653~1706) — 오르간 연주자이자 작곡가예요. 같은 흐름이 되풀이되는 '캐논'으로 가장 널리 알려졌어요."], ["작곡가 ‘요제프 하이든’이(가) 속한 음악사 시대는?", "고전", ["국민악파", "낭만", "근현대"], "고전", "요제프 하이든(1732~1809) — '교향곡의 아버지'라 불려요. 교향곡을 100곡 넘게 썼고 모차르트·베토벤과도 교류했어요."], ["작곡가 ‘볼프강 아마데우스 모차르트’이(가) 속한 음악사 시대는?", "고전", ["국민악파", "근현대", "바로크"], "고전", "볼프강 아마데우스 모차르트(1756~1791) — 어릴 때부터 천재로 이름났고 35년의 짧은 삶 동안 오페라·교향곡·협주곡 등 모든 갈래에 걸작을 남겼어요."], ["작곡가 ‘조아키노 로시니’이(가) 속한 음악사 시대는?", "낭만", ["국민악파", "고전", "바로크"], "낭만", "조아키노 로시니(1792~1868) — 경쾌하고 재치 있는 희극 오페라의 대가예요. 요리를 좋아한 미식가로도 유명해요."], ["작곡가 ‘펠릭스 멘델스존’이(가) 속한 음악사 시대는?", "낭만", ["근현대", "바로크", "국민악파"], "낭만", "펠릭스 멘델스존(1809~1847) — 부유한 집안에서 자란 신동으로, 17살에 '한여름 밤의 꿈' 서곡을 썼어요. 바흐의 음악을 다시 세상에 알렸어요."], ["작곡가 ‘프레데리크 쇼팽’이(가) 속한 음악사 시대는?", "낭만", ["근현대", "국민악파", "고전"], "낭만", "프레데리크 쇼팽(1810~1849) — '피아노의 시인'이라 불려요. 거의 피아노 곡만 썼고 폴란드의 정서를 담은 곡이 많아요."], ["작곡가 ‘로베르트 슈만’이(가) 속한 음악사 시대는?", "낭만", ["고전", "국민악파", "근현대"], "낭만", "로베르트 슈만(1810~1856) — 피아노 곡과 가곡이 뛰어나고 음악 평론가로도 활동했어요. 아내 클라라는 이름난 피아니스트였어요."], ["작곡가 ‘프란츠 리스트’이(가) 속한 음악사 시 const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CATS = ["전체", ...new Set(D.map(d => d[3]).filter(Boolean))];
let cat = "전체", qs = [], i = 0, score = 0, best = ld(KEY) || 0, locked = false;
/*FLAG*/
const FLK = "quiz-flags-v1", FLF = (location.pathname.split("/").pop() || "quiz-quiz.html");
const flAll = () => { const v = ld(FLK); return v && typeof v === "object" ? v : {}; }, isFlag = q => !!(flAll()[FLF] || {})[q];
function toggleFlag(d, picked) { const all = flAll(), m = all[FLF] || (all[FLF] = {}); if (m[d[0]]) delete m[d[0]]; else m[d[0]] = { a: String(d[1]), p: String(picked || ""), t: Date.now() }; if (!Object.keys(m).length) delete all[FLF]; sv(FLK, all); }
function showFlag(d, picked) { $("q").insertAdjacentHTML("beforeend", `<button class="flagb ${isFlag(d[0]) ? "on" : ""}" type="button" data-flag="1">${isFlag(d[0]) ? "🚩 신고했어요 (누르면 취소)" : "🚩 문제가 이상해요"}</button>`); $("q").querySelector("[data-flag]").onclick = e => { toggleFlag(d, picked); e.target.classList.toggle("on", isFlag(d[0])); e.target.textContent = isFlag(d[0]) ? "🚩 신고했어요 (누르면 취소)" : "🚩 문제가 이상해요"; }; }
/*LEVEL*/
const LVN = ["전체", "🌱 초급", "🌿 중급", "🌳 고급"], LVM = [1, 1, 1.5, 2], LVK = KEY.split("-best-").join("-lv-") === KEY ? KEY + "-lv" : KEY.split("-best-").join("-lv-");
let lv = +ld(LVK) || 0; if (!(lv >= 0 && lv <= 3)) lv = 0;
const lvOf = n => +(typeof LV === "string" && LV[n] || 2), lvCnt = l => D.filter((d, n) => lvOf(n) === l).length, bestKey = () => lv ? KEY + "-L" + lv : KEY;
best = ld(bestKey()) || 0;
function renderLv() {
  if (lv && lvCnt(lv) < 4) lv = 0;
  window.FG_MULT = LVM[lv]; window.FG_LV = lv ? LVN[lv].slice(3) : "";
  $("lvs").innerHTML = LVN.map((n, k) => `<button class="chip ${k === lv ? "on" : ""}" type="button" data-l="${k}" aria-pressed="${k === lv}">${n}${k ? `<small> ${lvCnt(k)}</small>` : ""}</button>`).join("");
  $("lvp").textContent = lv ? `${LVN[lv].slice(3)} 문제예요. 포인트가 ×${LVM[lv]}배로 쌓여요.` : "초급 ×1 · 중급 ×1.5 · 고급 ×2 포인트 (전체는 ×1)";
}
$("lvs").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b) { lv = +b.dataset.l; sv(LVK, lv); best = ld(bestKey()) || 0; start(); } });

function options(d) {                                   // 보기를 만든다: 정답 + 틀린 보기 (같은 분류의 다른 정답 중에서 자동으로 뽑기도 함)
  let wrong = d[2] && d[2].length ? d[2].slice(0, 3) : shuf(D.filter(x => x !== d && x[1] !== d[1] && (!d[3] || x[3] === d[3])).map(x => x[1])).filter((v, k, a) => a.indexOf(v) === k).slice(0, 3);
  return shuf([d[1], ...wrong]);
}
function start() {
  renderLv(); const pool = D.filter((d, n) => (!lv || lvOf(n) === lv) && !isFlag(d[0]) && (cat === "전체" || d[3] === cat)); /*GUARD*/ if (!pool.length && lv) { lv = 0; sv(LVK, lv); best = ld(bestKey()) || 0; return start(); }
  qs = shuf(pool).slice(0, ROUND).map(d => ({ d, opts: options(d) })); i = 0; score = 0; $("res").hidden = true;
  $("cats").hidden = CATS.length < 3; $("cats").innerHTML = CATS.map(c => `<button class="chip ${c === cat ? "on" : ""}" type="button" data-c="${c}" aria-pressed="${c === cat}">${c}</button>`).join(""); show();
}
function show() {
  const { d, opts } = qs[i]; locked = false; $("next").hidden = true;
  $("q").innerHTML = (LABEL || d[3] ? `<small>${esc(LABEL || d[3])}</small>` : "") + esc(d[0]);
  $("opts").className = "opts" + (opts.some(o => String(o).length > 9) ? " one" : "");
  $("opts").innerHTML = opts.map((o, k) => `<button class="opt" type="button" data-k="${k}">${esc(o)}</button>`).join("");
  $("no").textContent = (i + 1) + "/" + qs.length; $("score").textContent = score; $("best").textContent = best;
}
function pick(k) {
  if (locked) return; locked = true; const { d, opts } = qs[i]; if (opts[k] === d[1]) score++;
  document.querySelectorAll(".opt").forEach((b, n) => { b.disabled = true; if (opts[n] === d[1]) b.classList.add("ok"); else if (n === k) b.classList.add("bad"); });
  if (d[4]) $("q").insertAdjacentHTML("beforeend", `<span class="note">${esc(d[4])}</span>`);
  showFlag(d, opts[k]);
  $("score").textContent = score; $("next").textContent = i === qs.length - 1 ? "결과 보기" : "다음 문제"; $("next").hidden = false;
}
function finish() {
  const full = qs.length === ROUND; let note = ""; if (full && cat === "전체" && score > best) { best = score; sv(bestKey(), best); note = " 🏆 최고 기록이에요!"; }
  $("q").innerHTML = "끝!"; $("opts").innerHTML = ""; $("next").hidden = true;
  $("res").innerHTML = `<b>${qs.length}문제 중 ${score}개 정답</b><p class="muted">${score >= qs.length * .9 ? "박사님이시네요! 🎓" : score >= qs.length * .6 ? "잘했어요 👍" : "조금만 더 힘내요 💪"}${note}</p><button class="btn" id="again" type="button" style="margin-top:10px;width:100%">다시 하기</button>`;
  $("res").hidden = false; $("best").textContent = best; $("again").onclick = start;
}
$("opts").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) pick(+b.dataset.k); });
$("cats").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b) { cat = b.dataset.c; start(); } });
$("next").onclick = () => { if (i === qs.length - 1) finish(); else { i++; show(); } };
start();
</script>
