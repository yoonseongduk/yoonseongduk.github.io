<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시계 읽기</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(215 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(215 22% 86%);--accent:hsl(215 65% 46%);--accent-fg:#fff;--soft:hsl(215 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(215 22% 10%);--surface:hsl(215 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(215 16% 25%);--accent:hsl(215 75% 68%);--accent-fg:#10131c;--soft:hsl(215 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.clockbox{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;display:grid;place-items:center}.clockbox canvas{width:min(100%,300px);aspect-ratio:1}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;min-height:58px;padding:8px;font-weight:700;font-size:1.1rem}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}.opt:disabled{cursor:default}
</style>
</head>
<body>
<main>
  <h1>시계 읽기 🕒</h1>
  <div class="seg" id="lv" role="radiogroup" aria-label="난이도"></div>
  <div class="stats"><div class="stat"><small>문제</small><b id="no">1/10</b></div><div class="stat"><small>맞힌 수</small><b id="score">0</b></div><div class="stat"><small>최고</small><b id="best">0</b></div></div>
  <div class="clockbox"><canvas id="cv" width="640" height="640" aria-label="시계 그림"></canvas></div>
  <div class="opts" id="opts"></div>
  <div class="res" id="res" hidden></div>
  <button class="btn" id="next" type="button" hidden>다음 문제</button>
  <p class="muted">시계 그림을 보고 <b>몇 시 몇 분</b>인지 골라 보세요. 짧은 바늘이 '시', 긴 바늘이 '분'을 가리켜요. 쉬움은 5분 단위, 어려움은 1분 단위예요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "clockquiz-best-v1";
const LV = { easy: { step: 5, label: "쉬움", hint: "5분 단위" }, hard: { step: 1, label: "어려움", hint: "1분 단위" } }, ROUND = 10;
let lv = (ld(KEY + "-lv") in LV) ? ld(KEY + "-lv") : "easy", qs, i, score, locked, best = ld(KEY) || {};
const label = (h, m) => `${h}시 ${m ? m + "분" : "정각"}`;
// 시침과 분침의 각도 (12시 방향이 0도, 시계 방향). 시침은 분이 지난 만큼도 조금 더 간다
const angles = (h, m) => ({ hour: ((h % 12) + m / 60) * 30, min: m * 6 });
function makeQ() {
  const step = LV[lv].step, h = ri(1, 12), m = ri(0, 59 / step | 0) * step, ans = label(h, m), set = new Set([ans]);
  while (set.size < 4) { const t = Math.random(); let hh = h, mm = m; if (t < .35) hh = ri(1, 12); else if (t < .7) mm = ri(0, 59 / step | 0) * step; else { hh = ri(1, 12); mm = ri(0, 59 / step | 0) * step; } set.add(label(hh, mm)); }
  return { h, m, ans, opts: shuf([...set]) };
}
function start() { qs = Array.from({ length: ROUND }, makeQ); i = 0; score = 0; $("res").hidden = true; show(); }
function drawClock(h, m) {
  const c = $("cv").getContext("2d"), R = 300, css = getComputedStyle(document.documentElement), fg = css.getPropertyValue("--fg").trim(), line = css.getPropertyValue("--line").trim(), acc = css.getPropertyValue("--accent").trim(), sf = css.getPropertyValue("--surface").trim();
  c.clearRect(0, 0, 640, 640); c.save(); c.translate(320, 320); c.fillStyle = sf; c.beginPath(); c.arc(0, 0, R, 0, 7); c.fill(); c.lineWidth = 10; c.strokeStyle = fg; c.stroke();
  for (let k = 0; k < 60; k++) { const a = k * 6 * Math.PI / 180, len = k % 5 ? 12 : 28; c.strokeStyle = k % 5 ? line : fg; c.lineWidth = k % 5 ? 3 : 6; c.beginPath(); c.moveTo(Math.sin(a) * (R - 8), -Math.cos(a) * (R - 8)); c.lineTo(Math.sin(a) * (R - 8 - len), -Math.cos(a) * (R - 8 - len)); c.stroke(); }
  c.fillStyle = fg; c.font = "bold 54px sans-serif"; c.textAlign = "center"; c.textBaseline = "middle"; for (let n = 1; n <= 12; n++) { const a = n * 30 * Math.PI / 180; c.fillText(n, Math.sin(a) * (R - 68), -Math.cos(a) * (R - 68)); }
  const A = angles(h, m); const hand = (deg, len, w, col) => { const a = deg * Math.PI / 180; c.strokeStyle = col; c.lineWidth = w; c.lineCap = "round"; c.beginPath(); c.moveTo(-Math.sin(a) * 20, Math.cos(a) * 20); c.lineTo(Math.sin(a) * len, -Math.cos(a) * len); c.stroke(); };
  hand(A.hour, 150, 16, fg); hand(A.min, 220, 10, acc); c.fillStyle = fg; c.beginPath(); c.arc(0, 0, 14, 0, 7); c.fill(); c.restore();
}
function show() { const q = qs[i]; locked = false; $("next").hidden = true; drawClock(q.h, q.m); $("opts").innerHTML = q.opts.map((o, k) => `<button class="opt" type="button" data-k="${k}">${o}</button>`).join(""); $("no").textContent = (i + 1) + "/" + ROUND; $("score").textContent = score; $("best").textContent = best[lv] || 0; $("lv").style.setProperty("--n", 2); $("lv").innerHTML = Object.keys(LV).map(k => `<button type="button" class="${k === lv ? "on" : ""}" data-l="${k}" role="radio" aria-checked="${k === lv}">${LV[k].label}<small>${LV[k].hint}</small></button>`).join(""); }
function pick(k) { if (locked) return; locked = true; const q = qs[i]; if (q.opts[k] === q.ans) score++; document.querySelectorAll(".opt").forEach((b, n) => { b.disabled = true; if (q.opts[n] === q.ans) b.classList.add("ok"); else if (n === k) b.classList.add("bad"); }); $("score").textContent = score; $("next").textContent = i === ROUND - 1 ? "결과 보기" : "다음 문제"; $("next").hidden = false; }
function finish() { let note = ""; if (score > (best[lv] || 0)) { best[lv] = score; sv(KEY, best); note = " 🏆 최고 기록이에요!"; } $("opts").innerHTML = ""; $("next").hidden = true; $("res").innerHTML = `<b>${ROUND}문제 중 ${score}개 정답</b><p class="muted">${score >= 9 ? "시계 박사님! 🎓" : score >= 6 ? "잘했어요 👍" : "조금만 더 연습해 봐요 💪"}${note}</p><button class="btn" id="again" type="button" style="margin-top:10px;width:100%">다시 하기</button>`; $("res").hidden = false; $("best").textContent = best[lv]; $("again").onclick = start; }
$("opts").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) pick(+b.dataset.k); }); $("next").onclick = () => { if (i === ROUND - 1) finish(); else { i++; show(); } };
$("lv").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b && b.dataset.l !== lv) { lv = b.dataset.l; sv(KEY + "-lv", lv); start(); } }); start();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<script src="wrong-hook.js"></script>
</body>
</html>
