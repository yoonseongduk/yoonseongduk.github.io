<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오답 노트</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(355 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(355 22% 86%);--accent:hsl(355 65% 46%);--accent-fg:#fff;--soft:hsl(355 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(355 22% 10%);--surface:hsl(355 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(355 16% 25%);--accent:hsl(355 75% 68%);--accent-fg:#10131c;--soft:hsl(355 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.88rem}.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:700}.opts{display:grid;gap:8px}.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;min-height:54px;padding:8px 12px;font-weight:700;font-size:1rem;text-align:left}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}.wi{padding:10px 0;border-bottom:1px solid var(--line)}.wh{display:flex;justify-content:space-between;align-items:center}.wh button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--soft);padding:0}.wq{margin:4px 0;overflow-wrap:anywhere}details summary{color:var(--accent);cursor:pointer;font-size:.9rem}.wa{color:var(--ok)}
</style>
</head>
<body>
<main>
  <h1>오답 노트 📕</h1>
  <div class="stats"><div class="stat"><small>틀린 문제</small><b id="cnt">0</b></div><div class="stat"><small>익힌 문제</small><b id="mas">0</b></div><div class="stat"><small>퀴즈 종류</small><b id="kinds">0</b></div></div>
  <div class="chips" id="chips"></div>
  <div id="rev" hidden><div class="card center"><p class="muted" id="rt"></p><p class="big" id="rq" style="font-size:1.5rem"></p></div><div class="opts" id="ro"></div><p class="center" id="rm" style="min-height:1.4em;font-weight:700"></p><button class="btn" id="rn" type="button" hidden>다음</button></div>
  <div class="row" id="acts"><button class="btn" id="go" type="button">🔥 집중 복습 (10문제)</button><button class="btn ghost" id="clear" type="button">🗑 모두 지우기</button></div>
  <div class="res" id="sum" hidden></div>
  <div class="card" id="listbox"><b>📋 틀린 문제 목록</b><div id="list"></div></div>
  <p class="muted">퀴즈에서 <b>틀린 문제</b>가 자동으로 여기에 모여요. <b>집중 복습</b>을 누르면 많이 틀린 문제부터 다시 풀어요. 복습에서 <b>두 번 연속 맞히면</b> 노트에서 사라져요 (익힌 문제로 표시). 퀴즈에서 그 문제를 다시 맞혀도 같은 방식으로 세어져요. 기록은 이 폰에만 저장돼요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "wrongnotes-ui-v1";
const KEY2 = "wrongnotes-v1", MKEY = "wrongnotes-mastered-v1";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY2)) || []; } catch (e) { return []; } }, save = a => { try { localStorage.setItem(KEY2, JSON.stringify(a)); } catch (e) {} }, mastered = () => { try { return +localStorage.getItem(MKEY) || 0; } catch (e) { return 0; } }, addMastered = () => { try { localStorage.setItem(MKEY, String(mastered() + 1)); } catch (e) {} };
let items = load(), filt = "전체", q = [], qi = 0, good = 0, locked = false, tempo = 1;
const kinds = () => [...new Set(items.map(x => x.t))];
function chips() { const ks = kinds(); $("chips").innerHTML = ["전체", ...ks].map(k => `<button type="button" class="chip${k === filt ? " on" : ""}" data-k="${esc(k)}">${esc(k)} <small>${k === "전체" ? items.length : items.filter(x => x.t === k).length}</small></button>`).join(""); }
const view = () => items.filter(x => filt === "전체" || x.t === filt);
function render() {
  items = load(); if (filt !== "전체" && !items.some(x => x.t === filt)) filt = "전체"; chips(); $("cnt").textContent = items.length; $("mas").textContent = mastered(); $("kinds").textContent = kinds().length;
  const v = view().sort((a, b) => (b.n || 1) - (a.n || 1) || b.d - a.d);
  $("list").innerHTML = v.length ? v.map((x, k) => `<div class="wi"><div class="wh"><span class="muted">${esc(x.t)} · ${x.n || 1}번 틀림</span><button type="button" data-del="${esc(x.id)}" aria-label="삭제">✕</button></div><div class="wq">${esc(x.q)}</div><details><summary>정답 보기</summary><b class="wa">${esc(x.a)}</b>${x.k === "write" ? ' <a href="hanja-write.html">✍️ 쓰기 연습</a>' : ""}</details></div>`).join("") : '<p class="muted center" style="padding:14px 0">🎉 틀린 문제가 없어요! 퀴즈를 풀다 틀리면 여기에 모여요.</p>';
  $("go").disabled = !v.filter(x => x.k === "write" || (x.o && x.o.length >= 2)).length; $("acts").hidden = false;
}
let HJ = null;
async function loadHanja() { if (HJ) return HJ; try { HJ = await (await fetch("data/hanja.json")).json(); } catch (e) { HJ = []; } return HJ; }
// 한자 쓰기에서 틀린 글자는 "뜻과 음 → 알맞은 한자 고르기" 4지선다로 바꿔서 낸다
function asChoice(x) {
  if (x.k !== "write") return x.o && x.o.length >= 2 ? x : null;
  const me = HJ.find(h => h[0] === x.a); if (!me) return null;
  const same = HJ.filter(h => h[2] === me[2] && h[0] !== x.a), o = [x.a];
  while (o.length < 4 && same.length) o.push(same.splice(ri(0, same.length - 1), 1)[0][0]);
  return o.length < 2 ? null : { ...x, q: x.q + " — 알맞은 한자는?", o };
}
async function startReview() {
  await loadHanja();
  const pool = view().map(asChoice).filter(Boolean); if (!pool.length) return;
  q = pool.map(x => ({ x, w: (x.n || 1) + Math.random() * 1.5 })).sort((a, b) => b.w - a.w).slice(0, 10).map(o => o.x); q = shuf(q); qi = 0; good = 0; $("sum").hidden = true; $("rev").hidden = false; $("acts").hidden = true; $("listbox").hidden = true; showQ();
}
function showQ() { const x = q[qi]; locked = false; $("rt").textContent = `${x.t} · ${qi + 1}/${q.length}`; $("rq").textContent = x.q; $("rm").textContent = ""; $("rn").hidden = true; $("ro").innerHTML = shuf(x.o).map((o, k) => `<button class="opt" type="button" data-o="${esc(o)}">${esc(o)}</button>`).join(""); }
function pick(b) {
  if (locked) return; locked = true; const x = q[qi], ok = b.dataset.o === x.a, all = load(), k = all.findIndex(y => y.id === x.id);
  document.querySelectorAll("#ro .opt").forEach(o => { o.disabled = true; if (o.dataset.o === x.a) o.classList.add("ok"); else if (o === b) o.classList.add("bad"); });
  if (ok) { good++; if (k >= 0) { all[k].s = (all[k].s || 0) + 1; if (all[k].s >= 2) { all.splice(k, 1); addMastered(); $("rm").textContent = "⭕ 두 번 맞혔어요! 익힌 문제로 옮겼어요 🎉"; } else $("rm").textContent = "⭕ 정답! 한 번 더 맞히면 익힌 문제예요"; } }
  else { if (k >= 0) { all[k].n = (all[k].n || 1) + 1; all[k].s = 0; all[k].d = Date.now(); } $("rm").textContent = "❌ 아쉬워요. 다시 도전해요"; }
  $("rm").style.color = ok ? "var(--ok)" : "var(--bad)"; save(all); $("rn").textContent = qi === q.length - 1 ? "결과 보기" : "다음"; $("rn").hidden = false;
}
function finish() { $("rev").hidden = true; $("acts").hidden = false; $("listbox").hidden = false; render(); $("sum").hidden = false; $("sum").innerHTML = `<b>복습 끝! ${q.length}문제 중 ${good}개 정답</b><p class="muted">${good === q.length ? "완벽해요 🎉" : "틀린 문제는 노트에 남아 있어요. 또 도전해요 💪"}</p>`; }
$("go").onclick = startReview; $("ro").addEventListener("click", e => { const b = e.target.closest("[data-o]"); if (b) pick(b); }); $("rn").onclick = () => { if (qi === q.length - 1) finish(); else { qi++; showQ(); } };
$("chips").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) { filt = b.dataset.k; render(); } });
$("list").addEventListener("click", e => { const d = e.target.closest("[data-del]"); if (d) { save(load().filter(x => x.id !== d.dataset.del)); render(); } });
$("clear").onclick = () => { if (confirm("오답 노트를 모두 지울까요?")) { save([]); render(); } }; render();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<script src="wrong-hook.js"></script>
</body>
</html>
