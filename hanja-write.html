<body>
<main>
  <h1>한자 쓰기 ✍️</h1>
  <div class="chips" id="cats"></div>
  <div class="seg" id="mode" style="--n:2"><button type="button" data-m="trace" class="on">따라 쓰기<small>연한 글자를 따라</small></button><button type="button" data-m="memo">보고 쓰기<small>뜻과 음만 보고</small></button></div>
  <div class="stats"><div class="stat"><small>문제</small><b id="no">1/10</b></div><div class="stat"><small>성공</small><b id="score">0</b></div><div class="stat"><small>최고</small><b id="best">0</b></div></div>
  <div class="card center"><div class="tl"><button type="button" id="numt" aria-label="획순 번호 켜고 끄기" title="획순 번호">🔢</button><button type="button" id="edt" aria-label="획순 번호 고치기" title="획순 고치기">✏️</button></div><p class="muted" id="ask" style="padding:0 70px"></p><p class="big" id="mean" style="font-size:1.8rem"></p></div>
  <div class="padwrap"><canvas id="pad" width="300" height="300" aria-label="한자를 쓰는 칸"></canvas></div>
  <div class="dock" id="dock">
  <div class="row3"><button class="btn ghost" id="undo" type="button">↩ 한 획 지우기</button><button class="btn ghost" id="clear" type="button">🧽 모두 지우기</button><button class="btn" id="check" type="button">확인</button></div>
  <div id="editbar"><button class="btn ghost" id="e_undo" type="button">↩ 한 개 취소</button><button class="btn ghost" id="e_clear" type="button">🧹 처음부터</button><button class="btn ghost" id="e_reset" type="button">🗑 원래대로</button><button class="btn" id="e_save" type="button">✅ 저장</button></div>
  <div class="res" id="res" hidden></div>
  <button class="btn ghost" id="self" type="button" hidden>맞게 썼어요</button>
  <button class="btn ghost" id="retry" type="button" hidden>✏️ 다시 쓰기</button>
  <button class="btn" id="next" type="button" hidden>다음 문제</button>
  </div>
  <p class="muted" id="help">화면의 네모 칸에 <b>손가락으로 한자를 써 보세요</b>. <b>따라 쓰기</b>는 연하게 보이는 한자를 따라 쓰고, <b>보고 쓰기</b>는 뜻과 음만 보고 기억해서 써요. <b>확인</b>을 누르면 쓴 모양과 정답 모양이 얼마나 겹치는지 계산해요 (AI가 아니라 모양 비교예요). 획순은 검사하지 않아요.</p>
  <p class="center"><button type="button" class="fixb" id="expfix">📋 내가 고친 획순 복사</button></p>
  <p class="muted center">획순 번호: Make Me a Hanzi(Arphic Public License) · 자료 출처: <a href="licenses.html" style="color:inherit">출처와 저작권</a></p>
</main>
<div class="ovl" id="ovl" hidden><div class="sheet" id="sheet" role="dialog" aria-label="한자 유래"></div></div>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };

const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "hanja-write-best-v1";
const FIXK = "hanja-write-strokefix-v1", NUMK = "hanja-write-nums-v1";
let SD = {}, FIXS = {}, FIXL = ld(FIXK) || {}, numsOn = ld(NUMK) !== false, editing = false, editPts = [], OC = {}, stl = {};
let tried = false, DET = null, ALL = [], pool = [], cat = "6급", mode = "trace", qs = [], i = 0, score = 0, best = ld(KEY) || 0, strokes = [], cur = null, done = false, guideCache = null;
const cv = $("pad"), ctx = cv.getContext("2d"), S = 300, G = 60, CELL = S / G, FONT = '"Noto Serif CJK KR","Noto Serif KR","Noto Sans CJK KR","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","AppleGothic","Batang","serif"';
fetch("data/hanja.json").then(r => r.json()).then(d => { ALL = d; chips(); start(); }).catch(() => { $("ask").textContent = "한자 자료를 불러오지 못했어요. 인터넷에 한 번 연결한 뒤 다시 열어 주세요."; });
function chips() { $("cats").innerHTML = ["6급", "5급", "4급", "3급", "2급", "1급"].map(c => `<button type="button" class="chip${c === cat ? " on" : ""}" data-c="${c}">${c}</button>`).join(""); }
function start() { loadStroke(cat); pool = ALL.filter(d => d[2] === cat); qs = shuf(pool).slice(0, 10); i = 0; score = 0; $("res").hidden = true; show(); }
function outlineCanvas(ch) { if (OC[ch]) return OC[ch]; const c = document.createElement("canvas"); c.width = c.height = S; const x = c.getContext("2d"), k = S / 256; x.setTransform(k, 0, 0, -k, 0, 225 * k); x.fillStyle = "#000"; SD[ch].s.forEach(p => x.fill(new Path2D(p))); return (OC[ch] = c); }
const nums = ch => FIXL[ch] || FIXS[ch] || (SD[ch] ? SD[ch].n.map(([a, b]) => [a * S / 256, (225 - b) * S / 256]) : null);
const BR = 9, BD = 21;     // 번호표 반지름, 번호표 사이 최소 간격
function spread(pts) {      // 겹치는 번호표는 한 줄(가로)로 나란히 펼쳐요
  let P = pts.map(p => [p[0], p[1]]);

    const n = P.length, par = Array.from({ length: n }, (_, k) => k), fd = x => par[x] === x ? x : (par[x] = fd(par[x]));
    for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) if (Math.hypot(P[a][0] - P[b][0], P[a][1] - P[b][1]) < BD - 1) par[fd(a)] = fd(b);
    const gr = {}; for (let k = 0; k < n; k++) (gr[fd(k)] = gr[fd(k)] || []).push(k);
    let moved = false;
    Object.values(gr).forEach(g => { if (g.length < 2) return; g.sort((a, b) => a - b); const cx = g.reduce((t, k) => t + P[k][0], 0) / g.length, cy = g.reduce((t, k) => t + P[k][1], 0) / g.length, w = (g.length - 1) * BD, x0 = clamp(cx - w / 2, BR + 2, S - BR - 2 - w); g.forEach((k, m) => { P[k] = [x0 + m * BD, clamp(cy, BR + 2, S - BR - 2)]; }); moved = true; });
    if (!moved) break;
  }
  for (let it = 0; it < 400; it++) {     // 그래도 겹치면 서로 밀어내요
    let any = false;
    for (let a = 0; a < P.length; a++) for (let b = a + 1; b < P.length; b++) { let dx = P[b][0] - P[a][0], dy = P[b][1] - P[a][1], d = Math.hypot(dx, dy); if (d < BD - .5) { if (d < .01) { dx = 1; dy = 0; d = 1; } const m = (BD - d) / 2 + .1, ux = dx / d, uy = dy / d; P[a][0] -= ux * m; P[a][1] -= uy * m; P[b][0] += ux * m; P[b][1] += uy * m; any = true; } }
    P.forEach(p => { p[0] = clamp(p[0], BR + 2, S - BR - 2); p[1] = clamp(p[1], BR + 2, S - BR - 2); });
    if (!any) break;

  return P;
}
function drawNums(c, pts, col) {

  pts.forEach((p, k) => { if (Math.hypot(p[0] - P[k][0], p[1] - P[k][1]) > 3) { c.strokeStyle = col; c.globalAlpha = .55; c.lineWidth = 1.2; c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(P[k][0], P[k][1]); c.stroke(); c.globalAlpha = 1; c.fillStyle = col; c.beginPath(); c.arc(p[0], p[1], 2.5, 0, 7); c.fill(); } });
  P.forEach((p, k) => { c.beginPath(); c.arc(p[0], p[1], BR, 0, 7); c.fillStyle = col; c.fill(); c.strokeStyle = "#fff"; c.lineWidth = 1.5; c.stroke(); c.fillStyle = "#fff"; c.fillText(String(k + 1), p[0], p[1] + .5); });
  c.restore();
}
function loadStroke(g) { const f = g.replace("급", ""); if (stl[f]) return; stl[f] = 1; fetch("data/stroke-" + f + ".json").then(r => r.json()).then(d => { Object.assign(SD, d); if (qs.length) { if (!editing) $("ask").textContent = askTxt(); render(done); } }).catch(() => { stl[f] = 0; }); }
fetch("data/stroke-fix.json").then(r => r.ok ? r.json() : {}).then(d => { FIXS = d || {}; if (qs.length && !editing) render(done); }).catch(() => {});

function glyphCanvas(ch, scale = 1) { if (SD[ch] && scale === 1) return outlineCanvas(ch); const c = document.createElement("canvas"); c.width = c.height = S; const x = c.getContext("2d"); x.fillStyle = "#000"; x.textAlign = "center"; x.textBaseline = "middle"; x.font = `${Math.round(S * .78 * scale)}px ${FONT}`; x.fillText(ch, S / 2, S / 2 + S * .04); return c; }
function drawStroke(x, pts, w, col) { x.strokeStyle = col; x.fillStyle = col; x.lineWidth = w; x.lineCap = x.lineJoin = "round"; if (pts.length === 1) { x.beginPath(); x.arc(pts[0][0], pts[0][1], w / 2, 0, 7); x.fill(); return; } x.beginPath(); pts.forEach(([a, b], k) => k ? x.lineTo(a, b) : x.moveTo(a, b)); x.stroke(); }
function render(overlay) {
  const d = qs[i], style = getComputedStyle(document.documentElement), fg = style.getPropertyValue("--fg").trim() || "#222", line = style.getPropertyValue("--line").trim() || "#ccc", surf = style.getPropertyValue("--surface").trim() || "#fff", acc = style.getPropertyValue("--accent").trim() || "#c4552b";
  ctx.clearRect(0, 0, S, S); ctx.fillStyle = surf; ctx.fillRect(0, 0, S, S); ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.setLineDash([5, 5]); ctx.strokeRect(.5, .5, S - 1, S - 1); ctx.beginPath(); ctx.moveTo(S / 2, 0); ctx.lineTo(S / 2, S); ctx.moveTo(0, S / 2); ctx.lineTo(S, S / 2); ctx.stroke(); ctx.setLineDash([]);
