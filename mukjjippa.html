<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>묵찌빠</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(10 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(10 22% 86%);--accent:hsl(10 65% 46%);--accent-fg:#fff;--soft:hsl(10 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(10 22% 10%);--surface:hsl(10 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(10 16% 25%);--accent:hsl(10 75% 68%);--accent-fg:#10131c;--soft:hsl(10 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.phase{text-align:center;font-family:var(--font-display);font-size:1.25rem;min-height:1.8em}.stage{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px}.stage .h{font-size:clamp(3.4rem,20vw,5rem);line-height:1.1}.stage small{color:var(--muted)}.stage .vs{color:var(--muted);font-family:var(--font-display)}.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:1.1rem}.pick span{font-size:clamp(2.4rem,14vw,3.4rem);line-height:1.1}.pick:active{transform:scale(.96);border-color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>묵찌빠 ✊</h1>
  <div class="stats"><div class="stat"><small>승</small><b id="w">0</b></div><div class="stat"><small>연승</small><b id="s">0</b></div><div class="stat"><small>패</small><b id="l">0</b></div></div>
  <div class="phase" id="phase" aria-live="polite"></div>
  <div class="stage"><div><div class="h" id="mine">❔</div><small>나</small></div><div class="vs">VS</div><div><div class="h" id="cpu">❔</div><small>컴퓨터</small></div></div>
  <div class="res" id="msg"><b>가위바위보로 공격권을 정해요</b></div>
  <div class="picks" id="picks"></div>
  <button class="btn ghost" id="reset" type="button">기록 지우기</button>
  <p class="muted">먼저 <b>가위바위보</b>로 공격권을 정해요. 이긴 쪽이 공격이에요. 그다음 <b>묵(✊)·찌(✌️)·빠(✋)</b>를 내서 <b>공격하는 쪽과 같은 손이 나오면 공격하는 쪽이 이겨요!</b> 다른 손이 나오면 가위바위보처럼 이긴 쪽이 공격권을 가져가요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "mukjjippa-v1";
const HANDS = [{ e: "✊", rps: "바위", mjp: "묵" }, { e: "✌️", rps: "가위", mjp: "찌" }, { e: "✋", rps: "보", mjp: "빠" }];
let st = ld(KEY) || { w: 0, l: 0, s: 0 }, phase = "rps", att = null, round = 0;
const beats = (a, b) => (a - b + 3) % 3 === 2;                      // 바위(묵) > 가위(찌) > 보(빠) > 바위
// 한 판의 규칙: (단계, 내 손, 컴퓨터 손, 공격권) → 다음 단계와 결과
function rule(phase, me, cpu, att) {
  if (phase === "rps") { if (me === cpu) return { phase: "rps", att: null, text: "비겼어요! 다시 가위바위보" }; const a = beats(me, cpu) ? "me" : "cpu"; return { phase: "mjp", att: a, text: a === "me" ? "내가 이겼어요! 공격권은 나에게 있어요 ⚔️" : "컴퓨터가 이겼어요. 공격권은 컴퓨터에게 있어요 🛡️" }; }
  if (me === cpu) return { phase: "rps", att: null, end: att, text: att === "me" ? "🎉 묵찌빠! 내가 이겼어요" : "😢 묵찌빠! 컴퓨터가 이겼어요" };
  const a = beats(me, cpu) ? "me" : "cpu"; return { phase: "mjp", att: a, text: (a === att ? "공격권을 지켰어요" : "공격권이 넘어갔어요") + (a === "me" ? " (내게 있어요 ⚔️)" : " (컴퓨터에게 있어요 🛡️)") };
}
function play(me) {
  const cpu = ri(0, 2), r = rule(phase, me, cpu, att); round++; $("mine").textContent = HANDS[me].e; $("cpu").textContent = HANDS[cpu].e;
  if (r.end) { if (r.end === "me") { st.w++; st.s++; } else { st.l++; st.s = 0; } sv(KEY, st); }
  phase = r.phase; att = r.att; $("msg").innerHTML = `<b>${r.text}</b>`; render();
}
function render() {
  $("w").textContent = st.w; $("l").textContent = st.l; $("s").textContent = st.s;
  $("phase").innerHTML = phase === "rps" ? "✊✌️✋ 가위바위보로 공격권 정하기" : att === "me" ? "<b style='color:var(--ok)'>⚔️ 내가 공격!</b> 컴퓨터와 같은 손을 내면 이겨요" : "<b style='color:var(--bad)'>🛡️ 컴퓨터가 공격!</b> 컴퓨터와 다른 손을 내세요";
  $("picks").innerHTML = HANDS.map((h, i) => `<button class="pick" type="button" data-p="${i}"><span>${h.e}</span>${phase === "rps" ? h.rps : h.mjp}</button>`).join("");
}
$("picks").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (b) play(+b.dataset.p); });
$("reset").onclick = () => { st = { w: 0, l: 0, s: 0 }; sv(KEY, st); phase = "rps"; att = null; $("mine").textContent = $("cpu").textContent = "❔"; $("msg").innerHTML = "<b>기록을 지웠어요</b>"; render(); }; render();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
