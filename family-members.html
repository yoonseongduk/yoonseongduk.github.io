<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가족 명단</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(25 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(25 22% 86%);--accent:hsl(25 65% 46%);--accent-fg:#fff;--soft:hsl(25 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(25 22% 10%);--surface:hsl(25 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(25 16% 25%);--accent:hsl(25 75% 68%);--accent-fg:#10131c;--soft:hsl(25 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}.x{background:none;border:0;color:var(--muted);font-size:1.1rem;padding:4px 8px}.btn.sm{padding:8px 14px;font-size:1rem}.lb{font-size:.88rem;color:var(--muted);font-weight:700}.note{font-size:.85rem;color:var(--muted)}.nm{flex:1;min-width:0}.nm input{background:transparent;border:1px solid transparent;font-weight:700;padding:8px 6px}.nm input:focus{border-color:var(--line);background:var(--soft)}.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}input[type=file]{width:100%;font:inherit}.opt{display:flex;gap:8px;align-items:flex-start;font-size:.95rem}.tbl{width:100%;border-collapse:collapse;font-size:.9rem}.tbl td{padding:4px 2px;border-bottom:1px solid var(--line)}.tbl td:last-child{text-align:right;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>가족 명단 👨‍👩‍👧</h1>
  <div class="card"><b>👨‍👩‍👧 우리 가족</b><div id="list"></div><div class="g2" style="grid-template-columns:1fr auto"><input type="text" id="nn" maxlength="8" placeholder="이름 추가 (예: 엄마)"><button class="btn sm" id="add" type="button">추가</button></div><div class="note" id="cnt"></div></div>
  <div class="card"><b>📌 어디에서 쓰나요?</b><div class="note">집안일 당번표 · 가족 점수판 · 혈압·혈당 기록장 · 팀 나누기 · 순서·벌칙 정하기 · 성격 유형 테스트(이름 자동 완성)<br>각 화면의 <b>"👨‍👩‍👧 가족 명단 불러오기"</b> 버튼을 누르면 이 명단이 들어가요.</div></div>
  <p class="muted">가족 이름을 한 번만 적어 두면, 당번표·점수판·혈압 기록·팀 나누기·순서 정하기에서 '가족 명단 불러오기' 버튼으로 한 번에 쓸 수 있어요. 이 폰에만 저장돼요.</p>
</main>
<script src="family.js"></script>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "family-members-v1";

const MAX = 12;
let L = (window.FAMILY ? FAMILY.get() : (ld("family-members-v1") || []));
const save = () => { if (window.FAMILY) FAMILY.set(L); else sv("family-members-v1", L); };
function render() {
  $("list").innerHTML = L.length ? L.map((n, i) => `<div class="li"><span class="nm"><input type="text" value="${esc(n)}" maxlength="8" data-i="${i}" aria-label="이름"></span><span style="display:flex"><button class="x" data-up="${i}" type="button" aria-label="위로"${i ? "" : " disabled"}>▲</button><button class="x" data-dn="${i}" type="button" aria-label="아래로"${i < L.length - 1 ? "" : " disabled"}>▼</button><button class="x" data-del="${i}" type="button" aria-label="삭제">✕</button></span></div>`).join("") : '<p class="muted">아직 등록된 가족이 없어요. 아래에 이름을 적어 추가해 주세요.</p>';
  $("cnt").textContent = `${L.length}명 / 최대 ${MAX}명`;
}
function addName() { const v = $("nn").value.trim().slice(0, 8); if (!v) { $("nn").focus(); return; } if (L.includes(v)) { $("cnt").innerHTML = '<span class="bad">같은 이름이 이미 있어요</span>'; return; } if (L.length >= MAX) { $("cnt").innerHTML = '<span class="bad">최대 12명까지예요</span>'; return; } L.push(v); save(); $("nn").value = ""; render(); $("nn").focus(); }
$("add").onclick = addName; $("nn").addEventListener("keydown", e => { if (e.key === "Enter") addName(); });
$("list").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const g = k => b.dataset[k] !== undefined ? +b.dataset[k] : null;
  if (g("del") !== null) { L.splice(g("del"), 1); } else if (g("up") !== null && g("up") > 0) { const i = g("up"); [L[i - 1], L[i]] = [L[i], L[i - 1]]; } else if (g("dn") !== null && g("dn") < L.length - 1) { const i = g("dn"); [L[i + 1], L[i]] = [L[i], L[i + 1]]; } else return; save(); render(); });
$("list").addEventListener("change", e => { const i = +e.target.dataset.i, v = e.target.value.trim().slice(0, 8); if (!v || (L.includes(v) && L[i] !== v)) { e.target.value = L[i]; return; } L[i] = v; save(); render(); });
render();


</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<script src="med-notify.js" defer></script>
</body>
</html>
