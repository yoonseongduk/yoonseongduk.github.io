<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="person.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가족 순위표</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(30 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(30 22% 86%);--accent:hsl(30 65% 46%);--accent-fg:#fff;--soft:hsl(30 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(30 22% 10%);--surface:hsl(30 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(30 16% 25%);--accent:hsl(30 75% 68%);--accent-fg:#10131c;--soft:hsl(30 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}
.note{font-size:.85rem;color:var(--muted)}.me{font-weight:700;color:var(--accent)}.sub{font-size:.85rem;color:var(--muted);margin-top:6px}
.gt{display:flex;justify-content:space-between;align-items:center;gap:8px}.gt a{font-size:.85rem;color:var(--accent)}.rk{display:inline-block;min-width:1.6em}

</style>
</head>
<body>
<main>
  <h1>가족 순위표 🏅</h1>
  <div class="card"><b>🏅 종합 (1등 횟수)</b><div id="total"></div><div class="note" id="tnote"></div></div>
  <div id="boards"></div>
  <p class="muted">이 폰에 저장된 기록만 비교해요. 가족이 한 폰을 같이 쓰면서 위쪽 칩에서 이름을 골라 하면 사람별로 쌓여요. 기록이 두 사람 이상일 때만 1등으로 세요.</p>

  <p class="muted">게임별로 가족 중 누가 가장 잘했는지 최고 기록을 비교해요. 이 폰에 저장된 기록만 보여요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "fg-ranking-v1";

// 게임별 기록 정의: k=저장 키, sub=[[세부 키, 이름]](없으면 숫자 하나), low=낮을수록 좋음, f=값 표시 함수
const BOARDS = [
  { f: "reaction-test.html",  e: "⚡", t: "반응 속도",   k: "reaction-best-v1",    sub: [["avg", "5번 평균"], ["one", "한 번 최고"]], low: true, fmt: v => v + "ms" },
  { f: "typing-test.html",    e: "⌨️", t: "타자 속도",   k: "typing-best-v1",      fmt: v => v + "타" },
  { f: "quick-math.html",     e: "🧮", t: "암산 (60초)", k: "quickmath-best-v1",   sub: [["add", "덧셈·뺄셈"], ["times", "구구단"], ["mul", "곱셈"]], fmt: v => v + "문제" },
  { f: "times-table.html",    e: "✖️", t: "구구단 (60초)", k: "timestable-best-v1", fmt: v => v + "개" },
  { f: "click-speed.html",    e: "👆", t: "클릭 속도",   k: "clickspeed-best-v1",  sub: [["5", "5초"], ["10", "10초"], ["30", "30초"]], fmt: v => v + " CPS" },
  { f: "number-memory.html",  e: "🔢", t: "숫자 기억",   k: "numbermemory-best-v1", fmt: v => v + "단계" },
  { f: "reverse-memory.html", e: "🔁", t: "거꾸로 기억", k: "reversememory-best-v1", fmt: v => v + "단계" },
  { f: "pattern-memory.html", e: "🧩", t: "패턴 기억",   k: "patternmem-best-v1",  fmt: v => v + "단계" },
  { f: "aim-trainer.html",    e: "🎯", t: "조준 연습 (30초)", k: "aim-best-v1",    sub: [["big", "큰 과녁"], ["mid", "보통"], ["small", "작은 과녁"]], fmt: v => v + "명중" },
  { f: "stroop-color.html",   e: "🎨", t: "글자 색 맞히기", k: "stroop-best-v1",   fmt: v => v + "점" },
  { f: "number-tap.html",     e: "👇", t: "숫자 순서 터치", k: "numtap-best-v1",   sub: [["3", "3단계"], ["4", "4단계"], ["5", "5단계"]], low: true, fmt: v => (v / 1000).toFixed(2) + "초" },
];
const FP = window.fgPerson, MEDAL = ["🥇", "🥈", "🥉"];
const rawGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const jsonGet = k => { try { return JSON.parse(rawGet(k)); } catch (e) { return null; } };
const ownerName = () => FP.owner() || "(이 폰)";
// 이름 모으기: 가족 명단 + 포인트 기록 + 이 폰 주인 + 저장소에 "키::이름"으로 남은 이름
function allNames() {
  const fam = jsonGet("family-members-v1"), pts = (jsonGet(FP.pointsKey) || {}).p || {}, set = new Set([ownerName()]);
  (Array.isArray(fam) ? fam : []).forEach(n => typeof n === "string" && n && set.add(n));
  Object.keys(pts).forEach(n => n && set.add(n));
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i) || ""; const j = k.indexOf("::"); if (j > 0 && BOARDS.some(b => b.k === k.slice(0, j))) set.add(k.slice(j + 2)); } } catch (e) {}
  return [...set];
}
// 한 사람의 기록 읽기(이 폰 주인은 "키", 다른 사람은 "키::이름")
function readVal(b, name, sub) {
  const key = name === ownerName() ? b.k : b.k + "::" + name;
  let v = jsonGet(key);
  if (v && typeof v === "object" && sub != null) v = v[sub];
  v = Number(v);
  return v > 0 ? v : null;
}
function render() {
  const names = allNames(), cur = FP.player() || ownerName(), wins = {};
  names.forEach(n => wins[n] = 0);
  let html = "";
  BOARDS.forEach(b => {
    const subs = b.sub || [[null, ""]];
    let rowsHtml = "", any = false;
    subs.forEach(([sk, sl]) => {
      const rows = names.map(n => ({ n, v: readVal(b, n, sk) })).filter(r => r.v != null).sort((x, y) => b.low ? x.v - y.v : y.v - x.v);
      if (rows.length) any = true;
      if (rows.length >= 2) { const best = rows[0].v; rows.filter(r => r.v === best).forEach(r => wins[r.n]++); }
      rowsHtml += (sl ? `<div class="sub">${esc(sl)}</div>` : "") + (rows.length ? rows.map((r, i) => `<div class="li${r.n === cur ? " me" : ""}"><span><span class="rk">${MEDAL[i] || (i + 1)}</span> ${esc(r.n)}</span><b>${esc(b.fmt(r.v))}</b></div>`).join("") : `<div class="note">아직 기록이 없어요</div>`);
    });
    html += `<div class="card"><div class="gt"><b>${b.e} ${esc(b.t)}</b><a href="${b.f}">하러 가기 ›</a></div>${rowsHtml}</div>`;
  });
  $("boards").innerHTML = html;
  const tot = names.map(n => ({ n, w: wins[n] })).sort((a, b) => b.w - a.w);
  $("total").innerHTML = tot.map((r, i) => `<div class="li${r.n === cur ? " me" : ""}"><span><span class="rk">${i === 0 && r.w > 0 ? "🥇" : i + 1}</span> ${esc(r.n)}</span><b>${r.w}번</b></div>`).join("");
  $("tnote").textContent = tot.every(r => r.w === 0) ? "두 사람 이상이 같은 게임을 하면 1등이 정해져요. 위쪽 칩에서 '누가 하나요?'를 골라 보세요." : "";
}
render();
addEventListener("pageshow", render);

</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<script src="med-notify.js" defer></script>
<script src="home.js" defer></script>
</body>
</html>
