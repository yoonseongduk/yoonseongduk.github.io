<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미니 스도쿠</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(262 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(262 22% 86%);--accent:hsl(262 65% 46%);--accent-fg:#fff;--soft:hsl(262 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(262 22% 10%);--surface:hsl(262 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(262 16% 25%);--accent:hsl(262 75% 68%);--accent-fg:#10131c;--soft:hsl(262 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sgrid{display:grid;gap:0;border:3px solid var(--fg);border-radius:12px;overflow:hidden;background:var(--surface);width:100%;max-width:400px;margin:0 auto}.cell{aspect-ratio:1;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);font-family:var(--font-display);font-size:clamp(1.5rem,8vw,2.2rem);padding:0;min-width:0;color:var(--accent)}.cell.fx{color:var(--fg);background:var(--soft)}.cell.br{border-right:3px solid var(--fg)}.cell.bb{border-bottom:3px solid var(--fg)}.cell.same{background:color-mix(in srgb,var(--accent) 18%,var(--surface))}.cell.sel{background:color-mix(in srgb,var(--accent) 38%,var(--surface))}.cell.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}.pad{display:grid;gap:6px}.pad button{padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-display);font-size:1.5rem}.pad .er{grid-column:1/-1;font-family:var(--font-body);font-size:1rem;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>미니 스도쿠 🔢</h1>
  <div class="seg" id="mode" style="--n:2"><button type="button" data-m="4" class="on">4×4<small>쉬움</small></button><button type="button" data-m="6">6×6<small>보통</small></button></div>
  <div class="stats"><div class="stat"><small>시간</small><b id="time">0:00</b></div><div class="stat"><small>빈칸</small><b id="left">0</b></div><div class="stat"><small>최고 기록</small><b id="best">-</b></div></div>
  <div class="sgrid" id="grid"></div>
  <div class="pad" id="pad"></div>
  <div class="res" id="res" hidden></div>
  <button class="btn ghost" id="again" type="button">새 퍼즐</button>
  <p class="muted">빈칸에 숫자를 채워요. <b>가로줄, 세로줄, 굵은 선으로 나뉜 작은 상자</b> 안에 같은 숫자가 겹치지 않아야 해요. 4×4는 1~4, 6×6은 1~6을 써요. 칸을 누르고 아래 숫자를 눌러 채우세요. 겹치는 숫자는 빨갛게 표시돼요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "minisudoku-best-v1";
const CFG = { 4: [2, 2, 8], 6: [2, 3, 20] };
let N = 4, BH = 2, BW = 2, sol = [], puz = [], cur = [], fixed = [], sel = -1, done = false, t0 = 0, best = ld(KEY) || {}, timer = 0;
function ok(g, i, v) {
  const r = Math.floor(i / N), c = i % N;
  for (let k = 0; k < N; k++) { if (r * N + k !== i && g[r * N + k] === v) return false; if (k * N + c !== i && g[k * N + c] === v) return false; }
  const r0 = r - (r % BH), c0 = c - (c % BW);
  for (let a = 0; a < BH; a++) for (let b = 0; b < BW; b++) { const j = (r0 + a) * N + c0 + b; if (j !== i && g[j] === v) return false; }
  return true;
}
function solveCount(g, limit) {
  const i = g.indexOf(0); if (i < 0) return 1; let n = 0;
  for (let v = 1; v <= N; v++) if (ok(g, i, v)) { g[i] = v; n += solveCount(g, limit - n); g[i] = 0; if (n >= limit) break; }
  return n;
}
function fillRandom(g) {
  const i = g.indexOf(0); if (i < 0) return true;
  for (const v of shuf(Array.from({ length: N }, (_, k) => k + 1))) if (ok(g, i, v)) { g[i] = v; if (fillRandom(g)) return true; g[i] = 0; }
  return false;
}
function newGame(m) {
  if (m) { N = m; [BH, BW] = CFG[m]; }
  sol = Array(N * N).fill(0); fillRandom(sol); puz = [...sol]; let removed = 0;
  for (const i of shuf([...Array(N * N).keys()])) {
    if (removed >= CFG[N][2]) break; const v = puz[i]; puz[i] = 0;
    if (solveCount([...puz], 2) !== 1) puz[i] = v; else removed++;
  }
  cur = [...puz]; fixed = puz.map(v => v > 0); sel = -1; done = false; t0 = Date.now(); $("res").hidden = true;
  $("grid").style.gridTemplateColumns = `repeat(${N}, 1fr)`; $("grid").className = "sgrid n" + N;
  $("pad").innerHTML = Array.from({ length: N }, (_, k) => `<button type="button" data-v="${k + 1}">${k + 1}</button>`).join("") + `<button type="button" data-v="0" class="er">지우기</button>`;
  $("pad").style.gridTemplateColumns = `repeat(${N}, 1fr)`; render();
}
function conflict(i) { return cur[i] > 0 && !ok(cur, i, cur[i]); }
function fmt(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function render() {
  $("grid").innerHTML = cur.map((v, i) => {
    const r = Math.floor(i / N), c = i % N, cl = ["cell"];
    if (fixed[i]) cl.push("fx"); if (i === sel) cl.push("sel"); else if (sel >= 0 && v && v === cur[sel]) cl.push("same"); if (conflict(i)) cl.push("bad");
    if ((c + 1) % BW === 0 && c < N - 1) cl.push("br"); if ((r + 1) % BH === 0 && r < N - 1) cl.push("bb");
    return `<button type="button" class="${cl.join(" ")}" data-i="${i}" aria-label="${r + 1}행 ${c + 1}열 ${v || "빈칸"}">${v || ""}</button>`;
  }).join("");
  $("left").textContent = cur.filter(v => v === 0).length; $("best").textContent = best[N] ? fmt(best[N]) : "-";
}
function check() {
  if (cur.every(v => v > 0) && cur.every((v, i) => !conflict(i))) {
    done = true; const s = Math.round((Date.now() - t0) / 1000), nb = !best[N] || s < best[N]; if (nb) { best[N] = s; sv(KEY, best); }
    $("res").innerHTML = `<b>🎉 완성! ${fmt(s)}</b><p class="muted">${nb ? "신기록이에요!" : "최고 기록 " + fmt(best[N])}</p>`; $("res").hidden = false; render();
  }
}
$("grid").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b && !done) { sel = +b.dataset.i; render(); } });
$("pad").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (!b || done || sel < 0 || fixed[sel]) return; cur[sel] = +b.dataset.v; render(); check(); });
$("mode").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (!b) return; document.querySelectorAll("#mode button").forEach(x => x.classList.toggle("on", x === b)); newGame(+b.dataset.m); });
$("again").onclick = () => newGame();
timer = setInterval(() => { if (!done) $("time").textContent = fmt(Math.floor((Date.now() - t0) / 1000)); }, 500);
newGame(4);
</script>
</body>
</html>
