<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스톱워치·타이머</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(215 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(215 22% 86%);--accent:hsl(215 65% 46%);--accent-fg:#fff;--soft:hsl(215 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(215 22% 10%);--surface:hsl(215 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(215 16% 25%);--accent:hsl(215 75% 68%);--accent-fg:#10131c;--soft:hsl(215 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.blink{animation:bl .5s infinite alternate;color:var(--bad)}@keyframes bl{to{opacity:.25}}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.92rem}.row3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.row3 label{display:flex;flex-direction:column;gap:2px;font-size:.85rem;color:var(--muted)}.laps{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px}.laps li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
</style>
</head>
<body>
<main>
  <h1>스톱워치·타이머 ⏱️</h1>
  <div class="seg" id="tab" style="--n:2"><button type="button" data-t="sw" class="on">⏱ 스톱워치</button><button type="button" data-t="tm">⏳ 타이머</button></div>
  <div class="card center"><p class="big" id="clock" style="font-size:clamp(2.6rem,15vw,4rem);font-variant-numeric:tabular-nums">00:00.00</p></div>
  <div id="swp"><div class="row"><button class="btn ghost" id="lap" type="button">구간 기록</button><button class="btn" id="ss" type="button">시작</button></div><button class="btn ghost" id="swreset" type="button" style="margin-top:8px;width:100%">초기화</button><ol class="laps" id="laps"></ol></div>
  <div id="tmp" hidden><div class="chips" id="pre"></div><div class="row3"><label>분<input type="number" id="mm" min="0" max="180" value="3" inputmode="numeric"></label><label>초<input type="number" id="ss2" min="0" max="59" value="0" inputmode="numeric"></label></div><div class="row"><button class="btn ghost" id="tmreset" type="button">초기화</button><button class="btn" id="tms" type="button">시작</button></div></div>
  <p class="muted"><b>스톱워치</b>는 시작/멈춤/구간 기록을, <b>타이머</b>는 라면 3분처럼 정해진 시간이 지나면 <b>소리와 진동</b>으로 알려 줘요. 위의 프리셋 버튼을 누르거나 직접 시간을 정할 수 있어요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "stopwatch-v1";
let mode = "sw", run = false, t0 = 0, acc = 0, laps = [], raf = 0, total = 180000, tempo = 1, tmRun = false, endAt = 0, left = 180000;
const fmt = ms => { ms = Math.max(0, ms); const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60, c = Math.floor(ms % 1000 / 10); return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(c).padStart(2, "0")}`; };
function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(); for (let k = 0; k < 4; k++) { const o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = .25; o.start(a.currentTime + k * .35); o.stop(a.currentTime + k * .35 + .2); } } catch (e) {} if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); }
function loop() { if (mode === "sw") { const t = acc + (run ? (performance.now() - t0) * tempo : 0); $("clock").textContent = fmt(t); } else { if (tmRun) { left = endAt - performance.now() * tempo; if (left <= 0) { left = 0; tmRun = false; $("tms").textContent = "시작"; beep(); $("clock").classList.add("blink"); } } $("clock").textContent = fmt(left); } raf = requestAnimationFrame(loop); }
$("ss").onclick = () => { if (run) { acc += (performance.now() - t0) * tempo; run = false; $("ss").textContent = "계속"; } else { t0 = performance.now(); run = true; $("ss").textContent = "멈춤"; } };
$("lap").onclick = () => { const t = acc + (run ? (performance.now() - t0) * tempo : 0); if (t > 0) { laps.push(t); $("laps").innerHTML = laps.map((x, k) => `<li>구간 ${k + 1}: <b>${fmt(x)}</b> <small>(+${fmt(x - (laps[k - 1] || 0))})</small></li>`).reverse().join(""); } };
$("swreset").onclick = () => { run = false; acc = 0; laps = []; $("ss").textContent = "시작"; $("laps").innerHTML = ""; };
function setTotal() { total = ((+$("mm").value || 0) * 60 + (+$("ss2").value || 0)) * 1000; left = total; $("clock").classList.remove("blink"); }
$("pre").innerHTML = [["라면 3분", 3, 0], ["계란 7분", 7, 0], ["5분", 5, 0], ["10분", 10, 0], ["30분", 30, 0], ["양치 2분", 2, 0]].map(([n, m, s]) => `<button type="button" class="chip" data-m="${m}" data-s="${s}">${n}</button>`).join("");
$("pre").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (b) { $("mm").value = b.dataset.m; $("ss2").value = b.dataset.s; tmRun = false; $("tms").textContent = "시작"; setTotal(); } });
$("mm").oninput = $("ss2").oninput = () => { if (!tmRun) setTotal(); };
$("tms").onclick = () => { if (tmRun) { tmRun = false; $("tms").textContent = "계속"; } else { if (left <= 0) setTotal(); if (left <= 0) return; $("clock").classList.remove("blink"); endAt = performance.now() * tempo + left; tmRun = true; $("tms").textContent = "멈춤"; } };
$("tmreset").onclick = () => { tmRun = false; $("tms").textContent = "시작"; setTotal(); };
$("tab").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (!b) return; mode = b.dataset.t; document.querySelectorAll("#tab button").forEach(x => x.classList.toggle("on", x === b)); $("swp").hidden = mode !== "sw"; $("tmp").hidden = mode !== "tm"; $("clock").classList.remove("blink"); });
setTotal(); raf = requestAnimationFrame(loop);
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
