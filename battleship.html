<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전함 게임</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(215 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(215 22% 86%);--accent:hsl(215 65% 46%);--accent-fg:#fff;--soft:hsl(215 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(215 22% 10%);--surface:hsl(215 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(215 16% 25%);--accent:hsl(215 75% 68%);--accent-fg:#10131c;--soft:hsl(215 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bs{display:grid;gap:4px;max-width:300px;margin:0 auto;width:100%}.bc{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:color-mix(in srgb,#2f8fe0 20%,var(--surface));padding:0;font-size:1.2rem;min-width:0;display:flex;align-items:center;justify-content:center}.bc.miss{background:var(--surface)}.bc.hit{background:color-mix(in srgb,var(--bad) 28%,var(--surface))}.mine .bc.ship{background:var(--soft)}.bc:disabled{opacity:1;cursor:default}
</style>
</head>
<body>
<main>
  <h1>전함 게임 🚢</h1>
  <div class="stats"><div class="stat"><small>적 함선 남음</small><b id="e">0</b></div><div class="stat"><small>내 함선 남음</small><b id="m">0</b></div><div class="stat"><small>최소 발사</small><b id="best">-</b></div></div>
  <p class="muted center">📍 적의 바다 — 여기를 눌러 공격!</p>
  <div class="bs" id="eg"></div>
  <p class="muted center">🛟 내 바다</p>
  <div class="bs mine" id="mg"></div>
  <p class="center" id="msg" style="min-height:1.5em;font-weight:700"></p>
  <div class="res" id="res" hidden></div>
  <button class="btn ghost" id="again" type="button">새 게임</button>
  <p class="muted">컴퓨터의 바다(위쪽 판)에 숨은 <b>전함</b>을 찾아 칸을 눌러 포탄을 쏘세요! 💥 명중, 🌊 빗나감. 컴퓨터도 내 바다(아래쪽 판)에 포탄을 쏴요. 상대 전함을 <b>먼저 모두 침몰</b>시키면 이겨요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "battleship-best-v1";
const N = 6, SHIPS = [3, 2, 2, 1];
let eb, mb, es, ms, shots = 0, over = false, busy = false, best = ld(KEY), tempo = 1, cpuHits = [];
function place() { const b = Array.from({ length: N }, () => Array(N).fill(0)), ships = []; for (const len of SHIPS) { for (;;) { const h = Math.random() < .5, r = ri(0, N - (h ? 1 : len)), c = ri(0, N - (h ? len : 1)), cells = Array.from({ length: len }, (_, k) => [r + (h ? 0 : k), c + (h ? k : 0)]); const near = cells.some(([y, x]) => { for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (b[y + dy] && b[y + dy][x + dx]) return true; return false; }); if (near) continue; cells.forEach(([y, x]) => { b[y][x] = ships.length + 1; }); ships.push({ cells, hit: 0 }); break; } } return { b, ships }; }
function newGame() { const e = place(), m = place(); eb = e.b; es = e.ships; mb = m.b; ms = m.ships; ge = Array.from({ length: N }, () => Array(N).fill(0)); gm = Array.from({ length: N }, () => Array(N).fill(0)); shots = 0; over = false; busy = false; cpuHits = []; $("msg").textContent = ""; $("res").hidden = true; render(); }
let ge, gm;
const alive = ships => ships.filter(s => s.hit < s.cells.length).length;
function render() {
  $("eg").style.gridTemplateColumns = $("mg").style.gridTemplateColumns = `repeat(${N}, 1fr)`;
  $("eg").innerHTML = ge.map((row, r) => row.map((v, c) => `<button type="button" class="bc${v === 1 ? " miss" : v === 2 ? " hit" : ""}" data-r="${r}" data-c="${c}" ${v || over ? "disabled" : ""}>${v === 1 ? "🌊" : v === 2 ? "💥" : ""}</button>`).join("")).join("");
  $("mg").innerHTML = gm.map((row, r) => row.map((v, c) => `<div class="bc${mb[r][c] ? " ship" : ""}${v === 1 ? " miss" : v === 2 ? " hit" : ""}">${v === 1 ? "🌊" : v === 2 ? "💥" : mb[r][c] ? "🚢" : ""}</div>`).join("")).join("");
  $("e").textContent = alive(es); $("m").textContent = alive(ms); $("best").textContent = best ? best + "발" : "-";
}
function fire(b, ships, g, r, c) { if (b[r][c]) { g[r][c] = 2; const s = ships[b[r][c] - 1]; s.hit++; return s.hit === s.cells.length ? "sunk" : "hit"; } g[r][c] = 1; return "miss"; }
function cpuShot() {
  let cand = []; for (const [r, c] of cpuHits) for (const [dy, dx] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const y = r + dy, x = c + dx; if (y >= 0 && y < N && x >= 0 && x < N && !gm[y][x]) cand.push([y, x]); }
  if (!cand.length) for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!gm[r][c] && (r + c) % 2 === 0) cand.push([r, c]); if (!cand.length) for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!gm[r][c]) cand.push([r, c]);
  const [r, c] = cand[ri(0, cand.length - 1)], res = fire(mb, ms, gm, r, c); if (res === "hit") cpuHits.push([r, c]); if (res === "sunk") cpuHits = []; return res;
}
async function attack(r, c) {
  if (over || busy || ge[r][c]) return; busy = true; shots++; const res = fire(eb, es, ge, r, c); $("msg").textContent = res === "sunk" ? "💥 침몰시켰어요!" : res === "hit" ? "💥 명중!" : "🌊 빗나갔어요"; render();
  if (!alive(es)) { over = true; const nb = !best || shots < best; if (nb) { best = shots; sv(KEY, best); } $("res").innerHTML = `<b>🎉 승리! ${shots}발 만에 모두 침몰</b><p class="muted">${nb ? "신기록이에요!" : "최소 기록 " + best + "발"}</p>`; $("res").hidden = false; render(); busy = false; return; }
  await new Promise(r2 => setTimeout(r2, 500 * tempo)); const rr = cpuShot(); $("msg").textContent += rr === "miss" ? "  (적도 빗나감)" : "  ⚠️ 적의 공격에 당했어요!"; render();
  if (!alive(ms)) { over = true; $("res").innerHTML = `<b>😢 내 함선이 모두 침몰했어요</b>`; $("res").hidden = false; render(); } busy = false;
}
$("eg").addEventListener("click", e => { const b = e.target.closest("[data-r]"); if (b) attack(+b.dataset.r, +b.dataset.c); });
$("again").onclick = newGame; newGame();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
