<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="person.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오케스트라 퀴즈</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
/* 레이아웃: (분류 버튼), 점수 줄, 문제 카드, 네 개의 보기. 고르면 정답이 바로 표시되고 10문제를 풀면 결과가 나온다 */
:root{--bg:hsl(20 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(20 22% 86%);--accent:hsl(20 60% 42%);--accent-fg:#fff;--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(20 22% 10%);--surface:hsl(20 20% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(20 18% 24%);--accent:hsl(20 75% 68%);--accent-fg:#10131c;--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.9rem}.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:12px;font-family:var(--font-display);font-size:1.3rem}
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 16px;text-align:center;font-family:var(--font-display);font-size:clamp(1.5rem,7vw,2.1rem);line-height:1.4;overflow-wrap:anywhere}
.q small{display:block;color:var(--accent);font-family:var(--font-body);font-weight:700;font-size:.85rem;margin-bottom:4px}
.q .note{display:block;color:var(--muted);font-family:var(--font-body);font-size:.9rem;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts.one{grid-template-columns:1fr}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;min-height:58px;padding:8px 10px;font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}.opt:disabled{cursor:default}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.flagb{margin-top:8px;background:transparent;border:1px dashed var(--line);border-radius:999px;padding:4px 12px;font-family:var(--font-body);font-size:.85rem;color:var(--muted)}.flagb.on{border-style:solid;border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body>
<main>
  <h1>오케스트라 퀴즈 🎻</h1>
  <div class="chips" id="lvs" role="group" aria-label="등급"></div>
  <p class="muted" id="lvp"></p>
  <div class="chips" id="cats" role="group" aria-label="분류" hidden></div>
  <div class="stats"><div class="stat"><small>문제</small><b id="no">0/10</b></div><div class="stat"><small>맞힌 수</small><b id="score">0</b></div><div class="stat"><small>최고</small><b id="best">0</b></div></div>
  <div class="q" id="q"></div>
  <div class="opts" id="opts"></div>
  <div class="res" id="res" hidden></div>
  <button class="btn" id="next" type="button" hidden>다음 문제</button>
  <p class="muted">오케스트라 악기와 연주 이야기를 맞혀 보세요. 모든 악기는 <a href="orchestra-gallery.html">🎷 오케스트라 악기 도감</a>에서 볼 수 있어요. 10문제를 풀면 결과가 나와요.</p>
</main>
<script>
// [문제, 정답, 틀린 보기(없으면 같은 분류의 다른 정답에서 뽑음), 분류, 해설]
const D = [["도감 1번 악기(그림)의 이름은 무엇일까요?", "바이올린", ["비올라", "트롬본", "큰북"], "현악기", "바이올린(Violin)은 현악기예요. 현악기 가운데 가장 작고 가장 높은 소리를 내요. 오케스트라에서 제1·제2바이올린으로 나뉘어 가장 많은 사람이 앉아요."], ["현악기 중 가장 작고 가장 높은 소리를 내는 악기는?", "바이올린", ["실로폰", "콘트라바순", "플루트"], "현악기", "바이올린 — 현악기 가운데 가장 작고 가장 높은 소리를 내요. 오케스트라에서 제1·제2바이올린으로 나뉘어 가장 많은 사람이 앉아요."], ["도감 2번 악기(그림)의 이름은 무엇일까요?", "비올라", ["콘트라베이스", "팀파니", "클라리넷"], "현악기", "비올라(Viola)은 현악기예요. 바이올린보다 조금 크고 소리가 낮고 부드러워요. 현악 합주에서 가운데 소리를 맡아요."], ["바이올린보다 조금 크고 가운데 소리를 맡는 현악기는?", "비올라", ["콘트라베이스", "심벌즈", "파이프 오르간"], "현악기", "비올라 — 바이올린보다 조금 크고 소리가 낮고 부드러워요. 현악 합주에서 가운데 소리를 맡아요."], ["도감 3번 악기(그림)의 이름은 무엇일까요?", "첼로", ["바이올린", "호른", "징(탐탐)"], "현악기", "첼로(Cello)은 현악기예요. 사람의 목소리와 비슷한 깊고 따뜻한 소리가 나요. 앉아서 연주하고 바닥에 닿는 막대(엔드핀)로 받쳐요."], ["바닥에 세워 무릎 사이에 끼고 연주하는 현악기는?", "첼로", ["큰북", "파이프 오르간", "플루트"], "현악기", "첼로 — 사람의 목소리와 비슷한 깊고 따뜻한 소리가 나요. 앉아서 연주하고 바닥에 닿는 막대(엔드핀)로 받쳐요."], ["도감 4번 악기(그림)의 이름은 무엇일까요?", "콘트라베이스", ["첼로", "탬버린", "파이프 오르간"], "현악기", "콘트라베이스(Double bass)은 현악기예요. 현악기 중 가장 크고 가장 낮은 소리를 내요. 오케스트라의 낮은 바탕 소리를 맡아요."], ["현악기 중 가장 크고 가장 낮은 소리를 내는 악기는?", "콘트라베이스", ["비올라", "탬버린", "첼레스타"], "현악기", "콘트라베이스 — 현악기 중 가장 크고 가장 낮은 소리를 내요. 오케스트라의 낮은 바탕 소리를 맡아요."], ["도감 5번 악기(그림)의 이름은 무엇일까요?", "하프", ["비올라", "바이올린", "트라이앵글"], "건반·하프", "하프(Harp)은 건반·하프예요. 줄이 40개 넘게 걸려 있고 발로 페달을 밟아 음높이를 바꿔요. 맑고 흐르는 듯한 소리가 나요."], ["줄이 40개 넘게 걸려 있고 발로 페달을 밟아 음높이를 바꾸는 악기는?", "하프", ["바순", "탬버린", "실로폰"], "건반·하프", "하프 — 줄이 40개 넘게 걸려 있고 발로 페달을 밟아 음높이를 바꿔요. 맑고 흐르는 듯한 소리가 나요."], ["도감 6번 악기(그림)의 이름은 무엇일까요?", "플루트", ["캐스터네츠", "트럼펫", "피아노"], "목관악기", "플루트(Flute)은 목관악기예요. 금속으로 만들지만 '나무로 된 관악기'의 전통 때문에 목관악기로 분류해요. 맑고 밝은 소리가 나요."], ["금속으로 만들지만 목관악기로 분류하고, 리드 없이 바람을 불어 소리 내는 악기는?", "플루트", ["첼로", "트롬본", "튜바"], "목관악기", "플루트 — 금속으로 만들지만 '나무로 된 관악기'의 전통 때문에 목관악기로 분류해요. 맑고 밝은 소리가 나요."], ["도감 7번 악기(그림)의 이름은 무엇일까요?", "피콜로", ["클라리넷", "파이프 오르간", "작은북"], "목관악기", "피콜로(Piccolo)은 목관악기예요. 플루트의 절반 정도 크기이고 오케스트라에서 가장 높은 소리를 내는 악기 가운데 하나예요."], ["플루트의 절반쯤 크기로 아주 높은 소리를 내는 목관악기는?", "피콜로", ["오보에", "큰북", "튜바"], "목관악기", "피콜로 — 플루트의 절반 정도 크기이고 오케스트라에서 가장 높은 소리를 내는 악기 가운데 하나예요."], ["도감 8번 악기(그림)의 이름은 무엇일까요?", "오보에", ["캐스터네츠", "작은북", "바이올린"], "목관악기", "오보에(Oboe)은 목관악기예요. 코가 막힌 듯 또렷한 소리가 나요. 연주 전에 오보에가 '라(A)' 음을 내면 다른 악기가 음을 맞춰요."], ["연주 전에 튜닝 기준 음(라)을 내 주는, 겹리드를 쓰는 목관악기는?", "오보에", ["작은북", "첼레스타", "피아노"], "목관악기", "오보에 — 코가 막힌 듯 또렷한 소리가 나요. 연주 전에 오보에가 '라(A)' 음을 내면 다른 악기가 음을 맞춰요."], ["도감 9번 악기(그림)의 이름은 무엇일까요?", "잉글리시 호른", ["콘트라바순", "클라리넷", "심벌즈"], "목관악기", "잉글리시 호른(English horn)은 목관악기예요. 이름과 달리 호른이 아니라 오보에 계열 악기예요. 오보에보다 낮고 쓸쓸한 소리가 나요."], ["이름과 달리 호른이 아니라 오보에 계열에 속하는 악기는?", "잉글리시 호른", ["클라리넷", "플루트", "실로폰"], "목관악기", "잉글리시 호른 — 이름과 달리 호른이 아니라 오보에 계열 악기예요. 오보에보다 낮고 쓸쓸한 소리가 나요."], ["도감 10번 악기(그림)의 이름은 무엇일까요?", "클라리넷", ["하프", "트롬본", "트라이앵글"], "목관악기", "클라리넷(Clarinet)은 목관악기예요. 음역이 넓고 소리가 부드러워요. 낮은 소리는 어둡고 높은 소리는 밝아요."], ["홑리드를 입에 물고 부는 목관악기로 '피터와 늑대'의 고양이를 맡은 악기는?", "클라리넷", ["실로폰", "호른", "피아노"], "목관악기", "클라리넷 — 음역이 넓고 소리가 부드러워요. 낮은 소리는 어둡고 높은 소리는 밝아요."], ["도감 11번 악기(그림)의 이름은 무엇일까요?", "바순", ["잉글리시 호른", "비올라", "피아노"], "목관악기", "바순(Bassoon)은 목관악기예요. 긴 관을 반으로 접은 모양이에요. 목관악기 중 낮은 소리를 맡고 익살스러운 소리도 잘 내요."], ["긴 관을 반으로 접은 모양의 낮은 목관악기로 '피터와 늑대'의 할아버지를 맡은 악기는?", "바순", ["콘트라바순", "첼레스타", "호른"], "목관악기", "바순 — 긴 관을 반으로 접은 모양이에요. 목관악기 중 낮은 소리를 맡고 익살스러운 소리도 잘 내요."], ["도감 12번 악기(그림)의 이름은 무엇일까요?", "콘트라바순", ["오보에", "잉글리시 호른", "첼로"], "목관악기", "콘트라바순(Contrabassoon)은 목관악기예요. 바순보다 한 옥타브 낮은 소리를 내는, 오케스트라에서 가장 낮은 목관악기예요."], ["오케스트라에서 가장 낮은 소리를 내는 목관악기는?", "콘트라바순", ["플루트", "바순", "탬버린"], "목관악기", "콘트라바순 — 바순보다 한 옥타브 낮은 소리를 내는, 오케스트라에서 가장 낮은 목관악기예요."], ["도감 13번 악기(그림)의 이름은 무엇일까요?", "트럼펫", ["캐스터네츠", "팀파니", "피아노"], "금관악기", "트럼펫(Trumpet)은 금관악기예요. 밝고 힘찬 소리를 내서 팡파르에 많이 써요."], ["금관악기 중 가장 높고 밝은 소리를 내고 팡파르에 자주 쓰는 악기는?", "트럼펫", ["실로폰", "플루트", "글로켄슈필"], "금관악기", "트럼펫 — 밝고 힘찬 소리를 내서 팡파르에 많이 써요."], ["도감 14번 악기(그림)의 이름은 무엇일까요?", "호른", ["바순", "글로켄슈필", "피아노"], "금관악기", "호른(French horn)은 금관악기예요. 관을 동그랗게 감은 모양이에요. 부드럽고 따뜻한 소리로 숲이나 사냥을 표현할 때 많이 써요."], ["관을 동그랗게 감았고 오른손을 나팔 안에 넣어 소리를 다듬는 금관악기는?", "호른", ["탬버린", "큰북", "피콜로"], "금관악기", "호른 — 관을 동그랗게 감은 모양이에요. 부드럽고 따뜻한 소리로 숲이나 사냥을 표현할 때 많이 써요."], ["도감 15번 악기(그림)의 이름은 무엇일까요?", "트롬본", ["큰북", "글로켄슈필", "클라리넷"], "금관악기", "트롬본(Trombone)은 금관악기예요. 밸브 대신 슬라이드를 써서 음이 미끄러지듯 이어지는 소리를 낼 수 있어요."], ["슬라이드를 밀고 당겨 음높이를 바꾸는 금관악기는?", "트롬본", ["바이올린", "피아노", "플루트"], "금관악기", "트롬본 — 밸브 대신 슬라이드를 써서 음이 미끄러지듯 이어지는 소리를 낼 수 있어요."], ["도감 16번 악기(그림)의 이름은 무엇일까요?", "튜바", ["트럼펫", "바순", "콘트라베이스"], "금관악기", "튜바(Tuba)은 금관악기예요. 금관악기 중 가장 크고 가장 낮은 소리를 내요."], ["금관악기 중 가장 크고 가장 낮은 소리를 내는 악기는?", "튜바", ["호른", "트라이앵글", "콘트라바순"], "금관악기", "튜바 — 금관악기 중 가장 크고 가장 낮은 소리를 내요."], ["도감 17번 악기(그림)의 이름은 무엇일까요?", "팀파니", ["잉글리시 호른", "호른", "첼레스타"], "타악기", "팀파니(Timpani)은 타악기예요. 구리 솥 모양의 북이에요. 페달로 음높이를 바꿀 수 있어서 '음정이 있는 북'이에요."], ["페달로 음높이를 바꿀 수 있는, 구리 솥 모양의 북은?", "팀파니", ["첼로", "오보에", "첼레스타"], "타악기", "팀파니 — 구리 솥 모양의 북이에요. 페달로 음높이를 바꿀 수 있어서 '음정이 있는 북'이에요."], ["도감 18번 악기(그림)의 이름은 무엇일까요?", "작은북", ["글로켄슈필", "호른", "트롬본"], "타악기", "작은북(Snare drum)은 타악기예요. 북 아래쪽에 줄(스네어)이 있어서 '차르르' 하는 소리가 나요. 행진곡에 어울려요."], ["아래쪽에 줄(스네어)이 있어 '차르르' 소리가 나는 북은?", "작은북", ["탬버린", "비올라", "파이프 오르간"], "타악기", "작은북 — 북 아래쪽에 줄(스네어)이 있어서 '차르르' 하는 소리가 나요. 행진곡에 어울려요."], ["도감 19번 악기(그림)의 이름은 무엇일까요?", "큰북", ["캐스터네츠", "콘트라베이스", "플루트"], "타악기", "큰북(Bass drum)은 타악기예요. 크고 깊게 울리는 북이에요. 폭발이나 천둥소리를 표현해요."], ["오케스트라에서 가장 큰 북으로 깊고 낮게 울리는 악기는?", "큰북", ["트라이앵글", "튜바", "잉글리시 호른"], "타악기", "큰북 — 크고 깊게 울리는 북이에요. 폭발이나 천둥소리를 표현해요."], ["도감 20번 악기(그림)의 이름은 무엇일까요?", "심벌즈", ["파이프 오르간", "바순", "콘트라베이스"], "타악기", "심벌즈(Cymbals)은 타악기예요. 둥근 금속 판 두 장으로 '쨍' 하고 화려한 소리를 내요."], ["둥근 금속 판 두 장을 마주쳐 '쨍' 소리를 내는 악기는?", "심벌즈", ["바이올린", "호른", "오보에"], "타악기", "심벌즈 — 둥근 금속 판 두 장으로 '쨍' 하고 화려한 소리를 내요."], ["도감 21번 악기(그림)의 이름은 무엇일까요?", "트라이앵글", ["오보에", "피콜로", "비올라"], "타악기", "트라이앵글(Triangle)은 타악기예요. 삼각형 모양의 금속 막대예요. 맑고 반짝이는 소리가 나요."], ["삼각형 쇠막대를 쇠채로 쳐서 맑은 소리를 내는 악기는?", "트라이앵글", ["바순", "비올라", "첼레스타"], "타악기", "트라이앵글 — 삼각형 모양의 금속 막대예요. 맑고 반짝이는 소리가 나요."], ["도감 22번 악기(그림)의 이름은 무엇일까요?", "실로폰", ["팀파니", "바이올린", "튜바"], "타악기", "실로폰(Xylophone)은 타악기예요. 음높이가 다른 나무판을 늘어놓은 악기예요. 통통 튀는 딱딱한 소리가 나요."], ["나무 판을 채로 쳐서 통통 튀는 소리를 내는 악기는?", "실로폰", ["탬버린", "첼레스타", "콘트라베이스"], "타악기", "실로폰 — 음높이가 다른 나무판을 늘어놓은 악기예요. 통통 튀는 딱딱한 소리가 나요."], ["도감 23번 악기(그림)의 이름은 무엇일까요?", "글로켄슈필", ["팀파니", "캐스터네츠", "클라리넷"], "타악기", "글로켄슈필(Glockenspiel)은 타악기예요. 금속 판을 늘어놓은 악기라 종소리처럼 맑고 높은 소리가 나요."], ["금속 판을 채로 쳐서 종소리처럼 맑은 소리를 내는 악기는?", "글로켄슈필", ["심벌즈", "트라이앵글", "콘트라바순"], "타악기", "글로켄슈필 — 금속 판을 늘어놓은 악기라 종소리처럼 맑고 높은 소리가 나요."], ["도감 24번 악기(그림)의 이름은 무엇일까요?", "징(탐탐)", ["실로폰", "캐스터네츠", "콘트라베이스"], "타악기", "징(탐탐)(Gong (tam-tam))은 타악기예요. 크고 둥근 금속 판이에요. 길고 깊게 울려서 엄숙하거나 무서운 장면에 써요."], ["크고 둥근 금속 판을 큰 채로 쳐서 길게 울리게 하는 악기는?", "징(탐탐)", ["팀파니", "심벌즈", "트롬본"], "타악기", "징(탐탐) — 크고 둥근 금속 판이에요. 길고 깊게 울려서 엄숙하거나 무서운 장면에 써요."], ["도감 25번 악기(그림)의 이름은 무엇일까요?", "탬버린", ["글로켄슈필", "플루트", "피콜로"], "타악기", "탬버린(Tambourine)은 타악기예요. 둥근 틀에 작은 금속판(방울)이 달려 있어 '짤랑' 소리가 나요."], ["둥근 틀에 작은 금속판이 달려 흔들거나 쳐서 '짤랑' 소리를 내는 악기는?", "탬버린", ["캐스터네츠", "바순", "호른"], "타악기", "탬버린 — 둥근 틀에 작은 금속판(방울)이 달려 있어 '짤랑' 소리가 나요."], ["도감 26번 악기(그림)의 이름은 무엇일까요?", "캐스터네츠", ["탬버린", "글로켄슈필", "호른"], "타악기", "캐스터네츠(Castanets)은 타악기예요. 작은 조개 모양 나무 두 짝을 부딪쳐 '딱딱' 소리를 내요. 스페인 춤에 많이 쓰여요."], ["작은 나무 조개 두 짝을 부딪쳐 '딱딱' 소리를 내고 스페인 춤에 쓰는 악기는?", "캐스터네츠", ["징(탐탐)", "탬버린", "호른"], "타악기", "캐스터네츠 — 작은 조개 모양 나무 두 짝을 부딪쳐 '딱딱' 소리를 내요. 스페인 춤에 많이 쓰여요."], ["도감 27번 악기(그림)의 이름은 무엇일까요?", "피아노", ["탬버린", "튜바", "콘트라바순"], "건반·하프", "피아노(Piano)은 건반·하프예요. 오케스트라의 정식 단원은 아니지만 협주곡의 독주 악기나 반주로 자주 참여해요."], ["건반을 누르면 해머가 줄을 치는 악기로, 협주곡의 독주 악기로 자주 나오는 악기는?", "피아노", ["심벌즈", "실로폰", "바이올린"], "건반·하프", "피아노 — 오케스트라의 정식 단원은 아니지만 협주곡의 독주 악기나 반주로 자주 참여해요."], ["도감 28번 악기(그림)의 이름은 무엇일까요?", "첼레스타", ["파이프 오르간", "하프", "탬버린"], "건반·하프", "첼레스타(Celesta)은 건반·하프예요. 작은 피아노처럼 생겼지만 종소리처럼 맑고 신비로운 소리가 나요."], ["작은 피아노처럼 생겼지만 종소리 같은 소리가 나고 '요정의 춤'에 쓰인 악기는?", "첼레스타", ["피아노", "하프", "바이올린"], "건반·하프", "첼레스타 — 작은 피아노처럼 생겼지만 종소리처럼 맑고 신비로운 소리가 나요."], ["도감 29번 악기(그림)의 이름은 무엇일까요?", "파이프 오르간", ["첼레스타", "트럼펫", "심벌즈"], "건반·하프", "파이프 오르간(Pipe organ)은 건반·하프예요. 수많은 파이프로 웅장한 소리를 내요. 주로 큰 홀이나 성당에 설치돼 있어요."], ["수많은 파이프에 공기를 보내 소리를 내는 건반악기로, 성당에서 자주 보는 악기는?", "파이프 오르간", ["하프", "호른", "심벌즈"], "건반·하프", "파이프 , "두 개의 입술", "얇은 막대"], "오케스트라", "'높은 소리의 나무 악기'라는 뜻에서 왔어요."], ["'첼레스타(celesta)'라는 이름은 어떤 뜻에서 왔을까요?", "하늘의, 천상의", ["작은 종", "건반 있는 하프", "은빛 줄"], "오케스트라", "천상의 소리 같다고 해서 붙은 이름이에요."], ["트롬본 슬라이드의 기본 위치는 몇 가지일까요?", "7가지", ["3가지", "5가지", "12가지"], "오케스트라", "슬라이드를 바깥으로 밀수록 낮은 소리가 나고, 기본 위치가 일곱 가지예요."], ["'튜티(tutti)'의 뜻은?", "모두 함께", ["혼자", "아주 여리게", "조금 느리게"], "오케스트라", "오케스트라 단원이 모두 함께 연주하는 것을 말해요."], ["여러 사람이 함께 소리를 맞춰 연주하는 것을 무엇이라고 할까요?", "합주(앙상블)", ["독주", "카덴차", "서곡"], "오케스트라", "혼자 하면 독주(솔로), 여럿이 함께 하면 합주예요."], ["'소나타'라는 말은 원래 어떤 곡을 가리켰을까요?", "악기로 연주하는 곡", ["노래로 부르는 곡", "춤추는 곡", "행진하는 곡"], "오케스트라", "소리 낸다는 뜻에서 왔고, 노래하는 곡(칸타타)과 대비되는 이름이었어요."], ["베토벤 교향곡 중 합창과 독창이 함께하는 곡은 몇 번일까요?", "9번", ["3번", "5번", "6번"], "곡 속 악기", "9번 '합창'의 마지막 악장에서 노래가 함께해요."], ["비발디 '사계'는 몇 개의 협주곡으로 이뤄져 있을까요?", "4개", ["2개", "3개", "12개"], "곡 속 악기", "봄·여름·가을·겨울이 각각 하나의 협주곡이에요."], ["'동물의 사육제'를 작곡한 사람은?", "카미유 생상스", ["안토닌 드보르자크", "클로드 드뷔시", "요하네스 브람스"], "곡 속 악기", "여러 동물을 악기로 재미있게 표현한 곡이에요."], ["'피터와 늑대'를 작곡한 사람은?", "세르게이 프로코피예프", ["표트르 일리치 차이콥스키", "에드바르 그리그", "모리스 라벨"], "곡 속 악기", "악기마다 등장인물을 맡아 이야기를 들려주는 곡이에요."], ["'볼레로'를 작곡한 사람은?", "모리스 라벨", ["카미유 생상스", "클로드 드뷔시", "에드바르 그리그"], "곡 속 악기", "작은북의 같은 리듬 위에서 악기들이 차례로 선율을 이어받는 곡이에요."], ["'청소년을 위한 관현악 입문'을 작곡한 사람은?", "벤저민 브리튼", ["카미유 생상스", "세르게이 프로코피예프", "클로드 드뷔시"], "곡 속 악기", "오케스트라 악기와 악기군을 차례로 소개하는 곡이에요."], ["배치도에서 주황색으로 표시된 1번 자리에는 보통 누가 앉을까요? (일반적인 배치)", "제1바이올린", ["하프", "금관악기", "목관악기"], "무대 배치", "1번 자리는 지휘자 왼쪽 앞에 앉는 제1바이올린의 자리가 일반적이에요. 오케스트라마다 조금씩 다를 수 있어요."], ["배치도에서 주황색으로 표시된 2번 자리에는 보통 누가 앉을까요? (일반적인 배치)", "제2바이올린", ["콘트라베이스", "비올라", "첼로"], "무대 배치", "2번 자리는 제1바이올린 바로 옆(안쪽)에 앉는 제2바이올린의 자리가 일반적이에요. 오케스트라마다 조금씩 다를 수 있어요."], ["배치도에서 주황색으로 표시된 3번 자리에는 보통 누가 앉을까요? (일반적인 배치)", "비올라", ["금관악기", "지휘자", "콘트라베이스"], "무대 배치", "3번 자리는 지휘자 오른쪽 앞 안쪽에 앉는 비올라의 자리가 일반적이에요. 오케스트라마다 조금씩 다를 수 있어요."], ["배치도에서 주황색으로 표시된 4번 자리에는 보통 누가 앉을까요? (일반적인 배치)", "첼로", ["비올라", "제2바이올린", "목관악기"], "무대 배치", "4번 자리는 지휘자 오른쪽 앞에 앉는 첼로의 자리가 일반적이에요. 오케스트라마다 조금씩 다를 수 있어요."], ["배치도에서 주황색으로 표시된 5번 자리에는 보통 누가 앉을까요? (일반적인 배치)", "콘트라베이스", ["제2바이올린", "제1바이올린", "비올라"], "무대 배치", "5번 자리는 첼로 뒤(오른쪽 뒤)에 앉는 콘트라베이스의 자리가 일반적이에요. 오케스트라마다 조금씩 다를 수 있어요."], ["배치도에서 주황색으로 표시된 6번 자리에는 보통 누가 앉을까요? (일반적인 배치)", "목관악기", ["지휘자", "첼로", "제1바이올린"], "무대 배치", "6번 자리는 무대 가운데에 앉는 목관악기의 자리가 일반적이에요. 오케스트라마다 조금씩 다를 수 있어요."], ["배치도에서 주황색으로 표시된 7번 자리에는 보통 누가 앉을까요? (일반적인 배치)", "금관악기", ["첼로", "목관악기", "제1바이올린"], "무대 배치", "7번 자리는 목관 뒤에 앉는 금관악기의 자리가 일반적이에요. 오케스트라마다 조금씩 다를 수 있어요."], ["배치도에서 주황색으로 표시된 8번 자리에는 보통 누가 앉을까요? (일반적인 배치)", "타악기·팀파니", ["콘트라베이스", "제1바이올린", "지휘자"], "무대 배치", "8번 자리는 가장 뒤에 앉는 타악기·팀파니의 자리가 일반적이에요. 오케스트라마다 조금씩 다를 수 있어요."], ["배치도에서 주황색으로 표시된 9번 자리에는 보통 누가 앉을까요? (일반적인 배치)", "하프", ["콘트라베이스", "첼로", "타악기·팀파니"], "무대 배치", "9번 자리는 왼쪽 뒤에 앉는 하프의 자리가 일반적이에요. 오케스트라마다 조금씩 다를 수 있어요."], ["배치도에서 주황색으로 표시된 10번 자리에는 보통 누가 앉을까요? (일반적인 배치)", "지휘자", ["타악기·팀파니", "목관악기", "제1바이올린"], "무대 배치", "10번 자리는 앞 가운데 지휘대에 앉는 지휘자의 자리가 일반적이에요. 오케스트라마다 조금씩 다를 수 있어요."], ["🔊 소리 1번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "바이올린", ["콘트라베이스", "클라리넷", "플루트"], "현악기", "바이올린(Violin)의 소리였어요. 현악기 가운데 가장 작고 가장 높은 소리를 내요. 오케스트라에서 제1·제2바이올린으로 나뉘어 가장 많은 사람이 앉아요."], ["🔊 소리 2번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "비올라", ["첼로", "오보에", "글로켄슈필"], "현악기", "비올라(Viola)의 소리였어요. 바이올린보다 조금 크고 소리가 낮고 부드러워요. 현악 합주에서 가운데 소리를 맡아요."], ["🔊 소리 3번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "첼로", ["콘트라베이스", "트롬본", "파이프 오르간"], "현악기", "첼로(Cello)의 소리였어요. 사람의 목소리와 비슷한 깊고 따뜻한 소리가 나요. 앉아서 연주하고 바닥에 닿는 막대(엔드핀)로 받쳐요."], ["🔊 소리 4번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "콘트라베이스", ["첼로", "피콜로", "트라이앵글"], "현악기", "콘트라베이스(Double bass)의 소리였어요. 현악기 중 가장 크고 가장 낮은 소리를 내요. 오케스트라의 낮은 바탕 소리를 맡아요."], ["🔊 소리 5번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "하프", ["비올라", "작은북", "트럼펫"], "건반·하프", "하프(Harp)의 소리였어요. 줄이 40개 넘게 걸려 있고 발로 페달을 밟아 음높이를 바꿔요. 맑고 흐르는 듯한 소리가 나요."], ["🔊 소리 6번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "플루트", ["피콜로", "징(탐탐)", "트라이앵글"], "목관악기", "플루트(Flute)의 소리였어요. 금속으로 만들지만 '나무로 된 관악기'의 전통 때문에 목관악기로 분류해요. 맑고 밝은 소리가 나요."], ["🔊 소리 7번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "피콜로", ["오보에", "첼레스타", "작은북"], "목관악기", "피콜로(Piccolo)의 소리였어요. 플루트의 절반 정도 크기이고 오케스트라에서 가장 높은 소리를 내는 악기 가운데 하나예요."], ["🔊 소리 8번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "오보에", ["클라리넷", "트럼펫", "첼레스타"], "목관악기", "오보에(Oboe)의 소리였어요. 코가 막힌 듯 또렷한 소리가 나요. 연주 전에 오보에가 '라(A)' 음을 내면 다른 악기가 음을 맞춰요."], ["🔊 소리 9번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "잉글리시 호른", ["피콜로", "클라리넷", "하프"], "목관악기", "잉글리시 호른(English horn)의 소리였어요. 이름과 달리 호른이 아니라 오보에 계열 악기예요. 오보에보다 낮고 쓸쓸한 소리가 나요."], ["🔊 소리 10번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "클라리넷", ["잉글리시 호른", "트롬본", "비올라"], "목관악기", "클라리넷(Clarinet)의 소리였어요. 음역이 넓고 소리가 부드러워요. 낮은 소리는 어둡고 높은 소리는 밝아요."], ["🔊 소리 11번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "바순", ["클라리넷", "심벌즈", "파이프 오르간"], "목관악기", "바순(Bassoon)의 소리였어요. 긴 관을 반으로 접은 모양이에요. 목관악기 중 낮은 소리를 맡고 익살스러운 소리도 잘 내요."], ["🔊 소리 12번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "콘트라바순", ["바순", "오보에", "큰북"], "목관악기", "콘트라바순(Contrabassoon)의 소리였어요. 바순보다 한 옥타브 낮은 소리를 내는, 오케스트라에서 가장 낮은 목관악기예요."], ["🔊 소리 13번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "트럼펫", ["호른", "비올라", "작은북"], "금관악기", "트럼펫(Trumpet)의 소리였어요. 밝고 힘찬 소리를 내서 팡파르에 많이 써요."], ["🔊 소리 14번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "호른", ["튜바", "플루트", "심벌즈"], "금관악기", "호른(French horn)의 소리였어요. 관을 동그랗게 감은 모양이에요. 부드럽고 따뜻한 소리로 숲이나 사냥을 표현할 때 많이 써요."], ["🔊 소리 15번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "트롬본", ["호른", "파이프 오르간", "비올라"], "금관악기", "트롬본(Trombone)의 소리였어요. 밸브 대신 슬라이드를 써서 음이 미끄러지듯 이어지는 소리를 낼 수 있어요."], ["🔊 소리 16번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "튜바", ["호른", "탬버린", "클라리넷"], "금관악기", "튜바(Tuba)의 소리였어요. 금관악기 중 가장 크고 가장 낮은 소리를 내요."], ["🔊 소리 17번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "팀파니", ["하프", "튜바", "오보에"], "타악기", "팀파니(Timpani)의 소리였어요. 구리 솥 모양의 북이에요. 페달로 음높이를 바꿀 수 있어서 '음정이 있는 북'이에요."], ["🔊 소리 18번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "작은북", ["트라이앵글", "플루트", "튜바"], "타악기", "작은북(Snare drum)의 소리였어요. 북 아래쪽에 줄(스네어)이 있어서 '차르르' 하는 소리가 나요. 행진곡에 어울려요."], ["🔊 소리 19번을 들어 보세요. 어떤 악기 소리일까요? (아래 소리 단추를 눌러요)", "큰북", ["징(탐탐)", "트롬본", "클라리넷"], "타악기", "큰북(Bass drum)의 소리였어요. 크고 깊게 울리는 const flAll = () => { const v = ld(FLK); return v && typeof v === "object" ? v : {}; }, isFlag = q => !!(flAll()[FLF] || {})[q];
function toggleFlag(d, picked) { const all = flAll(), m = all[FLF] || (all[FLF] = {}); if (m[d[0]]) delete m[d[0]]; else m[d[0]] = { a: String(d[1]), p: String(picked || ""), t: Date.now() }; if (!Object.keys(m).length) delete all[FLF]; sv(FLK, all); }
function showFlag(d, picked) { $("q").insertAdjacentHTML("beforeend", `<button class="flagb ${isFlag(d[0]) ? "on" : ""}" type="button" data-flag="1">${isFlag(d[0]) ? "🚩 신고했어요 (누르면 취소)" : "🚩 문제가 이상해요"}</button>`); $("q").querySelector("[data-flag]").onclick = e => { toggleFlag(d, picked); e.target.classList.toggle("on", isFlag(d[0])); e.target.textContent = isFlag(d[0]) ? "🚩 신고했어요 (누르면 취소)" : "🚩 문제가 이상해요"; }; }
/*LEVEL*/
const LVN = ["전체", "🌱 초급", "🌿 중급", "🌳 고급"], LVM = [1, 1, 1.5, 2], LVK = KEY.split("-best-").join("-lv-") === KEY ? KEY + "-lv" : KEY.split("-best-").join("-lv-");
let lv = +ld(LVK) || 0; if (!(lv >= 0 && lv <= 3)) lv = 0;
const lvOf = n => +(typeof LV === "string" && LV[n] || 2), lvCnt = l => D.filter((d, n) => lvOf(n) === l).length, bestKey = () => lv ? KEY + "-L" + lv : KEY;
best = ld(bestKey()) || 0;
function renderLv() {
  if (lv && lvCnt(lv) < 4) lv = 0;
  window.FG_MULT = LVM[lv]; window.FG_LV = lv ? LVN[lv].slice(3) : "";
  $("lvs").innerHTML = LVN.map((n, k) => `<button class="chip ${k === lv ? "on" : ""}" type="button" data-l="${k}" aria-pressed="${k === lv}">${n}${k ? `<small> ${lvCnt(k)}</small>` : ""}</button>`).join("");
  $("lvp").textContent = lv ? `${LVN[lv].slice(3)} 문제예요. 포인트가 ×${LVM[lv]}배로 쌓여요.` : "초급 ×1 · 중급 ×1.5 · 고급 ×2 포인트 (전체는 ×1)";
}
$("lvs").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b) { lv = +b.dataset.l; sv(LVK, lv); best = ld(bestKey()) || 0; start(); } });

function options(d) {                                   // 보기를 만든다: 정답 + 틀린 보기 (같은 분류의 다른 정답 중에서 자동으로 뽑기도 함)
  let wrong = d[2] && d[2].length ? d[2].slice(0, 3) : shuf(D.filter(x => x !== d && x[1] !== d[1] && (!d[3] || x[3] === d[3])).map(x => x[1])).filter((v, k, a) => a.indexOf(v) === k).slice(0, 3);
  return shuf([d[1], ...wrong]);
}
function start() {
  renderLv(); const pool = D.filter((d, n) => (!lv || lvOf(n) === lv) && !isFlag(d[0]) && (cat === "전체" || d[3] === cat)); /*GUARD*/ if (!pool.length && lv) { lv = 0; sv(LVK, lv); best = ld(bestKey()) || 0; return start(); }
  qs = shuf(pool).slice(0, ROUND).map(d => ({ d, opts: options(d) })); i = 0; score = 0; $("res").hidden = true;
  $("cats").hidden = CATS.length < 3; $("cats").innerHTML = CATS.map(c => `<button class="chip ${c === cat ? "on" : ""}" type="button" data-c="${c}" aria-pressed="${c === cat}">${c}</button>`).join(""); show();
}
function show() {
  const { d, opts } = qs[i]; locked = false; $("next").hidden = true;
  $("q").innerHTML = (LABEL || d[3] ? `<small>${esc(LABEL || d[3])}</small>` : "") + esc(d[0]);
  $("opts").className = "opts" + (opts.some(o => String(o).length > 9) ? " one" : "");
  $("opts").innerHTML = opts.map((o, k) => `<button class="opt" type="button" data-k="${k}">${esc(o)}</button>`).join("");
  $("no").textContent = (i + 1) + "/" + qs.length; $("score").textContent = score; $("best").textContent = best;
}
function pick(k) {
  if (locked) return; locked = true; const { d, opts } = qs[i]; if (opts[k] === d[1]) score++;
  document.querySelectorAll(".opt").forEach((b, n) => { b.disabled = true; if (opts[n] === d[1]) b.classList.add("ok"); else if (n === k) b.classList.add("bad"); });
  if (d[4]) $("q").insertAdjacentHTML("beforeend", `<span class="note">${esc(d[4])}</span>`);
  showFlag(d, opts[k]);
  $("score").textContent = score; $("next").textContent = i === qs.length - 1 ? "결과 보기" : "다음 문제"; $("next").hidden = false;
}
function finish() {
  const full = qs.length === ROUND; let note = ""; if (full && cat === "전체" && score > best) { best = score; sv(bestKey(), best); note = " 🏆 최고 기록이에요!"; }
  $("q").innerHTML = "끝!"; $("opts").innerHTML = ""; $("next").hidden = true;
  $("res").innerHTML = `<b>${qs.length}문제 중 ${score}개 정답</b><p class="muted">${score >= qs.length * .9 ? "박사님이시네요! 🎓" : score >= qs.length * .6 ? "잘했어요 👍" : "조금만 더 힘내요 💪"}${note}</p><button class="btn" id="again" type="button" style="margin-top:10px;width:100%">다시 하기</button>`;
  $("res").hidden = false; $("best").textContent = best; $("again").onclick = start;
}
$("opts").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) pick(+b.dataset.k); });
$("cats").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b) { cat = b.dataset.c; start(); } });
$("next").onclick = () => { if (i === qs.length - 1) finish(); else { i++; show(); } };
start();
</script>
