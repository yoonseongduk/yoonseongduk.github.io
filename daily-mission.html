<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="person.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 미션</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(15 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(15 22% 86%);--accent:hsl(15 65% 46%);--accent-fg:#fff;--soft:hsl(15 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(15 22% 10%);--surface:hsl(15 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(15 16% 25%);--accent:hsl(15 75% 68%);--accent-fg:#10131c;--soft:hsl(15 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}
.note{font-size:.85rem;color:var(--muted)}.done{color:var(--ok);font-weight:700}.go{font-size:.9rem;color:var(--accent);white-space:nowrap}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dot{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--muted)}
.dot.on{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}.dot.today{outline:2px solid var(--accent)}
.big2{font-family:var(--font-display);font-size:1.6rem}.me{font-weight:700;color:var(--accent)}

</style>
</head>
<body>
<main>
  <h1>오늘의 미션 🎯</h1>
  <div class="card"><b id="mt">🎯 오늘의 미션</b><div id="ms"></div><div class="note" id="mn"></div></div>
  <div class="card"><b>🔥 연속 도장</b><div class="big2" id="streak">0일</div><div class="note" id="total"></div><div class="dots" id="dots"></div></div>
  <div class="card"><b>👨‍👩‍👧 가족 오늘 현황</b><div id="fam"></div></div>
  <p class="muted">미션 3개는 날짜마다 바뀌고 가족이 모두 같아요. 게임을 한 판 하면(10초 이상, 또는 끝까지) 미션이 완료돼요. 위쪽 칩에서 누가 하는지 고르면 그 사람의 도장이 쌓여요. 도장은 놀이용이라 포인트는 따로 주지 않아요.</p>

  <p class="muted">날짜마다 게임 3개가 정해져요. 가족이 모두 같은 미션을 하고, 다 하면 도장을 받아요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "daily-mission-v1";

const FP = window.fgPerson, SK = "daily-mission-v1";
const POOLG = ["brain", "quiz", "react", "board", "arcade"];       // 미션을 뽑는 분류(같이 하기·생활 제외)
const SKIP = new Set(["wrong-notes.html", "go-stop.html", "blackjack.html", "hanja-today.html"]); // 너무 길거나 포인트 계산이 다른 화면
let INFO = {};                                                      // 파일 → {e, t, g} (시작 화면 목록에서 읽음)
const jget = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const ymd = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const ownerN = () => FP.owner() || "(이 폰)";
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rngOf(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// 그 날짜의 미션 3개: 분류 5개 중 3개를 날짜로 고르고, 각 분류에서 게임 1개를 고른다(같은 날짜면 언제나 같은 결과)
function missionsOf(date) {
  const byG = {};
  Object.keys(FP.games).forEach(f => { const i = INFO[f]; if (i && POOLG.includes(i.g) && !SKIP.has(f)) (byG[i.g] = byG[i.g] || []).push(f); });
  Object.values(byG).forEach(a => a.sort());
  const r = rngOf(hashStr("mission:" + date)), gs = POOLG.filter(g => byG[g] && byG[g].length);
  for (let i = gs.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [gs[i], gs[j]] = [gs[j], gs[i]]; }
  return gs.slice(0, 3).map(g => byG[g][Math.floor(r() * byG[g].length)]);
}
// 사람별로 날짜마다 해 본 게임 모으기(포인트 기록의 log)
function playedBy(name) { const m = {}, u = ((jget(FP.pointsKey) || {}).p || {})[name]; ((u && u.log) || []).forEach(x => { (m[ymd(x.t)] = m[ymd(x.t)] || new Set()).add(x.f); }); return m; }
function allNames() { const fam = jget("family-members-v1"), set = new Set([ownerN()]); (Array.isArray(fam) ? fam : []).forEach(n => typeof n === "string" && n && set.add(n)); Object.keys((jget(FP.pointsKey) || {}).p || {}).forEach(n => n && set.add(n)); return [...set]; }
const icon = e => /^img:/.test(e) ? `<img src="${esc(e.slice(4))}" alt="" style="height:1.3em;vertical-align:-.25em">` : esc(e); // 트럼프 카드 게임은 이모지 대신 그림 주소(img:)를 쓴다
function load() { const s = jget(SK); return s && typeof s === "object" ? s : {}; }
function render() {
  const today = ymd(Date.now()), cur = FP.player() || ownerN(), store = load(), ms = missionsOf(today), names = allNames();
  const isDone = {};
  names.forEach(n => {
    const pl = playedBy(n), have = new Set(store[n] || []);
    for (let k = 0; k < 14; k++) { const d = ymd(Date.now() - k * 86400000); if (have.has(d)) continue; const mm = missionsOf(d), p = pl[d]; if (p && mm.length === 3 && mm.every(f => p.has(f))) have.add(d); }
    store[n] = [...have].sort().slice(-400); isDone[n] = pl[today] || new Set();
  });
  try { localStorage.setItem(SK, JSON.stringify(store)); } catch (e) {}
  $("mt").textContent = "🎯 오늘의 미션 · " + today.slice(5).replace("-", "월 ") + "일";
  const mine = isDone[cur] || new Set(), cnt = ms.filter(f => mine.has(f)).length;
  $("ms").innerHTML = ms.length ? ms.map(f => { const i = INFO[f] || { e: "🎮", t: f }, ok = mine.has(f); return `<div class="li"><span>${ok ? "✅" : "⬜"} ${icon(i.e)} ${esc(i.t)}</span>${ok ? `<span class="done">완료</span>` : `<a class="go" href="${f}">하러 가기 ›</a>`}</div>`; }).join("") : `<div class="note">게임 목록을 불러오는 중이에요…</div>`;
  $("mn").textContent = cnt === 3 ? "🎉 " + cur + "님, 오늘 미션 완료! 도장을 받았어요." : cur + "님: " + cnt + "/3 완료";
  const have = new Set(store[cur] || []);
  let st = 0; for (let k = have.has(today) ? 0 : 1; k < 400; k++) { if (have.has(ymd(Date.now() - k * 86400000))) st++; else break; }
  if (cnt === 3) have.add(today);
  $("streak").textContent = st + "일";
  $("total").textContent = "지금까지 도장 " + have.size + "개";
  let dots = ""; for (let k = 13; k >= 0; k--) { const t = Date.now() - k * 86400000, d = ymd(t), on = have.has(d) || (k === 0 && cnt === 3); dots += `<div class="dot${on ? " on" : ""}${k === 0 ? " today" : ""}" title="${d}">${new Date(t).getDate()}</div>`; }
  $("dots").innerHTML = dots;
  $("fam").innerHTML = names.map(n => { const c = ms.filter(f => (isDone[n] || new Set()).has(f)).length; return `<div class="li${n === cur ? " me" : ""}"><span>${c === 3 ? "🏅" : "👤"} ${esc(n)}</span><b>${c}/3</b></div>`; }).join("");
}
fetch("index.html").then(r => r.text()).then(t => { for (const m of t.matchAll(/\["([^"]+\.html)", "([^"]*)", "([^"]*)", "[^"]*", "([^"]*)"/g)) INFO[m[1]] = { e: m[2], t: m[3], g: m[4] }; render(); }).catch(() => render());
render();
addEventListener("pageshow", render);

</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<script src="med-notify.js" defer></script>
<script src="home.js" defer></script>
</body>
</html>
