<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하노이 탑</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 위에 원반 수 선택, 가운데 기둥 3개(눌러서 옮긴다), 아래에 이동 횟수와 새로 시작 */
:root{--bg:#f1eef8;--surface:#fff;--fg:#221d33;--muted:#6a6282;--line:#dad5ea;--pole:#8b7f6a;--accent:#7b4fd6;--accent-fg:#fff;--ok:#1f9d62;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14111f;--surface:#1f1a31;--fg:#ece8f8;--muted:#a199bd;--line:#352e4f;--pole:#6f6552;--accent:#a483ff;--accent-fg:#14111f;--ok:#4cc98a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:grid;gap:8px;grid-template-columns:repeat(5,1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 2px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.7rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.pegs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.peg{position:relative;height:250px;background:var(--surface);border:2px solid var(--line);border-radius:14px;display:flex;flex-direction:column-reverse;align-items:center;padding:0 4px 10px;gap:3px;overflow:hidden}
.peg::before{content:"";position:absolute;bottom:0;left:50%;width:8px;height:88%;transform:translateX(-50%);background:var(--pole);border-radius:4px 4px 0 0}
.peg.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.d{position:relative;z-index:1;height:22px;border-radius:11px;box-shadow:0 2px 2px rgba(0,0,0,.25);flex:none}
.d.top.up{transform:translateY(-6px)}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.5rem}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:12px;font-family:var(--font-display);font-size:1.3rem}
.msg{text-align:center;min-height:1.6em}
</style>
</head>
<body>
<main>
  <h1>하노이 탑 🗼</h1>
  <div class="seg" id="lv" role="radiogroup" aria-label="원반 수"></div>
  <div class="stats"><div class="stat"><small>이동</small><b id="moves">0</b></div><div class="stat"><small>최소 이동</small><b id="min">0</b></div><div class="stat"><small>최고 기록</small><b id="best">-</b></div></div>
  <div class="pegs" id="pegs"></div>
  <p class="msg muted" id="msg" aria-live="polite"></p>
  <div class="res" id="res" hidden></div>
  <button class="btn" id="newGame" type="button">처음부터 다시</button>
  <p class="muted">왼쪽 기둥의 원반을 <b>오른쪽 기둥으로 모두 옮기세요.</b> 한 번에 하나씩, 위에 있는 원반만 옮길 수 있고, <b>큰 원반을 작은 원반 위에 놓을 수 없어요.</b> 기둥을 눌러 고르고, 옮길 기둥을 누르세요.</p>
</main>
<script>
const KEY = "hanoi-best-v1", LKEY = "hanoi-level-v1", COL = ["#e8453c", "#f08a24", "#f2c200", "#3cc46a", "#2fc6e8", "#3f6fe0", "#a75be0"];
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let n = [3, 4, 5, 6, 7].includes(ld(LKEY)) ? ld(LKEY) : 4, pegs, sel = -1, moves = 0, done = false, best = ld(KEY) || {};

function newGame() { pegs = [Array.from({ length: n }, (_, i) => n - i), [], []]; sel = -1; moves = 0; done = false; $("res").hidden = true; $("msg").textContent = "왼쪽 기둥을 눌러 시작하세요."; render(); }
// i번 기둥의 맨 위 원반을 j번 기둥으로 옮길 수 있는지
const can = (i, j) => i !== j && pegs[i].length > 0 && (!pegs[j].length || pegs[j][pegs[j].length - 1] > pegs[i][pegs[i].length - 1]);
function move(i, j) { pegs[j].push(pegs[i].pop()); moves++; }
function tap(j) {
  if (done) return;
  if (sel < 0) { if (pegs[j].length) { sel = j; $("msg").textContent = "어느 기둥으로 옮길까요?"; } else $("msg").textContent = "원반이 없는 기둥이에요."; }
  else if (sel === j) { sel = -1; $("msg").textContent = ""; }
  else if (can(sel, j)) { move(sel, j); sel = -1; $("msg").textContent = ""; if (pegs[2].length === n) win(); }
  else { $("msg").textContent = "큰 원반은 작은 원반 위에 놓을 수 없어요!"; sel = -1; }
  render();
}
function win() {
  done = true; const min = 2 ** n - 1; let t = `${moves}번 만에 옮겼어요.` + (moves === min ? " 최소 이동! 완벽해요 🏆" : ` (최소는 ${min}번)`);
  if (!best[n] || moves < best[n]) { best[n] = moves; sv(KEY, best); t += moves === min ? "" : " 🏆 최고 기록이에요!"; }
  $("res").innerHTML = `<b>🎉 성공!</b><p class="muted">${t}</p>`; $("res").hidden = false; $("msg").textContent = "";
}
function render() {
  $("pegs").innerHTML = pegs.map((p, j) => `<button class="peg ${sel === j ? "sel" : ""}" type="button" data-j="${j}" aria-label="${j + 1}번 기둥, 원반 ${p.length}개">${p.map((d, k) => `<span class="d ${k === p.length - 1 ? "top" : ""} ${sel === j && k === p.length - 1 ? "up" : ""}" style="width:${28 + d * 56 / n * 1.0}%;background:${COL[d - 1]}"></span>`).join("")}</button>`).join("");
  $("moves").textContent = moves; $("min").textContent = 2 ** n - 1; $("best").textContent = best[n] || "-";
  $("lv").innerHTML = [3, 4, 5, 6, 7].map(k => `<button type="button" class="${k === n ? "on" : ""}" data-n="${k}" role="radio" aria-checked="${k === n}">${k}개<small>${2 ** k - 1}번</small></button>`).join("");
}
$("pegs").addEventListener("click", e => { const p = e.target.closest("[data-j]"); if (p) tap(+p.dataset.j); });
$("lv").addEventListener("click", e => { const b = e.target.closest("[data-n]"); if (b && +b.dataset.n !== n) { n = +b.dataset.n; sv(LKEY, n); newGame(); } });
$("newGame").onclick = newGame;
newGame();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
