<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>물 정렬</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 난이도, 이동 횟수 줄, 시험관(병) 여러 개(눌러서 따를 병과 받을 병을 고름), 되돌리기·힌트·새 판 */
:root{--bg:#e8f1f6;--surface:#fff;--fg:#173040;--muted:#57707f;--line:#cadbe5;--glass:#f6fbff;--accent:#e8643f;--accent-fg:#fff;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1820;--surface:#162832;--fg:#e6f2f8;--muted:#92acba;--line:#264250;--glass:#0e1e27;--accent:#ff7f5a;--accent-fg:#0d1820;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 12px}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.3rem}
.tubes{display:flex;flex-wrap:wrap;gap:16px 12px;justify-content:center;padding:18px 6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:260px;align-content:flex-start}
.tube{width:46px;height:150px;border:3px solid var(--line);border-top-color:transparent;border-radius:0 0 24px 24px;background:var(--glass);display:flex;flex-direction:column-reverse;padding:3px;gap:2px;position:relative;transition:transform .15s}
.tube.sel{transform:translateY(-14px);border-color:var(--accent);border-top-color:transparent}.tube.hint{box-shadow:0 0 0 3px #3fd0a3}.tube.full{border-color:#3fa66a;border-top-color:transparent}
.b{flex:none;height:33px;border-radius:5px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:11px;font-family:var(--font-display);font-size:1.15rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:.95rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.5rem}
@media(prefers-reduced-motion:reduce){.tube{transition:none}}
</style>
</head>
<body>
<main>
  <h1>물 정렬 🧪</h1>
  <div class="seg" id="lv" role="radiogroup" aria-label="난이도"></div>
  <div class="stats"><div class="stat"><small>이동</small><b id="moves">0</b></div><div class="stat"><small>최고(적은 이동)</small><b id="best">-</b></div></div>
  <div class="tubes" id="tubes"></div>
  <div class="res" id="res" hidden></div>
  <div class="row"><button class="btn ghost" id="undo" type="button">↶ 되돌리기</button><button class="btn ghost" id="hint" type="button">💡 힌트</button><button class="btn" id="newGame" type="button">새 판</button></div>
  <p class="muted">병을 눌러 고른 뒤, 옮겨 담을 병을 누르세요. <b>맨 위의 같은 색</b>이 한꺼번에 따라지고, 받는 병이 <b>비었거나 맨 위가 같은 색</b>이며 자리가 있어야 해요. 한 병에 한 가지 색만 가득 채우면 완성! 힌트를 쓰면 기록이 남지 않아요.</p>
</main>
<script>
const CAP = 4, COLORS = ["#e8453c", "#f08a24", "#f2c200", "#3cc46a", "#2fc6e8", "#3f6fe0", "#a75be0", "#e86bb0", "#8a6a4a"];
const LV = { easy: { colors: 5, label: "쉬움", hint: "5색 · 병 7개" }, normal: { colors: 7, label: "보통", hint: "7색 · 병 9개" }, hard: { colors: 9, label: "어려움", hint: "9색 · 병 11개" } };
const KEY = "watersort-best-v1", LKEY = "watersort-level-v1";
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let lv = (ld(LKEY) in LV) ? ld(LKEY) : "easy", tubes, sel = -1, hist = [], moves = 0, done = false, hinted = false, hintMove = null, best = ld(KEY) || {};

const topRun = t => { if (!t.length) return 0; let k = 1; while (k < t.length && t[t.length - 1 - k] === t[t.length - 1]) k++; return k; };      // 맨 위에서 같은 색이 몇 개 이어지는지
const uniform = t => t.length > 0 && t.every(c => c === t[0]);
const canPour = (t, a, b) => a !== b && t[a].length > 0 && t[b].length < CAP && (!t[b].length || t[b][t[b].length - 1] === t[a][t[a].length - 1]);
function pour(t, a, b) { const n = Math.min(topRun(t[a]), CAP - t[b].length); for (let i = 0; i < n; i++) t[b].push(t[a].pop()); return n; }
const solvedState = t => t.every(x => !x.length || (x.length === CAP && uniform(x)));

// 풀 수 있는 판인지 찾아본다 (깊이 우선 탐색). 풀이의 첫 수는 힌트로도 쓴다
function solve(start, limit = 60000) {
  const seen = new Set(), path = []; let nodes = 0;
  const key = t => t.map(x => x.join("")).sort().join("|");
  (function dfs(t) {
    if (solvedState(t)) return true; if (++nodes > limit) return false; const k = key(t); if (seen.has(k)) return false; seen.add(k);
    const moves = []; for (let a = 0; a < t.length; a++) for (let b = 0; b < t.length; b++) {
      if (!canPour(t, a, b)) continue; if (t[a].length === CAP && uniform(t[a])) continue; if (!t[b].length && uniform(t[a])) continue;     // 의미 없는 이동은 건너뛴다
      const score = (t[b].length ? 2 : 0) + (uniform(t[a]) ? 1 : 0) + (t[b].length && topRun(t[a]) === t[a].length ? 1 : 0); moves.push([a, b, score]);
    }
    moves.sort((x, y) => y[2] - x[2]);
    for (const [a, b] of moves) { const nt = t.map(x => x.slice()); pour(nt, a, b); path.push([a, b]); if (dfs(nt)) return true; path.pop(); }
    return false;
  })(start.map(x => x.slice()));
  return solvedState(start) ? [] : (nodes > limit ? null : (path.length ? path : null));
}
function makeTubes(nc) {
  for (let tries = 0; tries < 60; tries++) {
    const pool = []; for (let c = 0; c < nc; c++) for (let k = 0; k < CAP; k++) pool.push(c);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const t = Array.from({ length: nc + 2 }, (_, i) => (i < nc ? pool.slice(i * CAP, i * CAP + CAP) : []));
    if (t.some(uniform) && tries < 40) continue;                                             // 처음부터 한 색으로 찬 병이 있으면 다시 섞는다
    if (solve(t)) return t;
  }
  return null;
}
function newGame() {
  let t = null; while (!t) t = makeTubes(LV[lv].colors);
  tubes = t; sel = -1; hist = []; moves = 0; done = false; hinted = false; hintMove = null; $("res").hidden = true; render();
}
function tap(i) {
  if (done) return; hintMove = null;
  if (sel < 0) { if (tubes[i].length) sel = i; }
  else if (sel === i) sel = -1;
  else if (canPour(tubes, sel, i)) { hist.push(tubes.map(x => x.slice())); pour(tubes, sel, i); moves++; sel = -1; if (solvedState(tubes)) win(); }
  else sel = tubes[i].length ? i : -1;
  render();
}
function win() {
  done = true; let t = `${moves}번 만에 정리했어요.`;
  if (!hinted && (!best[lv] || moves < best[lv])) { best[lv] = moves; sv(KEY, best); t += " 🏆 최고 기록이에요!"; } else if (hinted) t += " (힌트를 써서 기록은 남지 않아요)";
  $("res").innerHTML = `<b>🎉 완성!</b><p class="muted">${t}</p>`; $("res").hidden = false;
}
function undo() { if (!hist.length || done) return; tubes = hist.pop(); moves = Math.max(0, moves - 1); sel = -1; hintMove = null; render(); }
function hint() { if (done) return; const p = solve(tubes, 40000); if (!p || !p.length) { $("res").innerHTML = `<p class="muted">이 상태에서는 풀이를 찾지 못했어요. 되돌리기를 눌러 보세요.</p>`; $("res").hidden = false; return; } $("res").hidden = true; hinted = true; hintMove = p[0]; sel = -1; render(); }
function render() {
  $("tubes").innerHTML = tubes.map((t, i) => `<button type="button" class="tube ${sel === i ? "sel" : ""} ${hintMove && (hintMove[0] === i || hintMove[1] === i) ? "hint" : ""} ${t.length === CAP && uniform(t) ? "full" : ""}" data-i="${i}" aria-label="${i + 1}번 병, ${t.length}칸">${t.map(c => `<span class="b" style="background:${COLORS[c]}"></span>`).join("")}</button>`).join("");
  $("moves").textContent = moves; $("best").textContent = best[lv] || "-"; $("undo").disabled = !hist.length || done;
  $("lv").innerHTML = Object.keys(LV).map(k => `<button type="button" class="${k === lv ? "on" : ""}" data-l="${k}" role="radio" aria-checked="${k === lv}">${LV[k].label}<small>${LV[k].hint}</small></button>`).join("");
}
$("tubes").addEventListener("click", e => { const t = e.target.closest("[data-i]"); if (t) tap(+t.dataset.i); });
$("undo").onclick = undo; $("hint").onclick = hint; $("newGame").onclick = newGame;
$("lv").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b && b.dataset.l !== lv) { lv = b.dataset.l; sv(LKEY, lv); newGame(); } });
newGame();
</script>
</body>
</html>
