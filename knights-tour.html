<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기사의 여행</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(28 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(28 22% 86%);--accent:hsl(28 65% 46%);--accent-fg:#fff;--soft:hsl(28 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(28 22% 10%);--surface:hsl(28 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(28 16% 25%);--accent:hsl(28 75% 68%);--accent-fg:#10131c;--soft:hsl(28 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.kb{display:grid;gap:0;border:3px solid var(--fg);border-radius:8px;overflow:hidden;max-width:380px;margin:0 auto;width:100%}.kc{aspect-ratio:1;border:0;background:#f0d9b5;padding:0;min-width:0;font-family:var(--font-display);font-size:clamp(1rem,5vw,1.4rem);color:#5a3b1a}.kc.d{background:#b58863}.kc.v{background:#7aa874;color:#fff}.kc.can{box-shadow:inset 0 0 0 4px #7ed67e}.kc.cur{background:#e4572e;color:#fff;font-size:1.8rem}
</style>
</head>
<body>
<main>
  <h1>기사의 여행 ♞</h1>
  <div class="seg" id="lv" style="--n:2"><button type="button" data-n="5" class="on">5×5<small>보통</small></button><button type="button" data-n="6">6×6<small>어려움</small></button></div>
  <div class="stats"><div class="stat"><small>밟은 칸</small><b id="vis">0</b></div><div class="stat"><small>전체 칸</small><b id="tot">25</b></div><div class="stat"><small>최고 기록</small><b id="best">0</b></div></div>
  <div class="kb" id="grid"></div>
  <div class="res" id="res" hidden></div>
  <div class="row"><button class="btn ghost" id="undo" type="button">↩ 한 수 물리기</button><button class="btn ghost" id="again" type="button">처음부터</button></div>
  <p class="muted">체스의 <b>기사(말)</b>는 'ㄱ'자(2칸 가고 1칸 옆)로 움직여요. 같은 칸을 <b>두 번 밟지 않고</b> 판의 <b>모든 칸을 한 번씩</b> 밟아 보세요! 어느 칸에서 시작해도 돼요. 갈 수 있는 칸은 연한 초록으로 보여요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "knightstour-best-v1";
let N = 5, path = [], best = ld(KEY) || {};
const MV = [[1, 2], [2, 1], [-1, 2], [-2, 1], [1, -2], [2, -1], [-1, -2], [-2, -1]];
function newGame() { path = []; $("res").hidden = true; $("tot").textContent = N * N; $("grid").style.gridTemplateColumns = `repeat(${N}, 1fr)`; render(); }
const at = (r, c) => path.findIndex(([y, x]) => y === r && x === c);
function moves() { if (!path.length) return null; const [r, c] = path[path.length - 1]; return MV.map(([a, b]) => [r + a, c + b]).filter(([y, x]) => y >= 0 && y < N && x >= 0 && x < N && at(y, x) < 0); }
function render() {
  const mv = moves(), last = path[path.length - 1];
  $("grid").innerHTML = Array.from({ length: N * N }, (_, k) => { const r = Math.floor(k / N), c = k % N, idx = at(r, c), can = mv === null || mv.some(([y, x]) => y === r && x === c), dark = (r + c) % 2; return `<button type="button" class="kc${dark ? " d" : ""}${idx >= 0 ? " v" : ""}${can && idx < 0 ? " can" : ""}${last && last[0] === r && last[1] === c ? " cur" : ""}" data-r="${r}" data-c="${c}">${last && last[0] === r && last[1] === c ? "♞" : idx >= 0 ? idx + 1 : ""}</button>`; }).join("");
  $("vis").textContent = path.length; $("best").textContent = best[N] || 0;
}
function tap(r, c) {
  const mv = moves(); if (mv !== null && !mv.some(([y, x]) => y === r && x === c)) return; if (mv === null && at(r, c) >= 0) return; path.push([r, c]); render();
  const m = moves(); if (path.length > (best[N] || 0)) { best[N] = path.length; sv(KEY, best); $("best").textContent = best[N]; }
  if (path.length === N * N) { $("res").innerHTML = `<b>🎉 모든 칸을 밟았어요!</b><p class="muted">대단해요! 기사의 여행 성공</p>`; $("res").hidden = false; } else if (!m.length) { $("res").innerHTML = `<b>더 갈 수 있는 칸이 없어요</b><p class="muted">${path.length}칸까지 갔어요. '한 수 물리기'나 '처음부터'를 눌러 다시 해 보세요.</p>`; $("res").hidden = false; }
}
$("grid").addEventListener("click", e => { const b = e.target.closest("[data-r]"); if (b) tap(+b.dataset.r, +b.dataset.c); });
$("undo").onclick = () => { if (path.length) { path.pop(); $("res").hidden = true; render(); } }; $("again").onclick = newGame;
$("lv").addEventListener("click", e => { const b = e.target.closest("[data-n]"); if (!b) return; document.querySelectorAll("#lv button").forEach(x => x.classList.toggle("on", x === b)); N = +b.dataset.n; newGame(); }); newGame();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
