<style>
/* 레이아웃: (분류 버튼), 점수 줄, 문제 카드, 네 개의 보기. 고르면 정답이 바로 표시되고 10문제를 풀면 결과가 나온다 */
:root{--bg:hsl(20 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(20 22% 86%);--accent:hsl(20 60% 42%);--accent-fg:#fff;--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(20 22% 10%);--surface:hsl(20 20% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(20 18% 24%);--accent:hsl(20 75% 68%);--accent-fg:#10131c;--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.9rem}.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:12px;font-family:var(--font-display);font-size:1.3rem}
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 16px;text-align:center;font-family:var(--font-display);font-size:clamp(1.5rem,7vw,2.1rem);line-height:1.4;overflow-wrap:anywhere}
.q small{display:block;color:var(--accent);font-family:var(--font-body);font-weight:700;font-size:.85rem;margin-bottom:4px}
.q .note{display:block;color:var(--muted);font-family:var(--font-body);font-size:.9rem;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts.one{grid-template-columns:1fr}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;min-height:58px;padding:8px 10px;font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}.opt:disabled{cursor:default}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.flagb{margin-top:8px;background:transparent;border:1px dashed var(--line);border-radius:999px;padding:4px 12px;font-family:var(--font-body);font-size:.85rem;color:var(--muted)}.flagb.on{border-style:solid;border-color:var(--bad);color:var(--bad)}
</style>
</head>

<main>
  <h1>명화 작가 퀴즈 🖼️</h1>
  <div class="chips" id="lvs" role="group" aria-label="등급"></div>
  <p class="muted" id="lvp"></p>
  <div class="chips" id="cats" role="group" aria-label="분류" hidden></div>

  <p class="muted">세계(서양) 명화의 작가와 작품, 시대·화풍을 맞혀 보세요. 우리나라 화가는 <a href="korean-art-quiz.html">🖌️ 우리나라 화가 퀴즈</a>, 중국·일본 그림은 <a href="eastern-art-quiz.html">🏯 동양화 퀴즈</a>에 있어요. 모든 화가와 대표작은 <a href="art-gallery.html">🎨 명화 작가별 모음</a>에서 볼 수 있어요. 10문제를 풀면 결과가 나와요.</p>
</main>

Younger, 1497~1543) — 영국 궁정에서 활동한 독일 출신의 초상화가예요. 사실적인 얼굴 표현이 뛰어났어요."], ["‘알브레히트 뒤러’은(는) 어느 나라의 화가일까요?", "독일", ["이탈리아", "영국", "오스트리아"], "르네상스", "알브레히트 뒤러(Albrecht Dürer, 1471~1528) — 독일 르네상스를 대표하는 화가이자 판화가예요. 자화상을 많이 남겼어요."], ["‘카라바조’은(는) 어느 나라의 화가일까요?", "이탈리아", ["노르웨이", "프랑스", "멕시코"], "바로크·로코코", "카라바조(Caravaggio, 1571~1610) — 어둠 속에서 빛이 강하게 비치는 극적인 명암으로 바로크 회화를 연 화가예요."], ["‘렘브란트’은(는) 어느 나라의 화가일까요?", "네덜란드", ["미국", "한국(조선)", "독일"], "바로크·로코코", "렘브란트(Rembrandt van Rijn, 1606~1669) — 빛과 그림자, 인물의 속마음을 깊이 있게 그린 네덜란드 황금시대의 거장이에요. 자화상을 100점 가까이 남겼어요."], ["‘요하네스 페르메이르’은(는) 어느 나라의 화가일까요?", "네덜란드", ["미국", "한국(조선)", "독일"], "바로크·로코코", "요하네스 페르메이르(Johannes Vermeer, 1632~1675) — 고요한 실내와 창으로 들어오는 부드러운 빛을 그린 화가예요. 남긴 작품이 30여 점뿐이에요."], ["‘디에고 벨라스케스’은(는) 어느 나라의 화가일까요?", "스페인", ["한국(조선)", "미국", "일본"], "바로크·로코코", "디에고 벨라스케스(Diego Velázquez, 1599~1660) — 스페인 궁정화가로 왕과 왕족의 초상을 그렸어요. 공기까지 느껴지는 공간 표현이 뛰어났어요."], ["‘프란스 할스’은(는) 어느 나라의 화가일까요?", "네덜란드", ["벨기에", "일본", "미국"], "바로크·로코코", "프란스 할스(Frans Hals, 1582경~1666) — 웃는 얼굴과 생동감 있는 붓질로 인물의 순간을 포착한 초상화가예요."], ["‘장 앙투안 와토’은(는) 어느 나라의 화가일까요?", "프랑스", ["독일", "벨기에", "이탈리아"], "바로크·로코코", "장 앙투안 와토(Jean-Antoine Watteau, 1684~1721) — 귀족들의 우아한 야외 놀이를 그린 로코코 화가예요."], ["‘장 오노레 프라고나르’은(는) 어느 나라의 화가일까요?", "프랑스", ["멕시코", "미국", "네덜란드"], "바로크·로코코", "장 오노레 프라고나르(Jean-Honoré Fragonard, 1732~1806) — 밝고 경쾌하며 장난기 어린 장면을 그린 로코코 말기의 화가예요."], ["‘프란시스코 고야’은(는) 어느 나라의 화가일까요?", "스페인", ["한국(조선)", "벨기에", "프랑스"], "신고전·낭만·사실", "프란시스코 고야(Francisco Goya, 1746~1828) — 궁정화가였지만 전쟁의 참상과 인간의 어두운 면까지 그린 스페인의 거장이에요."], ["‘자크루이 다비드’은(는) 어느 나라의 화가일까요?", "프랑스", ["노르웨이", "독일", "오스트리아"], "신고전·낭만·사실", "자크루이 다비드(Jacques-Louis David, 1748~1825) — 프랑스 혁명과 나폴레옹 시대에 활동한 신고전주의의 대표 화가예요."], ["‘장 오귀스트 도미니크 앵그르’은(는) 어느 나라의 화가일까요?", "프랑스", ["영국", "노르웨이", "멕시코"], "신고전·낭만·사실", "장 오귀스트 도미니크 앵그르(Jean-Auguste-Dominique Ingres, 1780~1867) — 정확한 선과 매끄러운 피부 표현을 중시한 신고전주의 화가예요."], ["‘외젠 들라크루아’은(는) 어느 나라의 화가일까요?", "프랑스", ["벨기에", "노르웨이", "영국"], "신고전·낭만·사실", "외젠 들라크루아(Eugène Delacroix, 1798~1863) — 강렬한 색채와 격정적인 구도로 프랑스 낭만주의를 이끈 화가예요."], ["‘테오도르 제리코’은(는) 어느 나라의 화가일까요?", "프랑스", ["독일", "이탈리아", "영국"], "신고전·낭만·사실", "테오도르 제리코(Théodore Géricault, 1791~1824) — 실제 조난 사건을 거대한 화면에 그려 낭만주의의 문을 연 화가예요."], ["‘J.M.W. 터너’은(는) 어느 나라의 화가일까요?", "영국", ["프랑스", "오스트리아", "한국(조선)"], "신고전·낭만·사실", "J.M.W. 터너(J. M. W. Turner, 1775~1851) — 빛과 안개, 바다와 하늘을 흐릿하고 강렬하게 그려 인상주의에 영향을 준 영국 화가예요."], ["‘존 컨스터블’은(는) 어느 나라의 화가일까요?", "영국", ["노르웨이", "한국(조선)", "네덜란드"], "신고전·낭만·사실", "존 컨스터블(John Constable, 1776~1837) — 영국 시골의 풍경을 자연 그대로 그린 풍경화가예요."], ["‘카스파르 다비트 프리드리히’은(는) 어느 나라의 화가일까요?", "독일", ["일본", "영국", "이탈리아"], "신고전·낭만·사실", "카스파르 다비트 프리드리히(Caspar David Friedrich, 1774~1840) — 광활한 자연 앞에 선 작은 인간을 그려 숭고함과 고독을 표현한 독일 낭만주의 화가예요."], ["‘귀스타브 쿠르베’은(는) 어느 나라의 화가일까요?", "프랑스", ["일본", "네덜란드", "영국"], "신고전·낭만·사실", "귀스타브 쿠르베(Gustave Courbet, 1819~1877) — '나는 천사를 본 적이 없어서 그리지 않는다'고 말한 사실주의의 선구자예요."], ["‘장프랑수아 밀레’은(는) 어느 나라의 화가일까요?", "프랑스", ["일본", "미국", "스페인"], "신고전·낭만·사실", "장프랑수아 밀레(Jean-François Millet, 1814~1875) — 농촌의 소박한 생활과 노동하는 농민을 따뜻하게 그린 바르비종파 화가예요."], ["‘에두아르 마네’은(는) 어느 나라의 화가일까요?", "프랑스", ["멕시코", "일본", "독일"], "인상주의", "에두아르 마네(Édouard Manet, 1832~1883) — 전통을 깬 주제와 평평한 색면으로 논란을 일으키며 인상파 화가들에게 영향을 준 화가예요."], ["‘클로드 모네’은(는) 어느 나라의 화가일까요?", "프랑스", ["독일", "네덜란드", "벨기에"], "인상주의", "클로드 모네(Claude Monet, 1840~1926) — '인상주의'라는 이름이 그의 그림 제목에서 나왔어요. 같은 대상을 시간과 날씨에 따라 연작으로 그렸어요."], ["‘오귀스트 르누아르’은(는) 어느 나라의 화가일까요?", "프랑스", ["노르웨이", "일본", "벨기에"], "인상주의", "오귀스트 르누아르(Auguste Renoir, 1841~1919) — 밝고 따뜻한 색으로 사람들의 즐거운 한때와 여성을 그린 인상주의 화가예요."], ["‘에드가 드가’은(는) 어느 나라의 화가일까요?", "프랑스", ["멕시코", "노르웨이", "독일"], "인상주의", "에드가 드가(Edgar Degas, 1834~1917) — 발레 무용수를 즐겨 그린 화가예요. 순간적으로 잘린 듯한 구도가 특징이에요."], ["‘카미유 피사로’은(는) 어느 나라의 화가일까요?", "프랑스", ["한국(조선)", "멕시코", "벨기에"], "인상주의", "카미유 피사로(Camille Pissarro, 1830~1903) — 인상파 전시에 8번 모두 참여한 유일한 화가로, 다른 화가들의 맏형 같은 존재였어요."], ["‘폴 세잔’은(는) 어느 나라의 화가일까요?", "프랑스", ["노르웨이", "네덜란드", "영국"], "후기인상·상징", "폴 세잔(Paul Cézanne, 1839~1906) — 자연을 원기둥·구·원뿔로 단순화해 '현대 회화의 아버지'라 불려요."], ["‘빈센트 반 고흐’은(는) 어느 나라의 화가일까요?", "네덜란드", ["노르웨이", "영국", "한국(조선)"], "후기인상·상징", "빈센트 반 고흐(Vincent van Gogh, 1853~1890) — 소용돌이치는 붓질과 강렬한 색으로 감정을 표현한 화가예요. 살아 있을 때는 그림이 거의 팔리지 않았어요."], ["‘폴 고갱’은(는) 어느 나라의 화가일까요?", "프랑스", ["독일", "미국", "멕시코"], "후기인상·상징", "폴 고갱(Paul Gauguin, 1848~1903) — 문명을 떠나 타히티 섬에서 원색의 평면적인 그림을 그린 화가예요."], ["‘조르주 쇠라’은(는) 어느 나라의 화가일까요?", "프랑스", ["독일", "일본", "노르웨이"], "후기인상·상징", "조르주 쇠라(Georges Seurat, 1859~1891) — 작은 색 점을 찍어 그리는 점묘법을 만든 화가예요. 31세에 세상을 떠났어요."], ["‘앙리 드 툴루즈로트렉’은(는) 어느 나라의 화가일까요?", "프랑스", ["스페인", "독일", "오스트리아"], "후기인상·상징", "앙리 드 툴루즈로트렉(Henri de Toulouse-Lautrec, 1864~1901) — 파리 몽마르트르의 카바레와 무용수를 그린 포스터로 유명한 화가예요."], ["‘앙리 루소’은(는) 어느 나라의 화가일까요?", "프랑스", ["벨기에", "독일", "멕시코"], "후기인상·상징", "앙리 루소(Henri Rousseau, 1844~1910) — 세관원으로 일하다 독학으로 그림을 그린 화가예요. 꿈같은 밀림 그림으로 유명해요."], ["‘구스타프 클림트’은(는) 어느 나라의 화가일까요?", "오스트리아", ["노르웨이", "영국", "멕시코"], "후기인상·상징", "구스타프 클림트(Gustav Klimt, 1862~1918) — 금박과 화려한 장식 무늬를 쓴 빈 분리파의 중심 화가예요."], ["‘에드바르 뭉크’은(는) 어느 나라의 화가일까요?", "노르웨이", ["미국", "네덜란드", "일본"], "후기인상·상징", "에드바르 뭉크(Edvard Munch, 1863~1944) — 불안과 죽음, 사랑 같은 내면의 감정을 그린 노르웨이 화가예요."], ["‘에곤 실레’은(는) 어느 나라의 화가일까요?", "오스트리아", ["이탈리아", "네덜란드", "일본"], "후기인상·상징", "에곤 실레(Egon Schiele, 1890~1918) — 거칠고 뒤틀린 선으로 인간의 불안을 그린 화가예요. 클림트에게 배웠고 28세에 세상을 떠났어요."], ["‘앙리 마티스’은(는) 어느 나라의 화가일까요?", "프랑스", ["네덜란드", "오스트리아", "미국"], "근대·현대", "앙리 마티스(Henri Matisse, 1869~1954) — 강렬하고 단순한 색으로 '야수파'를 이끈 화가예요. 말년에는 종이 오리기 작품을 했어요."], ["‘피트 몬드리안’은(는) 어느 나라의 화가일까요?", "네덜란드", ["이탈리아", "독일", "멕시코"], "근대·현대", "피트 몬드리안(Piet Mondrian, 1872~1944) — 수직·수평선과 빨강·파랑·노랑 세 가지 원색으로 화면을 구성한 화가예요."], ["‘아메데오 모딜리아니’은(는) 어느 나라의 화가일까요?", "이탈리아", ["노르웨이", "한국(조선)", "오스트리아"], "근대·현대", "아메데오 모딜리아니(Amedeo Modigliani, 1884~1920) — 길쭉한 얼굴과 긴 목, 아몬드 모양의 눈으로 이루어진 초상화로 유명한 화가예요."], ["‘파블로 피카소’은(는) 어느 나라의 화가일까요?", "스페인", ["네덜란드", "일본", "노르웨이"], "근대·현대", "파블로 피카소(Pablo Picasso, 1881~1973) — 여러 방향에서 본 모습을 한 화면에 담는 입체주의를 연 20세기 최고의 화가예요."], ["‘살바도르 달리’은(는) 어느 나라의 화가일까요?", "스페인", ["오스트리아", "네덜란드", "벨기에"], "근대·현대", "살바도르 달리(Salvador Dalí, 1904~1989) — 꿈속 같은 이상한 장면을 정밀하게 그린 초현실주의 화가예요. 위로 솟은 콧수염으로도 유명해요."], ["‘르네 마그리트’은(는) 어느 나라의 화가일까요?", "벨기에", ["영국", "노르웨이", "프랑스"], "근대·현대", "르네 마그리트(René Magritte, 1898~1967) — 평범한 사물을 엉뚱하게 놓아 보는 사람을 생각하게 만드는 초현실주의 화가예요."], ["‘앤디 워홀’은(는) 어느 나라의 화가일까요?", "미국", ["독일", "한국(조선)", "멕시코"], "근대·현대", "앤디 워홀(Andy Warhol, 1928~1987) — 상품과 유명인의 이미지를 실크스크린으로 찍어 낸 팝 아트의 대표 작가예요."], ["‘잭슨 폴록’은(는) 어느 나라의 화가일까요?", "미국", ["멕시코", "노르웨이", "오스트리아"], "근대·현대", "잭슨 폴록(Jackson Pollock, 1912~1956) — 캔버스를 바닥에 놓고 물감을 흘리고 뿌리는 '드리핑' 기법을 쓴 화가예요."], ["‘프리다 칼로’은(는) 어느 나라의 화가일까요?", "멕시코", ["미국", "한국(조선)", "영국"], "근대·현대", "프리다 칼로(Frida Kahlo, 1907~1954) — 사고와 병으로 고통받은 자신의 삶을 담은 자화상으로 유명한 멕시코 화가예요."], ["‘에드워드 호퍼’은(는) 어느 나라의 화가일까요?", "미국", ["오스트리아", "프랑스", "노르웨이"], "근대·현대", "에드워드 호퍼(Edward Hopper, 1882~1967) — 도시의 쓸쓸함과 고독을 담은 장면을 그린 미국 화가예요."], ["‘존 싱어 사전트’은(는) 어느 나라의 화가일까요?", "미국", ["벨기에", "독일", "네덜란드"], "근대·현대", "존 싱어 사전트(John Singer Sargent, 1856~1925) — 우아한 사교계 인물을 대담한 붓질로 그린 초상화가예요."], ["화가 ‘레오나르도 다 빈치’과(와) 가장 관련 깊은 화풍(사조)은?", "르네상스", ["신인상주의", "소박파", "야수파"], "르네상스", "레오나르도 다 빈치은(는) '르네상스'의 대표적인 작가예요. 화가이자 과학자·발명가로, 여러 분야에 뛰어난 '만능인'이라 불려요. 연기처럼 부드럽게 번지는 명암 표현이 특징이에요."], ["화가 ‘미켈란젤로’과(와) 가장 관련 깊은 화풍(사조)은?", "르네상스", ["빈 분리파", "로코코", "팝 아트"], "르네상스", "미켈란젤로은(는) '르네상스'의 대표적인 작가예요. 조각·회화·건축을 모두 해낸 거장이에요. 근육이 힘차게 드러나는 인물 표현으로 유명해요."], ["화가 ‘라파엘로’과(와) 가장 관련 깊은 화풍(사조)은?", "르네상스", ["사실주의", "소박파", "신인상주의"], "르네상스", "라파엘로은(는) '르네상스'의 대표적인 작가예요. 조화롭고 우아한 성모화로 이름난 화가예요. 37세에 세상을 떠났어요."], ["화가 ‘산드로 보티첼리’과(와) 가장 관련 깊은 화풍(사조)은?", "르네상스", ["팝 아트", "입체주의", "사실주의"], "르네상스", "산드로 보티첼리은(는) '르네상스'의 대표적인 작가예요. 흐르는 선과 우아한 인물로 신화를 그린 피렌체의 화가예요."], ["화가 ‘티치아노’과(와) 가장 관련 깊은 화풍(사조)은?", "르네상스", ["초현실주의", "인상주의", "야수파"], "르네상스", "티치아노은(는) '르네상스'의 대표적인 작가예요. 풍부한 색채로 이름난 베네치아파의 대표 화가예요."], ["화가 ‘얀 반 에이크’과(와) 가장 관련 깊은 화풍(사조)은?", "르네상스", ["사실주의", "추상표현주의", "소박파"], "르네상스", "얀 반 에이크은(는) '르네상스'의 대표적인 작가예요. 유화 기법을 발전시켜 사물을 아주 세밀하게 그린 플랑드르(오늘날 벨기에 지역)의 화가예요."], ["화가 ‘한스 홀바인’과(와) 가장 관련 깊은 화풍(사조)은?", "르네상스", ["야수파", "빈 분리파", "후기 인상주의"], "르네상스", "한스 홀바인은(는) '르네상스'의 대표적인 작가예요. 영국 궁정에서 활동한 독일 출신의 초상화가예요. 사실적인 얼굴 표현이 뛰어났어요."], ["화가 ‘알브레히트 뒤러’과(와) 가장 관련 깊은 화풍(사조)은?", "르네상스", ["소박파", "후기 인상주의", "신고전주의"], "르네상스", "알브레히트 뒤러은(는) '르네상스'의 대표적인 작가예요. 독일 르네상스를 대표하는 화가이자 판화가예요. 자화상을 많이 남겼어요."], ["화가 ‘카라바조’과(와) 가장 관련 깊은 화풍(사조)은?", "바로크", ["낭만주의", "로코코", "소박파"], "바로크·로코코", "카라바조은(는) '바로크'의 대표적인 작가예요. 어둠 속에서 빛이 강하게 비치는 극적인 명암으로 바로크 회화를 연 화가예요."], ["화가 ‘렘브란트’과(와) 가장 관련 깊은 화풍(사조)은?", "바로크", ["추상미술", "입체주의", "후기 인상주의"], "바로크·로코코", "렘브란트은(는) '바로크'의 대표적인 작가예요. 빛과 그림자, 인물의 속마음을 깊이 있게 그린 네덜란드 황금시대의 거장이에요. 자화상을 100점 가까이 남겼어요."], ["화가 ‘요하네스 페르메이르’과(와) 가장 관련 깊은 화풍(사조)은?", "바로크", ["빈 분리파", "입체주의", "사실주의"], "바로크·로코코", "요하네스 페르메이르은(는) '바로크'의 대표적인 작가예요. 고요한 실내와 창으로 들어오는 부드러운 빛을 그린 화가예요. 남긴 작품이 30여 점뿐이에요."], ["화가 ‘디에고 벨라스케스’과(와) 가장 관련 깊은 화풍(사조)은?", "바로크", ["팝 아트", "빈 분리파", "초현실주의"], "바로크·로코코", "디에고 벨라스케스은(는) '바로크'의 대표적인 작가예요. 스페인 궁정화가로 왕과 왕족의 초상을 그렸어요. 공기까지 느껴지는 공간 표현이 뛰어났어요."], ["화가 ‘페테르 파울 루벤스’과(와) 가장 관련 깊은 화풍(사조)은?", "바로크", ["르네상스", "후기 인상주의", "추상미술"], "바로크·로코코", "페테르 파울 루벤스은(는) '바로크'의 대표적인 작가예요. 풍만하고 역동적인 인물과 화려한 색채로 바로크를 대표하는 플랑드르 화가예요."], ["화가 ‘프란스 할스’과(와) 가장 관련 깊은 화풍(사조)은?", "바로크", ["르네상스", "입체주의", "로코코"], "바로크·로코코", "프란스 할스은(는) '바로크'의 대표적인 작가예요. 웃는 얼굴과 생동감 있는 붓질로 인물의 순간을 포착한 초상화가예요."], ["화가 ‘장 앙투안 와토’과(와) 가장 관련 깊은 화풍(사조)은?", "로코코", ["신인상주의", "소박파", "신고전주의"], "바로크·로코코", "장 앙투안 와토은(는) '로코코'의 대표적인 작가예요. 귀족들의 우아한 야외 놀이를 그린 로코코 화가예요."], ["화가 ‘장 오노레 프라고나르’과(와) 가장 관련 깊은 화풍(사조)은?", "로코코", ["추상미술", "르네상스", "추상표현주의"], "바로크·로코코", "장 오노레 프라고나르은(는) '로코코'의 대표적인 작가예요. 밝고 경쾌하며 장난기 어린 장면을 그린 로코코 말기의 화가예요."], ["화가 ‘프란시스코 고야’과(와) 가장 관련 깊은 화풍(사조)은?", "낭만주의", ["입체주의", "신고전주의", "팝 아트"], "신고전·낭만·사실", "프란시스코 고야은(는) '낭만주의'의 대표적인 작가예요. 궁정화가였지만 전쟁의 참상과 인간의 어두운 면까지 그린 스페인의 거장이에요."], ["화가 ‘자크루이 다비드’과(와) 가장 관련 깊은 화풍(사조)은?", "신고전주의", ["야수파", "입체주의", "팝 아트"], "신고전·낭만·사실", "자크루이 다비드은(는) '신고전주의'의 대표적인 작가예요. 프랑스 혁명과 나폴레옹 시대에 활동한 신고전주의의 대표 화가예요."], ["화가 ‘장 오귀스트 도미니크 앵그르’과(와) 가장 관련 깊은 화풍(사조)은?", "신고전주의", ["소박파", "르네상스", "팝 아트"], "신고전·낭만·사실", "장 오귀스트 도미니크 앵그르은(는) '신고전주의'의 대표적인 작가예요. 정확한 선과 매끄러운 피부 표현을 중시한 신고전주의 화가예요."], ["화가 ‘외젠 들라크루아’과(와) 가장 관련 깊은 화풍(사조)은?", "낭만주의", ["추상미술", "빈 분리파", "팝 아트"], "신고전·낭만·사실", "외젠 들라크루아은(는) '낭만주의'의 대표적인 작가예요. 강렬한 색채와 격정적인 구도로 프랑스 낭만주의를 이끈 화가예요."], ["화가 ‘테오도르 제리코’과(와) 가장 관련 깊은 화풍(사조)은?", "낭만주의", ["후기 인상주의", "빈 분리파", "인상주의"], "신고전·낭만·사실", "테오도르 제리코은(는) '낭만주의'의 대표적인 작가예요. 실제 조난 사건을 거대한 화면에 그려 낭만주의의 문을 연 화가예요."], ["화가 ‘J.M.W. 터너’과(와) 가장 관련 깊은 화풍(사조)은?", "낭만주의", ["추상미술", "표현주의", "추상표현주의"], "신고전·낭만·사실", "J.M.W. 터너은(는) '낭만주의'의 대표적인 작가예요. 빛과 안개, 바다와 하늘을 흐릿하고 강렬하게 그려 인상주의에 영향을 준 영국 화가예요."], ["화가 ‘존 컨스터블’과(와) 가장 관련 깊은 화풍(사조)은?", "낭만주의", ["로코코", "소박파", "빈 분리파"], "신고전·낭만·사실", "존 컨스터블은(는) '낭만주의'의 대표적인 작가예요. 영국 시골의 풍경을 자연 그대로 그린 풍경화가예요."], ["화가 ‘카스파르 다비트 프리드리히’과(와) 가장 관련 깊은 화풍(사조)은?", "낭만주의", ["추상미술", "신인상주의", "소박파"], "신고전·낭만·사실", "카스파르 다비트 프리드리히은(는) '낭만주의'의 대표적인 작가예요. 광활한 자연 앞에 선 작은 인간을 그려 숭고함과 고독을 표현한 독일 낭만주의 화가예요."], ["화가 ‘귀스타브 쿠르베’과(와) 가장 관련 깊은 화풍(사조)은?", "사실주의", ["입체주의", "초현실주의", "인상주의"], "신고전·낭만·사실", "귀스타브 쿠르베은(는) '사실주의'의 대표적인 작가예요. '나는 천사를 본 적이 없어서 그리지 않는다'고 말한 사실주의의 선구자예요."], ["화가 ‘장프랑수아 밀레’과(와) 가장 관련 깊은 화풍(사조)은?", "사실주의", ["야수파", "로코코", "팝 아트"], "신고전·낭만·사실", "장프랑수아 밀레은(는) '사실주의'의 대표적인 작가예요. 농촌의 소박한 생활과 노동하는 농민을 따뜻하게 그린 바르비종파 화가예요."], ["화가 ‘클로드 모네’과(와) 가장 관련 깊은 화풍(사조)은?", "인상주의", ["초현실주의", "빈 분리파", "르네상스"], "인상주의", "클로드 모네은(는) '인상주의'의 대표적인 작가예요. '인상주의'라는 이름이 그의 그림 제목에서 나왔어요. 같은 대상을 시간과 날씨에 따라 연작으로 그렸어요."], ["화가 ‘오귀스트 르누아르’과(와) 가장 관련 깊은 화풍(사조)은?", "인상주의", ["신고전주의", "팝 아트", "르네상스"], "인상주의", "오귀스트 르누아르은(는) '인상주의'의 대표적인 작가예요. 밝고 따뜻한 색으로 사람들의 즐거운 한때와 여성을 그린 인상주의 화가예요."], ["화가 ‘에드가 드가’과(와) 가장 관련 깊은 화풍(사조)은?", "인상주의", ["표현주의", "야수파", "소박파"], "인상주의", "에드가 드가은(는) '인상주의'의 대표적인 작가예요. 발레 무용수를 즐겨 그린 화가예요. 순간적으로 잘린 듯한 구도가 특징이에요."], ["화가 ‘카미유 피사로’과(와) 가장 관련 깊은 화풍(사조)은?", "인상주의", ["팝 아트", "소박파", "사실주의"], "인상주의", "카미유 피사로은(는) '인상주의'의 대표적인 작가예요. 인상파 전시에 8번 모두 참여한 유일한 화가로, 다른 화가들의 맏형 같은 존재였어요."], ["화가 ‘폴 세잔’과(와) 가장 관련 깊은 화풍(사조)은?", "후기 인상주의", ["빈 분리파", "르네상스", "초현실주의"], "후기인상·상징", "폴 세잔은(는) '후기 인상주의'의 대표적인 작가예요. 자연을 원기둥·구·원뿔로 단순화해 '현대 회화의 아버지'라 불려요."], ["화가 ‘빈센트 반 고흐’과(와) 가장 관련 깊은 화풍(사조)은?", "후기 인상주의", ["추상미술", "추상표현주의", "바로크"], "후기인상·상징", "빈센트 반 고흐은(는) '후기 인상주의'의 대표적인 작가예요. 소용돌이치는 붓질과 강렬한 색으로 감정을 표현한 화가예요. 살아 있을 때는 그림이 거의 팔리지 않았어요."], ["화가 ‘폴 고갱’과(와) 가장 관련 깊은 화풍(사조)은?", "후기 인상주의", ["추상표현주의", "로코코", "사실주의"], "후기인상·상징", "폴 고갱은(는) '후기 인상주의'의 대표적인 작가예요. 문명을 떠나 타히티 섬에서 원색의 평면적인 그림을 그린 화가예요."], ["화가 ‘조르주 쇠라’과(와) 가장 관련 깊은 화풍(사조)은?", "신인상주의", ["야수파", "소박파", "빈 분리파"], "후기인상·상징", "조르주 쇠라은(는) '신인상주의'의 대표적인 작가예요. 작은 색 점을 찍어 그리는 점묘법을 만든 화가예요. 31세에 세상을 떠났어요."], ["화가 ‘앙리 드 툴루즈로트렉’과(와) 가장 관련 깊은 화풍(사조)은?", "후기 인상주의", ["르네상스", "야수파", "추상미술"], "후기인상·상징", "앙리 드 툴루즈로트렉은(는) '후기 인상주의'의 대표적인 작가예요. 파리 몽마르트르의 카바레와 무용수를 그린 포스터로 유명한 화가예요."], ["화가 ‘앙리 루소’과(와) 가장 관련 깊은 화풍(사조)은?", "소박파", ["인상주의", "초현실주의", "후기 인상주의"], "후기인상·상징", "앙리 루소은(는) '소박파'의 대표적인 작가예요. 세관원으로 일하다 독학으로 그림을 그린 화가예요. 꿈같은 밀림 그림으로 유명해요."], ["화가 ‘구스타프 클림트’과(와) 가장 관련 깊은 화풍(사조)은?", "빈 분리파", ["야수파", "로코코", "인상주의"], "후기인상·상징", "구스타프 클림트은(는) '빈 분리파'의 대표적인 작가예요. 금박과 화려한 장식 무늬를 쓴 빈 분리파의 중심 화가예요."], ["화가 ‘에드바르 뭉크’과(와) 가장 관련 깊은 화풍(사조)은?", "표현주의", ["사실주의", "소박파", "바로크"], "후기인상·상징", "에드바르 뭉크은(는) '표현주의'의 대표적인 작가예요. 불안과 죽음, 사랑 같은 내면의 감정을 그린 노르웨이 화가예요."], ["화가 ‘에곤 실레’과(와) 가장 관련 깊은 화풍(사조)은?", "표현주의", ["입체주의", "초현실주의", "낭만주의"], "후기인상·상징", "에곤 실레은(는) '표현주의'의 대표적인 작가예요. 거칠고 뒤틀린 선으로 인간의 불안을 그린 화가예요. 클림트에게 배웠고 28세에 세상을 떠났어요."], ["화가 ‘앙리 마티스’과(와) 가장 관련 깊은 화풍(사조)은?", "야수파", ["낭만주의", "입체주의", "추상표현주의"], "근대·현대", "앙리 마티스은(는) '야수파'의 대표적인 작가예요. 강렬하고 단순한 색으로 '야수파'를 이끈 화가예요. 말년에는 종이 오리기 작품을 했어요."], ["화가 ‘바실리 칸딘스키’과(와) 가장 관련 깊은 화풍(사조)은?", "추상미술", ["낭만주의", "후기 인상주의", "신인상주의"], "근대·현대", "바실리 칸딘스키은(는) '추상미술'의 대표적인 작가예요. 구체적인 대상 없이 색과 형태만으로 그린 최초의 추상화가 가운데 한 사람이에요."], ["화가 ‘피트 몬드리안’과(와) 가장 관련 깊은 화풍(사조)은?", "추상미술", ["팝 아트", "사실주의", "소박파"], "근대·현대", "피트 몬드리안은(는) '추상미술'의 대표적인 작가예요. 수직·수평선과 빨강·파랑·노랑 세 가지 원색으로 화면을 구성한 화가예요."], ["화가 ‘파블로 피카소’과(와) 가장 관련 깊은 화풍(사조)은?", "입체주의", ["낭만주의", "표현주의", "로코코"], "근대·현대", "파블로 피카소은(는) '입체주의'의 대표적인 작가예요. 여러 방향에서 본 모습을 한 화면에 담는 입체주의를 연 20세기 최고의 화가예요."], ["화가 ‘살바도르 달리’과(와) 가장 관련 깊은 화풍(사조)은?", "초현실주의", ["사실주의", "낭만주의", "표현주의"], "근대·현대", "살바도르 달리은(는) '초현실주의'의 대표적인 작가예요. 꿈속 같은 이상한 장면을 정밀하게 그린 초현실주의 화가예요. 위로 솟은 콧수염으로도 유명해요."], ["화가 ‘르네 마그리트’과(와) 가장 관련 깊은 화풍(사조)은?", "초현실주의", ["사실주의", "표현주의", "신고전주의"], "근대·현대", "르네 마그리트은(는) '초현실주의'의 대표적인 작가예요. 평범한 사물을 엉뚱하게 놓아 보는 사람을 생각하게 만드는 초현실주의 화가예요."], ["화가 ‘앤디 워홀’과(와) 가장 관련 깊은 화풍(사조)은?", "팝 아트", ["표현주의", "추상미술", "사실주의"], "근대·현대", "앤디 워홀은(는) '팝 아트'의 대표적인 작가예요. 상품과 유명인의 이미지를 실크스크린으로 찍어 낸 팝 아트의 대표 작가예요."], ["화가 ‘잭슨 폴록’과(와) 가장 관련 깊은 화풍(사조)은?", "추상표현주의", ["낭만주의", "신인상주의", "로코코"], "근대·현대", "잭슨 폴록은(는) '추상표현주의'의 대표적인 작가예요. 캔버스를 바닥에 놓고 물감을 흘리고 뿌리는 '드리핑' 기법을 쓴 화가예요."], ["‘모나리자’ 작품은 어디에서 볼 수 있을까요?", "루브르 박물관(파리)", ["오르세 미술관(파리)", "트레티야코프 미술관(모스크바)", "산토 토메 성당(톨레도)"], "르네상스", "레오나르도 다 빈치의 그림이에요. 1503~1519경 작품으로 루브르 박물관(파리)에 있어요."], ["‘최후의 만찬’ 작품은 어디에서 볼 수 있을까요?", "산타 마리아 델레 그라치에 성당(밀라노)", ["암브로시아나 미술관(밀라노)", "마르모탕 모네 미술관(파리)", "상수시 궁전(포츠담)"], "르네상스", "레오나르도 다 빈치의 벽화이에요. 1495~1498 작품으로 산타 마리아 델레 그라치에 성당(밀라노)에 있어요."], ["‘흰 담비를 안은 여인’ 작품은 어디에서 볼 수 있을까요?", "크라쿠프 국립박물관(폴란드)", ["드레스덴 고전 거장 미술관", "암브로시아나 미술관(밀라노)", "버펄로 AKG 미술관(미국)"], "르네상스", "레오나르도 다 빈치의 그림이에요. 1489~1491경 작품으로 크라쿠프 국립박물관(폴란드)에 있어요."], ["‘세례자 성 요한’ 작품은 어디에서 볼 수 있을까요?", "루브르 박물관(파리)", ["마르모탕 모네 미술관(파리)", "필라델피아 미술관", "암브로시아나 미술관(밀라노)"], "르네상스", "레오나르도 다 빈치의 그림이에요. 1513~1516경 작품으로 루브르 박물관(파리)에 있어요."], ["‘천지창조’ 작품은 어디에서 볼 수 있을까요?", "시스티나 성당(바티칸)", ["성 베드로 대성당(바티칸)", "암브로시아나 미술관(밀라노)", "버펄로 AKG 미술관(미국)"], "르네상스", "미켈란젤로의 벽화이에요. 1508~1512 작품으로 시스티나 성당(바티칸)에 있어요."], ["‘최후의 심판’ 작품은 어디에서 볼 수 있을까요?", "시스티나 성당(바티칸)", ["성 베드로 대성당(바티칸)", "돌로레스 올메도 미술관(멕시코시티)", "오슬로 국립미술관"], "르네상스", "미켈란젤로의 벽화이에요. 1536~1541 작품으로 시스티나 성당(바티칸)에 있어요."], ["‘다비드 상’ 작품은 어디에서 볼 수 있을까요?", "아카데미아 미술관(피렌체)", ["피티 궁(피렌체)", "암스테르담 국립미술관", "로스앤젤레스 카운티 미술관(LACMA)"], "르네상스", "미켈란젤로의 조각이에요. 1501~1504 작품으로 아카데미아 미술관(피렌체)에 있어요."], ["‘피에타’ 작품은 어디에서 볼 수 있을까요?", "성 베드로 대성당(바티칸)", ["시스티나 성당(바티칸)", "테이트 모던(런던)", "뉴욕 현대미술관(MoMA)"], "르네상스", "미켈란젤로의 조각이에요. 1498~1499 작품으로 성 베드로 대성당(바티칸)에 있어요."], ["‘도니 톤도’ 작품은 어디에서 볼 수 있을 const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CATS = ["전체", ...new Set(D.map(d => d[3]).filter(Boolean))];
let cat = "전체", qs = [], i = 0, score = 0, best = ld(KEY) || 0, locked = false;
/*FLAG*/
const FLK = "quiz-flags-v1", FLF = (location.pathname.split("/").pop() || "quiz-quiz.html");
const flAll = () => { const v = ld(FLK); return v && typeof v === "object" ? v : {}; }, isFlag = q => !!(flAll()[FLF] || {})[q];
function toggleFlag(d, picked) { const all = flAll(), m = all[FLF] || (all[FLF] = {}); if (m[d[0]]) delete m[d[0]]; else m[d[0]] = { a: String(d[1]), p: String(picked || ""), t: Date.now() }; if (!Object.keys(m).length) delete all[FLF]; sv(FLK, all); }
function showFlag(d, picked) { $("q").insertAdjacentHTML("beforeend", `<button class="flagb ${isFlag(d[0]) ? "on" : ""}" type="button" data-flag="1">${isFlag(d[0]) ? "🚩 신고했어요 (누르면 취소)" : "🚩 문제가 이상해요"}</button>`); $("q").querySelector("[data-flag]").onclick = e => { toggleFlag(d, picked); e.target.classList.toggle("on", isFlag(d[0])); e.target.textContent = isFlag(d[0]) ? "🚩 신고했어요 (누르면 취소)" : "🚩 문제가 이상해요"; }; }
/*LEVEL*/
const LVN = ["전체", "🌱 초급", "🌿 중급", "🌳 고급"], LVM = [1, 1, 1.5, 2], LVK = KEY.split("-best-").join("-lv-") === KEY ? KEY + "-lv" : KEY.split("-best-").join("-lv-");
let lv = +ld(LVK) || 0; if (!(lv >= 0 && lv <= 3)) lv = 0;
const lvOf = n => +(typeof LV === "string" && LV[n] || 2), lvCnt = l => D.filter((d, n) => lvOf(n) === l).length, bestKey = () => lv ? KEY + "-L" + lv : KEY;
best = ld(bestKey()) || 0;
function renderLv() {
  if (lv && lvCnt(lv) < 4) lv = 0;
  window.FG_MULT = LVM[lv]; window.FG_LV = lv ? LVN[lv].slice(3) : "";
  $("lvs").innerHTML = LVN.map((n, k) => `<button class="chip ${k === lv ? "on" : ""}" type="button" data-l="${k}" aria-pressed="${k === lv}">${n}${k ? `<small> ${lvCnt(k)}</small>` : ""}</button>`).join("");
  $("lvp").textContent = lv ? `${LVN[lv].slice(3)} 문제예요. 포인트가 ×${LVM[lv]}배로 쌓여요.` : "초급 ×1 · 중급 ×1.5 · 고급 ×2 포인트 (전체는 ×1)";
}
$("lvs").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b) { lv = +b.dataset.l; sv(LVK, lv); best = ld(bestKey()) || 0; start(); } });

function options(d) {                                   // 보기를 만든다: 정답 + 틀린 보기 (같은 분류의 다른 정답 중에서 자동으로 뽑기도 함)
  let wrong = d[2] && d[2].length ? d[2].slice(0, 3) : shuf(D.filter(x => x !== d && x[1] !== d[1] && (!d[3] || x[3] === d[3])).map(x => x[1])).filter((v, k, a) => a.indexOf(v) === k).slice(0, 3);
  return shuf([d[1], ...wrong]);
}
function start() {
  renderLv(); const pool = D.filter((d, n) => (!lv || lvOf(n) === lv) && !isFlag(d[0]) && (cat === "전체" || d[3] === cat)); /*GUARD*/ if (!pool.length && lv) { lv = 0; sv(LVK, lv); best = ld(bestKey()) || 0; return start(); }
  qs = shuf(pool).slice(0, ROUND).map(d => ({ d, opts: options(d) })); i = 0; score = 0; $("res").hidden = true;
  $("cats").hidden = CATS.length < 3; $("cats").innerHTML = CATS.map(c => `<button class="chip ${c === cat ? "on" : ""}" type="button" data-c="${c}" aria-pressed="${c === cat}">${c}</button>`).join(""); show();
}
function show() {
  const { d, opts } = qs[i]; locked = false; $("next").hidden = true;
  $("q").innerHTML = (LABEL || d[3] ? `<small>${esc(LABEL || d[3])}</small>` : "") + esc(d[0]);
  $("opts").className = "opts" + (opts.some(o => String(o).length > 9) ? " one" : "");
  $("opts").innerHTML = opts.map((o, k) => `<button class="opt" type="button" data-k="${k}">${esc(o)}</button>`).join("");
  $("no").textContent = (i + 1) + "/" + qs.length; $("score").textContent = score; $("best").textContent = best;
}
function pick(k) {
  if (locked) return; locked = true; const { d, opts } = qs[i]; if (opts[k] === d[1]) score++;
  document.querySelectorAll(".opt").forEach((b, n) => { b.disabled = true; if (opts[n] === d[1]) b.classList.add("ok"); else if (n === k) b.classList.add("bad"); });
  if (d[4]) $("q").insertAdjacentHTML("beforeend", `<span class="note">${esc(d[4])}</span>`);
  showFlag(d, opts[k]);
  $("score").textContent = score; $("next").textContent = i === qs.length - 1 ? "결과 보기" : "다음 문제"; $("next").hidden = false;
}
function finish() {
  const full = qs.length === ROUND; let note = ""; if (full && cat === "전체" && score > best) { best = score; sv(bestKey(), best); note = " 🏆 최고 기록이에요!"; }
  $("q").innerHTML = "끝!"; $("opts").innerHTML = ""; $("next").hidden = true;
  $("res").innerHTML = `<b>${qs.length}문제 중 ${score}개 정답</b><p class="muted">${score >= qs.length * .9 ? "박사님이시네요! 🎓" : score >= qs.length * .6 ? "잘했어요 👍" : "조금만 더 힘내요 💪"}${note}</p><button class="btn" id="again" type="button" style="margin-top:10px;width:100%">다시 하기</button>`;
  $("res").hidden = false; $("best").textContent = best; $("again").onclick = start;
}
$("opts").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) pick(+b.dataset.k); });
$("cats").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b) { cat = b.dataset.c; start(); } });
$("next").onclick = () => { if (i === qs.length - 1) finish(); else { i++; show(); } };
start();
</script>
<script src="online.js"></script>
<script src="art-mode.js" defer></script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<script src="wrong-hook.js"></script>
<script src="med-notify.js" defer></script>
<script src="home.js" defer></script>
</body>
