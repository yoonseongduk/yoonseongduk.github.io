<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(30 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(30 22% 86%);--accent:hsl(30 65% 46%);--accent-fg:#fff;--soft:hsl(30 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(30 22% 10%);--surface:hsl(30 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(30 16% 25%);--accent:hsl(30 75% 68%);--accent-fg:#10131c;--soft:hsl(30 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}.chip small{font-size:.76em;opacity:.75;font-weight:400;margin-left:2px}.dots{display:flex;gap:6px;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}.dots i.ok{background:var(--ok)}
.hz{font-size:5.5rem;line-height:1.1;text-align:center;font-family:"Noto Serif KR","Noto Serif CJK KR","Batang",serif}.hd{text-align:center;font-weight:700;font-size:1.15rem}.sec h3{margin:0;font-size:.95rem}.sec p{margin:2px 0 0}.sec ul{margin:4px 0 0;padding-left:20px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{background:color-mix(in srgb,var(--fg) 10%,var(--surface));border-radius:999px;padding:3px 10px;font-size:.9rem}.sec{display:grid;gap:4px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts{display:grid;gap:8px}.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:700;text-align:center;font-size:1.1rem}.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--surface))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--surface))}.opts.big .opt{font-family:"Noto Serif KR","Noto Serif CJK KR","Batang",serif;font-size:2rem}.note{font-size:.85rem;color:var(--muted)}.num{font-family:var(--font-display);font-size:2.2rem;color:var(--accent);text-align:center}a.btn{display:block;text-align:center;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>오늘의 한자 📅</h1>
  <div class="chips" id="cats"></div>
  <div class="card center"><b id="ttl"></b><div class="dots" id="dots"></div><div class="note" id="streak"></div></div>
  <div class="card" id="view"></div>
  <div class="nav" id="nav"></div>
  <p class="muted">급수를 고르면 날마다 한자 3개가 정해져요. 유래와 쓰임을 보고 짧은 퀴즈로 마무리해요. 같은 날에는 같은 한자가 나오고, 공부 기록은 이 폰에만 저장돼요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "hanja-today-v1";

const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayS = () => ymd(new Date());
const dnum = s => { const [y, m, d] = s.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
const addDays = (s, n) => { const [y, m, d] = s.split("-").map(Number); return ymd(new Date(y, m - 1, d + n)); };
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const wdOf = s => WD[new Date(s + "T00:00:00").getDay()];

const RX = "丨 뚫을 곤,丶 점 주,丿 삐침 별,亅 갈고리 궐,亠 돼지해머리 두,儿 어진사람 인,冂 멀 경,冖 덮을 멱,冫 이수변 빙,凵 입벌릴 감,勹 쌀 포,匚 상자 방,匸 감출 혜,卩 병부 절,厂 기슭 엄,厶 사사 사,囗 에울 위,夊 천천히걸을 쇠,宀 집 면,尢 절름발이 왕,尸 주검 시,屮 싹날 철,巛 내 천,幺 작을 요,广 집 엄,廴 길게걸을 인,廾 받쳐들 공,弋 주살 익,彐 돼지머리 계,彡 터럭 삼,彳 걸을 척,攴 칠 복,无 없을 무,歹 뼈앙상할 알,殳 몽둥이 수,气 기운 기,疒 병질 엄,癶 걸을 발,禸 짐승발자국 유,糸 실 사,缶 장군 부,网 그물 망,耒 가래 뢰,聿 붓 율,舛 어그러질 천,艸 풀 초,虍 범호엄 호,虫 벌레 훼,襾 덮을 아,豕 돼지 시,豸 갖은돼지시 치,辵 쉬엄쉬엄갈 착,釆 분별할 변,隶 미칠 이,隹 새 추,頁 머리 혈,髟 터럭발 표,鬥 싸울 투,鬯 울창주 창,鹵 짠땅 로,黽 맹꽁이 맹";
let RM = null;
function rname(c) {
  if (!RM) { RM = {}; RX.split(",").forEach(x => { RM[x[0]] = x.slice(2); }); ALL.forEach(x => { const k = x[0].normalize("NFKC"); if (!RM[k]) RM[k] = x[1].split(" / ")[0]; }); }
  const n = RM[(c || "").normalize("NFKC")]; return n ? c + "(" + n + ")" : c;
}
function rinfo(t) { return (t || "").replace(/부수 (\S+)/, (m, c) => "부수 " + rname(c)); }

const SC = 300, BR = 9, BD = 21, FONT = '"Noto Serif CJK KR","Noto Serif KR","Noto Sans CJK KR","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","AppleGothic","Batang","serif"';
let SD = {}, FIXS = {}, FIXL = ld("hanja-write-strokefix-v1") || {}, stl = {};
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
const nums = ch => FIXL[ch] || FIXS[ch] || (SD[ch] ? SD[ch].n.map(([a, b]) => [a * SC / 256, (225 - b) * SC / 256]) : null);
function spread(pts) {
  let P = pts.map(p => [p[0], p[1]]);
  for (let it = 0; it < 8; it++) {
    const n = P.length, par = Array.from({ length: n }, (_, k) => k), fd = x => par[x] === x ? x : (par[x] = fd(par[x]));
    for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) if (Math.hypot(P[a][0] - P[b][0], P[a][1] - P[b][1]) < BD - 1) par[fd(a)] = fd(b);
    const gr = {}; for (let k = 0; k < n; k++) (gr[fd(k)] = gr[fd(k)] || []).push(k);
    let moved = false;
    Object.values(gr).forEach(g => { if (g.length < 2) return; g.sort((a, b) => a - b); const cx = g.reduce((t, k) => t + P[k][0], 0) / g.length, cy = g.reduce((t, k) => t + P[k][1], 0) / g.length, w = (g.length - 1) * BD, x0 = clampN(cx - w / 2, BR + 2, SC - BR - 2 - w); g.forEach((k, m) => { P[k] = [x0 + m * BD, clampN(cy, BR + 2, SC - BR - 2)]; }); moved = true; });
    if (!moved) break;
  }
  for (let it = 0; it < 400; it++) {
    let any = false;
    for (let a = 0; a < P.length; a++) for (let b = a + 1; b < P.length; b++) { let dx = P[b][0] - P[a][0], dy = P[b][1] - P[a][1], d = Math.hypot(dx, dy); if (d < BD - .5) { if (d < .01) { dx = 1; dy = 0; d = 1; } const m = (BD - d) / 2 + .1, ux = dx / d, uy = dy / d; P[a][0] -= ux * m; P[a][1] -= uy * m; P[b][0] += ux * m; P[b][1] += uy * m; any = true; } }
    P.forEach(p => { p[0] = clampN(p[0], BR + 2, SC - BR - 2); p[1] = clampN(p[1], BR + 2, SC - BR - 2); });
    if (!any) break;
  }
  return P;
}
function drawNums(c, pts, col) {
  const P = spread(pts); c.save(); c.font = "bold 12px sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
  pts.forEach((p, k) => { if (Math.hypot(p[0] - P[k][0], p[1] - P[k][1]) > 3) { c.strokeStyle = col; c.globalAlpha = .55; c.lineWidth = 1.2; c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(P[k][0], P[k][1]); c.stroke(); c.globalAlpha = 1; c.fillStyle = col; c.beginPath(); c.arc(p[0], p[1], 2.5, 0, 7); c.fill(); } });
  P.forEach((p, k) => { c.beginPath(); c.arc(p[0], p[1], BR, 0, 7); c.fillStyle = col; c.fill(); c.strokeStyle = "#fff"; c.lineWidth = 1.5; c.stroke(); c.fillStyle = "#fff"; c.fillText(String(k + 1), p[0], p[1] + .5); });
  c.restore();
}
function drawStrokeCard(ch) {
  const cv = $("sc"); if (!cv) return; const c = cv.getContext("2d"), st = getComputedStyle(document.documentElement), fg = st.getPropertyValue("--fg").trim() || "#222", line = st.getPropertyValue("--line").trim() || "#ccc";
  c.clearRect(0, 0, SC, SC); c.strokeStyle = line; c.lineWidth = 1; c.setLineDash([5, 5]); c.strokeRect(.5, .5, SC - 1, SC - 1); c.beginPath(); c.moveTo(SC / 2, 0); c.lineTo(SC / 2, SC); c.moveTo(0, SC / 2); c.lineTo(SC, SC / 2); c.stroke(); c.setLineDash([]);
  c.globalAlpha = .3; c.fillStyle = fg;
  if (SD[ch]) { c.save(); const k = SC / 256; c.setTransform(k, 0, 0, -k, 0, 225 * k); SD[ch].s.forEach(p => c.fill(new Path2D(p))); c.restore(); }
  else { c.textAlign = "center"; c.textBaseline = "middle"; c.font = `${Math.round(SC * .78)}px ${FONT}`; c.fillText(ch, SC / 2, SC / 2 + SC * .04); }
  c.globalAlpha = 1; const np = nums(ch); if (np) drawNums(c, np, "#2563eb");
  const m = $("scn"); if (m) m.textContent = np ? "번호 순서대로 쓰세요 (파란 점은 획이 시작되는 곳이에요)" : "이 글자는 획순 번호가 없어요. 한자 쓰기 화면의 ✏️로 직접 넣을 수 있어요.";
}
function loadStroke(g) { const f = g.replace("급", ""); if (stl[f]) return; stl[f] = 1; fetch("data/stroke-" + f + ".json").then(r => r.json()).then(d => { Object.assign(SD, d); if (step < 3) drawStrokeCard(set[step][0]); }).catch(() => { stl[f] = 0; }); }
fetch("data/stroke-fix.json").then(r => r.ok ? r.json() : {}).then(d => { FIXS = d || {}; if (step < 3 && set.length) drawStrokeCard(set[step][0]); }).catch(() => {});
const GR = ["6급", "5급", "4급", "3급", "2급", "1급"];
let S = Object.assign({ cat: "6급", done: {}, days: {} }, ld(KEY) || {});
let ALL = [], DET = {}, pool = [], set = [], step = 0, off = 0, qs = [], qi = 0, right = 0, locked = false;
const save = () => sv(KEY, S);
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function seeded(arr, seed) { const r = rng(seed), a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const hash = s => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const dkey = () => todayS() + "|" + S.cat + "|" + off;
function pick() {
  loadStroke(S.cat); pool = ALL.filter(d => d[2] === S.cat); const order = seeded(pool, hash("hz" + S.cat)), n = order.length, base = ((dnum(todayS()) + off) * 3) % n;
  set = [0, 1, 2].map(k => order[(base + k) % n]);
}
const dt = () => { const d = new Date(); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${wdOf(todayS())})`; };
function streak() { let n = 0, d = todayS(); if (!S.days[d]) d = addDays(d, -1); while (S.days[d]) { n++; d = addDays(d, -1); } return n; }
function head() {
  $("ttl").textContent = `📅 오늘의 한자 · ${dt()}${off ? ` · 추가 ${off}` : ""}`;
  $("dots").innerHTML = set.map((_, i) => `<i class="${step > i ? "ok" : step === i ? "on" : ""}"></i>`).join("") + `<i class="${step === 3 ? "on" : step > 3 ? "ok" : ""}" style="border-radius:3px"></i>`;
  const n = streak(), dn = S.done[dkey()];
  $("streak").textContent = `${n ? "🔥 " + n + "일 연속 공부 중 · " : ""}${dn !== undefined ? "이 묶음은 오늘 공부했어요 ✅ (퀴즈 " + dn + "/3)" : "한자 3개를 보고 짧은 퀴즈로 마무리해요"}`;
}
function card(d) {
  const e = DET[d[0]] || {};
  let h = `<div class="hz">${esc(d[0])}</div><div class="hd">${esc(d[1])} · ${esc(d[2])}</div><p class="note center">${esc(rinfo(d[3]))}</p><div class="sec"><h3>✍️ 쓰는 순서</h3><canvas id="sc" width="300" height="300" style="width:100%;max-width:240px;margin:0 auto;display:block" aria-label="획순 번호"></canvas><p class="note center" id="scn"></p></div>`;
  h += e.o ? `<div class="sec"><h3>🌱 글자의 유래</h3><p>${esc(e.o)}</p><p class="note">※ 한자의 유래는 학설에 따라 다를 수 있어요.</p></div>` : `<div class="sec"><h3>🌱 글자의 유래</h3><p class="note">이 글자의 유래 설명은 아직 준비 중이에요.</p></div>`;
  if (e.w) h += `<div class="sec"><h3>📝 이렇게 써요 (한자어)</h3><ul>${e.w.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  if (e.i) h += `<div class="sec"><h3>📜 사자성어 속 쓰임</h3><ul>${e.i.map(x => `<li><b>${esc(x[0])}</b> (${esc(x[1])}) — ${esc(x[2])}</li>`).join("")}</ul></div>`;
  if (e.r) h += `<div class="sec"><h3>🧩 같은 부수 ${esc(rname(e.r[0]))} 한자</h3><div class="tags">${e.r[1].map(x => `<span>${esc(x[0])} ${esc(x[1])}</span>`).join("")}</div></div>`;
  return h;
}
function makeQs() {
  const others = d => shuf(pool.filter(x => x[0] !== d[0]));
  qs = shuf(set).map((d, i) => { const t = i % 2; const o = others(d).slice(0, 3); return t === 0 ? { d, type: "hun", opts: shuf([d, ...o]) } : { d, type: "char", opts: shuf([d, ...o]) }; });
  qi = 0; right = 0; locked = false;
}
function render() {
  head();
  if (step < 3) { $("view").innerHTML = card(set[step]); drawStrokeCard(set[step][0]); $("nav").innerHTML = `<button class="btn ghost" id="bk" type="button"${step ? "" : " disabled"}>◀ 이전</button><button class="btn" id="nx" type="button">${step < 2 ? "다음 한자 ▶" : "퀴즈 풀기 ▶"}</button>`;
    $("bk").onclick = () => { step--; render(); window.scrollTo(0, 0); }; $("nx").onclick = () => { step++; if (step === 3) makeQs(); render(); window.scrollTo(0, 0); }; return; }
  if (step === 3) { const q = qs[qi], big = q.type === "hun";
    $("view").innerHTML = `<div class="note center">퀴즈 ${qi + 1}/3</div>${q.type === "hun" ? `<div class="hz">${esc(q.d[0])}</div><p class="center"><b>이 한자의 뜻과 음은?</b></p>` : `<div class="hd" style="font-size:1.6rem">${esc(q.d[1])}</div><p class="center"><b>이 뜻과 음의 한자는?</b></p>`}<div class="opts${big ? "" : " big"}" id="op">${q.opts.map((o, i) => `<button type="button" class="opt" data-i="${i}">${esc(q.type === "hun" ? o[1] : o[0])}</button>`).join("")}</div><div class="note center" id="fb"></div>`;
    $("nav").innerHTML = `<button class="btn" id="nx2" type="button" hidden style="grid-column:1/-1">${qi < 2 ? "다음 문제 ▶" : "결과 보기 ▶"}</button>`;
    $("op").onclick = e => { const b = e.target.closest("[data-i]"); if (!b || locked) return; locked = true; const o = q.opts[+b.dataset.i], ok = o[0] === q.d[0]; if (ok) right++; document.querySelectorAll("#op .opt").forEach((x, i) => { if (q.opts[i][0] === q.d[0]) x.classList.add("good"); else if (x === b) x.classList.add("bad"); });
      $("fb").textContent = ok ? "⭕ 정답!" : `❌ 정답은 ${q.d[0]} (${q.d[1]})`; $("nx2").hidden = false; };
    $("nx2").onclick = () => { locked = false; if (qi < 2) { qi++; render(); } else { S.done[dkey()] = right; S.days[todayS()] = 1; save(); step = 4; render(); } };
    return; }
  const msg = right === 3 ? "🎉 모두 맞혔어요!" : right >= 2 ? "👍 잘했어요!" : "💪 내일 또 만나요!";
  $("view").innerHTML = `<div class="center"><div class="num">${right} / 3</div><b>${msg}</b></div><div class="sec"><h3>오늘 공부한 한자</h3><div class="tags">${set.map(d => `<span>${esc(d[0])} ${esc(d[1])}</span>`).join("")}</div></div><p class="note center">${streak()}일 연속 공부 중이에요 🔥</p>`;
  $("nav").innerHTML = `<button class="btn" id="more" type="button">➕ 3개 더 공부하기</button><button class="btn ghost" id="again" type="button">↩ 처음부터 다시 보기</button><a class="btn ghost" href="hanja-write.html" style="grid-column:1/-1">✍️ 한자 쓰기에서 연습하기</a><a class="btn ghost" href="hanja-quiz.html" style="grid-column:1/-1">📖 한자 급수 퀴즈 풀기</a>`;
  $("more").onclick = () => { off++; step = 0; pick(); render(); window.scrollTo(0, 0); }; $("again").onclick = () => { step = 0; render(); window.scrollTo(0, 0); };
}
function cats() { $("cats").innerHTML = GR.map(c => `<button type="button" class="chip${c === S.cat ? " on" : ""}" data-c="${c}">${c}<small>${ALL.filter(d => d[2] === c).length}자</small></button>`).join(""); }
$("cats").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; S.cat = b.dataset.c; off = 0; step = 0; save(); cats(); pick(); render(); };
Promise.all([fetch("data/hanja.json").then(r => r.json()), fetch("data/hanja-detail.json").then(r => r.json()).catch(() => ({}))]).then(([a, d]) => { ALL = a; DET = d; cats(); pick(); render(); }).catch(() => { $("view").innerHTML = '<p class="muted">한자 자료를 불러오지 못했어요. 인터넷에 한 번 연결한 뒤 다시 열어 주세요.</p>'; });

</script>
