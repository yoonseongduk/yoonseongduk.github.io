<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="person.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뱀 사다리</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 참가자 설정 → 100칸 판(사다리는 초록, 뱀은 빨강 선) 위에서 말이 움직이고, 아래에 주사위 버튼. 먼저 100번 칸에 도착하면 이긴다 */
:root{--bg:#eef3ea;--surface:#fff;--fg:#1c2a1e;--muted:#5d7260;--line:#d2dfd0;--accent:#e8643f;--accent-fg:#fff;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f180f;--surface:#192619;--fg:#e8f2e8;--muted:#96b098;--line:#2a3f2b;--accent:#ff7f5a;--accent-fg:#0f180f;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.3rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.opt h2{margin:14px 0 0}.cb{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:9px 13px;font-size:1rem;font-family:var(--font-body)}.cb.on{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:700}.step{display:flex;align-items:center;justify-content:space-between}.step div{display:flex;align-items:center;gap:10px}.step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.3rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.5rem;min-width:2ch;text-align:center}
.pl{display:flex;align-items:center;gap:10px}.pl i{width:20px;height:20px;border-radius:50%;flex:none}.pl span{flex:1}.pl button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.9rem}
.players{display:flex;gap:6px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.88rem}.chip i{width:14px;height:14px;border-radius:50%}.chip.cur{border-color:var(--accent);font-weight:700}
.wrap{border-radius:12px;overflow:hidden;border:2px solid var(--line)}canvas{width:100%;display:block;aspect-ratio:1}
.dice{display:flex;align-items:center;gap:18px}
/* 3D 주사위: 정육면체의 여섯 면에 눈을 그리고, 굴릴 때 실제로 돌려서 나온 눈이 앞에 오게 한다. 색은 일부러 고정해서(흰 면·검은 눈) 다크 모드에서도 똑같이 보여요 */
.die{flex:none;width:92px;height:92px;perspective:380px;position:relative;color-scheme:light}.die.idle{opacity:.5;filter:grayscale(.5)}.die::after{content:"";position:absolute;left:14px;right:6px;bottom:2px;height:12px;border-radius:50%;background:rgba(0,0,0,.28);filter:blur(4px)}
.cube{position:absolute;left:18px;top:14px;width:54px;height:54px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.15,.7,.2,1)}
.cf{position:absolute;inset:0;border-radius:11px;border:2px solid var(--dc,#b9b2a0);background:linear-gradient(145deg,#ffffff,#e9e3d3);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;backface-visibility:hidden;box-shadow:inset 0 0 8px rgba(0,0,0,.12)}
.cf i{width:10px;height:10px;border-radius:50%;place-self:center;background:radial-gradient(circle at 35% 30%,#555,#111)}.cf.f1 i{width:15px;height:15px;background:radial-gradient(circle at 35% 30%,#ff6a5c,#c2271d)}
.cf.f1{transform:translateZ(27px)}.cf.f6{transform:rotateY(180deg) translateZ(27px)}.cf.f3{transform:rotateY(90deg) translateZ(27px)}.cf.f4{transform:rotateY(-90deg) translateZ(27px)}.cf.f2{transform:rotateX(90deg) translateZ(27px)}.cf.f5{transform:rotateX(-90deg) translateZ(27px)}
@media (prefers-reduced-motion:reduce){.cube{transition:none}}.msg{flex:1;min-height:3em}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn:disabled{opacity:.5;cursor:default}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.5rem}
</style>
</head>
<body>
<main>
  <h1>뱀 사다리 🐍🪜</h1>
  <section id="setup" class="card">
    <div class="step"><h2>참가 인원</h2><div><button id="minus" type="button" aria-label="한 명 줄이기">−</button><b id="n">2</b><button id="plus" type="button" aria-label="한 명 늘리기">＋</button></div></div>
    <div id="pl"></div>
    <div class="opt"><h2>판 모양</h2><div id="modes" style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0"></div><div id="lvs" style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0"></div><p class="muted" id="layoutInfo" style="margin:4px 0 10px"></p></div>
    <button class="btn" id="start" type="button">게임 시작</button>
    <p class="muted">주사위를 굴려 100번 칸에 먼저 도착하면 이겨요. 🪜 사다리 아래칸에 서면 위로 올라가고, 🐍 뱀 꼬리 칸에 서면 뱀을 타고 머리가 있는 아래 칸으로 미끄러져요. 100에는 <b>딱 맞게</b> 도착해야 해요. 사람 대신 컴퓨터가 굴리게 정할 수도 있어요.</p>
  </section>
  <section id="game" hidden>
    <div class="players" id="chips"></div>
    <div class="wrap" style="margin-top:10px"><canvas id="cv" aria-label="뱀 사다리 판"></canvas></div>
    <div class="dice" style="margin-top:10px"><div class="die" id="die" role="img" aria-label="주사위"></div><p class="msg" id="msg" aria-live="polite"></p></div>
    <button class="btn" id="roll" type="button" style="margin-top:10px;width:100%">주사위 굴리기</button>
    <div class="res" id="res" hidden style="margin-top:10px"></div>
    <button class="btn ghost" id="home" type="button" style="margin-top:10px;width:100%">처음으로</button>
  </section>
</main>
<script>
const COLORS = ["#e8453c", "#2f6fd0", "#e2a800", "#1f9d62"], NAMES = ["빨강", "파랑", "노랑", "초록"], PIPS = [[], [4], [0, 8], [0, 4, 8], [0, 2, 6, 8], [0, 2, 4, 6, 8], [0, 2, 3, 5, 6, 8]]; /* 주사위 눈이 놓이는 칸(3×3 중 번호) */
/* 윗면이 결과: 그 눈을 앞으로 돌린 뒤 한 번 더 위로 젖힌다 */
const SHOW = { 1: [0, 0], 2: [-90, 0], 3: [0, -90], 4: [0, 90], 5: [90, 0], 6: [0, 180] }; /* 그 눈이 앞에 오게 돌리는 각도 [X, Y] */
let dieTurns = 0;
function setDie(v, roll) { const d = $("die"); if (!d.firstChild) d.innerHTML = '<div class="cube" id="cube">' + [1, 2, 3, 4, 5, 6].map(f => `<div class="cf f${f}">` + Array.from({ length: 9 }, (_, k) => PIPS[f].includes(k) ? "<i></i>" : "<span></span>").join("") + "</div>").join("") + "</div>";
  const first = !$("cube").style.transform, f = v || 5, [x, y] = SHOW[f]; if (first) $("cube").style.transition = "none"; else $("cube").style.transition = ""; if (roll) dieTurns++; const t = dieTurns * 720; $("cube").style.transform = `rotateX(-55deg) rotateY(-26deg) rotateX(90deg) rotateX(${x + t}deg) rotateY(${y + t}deg)`; /* 결과 눈이 윗면에 오게(진짜 주사위처럼 위에서 읽음) */ d.classList.remove("idle"); if (first) { void $("cube").offsetWidth; $("cube").style.transition = ""; }
  d.setAttribute("aria-label", v ? "주사위 " + v : "주사위"); if (!v) d.classList.add("idle"); d.style.setProperty("--dc", typeof turn === "number" && COLORS[turn] ? COLORS[turn] : "#b9b2a0"); }
const BASE_L = { 4: 14, 9: 31, 20: 38, 28: 84, 40: 59, 51: 67, 63: 81, 71: 91 }, BASE_S = { 17: 7, 54: 34, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 99: 78 };
let LADDERS = BASE_L, SNAKES = BASE_S;
/* 판 모양: base=기본 고정판, today=오늘의 판(날짜가 씨앗이라 가족 모두 같은 판), random=한 판마다 새로 섞기. 난이도 = [사다리 수, 뱀 수] */
const MODES = [["base", "📌 기본 판"], ["today", "📅 오늘의 판"], ["random", "🎲 매번 새로"]], LVS = [["easy", "😊 쉬움", 10, 6], ["mid", "🙂 보통", 8, 8], ["hard", "🔥 어려움", 6, 11]];
const rng = a => () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
/* 규칙에 맞는 사다리·뱀을 만든다: 같은 칸을 두 번 쓰지 않고, 1·100번 칸은 비우고, 사다리는 1~6줄 위로 · 뱀은 1~5줄 아래로, 뱀 머리가 4칸 이상 연달아 놓이지 않게 */
function genLayout(seed, nl, ns) {
  const R = rng(seed), used = new Set([1, 100]), L = {}, S = {}, row = n => Math.floor((n - 1) / 10), pick = (lo, hi) => lo + Math.floor(R() * (hi - lo + 1));
  const run = (S, h) => { let k = 1; for (let x = h - 1; S[x]; x--) k++; for (let x = h + 1; S[x]; x++) k++; return k; }, ok = (a, b) => a !== b && !used.has(a) && !used.has(b);
  /* 뱀 한 마리 놓기: 밟는 칸 h를 lo~hi 사이에서 고르고, 도착 칸(머리)은 1~5줄 아래. 성공하면 true */
  const addSnake = (lo, hi) => { for (let g = 0; g < 3000; g++) { const h = pick(lo, hi), rt = pick(Math.max(0, row(h) - 5), row(h) - 1), t = rt * 10 + pick(1, 10); if (t >= 2 && ok(h, t) && run(S, h) < 4) { S[h] = t; used.add(h); used.add(t); return true; } } return false; };
  /* 필수 규칙: 맨 위 두 줄(81~100)에는 뱀을 꼭 4마리 이상(81~90 줄 2마리 + 91~99 줄 2마리). 안 그러면 80번만 넘으면 거의 끝나서 재미가 없어요 */
  let ds = 0; for (const [lo, hi] of [[81, 90], [81, 90], [91, 99], [91, 99]]) if (addSnake(lo, hi)) ds++;
  for (let i = 0, g = 0; i < nl && g < 3000; g++) { const a = pick(2, 89), rb = pick(row(a) + 1, Math.min(9, row(a) + 6)), b = rb * 10 + pick(1, 10); if (b <= 99 && ok(a, b)) { L[a] = b; used.add(a); used.add(b); i++; } }
  for (let i = ds; i < ns; i++) if (!addSnake(12, 98)) break;
  return { L, S };
}
function applyLayout() {
  const lv = LVS.find(x => x[0] === cfg.lv) || LVS[1];
  if (cfg.mode === "today") { const d = new Date(), seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); ({ L: LADDERS, S: SNAKES } = genLayout(seed * 7 + lv[2], lv[2], lv[3])); }
  else if (cfg.mode === "random") ({ L: LADDERS, S: SNAKES } = genLayout((Math.random() * 4294967296) >>> 0, lv[2], lv[3]));
  else { LADDERS = BASE_L; SNAKES = BASE_S; }
}
const SKCOL = [["#d2452f", "#f2a08f"], ["#e08a1e", "#f8d08a"], ["#8a4fc2", "#d2b6ee"], ["#2e86c1", "#acd5f0"], ["#c23b7a", "#f2b4d2"]]; /* 뱀 색깔(몸, 무늬) */
const arrow = (c, x, y, ang, sz, col) => { c.save(); c.translate(x, y); c.rotate(ang); c.fillStyle = col; c.strokeStyle = "rgba(40,20,10,.9)"; c.lineWidth = 1.5; c.lineJoin = "round"; c.beginPath(); c.moveTo(sz, 0); c.lineTo(-sz * .6, -sz * .8); c.lineTo(-sz * .6, sz * .8); c.closePath(); c.fill(); c.stroke(); c.restore(); }; /* 가는 방향 화살표 */
const BG = { ok: false, img: new Image() }; BG.img.onload = () => { BG.ok = true; if (typeof render === "function" && pos.length) render(); }; BG.img.src = "snake-img/board-bg.webp";
const KEY = "snakes-v1", $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let cfg = ld(KEY) || { n: 2, cpu: [false, true, true, true] }, pos = [], turn = 0, over = false, busy = false, tempo = 1;
cfg.n = Math.min(4, Math.max(2, cfg.n || 2)); if (!MODES.some(m => m[0] === cfg.mode)) cfg.mode = "base"; if (!LVS.some(m => m[0] === cfg.lv)) cfg.lv = "mid";

// 칸 번호 → 판 위의 좌표. 아래줄은 왼쪽→오른쪽, 그다음 줄은 오른쪽→왼쪽 (지그재그)
const cell = n => { const r = Math.floor((n - 1) / 10), c = r % 2 === 0 ? (n - 1) % 10 : 9 - (n - 1) % 10; return { r, c }; };
const dest = n => LADDERS[n] || SNAKES[n] || n;

function drawSetup() {
  $("n").textContent = cfg.n;
  const bt = (a, k, t, on) => `<button type="button" class="cb ${on ? "on" : ""}" data-${a}="${k}">${t}</button>`;
  $("modes").innerHTML = MODES.map(m => bt("mode", m[0], m[1], cfg.mode === m[0])).join("");
  $("lvs").innerHTML = cfg.mode === "base" ? "" : LVS.map(m => bt("lv", m[0], m[1], cfg.lv === m[0])).join("");
  const lv = LVS.find(x => x[0] === cfg.lv);
  $("layoutInfo").textContent = cfg.mode === "base" ? "언제나 같은 판이에요. (사다리 8개 · 뱀 8개)" : (cfg.mode === "today" ? "오늘 날짜로 정해져서 하루 동안은 가족 모두 같은 판이에요. " : "게임을 시작할 때마다(한 판 더 포함) 사다리와 뱀 자리가 새로 섞여요. ") + `(사다리 ${lv[2]}개 · 뱀 ${lv[3]}개)`;
  $("pl").innerHTML = Array.from({ length: cfg.n }, (_, i) => `<div class="pl" style="margin:6px 0"><i style="background:${COLORS[i]}"></i><span>${NAMES[i]}</span><button type="button" data-i="${i}" aria-label="${NAMES[i]} 사람 또는 컴퓨터 바꾸기">${cfg.cpu[i] ? "🤖 컴퓨터" : "👤 사람"}</button></div>`).join("");
}
function begin() { sv(KEY, cfg); applyLayout(); pos = Array(cfg.n).fill(0); turn = 0; over = false; busy = false; $("setup").hidden = true; $("game").hidden = false; $("res").hidden = true; setDie(0); $("msg").textContent = ""; render(); next(); }
function next() {
  if (over) return; render(); $("die").classList.add("idle"); /* 새 굴림 전에는 이전 결과라 흐리게 */
  if (cfg.cpu[turn]) { busy = true; $("roll").disabled = true; setTimeout(roll, 800 * tempo); } else { busy = false; $("roll").disabled = false; $("msg").textContent = `${NAMES[turn]} 차례예요. 주사위를 굴리세요!`; }
}
function roll() {
  if (over) return; busy = true; $("roll").disabled = true;
  const v = 1 + Math.floor(Math.random() * 6), p = turn; setDie(v, true); setTimeout(() => { if (over) return; moveAfterRoll(p, v); }, 600 * tempo);
}
function moveAfterRoll(p, v) {
  const from = pos[p]; let to = from + v;
  if (to > 100) { $("msg").textContent = `${NAMES[p]}: ${v}이(가) 나왔지만 100을 넘어서 제자리에 있어요.`; return setTimeout(endTurn, 700 * tempo); }
  $("msg").textContent = `${NAMES[p]}: ${v}칸 이동!`; let cur = from;
  const step = () => { cur++; pos[p] = cur; render(); if (cur < to) return setTimeout(step, 130 * tempo); settle(p, to); };
  setTimeout(step, 300 * tempo);
}
function settle(p, to) {
  const d = dest(to);
  if (d !== to) { $("msg").textContent = `${NAMES[p]}: ${LADDERS[to] ? "🪜 사다리를 타고 올라가요! " + to + " → " + d : "🐍 뱀에게 미끄러져요! " + to + " → " + d}`; setTimeout(() => { pos[p] = d; render(); finishOrNext(p); }, 600 * tempo); } else finishOrNext(p);
}
function finishOrNext(p) { if (pos[p] === 100) return win(p); setTimeout(endTurn, 500 * tempo); }
function endTurn() { turn = (turn + 1) % cfg.n; next(); }
function win(p) { over = true; $("roll").disabled = true; $("res").innerHTML = `<b>🎉 ${NAMES[p]} 승리!</b><p class="muted">${cfg.cpu[p] ? "컴퓨터가" : "사람이"} 가장 먼저 100번 칸에 도착했어요.</p><button class="btn" id="again" type="button" style="margin-top:8px;width:100%">한 판 더</button>`; $("res").hidden = false; $("again").onclick = begin; render(); }

function render() {
  const cv = $("cv"), w = cv.clientWidth, dpr = window.devicePixelRatio || 1; if (!w) return; cv.width = cv.height = Math.round(w * dpr);
  const c = cv.getContext("2d"), u = w / 10, css = getComputedStyle(document.documentElement); c.scale(dpr, dpr);
  const xy = n => { const { r, c: cc } = cell(n); return [(cc + .5) * u, w - (r + .5) * u]; };
  const bg = BG.ok; if (bg) c.drawImage(BG.img, 0, 0, w, w); /* 민화 배경 그림(없으면 단색 칸) */
  for (let n = 1; n <= 100; n++) { const { r, c: cc } = cell(n), x0 = cc * u, y0 = w - (r + 1) * u; c.globalAlpha = bg ? .55 : 1; c.fillStyle = (r + cc) % 2 ? "#f3ecd6" : "#e5efd3"; if (LADDERS[n]) c.fillStyle = "#cfe9c4"; if (SNAKES[n]) c.fillStyle = "#f4cfc8"; if (n === 100) c.fillStyle = "#ffe08a"; c.fillRect(x0, y0, u, u); c.globalAlpha = 1;
    if (bg) { c.strokeStyle = "rgba(120,100,70,.35)"; c.lineWidth = 1; c.strokeRect(x0 + .5, y0 + .5, u - 1, u - 1); }
  }
  /* 나무 사다리: 갈색 기둥 두 개 + 발판. 기둥은 어두운 테두리 위에 밝은 나무색을 겹쳐 입체감을 낸다 */
  c.lineCap = "round"; for (const [a, b] of Object.entries(LADDERS)) { const [x1, y1] = xy(+a), [x2, y2] = xy(b), dx = y2 - y1, dy = x1 - x2, L = Math.hypot(dx, dy) || 1, ox = dx / L * u * .14, oy = dy / L * u * .14;
    const steps = Math.max(2, Math.floor(Math.hypot(x2 - x1, y2 - y1) / (u * .42)));
    for (const [col, wd] of [["#5a3a1c", u * .105], ["#c98f50", u * .06]]) { c.strokeStyle = col; c.lineWidth = Math.max(2, wd);
      if (col === "#c98f50") for (let k = 1; k < steps; k++) { const t = k / steps, px = x1 + (x2 - x1) * t, py = y1 + (y2 - y1) * t; c.beginPath(); c.moveTo(px - ox, py - oy); c.lineTo(px + ox, py + oy); c.stroke(); }
      for (const sg of [-1, 1]) { c.beginPath(); c.moveTo(x1 + sg * ox, y1 + sg * oy); c.lineTo(x2 + sg * ox, y2 + sg * oy); c.stroke(); }
      if (col !== "#c98f50") for (let k = 1; k < steps; k++) { const t = k / steps, px = x1 + (x2 - x1) * t, py = y1 + (y2 - y1) * t; c.beginPath(); c.moveTo(px - ox, py - oy); c.lineTo(px + ox, py + oy); c.stroke(); } } }
  for (const [a, b] of Object.entries(LADDERS)) { const [x1, y1] = xy(+a), [x2, y2] = xy(b); arrow(c, x2 - Math.cos(Math.atan2(y2 - y1, x2 - x1)) * u * .08, y2 - Math.sin(Math.atan2(y2 - y1, x2 - x1)) * u * .08, Math.atan2(y2 - y1, x2 - x1), u * .17, "#f2b600"); } /* 사다리 위 끝 = 올라가서 도착 */
  /* 뱀: 밟는 칸(꼬리, 위) → 머리가 있는 칸(아래) 사이를 물결 모양으로 그린다. 몸은 머리 쪽이 굵고 꼬리로 갈수록 가늘고, 판이 바뀌어도 양 끝 칸 위치만 있으면 어떤 뱀이든 그려진다(모양은 머리 칸 번호로 정해져 다시 그려도 안 흔들림) */
  Object.entries(SNAKES).forEach(([a, b], k) => { const [x1, y1] = xy(b), [x2, y2] = xy(+a), /* 머리=도착(아래) 칸, 꼬리=밟는(위) 칸 */ L = Math.hypot(x2 - x1, y2 - y1) || 1, nx = -(y2 - y1) / L, ny = (x2 - x1) / L, pal = SKCOL[k % SKCOL.length];
    const waves = Math.max(1.5, L / (u * 2.4)), ph = ((+a) % 5) * 1.3, N = Math.ceil(L / (u * .1)) + 12, pts = [];
    for (let i = 0; i <= N; i++) { const t = i / N, off = u * .3 * Math.sin(Math.PI * t) * Math.sin(t * waves * 2 * Math.PI + ph); pts.push([x1 + (x2 - x1) * t + nx * off, y1 + (y2 - y1) * t + ny * off, u * (.035 + .105 * Math.pow(1 - t, .75))]); }
    for (let i = N; i >= 0; i--) { c.fillStyle = "rgba(40,20,10,.85)"; c.beginPath(); c.arc(pts[i][0], pts[i][1], pts[i][2] + 1.6, 0, 7); c.fill(); }
    for (let i = N; i >= 0; i--) { c.fillStyle = pal[0]; c.beginPath(); c.arc(pts[i][0], pts[i][1], pts[i][2], 0, 7); c.fill(); }
    for (let i = 3; i < N - 2; i += 4) { c.fillStyle = pal[1]; c.beginPath(); c.arc(pts[i][0], pts[i][1], pts[i][2] * .5, 0, 7); c.fill(); }
    const hd = Math.atan2(pts[0][1] - pts[3][1], pts[0][0] - pts[3][0]); c.save(); c.translate(pts[0][0], pts[0][1]); c.rotate(hd);
    c.strokeStyle = "#d8283c"; c.lineWidth = Math.max(1.5, u * .03); c.beginPath(); c.moveTo(u * .12, 0); c.lineTo(u * .27, 0); c.moveTo(u * .27, 0); c.lineTo(u * .33, -u * .05); c.moveTo(u * .27, 0); c.lineTo(u * .33, u * .05); c.stroke();
    c.fillStyle = "rgba(40,20,10,.85)"; c.beginPath(); c.ellipse(u * .02, 0, u * .185, u * .15, 0, 0, 7); c.fill(); c.fillStyle = pal[0]; c.beginPath(); c.ellipse(u * .02, 0, u * .165, u * .13, 0, 0, 7); c.fill();
    for (const sg of [-1, 1]) { c.fillStyle = "#fff"; c.beginPath(); c.arc(u * .07, sg * u * .075, u * .045, 0, 7); c.fill(); c.fillStyle = "#222"; c.beginPath(); c.arc(u * .085, sg * u * .075, u * .022, 0, 7); c.fill(); }
    c.restore(); });
  /* 숫자는 뱀·사다리 위에 그려서 절대 가려지지 않게 */
  for (let n = 1; n <= 100; n++) { const { r, c: cc } = cell(n), x0 = cc * u, y0 = w - (r + 1) * u;
    c.font = `bold ${Math.max(9, u * .26)}px sans-serif`; c.textAlign = "left"; c.textBaseline = "top"; const t = n === 100 ? "🏁100" : n;
    if (bg) { c.lineJoin = "round"; c.lineWidth = 3; c.strokeStyle = "rgba(255,252,240,.9)"; c.strokeText(t, x0 + 3, y0 + 2); } /* 글자 둘레 흰 테두리로 또렷하게 */
    c.fillStyle = "#4a5446"; c.fillText(t, x0 + 3, y0 + 2); }
  pos.forEach((p, i) => { const n = p || 0; const [x, y] = n ? xy(n) : [u * .3 + i * u * .4, w + 0]; if (!n) return; const off = [[-.18, -.18], [.18, -.18], [-.18, .18], [.18, .18]][i];
    c.fillStyle = COLORS[i]; c.strokeStyle = "#fff"; c.lineWidth = 2; c.beginPath(); c.arc(x + off[0] * u, y + off[1] * u, u * .17, 0, 7); c.fill(); c.stroke(); });
  $("chips").innerHTML = pos.map((p, i) => `<span class="chip ${i === turn && !over ? "cur" : ""}"><i style="background:${COLORS[i]}"></i>${NAMES[i]}${cfg.cpu[i] ? "🤖" : ""} <b>${p || "출발"}</b></span>`).join("");
}
$("minus").onclick = () => { if (cfg.n > 2) { cfg.n--; drawSetup(); } }; $("plus").onclick = () => { if (cfg.n < 4) { cfg.n++; drawSetup(); } };
$("setup").addEventListener("click", e => { const b = e.target.closest("[data-mode],[data-lv]"); if (!b) return; if (b.dataset.mode) cfg.mode = b.dataset.mode; if (b.dataset.lv) cfg.lv = b.dataset.lv; sv(KEY, cfg); drawSetup(); });
$("pl").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) { cfg.cpu[+b.dataset.i] = !cfg.cpu[+b.dataset.i]; drawSetup(); } });
$("start").onclick = begin; $("roll").onclick = () => { if (!busy && !over && !cfg.cpu[turn]) roll(); };
$("home").onclick = () => { over = true; $("game").hidden = true; $("setup").hidden = false; drawSetup(); };
window.addEventListener("resize", () => { if (!$("game").hidden) render(); });
drawSetup();
</script>
