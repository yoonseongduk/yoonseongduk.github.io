:root {
  --bg: #f4f1ec;
  --surface: #ffffff;
  --fg: #231f1a;
  --muted: #6b655c;
  --line: #e0dacf;
  --font-display: "Do Hyeon", "Noto Sans KR", sans-serif;
  --font-body: "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1a1815; --surface: #26231f; --fg: #f1ede4; --muted: #a69f92; --line: #3a362f; color-scheme: dark; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 2.2rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); }
input[type=search] {
  width: 100%; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 12px;
  padding: 11px 14px; font: inherit;
}
input[type=search]:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #e8643f; outline-offset: 2px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-inline: -2px; padding-inline: 2px; scrollbar-width: thin; }
.chip {
  flex: none; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 14px; font: inherit; font-size: .92rem; cursor: pointer; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); font-weight: 700; }
#list { display: flex; flex-direction: column; gap: 26px; }
section { display: flex; flex-direction: column; gap: 10px; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0; display: flex; align-items: baseline; gap: 8px; }
h2 span { font-family: var(--font-body); font-size: .85rem; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.game {
  --c: hsl(var(--h) 55% 42%);
  display: flex; flex-direction: column; gap: 4px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--c); border-radius: 14px; padding: 12px;
  color: inherit; text-decoration: none;
}
@media (prefers-color-scheme: dark) { .game { --c: hsl(var(--h) 70% 68%); } }
.game:hover { border-color: var(--c); }
.game:active { transform: scale(.98); }
.icon { font-size: 2rem; line-height: 1.1; }
.game { position: relative; }
.game .qc { color: var(--c); font-weight: 700; font-size: .78rem; margin-top: auto; }
.no { position: absolute; top: 8px; right: 10px; font-size: .72rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.game h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; margin: 0; line-height: 1.25; overflow-wrap: anywhere; }
.game p { margin: 0; color: var(--muted); font-size: .82rem; line-height: 1.4; overflow-wrap: anywhere; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; border: 1.5px dashed var(--line); border-radius: 14px; }
.pwa { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: .92rem; }
.pwa b { font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; }
.pwa p { margin: 0; color: var(--muted); }
.pwa .upd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .9rem; color: var(--muted); }
.pwa button { align-self: flex-start; background: var(--fg); color: var(--bg); border: 0; border-radius: 10px; padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; }
footer { color: var(--muted); font-size: .85rem; }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let group = "all", query = "";

function render() {
  const q = query.trim().toLowerCase();
  // 숫자만 넣으면(앞에 # 있어도 돼요) 게임 고유번호로 찾아요
  const qn = /^#?\d+$/.test(q) ? +q.replace("#", "") : 0, hit = g => qn ? NUM[g[0]] === qn : (g[2] + " " + g[3]).toLowerCase().includes(q);
  const shown = GAMES.filter(g => (group === "all" || g[4] === group) && (!q || hit(g)));
  const net = q && group === "all" ? NETG.filter(g => qn ? g[3] === qn : g[2].toLowerCase().includes(q)) : [];
  $("count").textContent = q || group !== "all" ? `${shown.length + net.length}개를 찾았어요 (전체 ${GAMES.length}개)` : `게임 ${GAMES.length}개`;
  $("chips").innerHTML = [{ id: "all", n: "전체", e: "" }, ...GROUPS].map(g => {
    const n = g.id === "all" ? GAMES.length : GAMES.filter(x => x[4] === g.id).length;
    return `<button type="button" class="chip" data-g="${g.id}" aria-pressed="${g.id === group}">${g.e} ${g.n} ${n}</button>`;
  }).join("");
  const html = GROUPS.map(gr => {
    const items = shown.filter(g => g[4] === gr.id); if (!items.length) return "";
    return `<section><h2>${gr.e} ${gr.n}<span>${items.length}개</span></h2><div class="grid">${items.map(g =>
      `<a class="game" style="--h:${gr.h}" href="${esc(g[0])}"><span class="icon" aria-hidden="true">${g[1]}</span><span class="no">${BUZZ.includes(g[0]) ? '<span title="같이 하기 퀴즈 버저로도 할 수 있어요">🔔</span> ' : ""}#${NUM[g[0]] || ""}</span><h3>${esc(g[2])}</h3><p>${esc(g[3])}</p>${QCNT[g[0]] ? `<p class="qc">📚 ${QCNT[g[0]]}</p>` : ""}</a>`).join("")}</div></section>`;
  }).join("") + (net.length ? `<section><h2>👫 같이 하기 게임<span>${net.length}개</span></h2><div class="grid">${net.map(g =>
      `<a class="game" style="--h:205" href="play-together.html"><span class="icon" aria-hidden="true">${g[1]}</span><span class="no">#${g[3]}</span><h3>${esc(g[2])}</h3><p>👫 같이 하기 화면에서 폰을 연결해 함께 해요</p></a>`).join("")}</div></section>` : "");
  $("list").innerHTML = html || `<div class="empty">찾는 게임이 없어요. 다른 단어로 찾아보세요.</div>`;
}
$("chips").addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (b) { group = b.dataset.g; render(); } });
$("q").addEventListener("input", e => { query = e.target.value; render(); });
render();
</script>

  const ask = reg => new Promise(res => { const w = reg.active; if (!w) return res(null); const ch = new MessageChannel(); ch.port1.onmessage = e => res(e.data); w.postMessage({ type: "status" }, [ch.port2]); setTimeout(() => res(null), 3000); });
  // ---- 새 버전 확인 · 자동 받기 ----
  const verEl = document.getElementById("pwaVer"), updBtn = document.getElementById("pwaUpd"), updMsg = document.getElementById("pwaUpdMsg");
  const askW = w => new Promise(res => { if (!w) return res(null); const ch = new MessageChannel(); ch.port1.onmessage = e => res(e.data); try { w.postMessage({ type: "status" }, [ch.port2]); } catch (e) { return res(null); } setTimeout(() => res(null), 2500); });
  let lastCheck = 0, checking = false, reloading = false; const wasControlled = !!navigator.serviceWorker.controller;
  const showVer = async reg => { const st = await askW(reg.active); verEl.textContent = st ? `설치된 버전: ${st.build || "이전 버전"}${st.games ? " · 게임 " + st.games + "개" : ""}` : ""; };
  const now = () => new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  function follow(w) { return new Promise(res => { updMsg.textContent = "⬇️ 새 버전을 받는 중이에요…"; const t = setInterval(async () => { const st = await askW(w); if (st) updMsg.textContent = `⬇️ 새 버전을 받는 중이에요… (${st.count}/${st.total})`; }, 700);
    w.addEventListener("statechange", () => { if (w.state === "activated") { clearInterval(t); updMsg.textContent = "🎉 새 버전을 받았어요! 곧 새로고침해요"; res(); } else if (w.state === "redundant") { clearInterval(t); updMsg.textContent = "업데이트를 끝내지 못했어요. 다시 눌러 주세요"; res(); } }); }); }
  async function check(manual) {
    if (checking) return; checking = true; updBtn.disabled = true; if (manual) updMsg.textContent = "확인하는 중…";
    try {
      if (!navigator.onLine) { if (manual) updMsg.textContent = "📴 인터넷이 꺼져 있어요. 연결되면 다시 확인해요."; return; }
      const reg = await navigator.serviceWorker.ready; await reg.update(); const w = reg.installing || reg.waiting;      // 인터넷이 없으면 update()가 실패해서 조용히 건너뛰어요
      if (w) await follow(w); else updMsg.textContent = `✅ 최신 버전이에요 (${now()} 확인)`;
      lastCheck = Date.now(); showVer(reg);
    } catch (e) { if (manual) updMsg.textContent = "확인하지 못했어요. 인터넷을 확인해 주세요."; } finally { checking = false; updBtn.disabled = false; }
  }
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!wasControlled || reloading) return; reloading = true; updMsg.textContent = "🎉 새 버전으로 바뀌었어요! 새로고침해요"; setTimeout(() => location.reload(), 1200); });
  updBtn.onclick = () => check(true);
  navigator.serviceWorker.ready.then(reg => { showVer(reg); setTimeout(() => check(false), 1500); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastCheck > 10 * 60 * 1000) check(false); });
  setInterval(() => { if (!document.hidden) check(false); }, 30 * 60 * 1000);
  addEventListener("online", () => setTimeout(() => check(false), 1500));      // 인터넷이 다시 연결되면 한 번 확인
  addEventListener("offline", () => { if (!checking) updMsg.textContent = "📴 오프라인이에요. 저장된 게임으로 계속 할 수 있어요."; });
  navigator.serviceWorker.ready.then(async reg => {
    for (let k = 0; k < 120; k++) {
      const st = await ask(reg);
      if (st && st.count >= st.total - 3) { save.textContent = "✅ 게임이 이 폰에 모두 저장됐어요. 인터넷이 없어도 할 수 있어요."; return; }
      save.textContent = st ? `⏳ 게임을 폰에 저장하는 중이에요 (${st.count}/${st.total}). 인터넷이 연결된 채로 잠시 기다려 주세요.` : "⏳ 준비하는 중이에요…";
      await new Promise(r => setTimeout(r, 1500));
    }
  }).catch(() => { box.hidden = true; });
})();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<script src="med-notify.js" defer></script>
<script src="family.js" defer></script>
