<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>폭탄 돌리기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 설정(시간 길이) → 폭탄 화면(점점 빨라지는 소리). 터지는 시간은 아무도 몰라서, 휴대폰을 옆 사람에게 계속 넘긴다 */
:root{--bg:#f6efe8;--surface:#fff;--fg:#2b2018;--muted:#7a6a5c;--line:#e6d9cc;--accent:#e8453c;--accent-fg:#fff;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a1410;--surface:#261e18;--fg:#f4ece4;--muted:#b0a092;--line:#3d3228;--accent:#ff6a5e;--accent-fg:#1a1410;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.35rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}
.stage{min-height:340px;border-radius:24px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;transition:background .15s}
.stage.hot{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}.stage.boom{background:var(--accent);color:#fff;border-color:var(--accent)}
.bomb{font-size:6rem;line-height:1}.bomb.tick{animation:pulse .5s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.big{font-family:var(--font-display);font-size:1.7rem}
.pen{font-family:var(--font-display);font-size:1.6rem;background:rgba(255,255,255,.2);border-radius:14px;padding:10px 14px}
.cnt{color:var(--muted);font-size:.85rem}
@media(prefers-reduced-motion:reduce){.bomb.tick{animation:none}}
</style>
</head>
<body>
<main>
  <h1>폭탄 돌리기 💣</h1>
  <div class="seg" id="lv" role="radiogroup" aria-label="폭탄 시간"></div>
  <div class="stage" id="stage"></div>
  <button class="btn" id="go" type="button">폭탄 켜기</button>
  <p class="muted">폭탄을 켜면 째깍째깍 소리가 나요. <b>언제 터질지는 아무도 몰라요!</b> 둘러앉은 사람끼리 휴대폰을 옆 사람에게 계속 넘기세요. 터질 때 들고 있는 사람이 벌칙이에요. (소리가 나요)</p>
</main>
<script>
const LV = { short: { min: 6, max: 14, label: "짧게", hint: "6~14초" }, normal: { min: 12, max: 26, label: "보통", hint: "12~26초" }, long: { min: 22, max: 45, label: "길게", hint: "22~45초" } };
const PEN = ["노래 한 소절 부르기", "성대모사 하나 하기", "10초 동안 웃지 않기", "옆 사람 칭찬 3가지", "애교 한 번 보여주기", "팔굽혀펴기 5번", "가장 부끄러운 비밀 하나", "다음 판 폭탄 먼저 잡기", "손뼉 치며 구구단 3단", "엉덩이로 이름 쓰기", "오늘의 큰절 올리기", "제일 좋아하는 음식 몸으로 설명하기"];
const $ = id => document.getElementById(id), KEY = "bomb-level-v1";
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let lv = (ld(KEY) in LV) ? ld(KEY) : "normal", state = "idle", fuse = 0, t0 = 0, loop = 0, audio = null, rounds = 0, tempo = 1, sound = true;

function beep(freq, ms) {
  if (!audio || !sound) return; try { const o = audio.createOscillator(), g = audio.createGain(); o.type = "square"; o.frequency.value = freq; g.gain.setValueAtTime(.12, audio.currentTime); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + ms / 1000); o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + ms / 1000); } catch (e) {}
}
// 터지는 시간을 정한다 (최소~최대 사이에서 무작위)
const makeFuse = l => (LV[l].min + Math.random() * (LV[l].max - LV[l].min)) * 1000;
function start() {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  state = "run"; fuse = makeFuse(lv) * tempo; t0 = performance.now(); rounds++; draw(); next();
}
function next() {                                              // 시간이 지날수록 소리 간격이 짧아진다
  if (state !== "run") return; const el = performance.now() - t0;
  if (el >= fuse) return boom();
  const frac = el / fuse; beep(frac > .75 ? 880 : 660, 70); $("stage").classList.toggle("hot", frac > .75);
  loop = setTimeout(next, Math.max(110, 800 * (1 - frac) ** 1.3 + 110) * (tempo < 1 ? tempo * 2 : 1));
}
function boom() {
  state = "boom"; clearTimeout(loop); beep(120, 600); setTimeout(() => beep(80, 500), 120); try { navigator.vibrate && navigator.vibrate([200, 80, 300]); } catch (e) {}
  draw();
}
function draw() {
  const s = $("stage"); s.className = "stage" + (state === "boom" ? " boom" : "");
  if (state === "idle") { s.innerHTML = `<div class="bomb">💣</div><div class="big">준비됐나요?</div><p class="muted">폭탄 시간을 고르고 "폭탄 켜기"를 누르세요</p>`; $("go").textContent = "폭탄 켜기"; $("go").hidden = false; }
  else if (state === "run") { s.innerHTML = `<div class="bomb tick">💣</div><div class="big">옆 사람에게 넘기세요!</div><p class="muted">째깍째깍… 언제 터질까요?</p>`; $("go").hidden = true; }
  else { const pen = PEN[Math.floor(Math.random() * PEN.length)]; s.innerHTML = `<div class="bomb">💥</div><div class="big">펑! 터졌어요!</div><p>들고 있던 사람의 벌칙은</p><div class="pen">${pen}</div><div class="cnt">${rounds}번째 판</div>`; $("go").textContent = "한 판 더"; $("go").hidden = false; }
  $("lv").innerHTML = Object.keys(LV).map(k => `<button type="button" class="${k === lv ? "on" : ""}" data-l="${k}" role="radio" aria-checked="${k === lv}" ${state === "run" ? "disabled" : ""}>${LV[k].label}<small>${LV[k].hint}</small></button>`).join("");
}
$("go").onclick = start;
$("lv").addEventListener("click", e => { const l = e.target.closest("[data-l]"); if (l && !l.disabled) { lv = l.dataset.l; sv(KEY, lv); state = "idle"; draw(); } });
document.addEventListener("visibilitychange", () => { if (document.hidden && state === "run") { clearTimeout(loop); state = "idle"; draw(); } });
draw();
</script>
</body>
</html>
