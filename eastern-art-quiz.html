<style>
/* 레이아웃: (분류 버튼), 점수 줄, 문제 카드, 네 개의 보기. 고르면 정답이 바로 표시되고 10문제를 풀면 결과가 나온다 */
:root{--bg:hsl(150 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(150 22% 86%);--accent:hsl(150 60% 42%);--accent-fg:#fff;--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(150 22% 10%);--surface:hsl(150 20% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(150 18% 24%);--accent:hsl(150 75% 68%);--accent-fg:#10131c;--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.9rem}.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:12px;font-family:var(--font-display);font-size:1.3rem}
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 16px;text-align:center;font-family:var(--font-display);font-size:clamp(1.5rem,7vw,2.1rem);line-height:1.4;overflow-wrap:anywhere}
.q small{display:block;color:var(--accent);font-family:var(--font-body);font-weight:700;font-size:.85rem;margin-bottom:4px}
.q .note{display:block;color:var(--muted);font-family:var(--font-body);font-size:.9rem;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts.one{grid-template-columns:1fr}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;min-height:58px;padding:8px 10px;font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}.opt:disabled{cursor:default}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.flagb{margin-top:8px;background:transparent;border:1px dashed var(--line);border-radius:999px;padding:4px 12px;font-family:var(--font-body);font-size:.85rem;color:var(--muted)}.flagb.on{border-style:solid;border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body>
<main>
  <h1>동양화 퀴즈 🏯</h1>
  <div class="chips" id="lvs" role="group" aria-label="등급"></div>
  <p class="muted" id="lvp"></p>
  <div class="chips" id="cats" role="group" aria-label="분류" hidden></div>
  <div class="stats"><div class="stat"><small>문제</small><b id="no">0/10</b></div><div class="stat"><small>맞힌 수</small><b id="score">0</b></div><div class="stat"><small>최고</small><b id="best">0</b></div></div>
  <div class="q" id="q"></div>
  <div class="opts" id="opts"></div>
  <div class="res" id="res" hidden></div>
  <button class="btn" id="next" type="button" hidden>다음 문제</button>
  <p class="muted">중국(고개지·곽희·장택단·황공망…)과 일본(셋슈·소타쓰·호쿠사이·히로시게…)의 그림과 화가, 시대, 동양화 용어를 맞혀 보세요. 우리나라 화가는 <a href="korean-art-quiz.html">🖌️ 우리나라 화가 퀴즈</a>에 있어요. 모든 화가와 대표작은 <a href="art-gallery.html">🎨 명화 작가별 모음</a>에서 볼 수 있어요. 10문제를 풀면 결과가 나와요.</p>
</main>
<script>
// [문제, 정답, 틀린 보기(없으면 같은 분류의 다른 정답에서 뽑음), 분류, 해설]

) 어느 나라의 화가일까요?", "중국", ["일본", "인도", "한국(조선)"], "중국", "양해(Liang Kai, 1140경~1210경) — 남송의 궁정 화가였지만 자리를 버리고 절에서 지냈어요. 몇 번의 붓질로 그린 거침없는 인물화가 유명해요."], ["‘목계’은(는) 어느 나라의 화가일까요?", "중국", ["인도", "일본", "한국(조선)"], "중국", "목계(Muqi, 1210경~1269경) — 남송의 선승 화가로, 먹 하나로 사물의 본모습을 담았어요. 중국보다 일본에서 더 높이 평가받았어요."], ["‘조맹부’은(는) 어느 나라의 화가일까요?", "중국", ["일본", "인도", "한국(조선)"], "중국", "조맹부(Zhao Mengfu, 1254~1322) — 송나라 왕족 출신으로 원나라에서 벼슬한 서예가이자 화가예요. 그의 글씨체(송설체)는 고려·조선에도 큰 영향을 주었어요."], ["‘황공망’은(는) 어느 나라의 화가일까요?", "중국", ["인도", "일본", "한국(조선)"], "중국", "황공망(Huang Gongwang, 1269~1354) — 원나라 말기 4대 화가(원말 4대가) 중 한 사람이에요. 몇 년에 걸쳐 그린 긴 두루마리는 불에 타 두 조각이 되었어요."], ["‘예찬’은(는) 어느 나라의 화가일까요?", "중국", ["한국(조선)", "일본", "인도"], "중국", "예찬(Ni Zan, 1301~1374) — 원말 4대가 중 한 사람으로, 텅 빈 강가에 나무 몇 그루와 빈 정자만 둔 쓸쓸하고 깨끗한 그림을 그렸어요."], ["‘왕몽’은(는) 어느 나라의 화가일까요?", "중국", ["한국(조선)", "일본", "인도"], "중국", "왕몽(Wang Meng, 1308경~1385) — 원말 4대가 중 한 사람으로, 산을 빽빽하게 채운 꼼꼼한 붓질이 특징이에요. 조맹부의 외손자예요."], ["‘심주’은(는) 어느 나라의 화가일까요?", "중국", ["인도", "일본", "한국(조선)"], "중국", "심주(Shen Zhou, 1427~1509) — 명나라 쑤저우의 문인 화가로, '오파'를 연 사람이에요. 벼슬하지 않고 평생 그림과 시를 즐겼어요."], ["‘구영’은(는) 어느 나라의 화가일까요?", "중국", ["일본", "한국(조선)", "인도"], "중국", "구영(Qiu Ying, 1494경~1552) — 명나라의 직업 화가로, 심주·문징명·당인과 함께 '명나라 4대가'로 꼽혀요. 화려하고 세밀한 그림을 그렸어요."], ["‘제백석’은(는) 어느 나라의 화가일까요?", "중국", ["한국(조선)", "일본", "인도"], "중국", "제백석(Qi Baishi, 1864~1957) — 목수 출신으로 그림을 익혀 중국 근대 최고의 화가가 되었어요. 투명하게 살아 움직이는 새우 그림이 유명해요."], ["‘서비홍’은(는) 어느 나라의 화가일까요?", "중국", ["한국(조선)", "일본", "인도"], "중국", "서비홍(Xu Beihong, 1895~1953) — 프랑스에서 서양화를 배우고, 먹으로 힘차게 달리는 말을 그린 중국 근대 화가예요."], ["‘셋슈’은(는) 어느 나라의 화가일까요?", "일본", ["인도", "한국(조선)", "중국"], "일본", "셋슈(Sesshū Tōyō, 1420~1506) — 무로마치 시대의 선승 화가로, 명나라에 다녀와 일본 수묵화를 완성했어요."], ["‘하세가와 도하쿠’은(는) 어느 나라의 화가일까요?", "일본", ["한국(조선)", "인도", "중국"], "일본", "하세가와 도하쿠(Hasegawa Tōhaku, 1539~1610) — 모모야마 시대의 화가로, 안개 속 소나무를 먹으로만 그린 병풍으로 이름났어요."], ["‘가노 에이토쿠’은(는) 어느 나라의 화가일까요?", "일본", ["인도", "중국", "한국(조선)"], "일본", "가노 에이토쿠(Kanō Eitoku, 1543~1590) — 가노파의 화가로, 오다 노부나가·도요토미 히데요시의 성을 금빛 장벽화로 꾸몄어요."], ["‘다와라야 소타쓰’은(는) 어느 나라의 화가일까요?", "일본", ["중국", "인도", "한국(조선)"], "일본", "다와라야 소타쓰(Tawaraya Sōtatsu, 17세기 초) — 금빛 바탕에 대담한 색과 모양을 쓴 장식 화풍(린파)을 연 화가예요."], ["‘오가타 고린’은(는) 어느 나라의 화가일까요?", "일본", ["인도", "중국", "한국(조선)"], "일본", "오가타 고린(Ogata Kōrin, 1658~1716) — 소타쓰의 화풍을 이어 '린파'라는 이름이 붙게 한 화가예요. 옷감·그릇 무늬도 디자인했어요."], ["‘이토 자쿠추’은(는) 어느 나라의 화가일까요?", "일본", ["한국(조선)", "중국", "인도"], "일본", "이토 자쿠추(Itō Jakuchū, 1716~1800) — 교토의 채소 도매상 주인이었다가 화가가 되었어요. 닭과 꽃·새를 아주 화려하고 세밀하게 그렸어요."], ["‘마루야마 오쿄’은(는) 어느 나라의 화가일까요?", "일본", ["중국", "인도", "한국(조선)"], "일본", "마루야마 오쿄(Maruyama Ōkyo, 1733~1795) — 자연을 직접 보고 그리는 사생을 중시한 화가로, 마루야마파를 열었어요."], ["‘기타가와 우타마로’은(는) 어느 나라의 화가일까요?", "일본", ["한국(조선)", "중국", "인도"], "일본", "기타가와 우타마로(Kitagawa Utamaro, 1753경~1806) — 여인의 얼굴을 크게 그린 미인화 판화로 이름난 우키요에 화가예요."], ["‘도슈사이 샤라쿠’은(는) 어느 나라의 화가일까요?", "일본", ["중국", "인도", "한국(조선)"], "일본", "도슈사이 샤라쿠(Tōshūsai Sharaku, 18세기 말) — 1794~1795년 열 달 남짓 가부키 배우 그림만 내고 사라진 수수께끼의 우키요에 화가예요."], ["‘가쓰시카 호쿠사이’은(는) 어느 나라의 화가일까요?", "일본", ["한국(조선)", "인도", "중국"], "일본", "가쓰시카 호쿠사이(Katsushika Hokusai, 1760~1849) — 일본 에도 시대의 풍속 판화(우키요에) 화가로, 유럽의 인상파에도 큰 영향을 주었어요."], ["‘우타가와 히로시게’은(는) 어느 나라의 화가일까요?", "일본", ["인도", "중국", "한국(조선)"], "일본", "우타가와 히로시게(Utagawa Hiroshige, 1797~1858) — 여행길의 풍경과 비·눈 같은 날씨를 서정적으로 담은 풍경 판화로 유명해요. 고흐가 그의 판화를 따라 그렸어요."], ["화가 ‘고개지’과(와) 가장 관련 깊은 화풍(사조)은?", "인물화", ["우키요에", "가노파", "산수화"], "중국", "고개지은(는) '인물화'의 대표적인 작가예요. 동진의 화가로, 중국 인물화의 아버지라 불려요. 인물의 정신은 눈동자에 담긴다고 여겼다고 전해져요."], ["화가 ‘범관’과(와) 가장 관련 깊은 화풍(사조)은?", "산수화", ["린파", "가노파", "인물화"], "중국", "범관은(는) '산수화'의 대표적인 작가예요. 북송 초기의 산수화가로, 거대한 산이 화면을 꽉 채우는 웅장한 그림을 그렸어요."], ["화가 ‘곽희’과(와) 가장 관련 깊은 화풍(사조)은?", "산수화", ["인물화", "가노파", "우키요에"], "중국", "곽희은(는) '산수화'의 대표적인 작가예요. 북송의 궁정 화가로, 산을 올려다보고·들여다보고·멀리 바라보는 '삼원법'을 정리했어요."], ["화가 ‘휘종’과(와) 가장 관련 깊은 화풍(사조)은?", "화조화", ["수묵화", "인물화", "산수화"], "중국", "휘종은(는) '화조화'의 대표적인 작가예요. 북송의 황제로, 나랏일보다 그림·글씨에 빠졌던 예술가 황제예요. 가늘고 날카로운 '수금체' 글씨를 만들었어요."], ["화가 ‘마원’과(와) 가장 관련 깊은 화풍(사조)은?", "산수화", ["가노파", "린파", "우키요에"], "중국", "마원은(는) '산수화'의 대표적인 작가예요. 남송의 궁정 화가로, 경치를 화면 한쪽 구석에 모으고 나머지를 비워 '마일각(마씨의 한 모서리)'이라 불렸어요."], ["화가 ‘양해’과(와) 가장 관련 깊은 화풍(사조)은?", "선종화", ["우키요에", "린파", "화조화"], "중국", "양해은(는) '선종화'의 대표적인 작가예요. 남송의 궁정 화가였지만 자리를 버리고 절에서 지냈어요. 몇 번의 붓질로 그린 거침없는 인물화가 유명해요."], ["화가 ‘목계’과(와) 가장 관련 깊은 화풍(사조)은?", "선종화", ["화조화", "린파", "가노파"], "중국", "목계은(는) '선종화'의 대표적인 작가예요. 남송의 선승 화가로, 먹 하나로 사물의 본모습을 담았어요. 중국보다 일본에서 더 높이 평가받았어요."], ["화가 ‘조맹부’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["린파", "인물화", "가노파"], "중국", "조맹부은(는) '문인화'의 대표적인 작가예요. 송나라 왕족 출신으로 원나라에서 벼슬한 서예가이자 화가예요. 그의 글씨체(송설체)는 고려·조선에도 큰 영향을 주었어요."], ["화가 ‘황공망’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["린파", "가노파", "화조화"], "중국", "황공망은(는) '문인화'의 대표적인 작가예요. 원나라 말기 4대 화가(원말 4대가) 중 한 사람이에요. 몇 년에 걸쳐 그린 긴 두루마리는 불에 타 두 조각이 되었어요."], ["화가 ‘예찬’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["우키요에", "린파", "화조화"], "중국", "예찬은(는) '문인화'의 대표적인 작가예요. 원말 4대가 중 한 사람으로, 텅 빈 강가에 나무 몇 그루와 빈 정자만 둔 쓸쓸하고 깨끗한 그림을 그렸어요."], ["화가 ‘왕몽’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["가노파", "인물화", "린파"], "중국", "왕몽은(는) '문인화'의 대표적인 작가예요. 원말 4대가 중 한 사람으로, 산을 빽빽하게 채운 꼼꼼한 붓질이 특징이에요. 조맹부의 외손자예요."], ["화가 ‘심주’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["화조화", "우키요에", "인물화"], "중국", "심주은(는) '문인화'의 대표적인 작가예요. 명나라 쑤저우의 문인 화가로, '오파'를 연 사람이에요. 벼슬하지 않고 평생 그림과 시를 즐겼어요."], ["화가 ‘셋슈’과(와) 가장 관련 깊은 화풍(사조)은?", "수묵화", ["린파", "가노파", "화조화"], "일본", "셋슈은(는) '수묵화'의 대표적인 작가예요. 무로마치 시대의 선승 화가로, 명나라에 다녀와 일본 수묵화를 완성했어요."], ["화가 ‘하세가와 도하쿠’과(와) 가장 관련 깊은 화풍(사조)은?", "수묵화", ["화조화", "린파", "가노파"], "일본", "하세가와 도하쿠은(는) '수묵화'의 대표적인 작가예요. 모모야마 시대의 화가로, 안개 속 소나무를 먹으로만 그린 병풍으로 이름났어요."], ["화가 ‘가노 에이토쿠’과(와) 가장 관련 깊은 화풍(사조)은?", "가노파", ["문인화", "화조화", "린파"], "일본", "가노 에이토쿠은(는) '가노파'의 대표적인 작가예요. 가노파의 화가로, 오다 노부나가·도요토미 히데요시의 성을 금빛 장벽화로 꾸몄어요."], ["화가 ‘다와라야 소타쓰’과(와) 가장 관련 깊은 화풍(사조)은?", "린파", ["문인화", "우키요에", "산수화"], "일본", "다와라야 소타쓰은(는) '린파'의 대표적인 작가예요. 금빛 바탕에 대담한 색과 모양을 쓴 장식 화풍(린파)을 연 화가예요."], ["화가 ‘오가타 고린’과(와) 가장 관련 깊은 화풍(사조)은?", "린파", ["가노파", "산수화", "수묵화"], "일본", "오가타 고린은(는) '린파'의 대표적인 작가예요. 소타쓰의 화풍을 이어 '린파'라는 이름이 붙게 한 화가예요. 옷감·그릇 무늬도 디자인했어요."], ["화가 ‘이토 자쿠추’과(와) 가장 관련 깊은 화풍(사조)은?", "화조화", ["가노파", "문인화", "선종화"], "일본", "이토 자쿠추은(는) '화조화'의 대표적인 작가예요. 교토 의 화가일까요?", "중국 남송", ["중국 당", "중국 근대", "일본 에도 시대"], "중국", "양해(Liang Kai, 1140경~1210경) — 남송의 궁정 화가였지만 자리를 버리고 절에서 지냈어요. 몇 번의 붓질로 그린 거침없는 인물화가 유명해요."], ["‘목계’은(는) 어느 시대의 화가일까요?", "중국 남송", ["중국 당", "중국 명", "일본 모모야마 시대"], "중국", "목계(Muqi, 1210경~1269경) — 남송의 선승 화가로, 먹 하나로 사물의 본모습을 담았어요. 중국보다 일본에서 더 높이 평가받았어요."], ["‘조맹부’은(는) 어느 시대의 화가일까요?", "중국 원", ["중국 근대", "중국 남송", "일본 모모야마 시대"], "중국", "조맹부(Zhao Mengfu, 1254~1322) — 송나라 왕족 출신으로 원나라에서 벼슬한 서예가이자 화가예요. 그의 글씨체(송설체)는 고려·조선에도 큰 영향을 주었어요."], ["‘황공망’은(는) 어느 시대의 화가일까요?", "중국 원", ["중국 북송", "중국 당", "일본 무로마치 시대"], "중국", "황공망(Huang Gongwang, 1269~1354) — 원나라 말기 4대 화가(원말 4대가) 중 한 사람이에요. 몇 년에 걸쳐 그린 긴 두루마리는 불에 타 두 조각이 되었어요."], ["‘예찬’은(는) 어느 시대의 화가일까요?", "중국 원", ["중국 남송", "중국 동진", "일본 모모야마 시대"], "중국", "예찬(Ni Zan, 1301~1374) — 원말 4대가 중 한 사람으로, 텅 빈 강가에 나무 몇 그루와 빈 정자만 둔 쓸쓸하고 깨끗한 그림을 그렸어요."], ["‘왕몽’은(는) 어느 시대의 화가일까요?", "중국 원", ["중국 당", "중국 근대", "일본 에도 시대"], "중국", "왕몽(Wang Meng, 1308경~1385) — 원말 4대가 중 한 사람으로, 산을 빽빽하게 채운 꼼꼼한 붓질이 특징이에요. 조맹부의 외손자예요."], ["‘심주’은(는) 어느 시대의 화가일까요?", "중국 명", ["중국 당", "중국 원", "일본 무로마치 시대"], "중국", "심주(Shen Zhou, 1427~1509) — 명나라 쑤저우의 문인 화가로, '오파'를 연 사람이에요. 벼슬하지 않고 평생 그림과 시를 즐겼어요."], ["‘구영’은(는) 어느 시대의 화가일까요?", "중국 명", ["중국 남송", "중국 원", "일본 에도 시대"], "중국", "구영(Qiu Ying, 1494경~1552) — 명나라의 직업 화가로, 심주·문징명·당인과 함께 '명나라 4대가'로 꼽혀요. 화려하고 세밀한 그림을 그렸어요."], ["‘제백석’은(는) 어느 시대의 화가일까요?", "중국 근대", ["중국 명", "중국 동진", "일본 무로마치 시대"], "중국", "제백석(Qi Baishi, 1864~1957) — 목수 출신으로 그림을 익혀 중국 근대 최고의 화가가 되었어요. 투명하게 살아 움직이는 새우 그림이 유명해요."], ["‘서비홍’은(는) 어느 시대의 화가일까요?", "중국 근대", ["중국 북송", "중국 동진", "일본 에도 시대"], "중국", "서비홍(Xu Beihong, 1895~1953) — 프랑스에서 서양화를 배우고, 먹으로 힘차게 달리는 말을 그린 중국 근대 화가예요."], ["‘셋슈’은(는) 어느 시대의 화가일까요?", "일본 무로마치 시대", ["일본 에도 시대", "일본 모모야마 시대", "중국 남송"], "일본", "셋슈(Sesshū Tōyō, 1420~1506) — 무로마치 시대의 선승 화가로, 명나라에 다녀와 일본 수묵화를 완성했어요."], ["‘하세가와 도하쿠’은(는) 어느 시대의 화가일까요?", "일본 모모야마 시대", ["일본 에도 시대", "일본 무로마치 시대", "중국 동진"], "일본", "하세가와 도하쿠(Hasegawa Tōhaku, 1539~1610) — 모모야마 시대의 화가로, 안개 속 소나무를 먹으로만 그린 병풍으로 이름났어요."], ["‘가노 에이토쿠’은(는) 어느 시대의 화가일까요?" const lvOf = n => +(typeof LV === "string" && LV[n] || 2), lvCnt = l => D.filter((d, n) => lvOf(n) === l).length, bestKey = () => lv ? KEY + "-L" + lv : KEY;
best = ld(bestKey()) || 0;
function renderLv() {
  if (lv && lvCnt(lv) < 4) lv = 0;
  window.FG_MULT = LVM[lv]; window.FG_LV = lv ? LVN[lv].slice(3) : "";
  $("lvs").innerHTML = LVN.map((n, k) => `<button class="chip ${k === lv ? "on" : ""}" type="button" data-l="${k}" aria-pressed="${k === lv}">${n}${k ? `<small> ${lvCnt(k)}</small>` : ""}</button>`).join("");
  $("lvp").textContent = lv ? `${LVN[lv].slice(3)} 문제예요. 포인트가 ×${LVM[lv]}배로 쌓여요.` : "초급 ×1 · 중급 ×1.5 · 고급 ×2 포인트 (전체는 ×1)";
}
$("lvs").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b) { lv = +b.dataset.l; sv(LVK, lv); best = ld(bestKey()) || 0; start(); } });

function options(d) {                                   // 보기를 만든다: 정답 + 틀린 보기 (같은 분류의 다른 정답 중에서 자동으로 뽑기도 함)
  let wrong = d[2] && d[2].length ? d[2].slice(0, 3) : shuf(D.filter(x => x !== d && x[1] !== d[1] && (!d[3] || x[3] === d[3])).map(x => x[1])).filter((v, k, a) => a.indexOf(v) === k).slice(0, 3);
  return shuf([d[1], ...wrong]);
}
function start() {
  renderLv(); const pool = D.filter((d, n) => (!lv || lvOf(n) === lv) && !isFlag(d[0]) && (cat === "전체" || d[3] === cat)); /*GUARD*/ if (!pool.length && lv) { lv = 0; sv(LVK, lv); best = ld(bestKey()) || 0; return start(); }
  qs = shuf(pool).slice(0, ROUND).map(d => ({ d, opts: options(d) })); i = 0; score = 0; $("res").hidden = true;
  $("cats").hidden = CATS.length < 3; $("cats").innerHTML = CATS.map(c => `<button class="chip ${c === cat ? "on" : ""}" type="button" data-c="${c}" aria-pressed="${c === cat}">${c}</button>`).join(""); show();
}
function show() {
  const { d, opts } = qs[i]; locked = false; $("next").hidden = true;
  $("q").innerHTML = (LABEL || d[3] ? `<small>${esc(LABEL || d[3])}</small>` : "") + esc(d[0]);
  $("opts").className = "opts" + (opts.some(o => String(o).length > 9) ? " one" : "");
  $("opts").innerHTML = opts.map((o, k) => `<button class="opt" type="button" data-k="${k}">${esc(o)}</button>`).join("");
  $("no").textContent = (i + 1) + "/" + qs.length; $("score").textContent = score; $("best").textContent = best;
}
function pick(k) {
  if (locked) return; locked = true; const { d, opts } = qs[i]; if (opts[k] === d[1]) score++;
  document.querySelectorAll(".opt").forEach((b, n) => { b.disabled = true; if (opts[n] === d[1]) b.classList.add("ok"); else if (n === k) b.classList.add("bad"); });
  if (d[4]) $("q").insertAdjacentHTML("beforeend", `<span class="note">${esc(d[4])}</span>`);
  showFlag(d, opts[k]);
  $("score").textContent = score; $("next").textContent = i === qs.length - 1 ? "결과 보기" : "다음 문제"; $("next").hidden = false;
}
function finish() {
  const full = qs.length === ROUND; let note = ""; if (full && cat === "전체" && score > best) { best = score; sv(bestKey(), best); note = " 🏆 최고 기록이에요!"; }
  $("q").innerHTML = "끝!"; $("opts").innerHTML = ""; $("next").hidden = true;
  $("res").innerHTML = `<b>${qs.length}문제 중 ${score}개 정답</b><p class="muted">${score >= qs.length * .9 ? "박사님이시네요! 🎓" : score >= qs.length * .6 ? "잘했어요 👍" : "조금만 더 힘내요 💪"}${note}</p><button class="btn" id="again" type="button" style="margin-top:10px;width:100%">다시 하기</button>`;
  $("res").hidden = false; $("best").textContent = best; $("again").onclick = start;
}
$("opts").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) pick(+b.dataset.k); });
$("cats").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b) { cat = b.dataset.c; start(); } });
$("next").onclick = () => { if (i === qs.length - 1) finish(); else { i++; show(); } };
start();
</script>
