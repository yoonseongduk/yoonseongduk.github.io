<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로봇 길 안내</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(175 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(175 22% 86%);--accent:hsl(175 65% 46%);--accent-fg:#fff;--soft:hsl(175 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(175 22% 10%);--surface:hsl(175 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(175 16% 25%);--accent:hsl(175 75% 68%);--accent-fg:#10131c;--soft:hsl(175 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.rgrid{display:grid;gap:4px;background:var(--line);padding:4px;border-radius:12px;max-width:380px;margin:0 auto;width:100%}.rc{aspect-ratio:1;background:var(--surface);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:clamp(1.3rem,8vw,2rem)}.rc.w{background:var(--fg)}.prog{min-height:48px;display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}.prog span{font-size:1.3rem;padding:0 2px;border-radius:6px}.prog span.hl{background:var(--soft);outline:2px solid var(--accent)}.cmds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cmds button{padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.5rem}.rgrid + .prog{}
</style>
</head>
<body>
<main>
  <h1>로봇 길 안내 🤖</h1>
  <div class="stats"><div class="stat"><small>단계</small><b id="lv">1/8</b></div><div class="stat"><small>명령 수</small><b id="cnt">0</b></div><div class="stat"><small>별</small><b id="stars">0</b></div></div>
  <div class="rgrid" id="grid"></div>
  <div class="prog" id="prog"></div>
  <div class="cmds"><button type="button" data-c="U">⬆️</button><button type="button" data-c="D">⬇️</button><button type="button" data-c="L">⬅️</button><button type="button" data-c="R">➡️</button></div>
  <div class="row"><button class="btn ghost" id="undo" type="button">⌫ 한 칸 지우기</button><button class="btn" id="run" type="button">▶ 실행</button></div>
  <p class="center" id="msg" style="min-height:1.5em;font-weight:700"></p>
  <button class="btn" id="next" type="button" hidden>다음 단계</button>
  <p class="muted">로봇이 ⭐까지 가도록 <b>명령(⬆️⬇️⬅️➡️)을 차례로 눌러</b> 순서를 만든 뒤 ▶ 실행을 누르세요. 벽(⬛)에 부딪히면 제자리에 멈춰요. 명령은 적을수록 별을 많이 받아요!</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "robotpath-v1";
// 맵: S 시작, G 별, # 벽, . 길. 최소 명령 수는 계산해서 별 개수를 정한다
const MAPS = [
 ["S..", "...", "..G"], ["S.#.", "..#.", "...G"], ["S...", ".##.", "...G"], ["S.#..", "..#.#", "....G"],
 ["S.#...", "..#.#.", "....#G", "###..."], ["S....", "####.", "....G"], ["S#...", ".#.#.", ".#.#.", "...#G"], ["S.....", ".####.", ".#..#.", ".#G##.", "......"]];
let lv = 0, prog = [], pos = [0, 0], grid = [], running = false, stars = ld(KEY) || 0, tempo = 1, best = 0, token = 0;
const DIR = { U: [-1, 0], D: [1, 0], L: [0, -1], R: [0, 1] }, ARROW = { U: "⬆️", D: "⬇️", L: "⬅️", R: "➡️" };
function bfs(m) { let s, g; m.forEach((row, r) => [...row].forEach((c, k) => { if (c === "S") s = [r, k]; if (c === "G") g = [r, k]; })); const q = [[s, 0]], seen = new Set([s + ""]); while (q.length) { const [[r, c], d] = q.shift(); if (r === g[0] && c === g[1]) return d; for (const [dr, dc] of Object.values(DIR)) { let nr = r, nc = c; while (nr + dr >= 0 && nr + dr < m.length && nc + dc >= 0 && nc + dc < m[0].length && m[nr + dr][nc + dc] !== "#") { nr += dr; nc += dc; break; } if (!seen.has([nr, nc] + "")) { seen.add([nr, nc] + ""); q.push([[nr, nc], d + 1]); } } } return 99; }
function load(l) { lv = l; grid = MAPS[l].map(r => [...r]); grid.forEach((row, r) => row.forEach((c, k) => { if (c === "S") pos = [r, k]; })); prog = []; running = false; token++; $("msg").textContent = ""; $("next").hidden = true; $("run").disabled = false; best = bfs(MAPS[l]); render(); }
function render(hl = -1) {
  $("grid").style.gridTemplateColumns = `repeat(${grid[0].length}, 1fr)`;
  $("grid").innerHTML = grid.map((row, r) => row.map((c, k) => `<div class="rc${c === "#" ? " w" : ""}">${r === pos[0] && k === pos[1] ? "🤖" : c === "G" ? "⭐" : ""}</div>`).join("")).join("");
  $("prog").innerHTML = prog.length ? prog.map((c, k) => `<span class="${k === hl ? "hl" : ""}">${ARROW[c]}</span>`).join("") : '<span class="muted">명령을 눌러 순서를 만들어 보세요</span>';
  $("lv").textContent = (lv + 1) + "/" + MAPS.length; $("cnt").textContent = prog.length; $("stars").textContent = stars;
}
const sleep = ms => new Promise(r => setTimeout(r, ms * tempo));
async function run() {
  if (running || !prog.length) return; running = true; const my = ++token; $("run").disabled = true; let reset = MAPS[lv].map(r => [...r]); grid.forEach((row, r) => row.forEach((c, k) => { if (c === "S") pos = [r, k]; }));
  for (let k = 0; k < prog.length; k++) { if (my !== token) return; const [dr, dc] = DIR[prog[k]], nr = pos[0] + dr, nc = pos[1] + dc; if (nr >= 0 && nr < grid.length && nc >= 0 && nc < grid[0].length && grid[nr][nc] !== "#") pos = [nr, nc]; render(k); await sleep(350); if (grid[pos[0]][pos[1]] === "G") break; }
  running = false; $("run").disabled = false; render();
  if (grid[pos[0]][pos[1]] === "G") { const n = prog.length, got = n <= best ? 3 : n <= best + 2 ? 2 : 1; stars += got; sv(KEY, stars); $("msg").textContent = `🎉 도착! ${"⭐".repeat(got)} (최소 ${best}개)`; $("stars").textContent = stars; if (lv < MAPS.length - 1) $("next").hidden = false; else $("msg").textContent += " 모든 단계를 끝냈어요!"; }
  else { $("msg").textContent = "아직 도착하지 못했어요. 명령을 고쳐 다시 해 보세요."; grid.forEach((row, r) => row.forEach((c, k) => { if (c === "S") pos = [r, k]; })); render(); }
}
document.querySelector(".cmds").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b && !running && prog.length < 30) { prog.push(b.dataset.c); render(); } });
$("undo").onclick = () => { if (!running) { prog.pop(); render(); } }; $("run").onclick = run; $("next").onclick = () => load(lv + 1); load(0);
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
