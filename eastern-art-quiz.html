*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts.one{grid-template-columns:1fr}

는 나귀를 끌어당기는 아이를 그린 그림이 알려져 있어요."], ["‘이정’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["인도", "일본", "중국"], "조선 초·중기", "이정(Yi Jeong, 1554~1626) — 세종의 현손인 왕족 화가로, 조선 최고의 대나무 그림(묵죽) 화가로 꼽혀요. 바람 맞는 대나무 그림이 오만 원권 뒷면에 실려 있어요."], ["‘어몽룡’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["인도", "일본", "중국"], "조선 초·중기", "어몽룡(Eo Mong-ryong, 1566~?) — 매화 그림에 뛰어난 화가예요. 달빛 아래 매화 그림이 오만 원권 뒷면에 실려 있어요."], ["‘김명국’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["일본", "인도", "중국"], "조선 초·중기", "김명국(Kim Myeong-guk, 1600~?) — 술을 좋아해 '취옹'이라고도 했고, 거침없는 붓질로 그린 그림이 유명해요. 조선 통신사를 따라 일본에도 다녀왔어요."], ["‘윤두서’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["일본", "중국", "인도"], "조선 후기", "윤두서(Yun Du-seo, 1668~1715) — 정약용의 외증조부로, 수염 한 올까지 살려 그린 자화상과 서민의 모습을 담은 그림을 남겼어요."], ["‘정선’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["인도", "일본", "중국"], "조선 후기", "정선(Jeong Seon, 1676~1759) — 중국풍이 아니라 우리 땅의 실제 경치를 그린 '진경산수화'를 완성한 화가예요."], ["‘심사정’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["인도", "일본", "중국"], "조선 후기", "심사정(Sim Sa-jeong, 1707~1769) — 정선에게 그림을 배웠고, 중국 남종화의 화풍을 우리 식으로 소화한 화가예요."], ["‘강세황’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["중국", "인도", "일본"], "조선 후기", "강세황(Kang Se-hwang, 1713~1791) — 김홍도의 스승으로 이름난 선비 화가이자 그림 평론가예요. 서양식 원근법을 써 본 그림도 남겼어요."], ["‘최북’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["인도", "일본", "중국"], "조선 후기", "최북(Choe Buk, 1712~1786경) — 이름 '북(北)'을 둘로 나눠 '칠칠'이라고도 불렀어요. 성격이 괴팍해 스스로 한쪽 눈을 찔렀다는 일화가 전해져요."], ["‘변상벽’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["일본", "중국", "인도"], "조선 후기", "변상벽(Byeon Sang-byeok, 18세기) — 고양이와 닭을 아주 잘 그려 '변고양이'라는 별명이 붙은 화원 화가예요."], ["‘김홍도’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["중국", "일본", "인도"], "조선 후기", "김홍도(Kim Hong-do, 1745~?) — 서민의 일상을 익살스럽고 따뜻하게 그린 조선 후기의 화가예요. 산수·신선·호랑이 그림에도 뛰어났어요."], ["‘신윤복’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["일본", "중국", "인도"], "조선 후기", "신윤복(Sin Yun-bok, 1758~?) — 양반과 기녀의 풍류, 여인의 맵시를 섬세하고 화려한 색으로 그린 화가예요."], ["‘김득신’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["인도", "일본", "중국"], "조선 후기", "김득신(Kim Deuk-sin, 1754~1822) — 김홍도의 영향을 받아 생생한 풍속화를 그린 화원이에요. 고양이가 병아리를 물고 달아나는 장면이 유명해요."], ["‘이인문’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["인도", "중국", "일본"], "조선 후기", "이인문(Yi In-mun, 1745~1821) — 김홍도와 같은 해에 태어난 화원으로, 끝없이 이어지는 산과 강을 긴 두루마리에 그렸어요."], ["‘김정희’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["일본", "인도", "중국"], "조선 말기", "김정희(Kim Jeong-hui, 1786~1856) — 독특한 글씨체(추사체)와 그림을 남긴 학자이자 서예가예요. 제주도로 유배되었을 때 제자에게 그림을 그려 주었어요."], ["‘조희룡’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["중국", "일본", "인도"], "조선 말기", "조희룡(Jo Hui-ryong, 1789~1866) — 김정희의 제자로, 매화를 특히 좋아해 매화 핀 집에서 책 읽는 선비를 그렸어요."], ["‘이하응’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["중국", "일본", "인도"], "조선 말기", "이하응(Yi Ha-eung, 1820~1898) — 고종의 아버지인 흥선대원군이에요. 난초 그림으로 이름나 그의 난초를 '석파란'이라 불렀어요."], ["‘장승업’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["중국", "인도", "일본"], "조선 말기", "장승업(Jang Seung-eop, 1843~1897) — 고아로 자라 어깨너머로 그림을 익혔지만 조선 말기 최고의 화가가 되었어요. 단원·혜원과 함께 '삼원'으로 불려요."], ["‘안중식’은(는) 어느 나라의 화가일까요?", "한국(조선)", ["인도", "중국", "일본"], "조선 말기", "안중식(An Jung-sik, 1861~1919) — 장승업에게 그림을 배우고, 조선 말기에서 근대로 넘어가는 때에 많은 제자를 길렀어요."], ["‘고개지’은(는) 어느 나라의 화가일까요?", "중국", ["한국(조선)", "인도", "일본"], "중국", "고개지(Gu Kaizhi, 344경~406경) — 동진의 화가로, 중국 인물화의 아버지라 불려요. 인물의 정신은 눈동자에 담긴다고 여겼다고 전해져요."], ["‘한황’은(는) 어느 나라의 화가일까요?", "중국", ["한국(조선)", "인도", "일본"], "중국", "한황(Han Huang, 723~787) — 당나라의 높은 관리이자 화가로, 소를 아주 잘 그렸어요. 그의 소 그림은 남아 있는 가장 오래된 종이 그림 가운데 하나예요."], ["‘범관’은(는) 어느 나라의 화가일까요?", "중국", ["인도", "일본", "한국(조선)"], "중국", "범관(Fan Kuan, 950경~1032경) — 북송 초기의 산수화가로, 거대한 산이 화면을 꽉 채우는 웅장한 그림을 그렸어요."], ["‘곽희’은(는) 어느 나라의 화가일까요?", "중국", ["한국(조선)", "일본", "인도"], "중국", "곽희(Guo Xi, 1020경~1090경) — 북송의 궁정 화가로, 산을 올려다보고·들여다보고·멀리 바라보는 '삼원법'을 정리했어요."], ["‘장택단’은(는) 어느 나라의 화가일까요?", "중국", ["일본", "한국(조선)", "인도"], "중국", "장택단(Zhang Zeduan, 1085~1145) — 북송의 화가로, 수도 카이펑의 북적이는 거리와 사람들을 긴 두루마리에 담았어요."], ["‘휘종’은(는) 어느 나라의 화가일까요?", "중국", ["한국(조선)", "인도", "일본"], "중국", "휘종(Emperor Huizong, 1082~1135) — 북송의 황제로, 나랏일보다 그림·글씨에 빠졌던 예술가 황제예요. 가늘고 날카로운 '수금체' 글씨를 만들었어요."], ["‘마원’은(는) 어느 나라의 화가일까요?", "중국", ["일본", "한국(조선)", "인도"], "중국", "마원(Ma Yuan, 1160경~1225경) — 남송의 궁정 화가로, 경치를 화면 한쪽 구석에 모으고 나머지를 비워 '마일각(마씨의 한 모서리)'이라 불렸어요."], ["‘양해’은(는) 어느 나라의 화가일까요?", "중국", ["일본", "인도", "한국(조선)"], "중국", "양해(Liang Kai, 1140경~1210경) — 남송의 궁정 화가였지만 자리를 버리고 절에서 지냈어요. 몇 번의 붓질로 그린 거침없는 인물화가 유명해요."], ["‘목계’은(는) 어느 나라의 화가일까요?", "중국", ["한국(조선)", "인도", "일본"], "중국", "목계(Muqi, 1210경~1269경) — 남송의 선승 화가로, 먹 하나로 사물의 본모습을 담았어요. 중국보다 일본에서 더 높이 평가받았어요."], ["‘조맹부’은(는) 어느 나라의 화가일까요?", "중국", ["일본", "한국(조선)", "인도"], "중국", "조맹부(Zhao Mengfu, 1254~1322) — 송나라 왕족 출신으로 원나라에서 벼슬한 서예가이자 화가예요. 그의 글씨체(송설체)는 고려·조선에도 큰 영향을 주었어요."], ["‘황공망’은(는) 어느 나라의 화가일까요?", "중국", ["한국(조선)", "일본", "인도"], "중국", "황공망(Huang Gongwang, 1269~1354) — 원나라 말기 4대 화가(원말 4대가) 중 한 사람이에요. 몇 년에 걸쳐 그린 긴 두루마리는 불에 타 두 조각이 되었어요."], ["‘예찬’은(는) 어느 나라의 화가일까요?", "중국", ["일본", "인도", "한국(조선)"], "중국", "예찬(Ni Zan, 1301~1374) — 원말 4대가 중 한 사람으로, 텅 빈 강가에 나무 몇 그루와 빈 정자만 둔 쓸쓸하고 깨끗한 그림을 그렸어요."], ["‘왕몽’은(는) 어느 나라의 화가일까요?", "중국", ["일본", "인도", "한국(조선)"], "중국", "왕몽(Wang Meng, 1308경~1385) — 원말 4대가 중 한 사람으로, 산을 빽빽하게 채운 꼼꼼한 붓질이 특징이에요. 조맹부의 외손자예요."], ["‘심주’은(는) 어느 나라의 화가일까요?", "중국", ["인도", "일본", "한국(조선)"], "중국", "심주(Shen Zhou, 1427~1509) — 명나라 쑤저우의 문인 화가로, '오파'를 연 사람이에요. 벼슬하지 않고 평생 그림과 시를 즐겼어요."], ["‘구영’은(는) 어느 나라의 화가일까요?", "중국", ["일본", "한국(조선)", "인도"], "중국", "구영(Qiu Ying, 1494경~1552) — 명나라의 직업 화가로, 심주·문징명·당인과 함께 '명나라 4대가'로 꼽혀요. 화려하고 세밀한 그림을 그렸어요."], ["‘제백석’은(는) 어느 나라의 화가일까요?", "중국", ["한국(조선)", "일본", "인도"], "중국", "제백석(Qi Baishi, 1864~1957) — 목수 출신으로 그림을 익혀 중국 근대 최고의 화가가 되었어요. 투명하게 살아 움직이는 새우 그림이 유명해요."], ["‘서비홍’은(는) 어느 나라의 화가일까요?", "중국", ["한국(조선)", "인도", "일본"], "중국", "서비홍(Xu Beihong, 1895~1953) — 프랑스에서 서양화를 배우고, 먹으로 힘차게 달리는 말을 그린 중국 근대 화가예요."], ["‘셋슈’은(는) 어느 나라의 화가일까요?", "일본", ["중국", "한국(조선)", "인도"], "일본", "셋슈(Sesshū Tōyō, 1420~1506) — 무로마치 시대의 선승 화가로, 명나라에 다녀와 일본 수묵화를 완성했어요."], ["‘하세가와 도하쿠’은(는) 어느 나라의 화가일까요?", "일본", ["인도", "중국", "한국(조선)"], "일본", "하세가와 도하쿠(Hasegawa Tōhaku, 1539~1610) — 모모야마 시대의 화가로, 안개 속 소나무를 먹으로만 그린 병풍으로 이름났어요."], ["‘가노 에이토쿠’은(는) 어느 나라의 화가일까요?", "일본", ["한국(조선)", "중국", "인도"], "일본", "가노 에이토쿠(Kanō Eitoku, 1543~1590) — 가노파의 화가로, 오다 노부나가·도요토미 히데요시의 성을 금빛 장벽화로 꾸몄어요."], ["‘다와라야 소타쓰’은(는) 어느 나라의 화가일까요?", "일본", ["한국(조선)", "중국", "인도"], "일본", "다와라야 소타쓰(Tawaraya Sōtatsu, 17세기 초) — 금빛 바탕에 대담한 색과 모양을 쓴 장식 화풍(린파)을 연 화가예요."], ["‘오가타 고린’은(는) 어느 나라의 화가일까요?", "일본", ["인도", "한국(조선)", "중국"], "일본", "오가타 고린(Ogata Kōrin, 1658~1716) — 소타쓰의 화풍을 이어 '린파'라는 이름이 붙게 한 화가예요. 옷감·그릇 무늬도 디자인했어요."], ["‘이토 자쿠추’은(는) 어느 나라의 화가일까요?", "일본", ["인도", "중국", "한국(조선)"], "일본", "이토 자쿠추(Itō Jakuchū, 1716~1800) — 교토의 채소 도매상 주인이었다가 화가가 되었어요. 닭과 꽃·새를 아주 화려하고 세밀하게 그렸어요."], ["‘마루야마 오쿄’은(는) 어느 나라의 화가일까요?", "일본", ["중국", "인도", "한국(조선)"], "일본", "마루야마 오쿄(Maruyama Ōkyo, 1733~1795) — 자연을 직접 보고 그리는 사생을 중시한 화가로, 마루야마파를 열었어요."], ["‘기타가와 우타마로’은(는) 어느 나라의 화가일까요?", "일본", ["중국", "한국(조선)", "인도"], "일본", "기타가와 우타마로(Kitagawa Utamaro, 1753경~1806) — 여인의 얼굴을 크게 그린 미인화 판화로 이름난 우키요에 화가예요."], ["‘도슈사이 샤라쿠’은(는) 어느 나라의 화가일까요?", "일본", ["인도", "중국", "한국(조선)"], "일본", "도슈사이 샤라쿠(Tōshūsai Sharaku, 18세기 말) — 1794~1795년 열 달 남짓 가부키 배우 그림만 내고 사라진 수수께끼의 우키요에 화가예요."], ["‘가쓰시카 호쿠사이’은(는) 어느 나라의 화가일까요?", "일본", ["한국(조선)", "인도", "중국"], "일본", "가쓰시카 호쿠사이(Katsushika Hokusai, 1760~1849) — 일본 에도 시대의 풍속 판화(우키요에) 화가로, 유럽의 인상파에도 큰 영향을 주었어요."], ["‘우타가와 히로시게’은(는) 어느 나라의 화가일까요?", "일본", ["한국(조선)", "중국", "인도"], "일본", "우타가와 히로시게(Utagawa Hiroshige, 1797~1858) — 여행길의 풍경과 비·눈 같은 날씨를 서정적으로 담은 풍경 판화로 유명해요. 고흐가 그의 판화를 따라 그렸어요."], ["화가 ‘안견’과(와) 가장 관련 깊은 화풍(사조)은?", "산수화", ["우키요에", "린파", "풍속화"], "조선 초·중기", "안견은(는) '산수화'의 대표적인 작가예요. 조선 초기 최고의 화가예요. 안평대군이 꾼 복숭아꽃 마을의 꿈을 그림으로 옮겼어요."], ["화가 ‘강희안’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["화조화", "인물화", "린파"], "조선 초·중기", "강희안은(는) '문인화'의 대표적인 작가예요. 시·글씨·그림에 모두 뛰어났던 조선 초기의 선비 화가예요. 바위에 엎드려 물을 바라보는 선비를 그렸어요."], ["화가 ‘이상좌’과(와) 가장 관련 깊은 화풍(사조)은?", "산수화", ["풍속화", "우키요에", "가노파"], "조선 초·중기", "이상좌은(는) '산수화'의 대표적인 작가예요. 노비 출신이었지만 그림 실력을 인정받아 나라의 화원이 되었다고 전해져요."], ["화가 ‘이정’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["린파", "인물화", "풍속화"], "조선 초·중기", "이정은(는) '문인화'의 대표적인 작가예요. 세종의 현손인 왕족 화가로, 조선 최고의 대나무 그림(묵죽) 화가로 꼽혀요. 바람 맞는 대나무 그림이 오만 원권 뒷면에 실려 있어요."], ["화가 ‘어몽룡’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["가노파", "우키요에", "풍속화"], "조선 초·중기", "어몽룡은(는) '문인화'의 대표적인 작가예요. 매화 그림에 뛰어난 화가예요. 달빛 아래 매화 그림이 오만 원권 뒷면에 실려 있어요."], ["화가 ‘정선’과(와) 가장 관련 깊은 화풍(사조)은?", "진경산수화", ["린파", "인물화", "화조화"], "조선 후기", "정선은(는) '진경산수화'의 대표적인 작가예요. 중국풍이 아니라 우리 땅의 실제 경치를 그린 '진경산수화'를 완성한 화가예요."], ["화가 ‘심사정’과(와) 가장 관련 깊은 화풍(사조)은?", "남종화", ["화조화", "인물화", "린파"], "조선 후기", "심사정은(는) '남종화'의 대표적인 작가예요. 정선에게 그림을 배웠고, 중국 남종화의 화풍을 우리 식으로 소화한 화가예요."], ["화가 ‘강세황’과(와) 가장 관련 깊은 화풍(사조)은?", "남종화", ["린파", "우키요에", "가노파"], "조선 후기", "강세황은(는) '남종화'의 대표적인 작가예요. 김홍도의 스승으로 이름난 선비 화가이자 그림 평론가예요. 서양식 원근법을 써 본 그림도 남겼어요."], ["화가 ‘김홍도’과(와) 가장 관련 깊은 화풍(사조)은?", "풍속화", ["인물화", "선종화", "진경산수화"], "조선 후기", "김홍도은(는) '풍속화'의 대표적인 작가예요. 서민의 일상을 익살스럽고 따뜻하게 그린 조선 후기의 화가예요. 산수·신선·호랑이 그림에도 뛰어났어요."], ["화가 ‘신윤복’과(와) 가장 관련 깊은 화풍(사조)은?", "풍속화", ["남종화", "문인화", "가노파"], "조선 후기", "신윤복은(는) '풍속화'의 대표적인 작가예요. 양반과 기녀의 풍류, 여인의 맵시를 섬세하고 화려한 색으로 그린 화가예요."], ["화가 ‘김득신’과(와) 가장 관련 깊은 화풍(사조)은?", "풍속화", ["우키요에", "수묵화", "문인화"], "조선 후기", "김득신은(는) '풍속화'의 대표적인 작가예요. 김홍도의 영향을 받아 생생한 풍속화를 그린 화원이에요. 고양이가 병아리를 물고 달아나는 장면이 유명해요."], ["화가 ‘이인문’과(와) 가장 관련 깊은 화풍(사조)은?", "산수화", ["화조화", "우키요에", "풍속화"], "조선 후기", "이인문은(는) '산수화'의 대표적인 작가예요. 김홍도와 같은 해에 태어난 화원으로, 끝없이 이어지는 산과 강을 긴 두루마리에 그렸어요."], ["화가 ‘김정희’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["화조화", "우키요에", "가노파"], "조선 말기", "김정희은(는) '문인화'의 대표적인 작가예요. 독특한 글씨체(추사체)와 그림을 남긴 학자이자 서예가예요. 제주도로 유배되었을 때 제자에게 그림을 그려 주었어요."], ["화가 ‘조희룡’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["가노파", "화조화", "린파"], "조선 말기", "조희룡은(는) '문인화'의 대표적인 작가예요. 김정희의 제자로, 매화를 특히 좋아해 매화 핀 집에서 책 읽는 선비를 그렸어요."], ["화가 ‘이하응’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["인물화", "우키요에", "풍속화"], "조선 말기", "이하응은(는) '문인화'의 대표적인 작가예요. 고종의 아버지인 흥선대원군이에요. 난초 그림으로 이름나 그의 난초를 '석파란'이라 불렀어요."], ["화가 ‘안중식’과(와) 가장 관련 깊은 화풍(사조)은?", "산수화", ["화조화", "인물화", "린파"], "조선 말기", "안중식은(는) '산수화'의 대표적인 작가예요. 장승업에게 그림을 배우고, 조선 말기에서 근대로 넘어가는 때에 많은 제자를 길렀어요."], ["화가 ‘고개지’과(와) 가장 관련 깊은 화풍(사조)은?", "인물화", ["화조화", "진경산수화", "우키요에"], "중국", "고개지은(는) '인물화'의 대표적인 작가예요. 동진의 화가로, 중국 인물화의 아버지라 불려요. 인물의 정신은 눈동자에 담긴다고 여겼다고 전해져요."], ["화가 ‘범관’과(와) 가장 관련 깊은 화풍(사조)은?", "산수화", ["화조화", "우키요에", "린파"], "중국", "범관은(는) '산수화'의 대표적인 작가예요. 북송 초기의 산수화가로, 거대한 산이 화면을 꽉 채우는 웅장한 그림을 그렸어요."], ["화가 ‘곽희’과(와) 가장 관련 깊은 화풍(사조)은?", "산수화", ["가노파", "풍속화", "우키요에"], "중국", "곽희은(는) '산수화'의 대표적인 작가예요. 북송의 궁정 화가로, 산을 올려다보고·들여다보고·멀리 바라보는 '삼원법'을 정리했어요."], ["화가 ‘휘종’과(와) 가장 관련 깊은 화풍(사조)은?", "화조화", ["가노파", "남종화", "진경산수화"], "중국", "휘종은(는) '화조화'의 대표적인 작가예요. 북송의 황제로, 나랏일보다 그림·글씨에 빠졌던 예술가 황제예요. 가늘고 날카로운 '수금체' 글씨를 만들었어요."], ["화가 ‘마원’과(와) 가장 관련 깊은 화풍(사조)은?", "산수화", ["화조화", "가노파", "인물화"], "중국", "마원은(는) '산수화'의 대표적인 작가예요. 남송의 궁정 화가로, 경치를 화면 한쪽 구석에 모으고 나머지를 비워 '마일각(마씨의 한 모서리)'이라 불렸어요."], ["화가 ‘양해’과(와) 가장 관련 깊은 화풍(사조)은?", "선종화", ["화조화", "가노파", "인물화"], "중국", "양해은(는) '선종화'의 대표적인 작가예요. 남송의 궁정 화가였지만 자리를 버리고 절에서 지냈어요. 몇 번의 붓질로 그린 거침없는 인물화가 유명해요."], ["화가 ‘목계’과(와) 가장 관련 깊은 화풍(사조)은?", "선종화", ["인물화", "화조화", "린파"], "중국", "목계은(는) '선종화'의 대표적인 작가예요. 남송의 선승 화가로, 먹 하나로 사물의 본모습을 담았어요. 중국보다 일본에서 더 높이 평가받았어요."], ["화가 ‘조맹부’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["우키요에", "가노파", "인물화"], "중국", "조맹부은(는) '문인화'의 대표적인 작가예요. 송나라 왕족 출신으로 원나라에서 벼슬한 서예가이자 화가예요. 그의 글씨체(송설체)는 고려·조선에도 큰 영향을 주었어요."], ["화가 ‘황공망’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["풍속화", "인물화", "화조화"], "중국", "황공망은(는) '문인화'의 대표적인 작가예요. 원나라 말기 4대 화가(원말 4대가) 중 한 사람이에요. 몇 년에 걸쳐 그린 긴 두루마리는 불에 타 두 조각이 되었어요."], ["화가 ‘예찬’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["가노파", "인물화", "풍속화"], "중국", "예찬은(는) '문인화'의 대표적인 작가예요. 원말 4대가 중 한 사람으로, 텅 빈 강가에 나무 몇 그루와 빈 정자만 둔 쓸쓸하고 깨끗한 그림을 그렸어요."], ["화가 ‘왕몽’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["풍속화", "화조화", "우키요에"], "중국", "왕몽은(는) '문인화'의 대표적인 작가예요. 원말 4대가 중 한 사람으로, 산을 빽빽하게 채운 꼼꼼한 붓질이 특징이에요. 조맹부의 외손자예요."], ["화가 ‘심주’과(와) 가장 관련 깊은 화풍(사조)은?", "문인화", ["화조화", "린파", "가노파"], "중국", "심주은(는) '문인화'의 대표적인 작가예요. 명나라 쑤저우의 문인 화가로, '오파'를 연 사람이에요. 벼슬하지 않고 평생 그림과 시를 즐겼어요."], ["화가 ‘셋슈’과(와) 가장 관련 깊은 화풍(사조)은?", "수묵화", ["인물화", "풍속화", "가노파"], "일본", "셋슈은(는) '수묵화'의 대표적인 작가예요. 무로마치 시대의 선승 화가로, 명나라에 다녀와 일본 수묵화를 완성했어요."], ["화가 ‘하세가와 도하쿠’과(와) 가장 관련 깊은 화풍(사조)은?", "수묵화", ["풍속화", "화조화", "가노파"], "일본", "하세가와 도하쿠은(는) '수묵화'의 대표적인 작가예요. 모모야마 시대의 화가로, 안개 속 소나무를 먹으로만 그린 병풍으로 이름났어요."], ["화가 ‘가노 에이토쿠’과(와) 가장 관련 깊은 화풍(사조)은?", "가노파", ["화조화", "린파", "문인화"], "일본", "가노 에이토쿠은(는) '가노파'의 대표적인 작가예요. 가노파의 화가로, 오다 노부나가·도요토미 히데요시의 성을 금빛 장벽화로 꾸몄어요."], ["화가 ‘다와라야 소타쓰’과 인물화의 아버지라 불려요. 인물의 정신은 눈동자에 담긴다고 여겼다고 전해져요."], ["‘한황’은(는) 어느 시대의 화가일까요?", "중국 당", ["중국 남송", "중국 북송", "일본 모모야마 시대"], "중국", "한황(Han Huang, 723~787) — 당나라의 높은 관리이자 화가로, 소를 아주 잘 그렸어요. 그의 소 그림은 남아 있는 가장 오래된 종이 그림 가운데 하나예요."], ["‘범관’은(는) 어느 시대의 화가일까요?", "중국 북송", ["중국 당", "중국 명", "조선 말기"], "중국", "범관(Fan Kuan, 950경~1032경) — 북송 초기의 산수화가로, 거대한 산이 화면을 꽉 채우는 웅장한 그림을 그렸어요."], ["‘곽희’은(는) 어느 시대의 화가일까요?", "중국 북송", ["중국 근대", "중국 원", "일본 모모야마 시대"], "중국", "곽희(Guo Xi, 1020경~1090경) — 북송의 궁정 화가로, 산을 올려다보고·들여다보고·멀리 바라보는 '삼원법'을 정리했어요."], ["‘장택단’은(는) 어느 시대의 화가일까요?", "중국 북송", ["중국 근대", "조선 초·중기", "일본 에도 시대"], "중국", "장택단(Zhang Zeduan, 1085~1145) — 북송의 화가로, 수도 카이펑의 북적이는 거리와 사람들을 긴 두루마리에 담았어요."], ["‘휘종’은(는) 어느 시대의 화가일까요?", "중국 북송", ["중국 원", "중국 남송", "일본 에도 시대"], "중국", "휘종(Emperor Huizong, 1082~1135) — 북송의 황제로, 나랏일보다 그림·글씨에 빠졌던 예술가 황제예요. 가늘고 날카로운 '수금체' 글씨를 만들었어요."], ["‘마원’은(는) 어느 시대의 화가일까요?", "중국 남송", ["중국 원", "중국 명", "일본 무로마치 시대"], "중국", "마원(Ma Yuan, 1160경~1225경) — 남송의 궁정 화가로, 경치를 화면 한쪽 구석에 모으고 나머지를 비워 '마일각(마씨의 한 모서리)'이라 불렸어요."], ["‘양해’은(는) 어느 시대의 화가일까요?", "중국 남송", ["중국 동진", "중국 원", "조선 말기"], "중국", "양해(Liang Kai, 1140경~1210경) — 남송의 궁정 화가였지만 자리를 버리고 절에서 지냈어요. 몇 번의 붓질로 그린 거침없는 인물화가 유명해요."], ["‘목계’은(는) 어느 시대의 화가일까요?", "중국 남송", ["중국 원", "중국 북송", "조선 초·중기"], "중국", "목계(Muqi, 1210경~1269경) — 남송의 선승 화가로, 먹 하나로 사물의 본모습을 담았어요. 중국보다 일본에서 더 높이 평가받았어요."], ["‘조맹부’은(는) 어느 시대의 화가일까요?", "중국 원", ["중국 북송", "중국 명", "일본 무로마치 시대"], "중국", "조맹부(Zhao Mengfu, 1254~1322) — 송나라 왕족 출신으로 원나라에서 벼슬한 서예가이자 화가예요. 그의 글씨체(송설체)는 고려·조선에도 큰 영향을 주었어요."], ["‘황공망’은(는) 어느 시대의 화가일까요?", "중국 원", ["중국 남송", "중국 북송", "조선 초·중기"], "중국", "황공망(Huang Gongwang, 1269~1354) — 원나라 말기 4대 화가(원말 4대가) 중 한 사람이에요. 몇 년에 걸쳐 그린 긴 두루마리는 불에 타 두 조각이 되었어요."], ["‘예찬’은(는) 어느 시대의 화가일까요?", "중국 원", ["중국 남송", "중국 당", "일본 모모야마 시대"], "중국", "예찬(Ni Zan, 1301~1374) — 원말 4대가 중 한 사람으로, 텅 빈 강가에 나무 몇 그루와 빈 정자만 둔 쓸쓸하고 깨끗한 그림을 그렸어요."], ["‘왕몽’은(는) 어느 시대의 화가일까요?", "중국 원", ["중국 근대", "중국 북송", "조선 후기"], "중국", "왕몽(Wang Meng, 1308경~1385) — 원말 4대가 중 한 사람으로, 산을 빽빽하게 채운 꼼꼼한 붓질이 특징이에요. 조맹부의 외손자예요."], ["‘심주’은(는) 어느 시대의 화가일까요?", "중국 명", ["중국 원", "중국 근대", "일본 에도 시대"], "중국", "심주(Shen Zhou, 1427~1509) — 명나라 쑤저우의 문인 화가로, '오파'를 연 사람이에요. 벼슬하지 않고 평생 그림과 시를 즐겼어요."], ["‘구영’은(는) 어느 시대의 화가일까요?", "중국 명", ["중국 북송", "중국 동진", "조선 후기"], "중국", "구영(Qiu Ying, 1494경~1552) — 명나라의 직업 화가로, 심주·문징명·당인과 함께 '명나라 4대가'로 꼽혀요. 화려하고 세밀한 그림을 그렸어요."], ["‘제백석’은(는) 어느 시대의 화가일까요?", "중국 근대", ["중국 당", "중국 명", "일본 무로마치 시대"], "중국", "제백석(Qi Baishi, 1864~1957) — 목수 출신으로 그림을 익혀 중국 근대 최고의 화가가 되었어요. 투명하게 살아 움직이는 새우 그림이 유명해요."], ["‘서비홍’은(는) 어느 시대의 화가일까요?", "중국 근대", ["중국 북송", "중국 원", "일본 모모야마 시대"], "중국", "서비홍(Xu Beihong, 1895~1953) — 프랑스에서 서양화를 배우고, 먹으로 힘차게 달리는 말을 그린 중국 근대 화가예요."], ["‘셋슈’은(는) 어느 시대의 화가일까요?", "일본 무로마치 시대", ["일본 에도 시대", "일본 모모야마 시대", "중국 명"], "일본", "셋슈(Sesshū Tōyō, 1420~1506) — 무로마치 시대의 선승 화가로, 명나라에 다녀와 일본 수묵화를 완성했어요."], ["‘하세가와 도하쿠’은(는) 어느 시대의 화가일까요?", "일본 모모야마 시대", ["일본 에도 시대", "일본 무로마치 시대", "중국 당"], "일본", "하세가와 도하쿠(Hasegawa Tōhaku, 1539~1610) — 모모야마 시대의 화가로, 안개 속 소나무를 먹으로만 그린 병풍으로 이름났어요."], ["‘가노 에이토쿠’은(는) 어느 시대의 화가일까요?", "일본 모모야마 시대", ["일본 무로마치 시대", "일본 에도 시대", "중국 북송"], "일본", "가노 에이토쿠(Kanō Eitoku, 1543~1590) — 가노파의 화가로, 오다 노부나가·도요토미 히데요시의 성을 금빛 장벽화로 꾸몄어요."], ["‘다와라야 소타쓰’은(는) 어느 시대의 화가일까요?", "일본 에도 시대", ["일본 무로마치 시대", "일본 모모야마 시대", "중국 북송"], "일본", "다와라야 소타쓰(Tawaraya Sōtatsu, 17세기 초) — 금빛 바탕에 대담한 색과 모양을 쓴 장식 화풍(린파)을 연 화가예요."], ["‘오가타 고린’은(는) 어느 시대의 화가일까요?", "일본 에도 시대", ["일본 모모야마 시대", "일본 무로마치 시대", "중국 명"], "일본", "오가타 고린(Ogata Kōrin, 1658~1716) — 소타쓰의 화풍을 이어 '린파'라는 이름이 붙게 한 화가예요. 옷감·그릇 무늬도 디자인했어요."], ["‘이토 자쿠추’은(는) 어느 시대의 화가일까요?", "일본 에도 시대", ["일본 무로마치 시대", "일본 모모야마 시대", "조선 후기"], "일본", "이토 자쿠추(Itō Jakuchū, 1716~1800) — 교토의 채소 도매상 주인이었다가 화가가 되었어요. 닭과 꽃·새를 아주 화려하고 세밀하게 그렸어요."], ["‘마루야마 오쿄’은(는) 어느 시대의 화가일까요?", "일본 에도 시대", ["일본 모모야마 시대", "일본 무로마치 시대", "중국 근대"], "일본", "마루야마 오쿄(Maruyama Ōkyo, 1733~1795) — 자연을 직접 보고 그리는 사생을 중시한 화가로, 마루야마파를 열었어요."], ["‘기타가와 우타마로’은(는) 어느 시대의 화가일까요?", "일본 에도 시대", ["일본 무로마치 시대", "일본 모모야마 시대", "중국 명"], "일본", "기타가와 우타마로(Kitagawa Utamaro, 1753경~1806) — 여인의 얼굴을 크게 그린 미인화 판화로 이름난 우키요에 화가예요."], ["‘도슈사이 샤라쿠’은(는) 어느 시대의 화가일까요?", "일본 에도 시대", ["일본 무로마치 시대", "일본 모모야마 시대", "중국 동진"], "일본", "도슈사이 샤라쿠(Tōshūsai Sharaku, 18세기 말) — 1794~1795년 열 달 남짓 가부키 배우 그림만 내고 사라진 수수께끼의 우키요에 화가예요."], ["‘가쓰시카 호쿠사이’은(는) 어느 시대의 화가일까요?", "일본 에도 시대", ["일본 모모야마 시대", "중국 원", "중국 남송"], "일본", "가쓰시카 호쿠사이(Katsushika Hokusai, 1760~1849) — 일본 에도 시대의 풍속 판화(우키요에) 화가로, 유럽의 인상파에도 큰 영향을 주었어요."], ["‘우타가와 히로시게’은(는) 어느 시대의 화가일까요?", "일본 에도 시대", ["일본 모모야마 시대", "일본 무로마치 시대", "중국 동진"], "일본", "우타가와 히로시게(Utagawa Hiroshige, 1797~1858) — 여행길의 풍경과 비·눈 같은 날씨를 서정적으로 담은 풍경 판화로 유명해요. 고흐가 그의 판화를 따라 그렸어요."], ["조선 시대에 나라의 그림 일을 맡아보던 관청은?", "도화서", ["집현전", "규장각", "승문원"], "상식", "도화서에 속한 직업 화가를 '화원'이라고 했어요. 김홍도·신윤복·김득신이 화원이에요."], ["조선 시대 도화서에서 그림을 그리던 직업 화가를 무엇이라 할까요?", "화원", ["선비", "역관", "의관"], "상식", "도화서의 화원은 왕의 초상(어진), 궁중 행사, 지도 등을 그렸어요."], ["우리 땅의 실제 경치를 직접 보고 그린 산수화를 무엇이라 할까요?", "진경산수화", ["남종화", "민화", "풍속화"], "상식", "겸재 정선이 완성했어요. '인왕제색도', '금강전도'가 대표작이에요."], ["서민의 생활 모습을 그린 그림을 무엇이라 할까요?", "풍속화", ["산수화", "초상화", "화조화"], "상식", "김홍도의 '씨름'·'서당', 신윤복의 '단오풍정'이 대표적인 풍속화예요."], ["매화·난초·국화·대나무를 함께 이르는 말은?", "사군자", ["문방사우", "십장생", "사신도"], "상식", "추위와 어려움을 이겨 내는 군자(훌륭한 사람)의 모습에 빗대어 선비들이 즐겨 그렸어요."], ["까치호랑이·책거리처럼 이름 없는 화가들이 복을 비는 마음을 담아 그린 우리 옛 그림은?", "민화", ["풍속화", "문인화", "진경산수화"], "상식", "민화는 집을 꾸미거나 복을 빌려고 널리 그려졌어요."], ["직업 화가가 아니라 학문을 하던 선비가 마음을 담아 그린 그림을 무엇이라 할까요?", "문인화", ["민화", "풍속화", "기록화"], "상식", "김정희의 '세한도'가 대표적인 문인화예요."], ["단원·혜원·오원을 함께 부르는 '삼원'에 들지 않는 화가는?", "정선", ["김홍도", "신윤복", "장승업"], "상식", "삼원은 단원 김홍도·혜원 신윤복·오원 장승업이에요. 정선의 호는 겸재예요."], ["겸재 정선·관아재 조영석과 함께 '삼재'로 불리는 화가는?", "심사정", ["김홍도", "신윤복", "장승업"], "상식", "삼재는 겸재 정선·현재 심사정·관아재 조영석을 말해요(관아재 대신 공재 윤두서를 넣기도 해요)."], ["오만 원권 지폐 앞면에 얼굴이 실린 화가는?", "신사임당", ["김홍도", "신윤복", "정선"], "상식", "신사임당은 '초충도'로 유명한 조선 초기의 화가예요."], ["오만 원권 지폐 뒷면에 실린 그림 두 점은?", "어몽룡의 '월매도'와 이정의 '풍죽도'", ["김홍도의 '씨름'과 '서당'", "정선의 '인왕제색도'와 '금강전도'", "신윤복의 '미인도'와 '단오풍정'"], "상식", "달빛 아래 매화(월매도)와 바람 맞는 대나무(풍죽도)를 겹쳐 실었어요."], ["천 원권 지폐 뒷면에 실린 정선의 그림은?", "계상정거도", ["인왕제색도", "금강전도", "박연폭포"], " const flAll = () => { const v = ld(FLK); return v && typeof v === "object" ? v : {}; }, isFlag = q => !!(flAll()[FLF] || {})[q];
function toggleFlag(d, picked) { const all = flAll(), m = all[FLF] || (all[FLF] = {}); if (m[d[0]]) delete m[d[0]]; else m[d[0]] = { a: String(d[1]), p: String(picked || ""), t: Date.now() }; if (!Object.keys(m).length) delete all[FLF]; sv(FLK, all); }
function showFlag(d, picked) { $("q").insertAdjacentHTML("beforeend", `<button class="flagb ${isFlag(d[0]) ? "on" : ""}" type="button" data-flag="1">${isFlag(d[0]) ? "🚩 신고했어요 (누르면 취소)" : "🚩 문제가 이상해요"}</button>`); $("q").querySelector("[data-flag]").onclick = e => { toggleFlag(d, picked); e.target.classList.toggle("on", isFlag(d[0])); e.target.textContent = isFlag(d[0]) ? "🚩 신고했어요 (누르면 취소)" : "🚩 문제가 이상해요"; }; }
/*LEVEL*/
const LVN = ["전체", "🌱 초급", "🌿 중급", "🌳 고급"], LVM = [1, 1, 1.5, 2], LVK = KEY.split("-best-").join("-lv-") === KEY ? KEY + "-lv" : KEY.split("-best-").join("-lv-");
let lv = +ld(LVK) || 0; if (!(lv >= 0 && lv <= 3)) lv = 0;
const lvOf = n => +(typeof LV === "string" && LV[n] || 2), lvCnt = l => D.filter((d, n) => lvOf(n) === l).length, bestKey = () => lv ? KEY + "-L" + lv : KEY;
best = ld(bestKey()) || 0;
function renderLv() {
  if (lv && lvCnt(lv) < 4) lv = 0;
  window.FG_MULT = LVM[lv]; window.FG_LV = lv ? LVN[lv].slice(3) : "";
  $("lvs").innerHTML = LVN.map((n, k) => `<button class="chip ${k === lv ? "on" : ""}" type="button" data-l="${k}" aria-pressed="${k === lv}">${n}${k ? `<small> ${lvCnt(k)}</small>` : ""}</button>`).join("");
  $("lvp").textContent = lv ? `${LVN[lv].slice(3)} 문제예요. 포인트가 ×${LVM[lv]}배로 쌓여요.` : "초급 ×1 · 중급 ×1.5 · 고급 ×2 포인트 (전체는 ×1)";
}
$("lvs").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b) { lv = +b.dataset.l; sv(LVK, lv); best = ld(bestKey()) || 0; start(); } });

function options(d) {                                   // 보기를 만든다: 정답 + 틀린 보기 (같은 분류의 다른 정답 중에서 자동으로 뽑기도 함)
  let wrong = d[2] && d[2].length ? d[2].slice(0, 3) : shuf(D.filter(x => x !== d && x[1] !== d[1] && (!d[3] || x[3] === d[3])).map(x => x[1])).filter((v, k, a) => a.indexOf(v) === k).slice(0, 3);
  return shuf([d[1], ...wrong]);
}
function start() {
  renderLv(); const pool = D.filter((d, n) => (!lv || lvOf(n) === lv) && !isFlag(d[0]) && (cat === "전체" || d[3] === cat)); /*GUARD*/ if (!pool.length && lv) { lv = 0; sv(LVK, lv); best = ld(bestKey()) || 0; return start(); }
  qs = shuf(pool).slice(0, ROUND).map(d => ({ d, opts: options(d) })); i = 0; score = 0; $("res").hidden = true;
  $("cats").hidden = CATS.length < 3; $("cats").innerHTML = CATS.map(c => `<button class="chip ${c === cat ? "on" : ""}" type="button" data-c="${c}" aria-pressed="${c === cat}">${c}</button>`).join(""); show();
}
function show() {
  const { d, opts } = qs[i]; locked = false; $("next").hidden = true;
  $("q").innerHTML = (LABEL || d[3] ? `<small>${esc(LABEL || d[3])}</small>` : "") + esc(d[0]);
  $("opts").className = "opts" + (opts.some(o => String(o).length > 9) ? " one" : "");
  $("opts").innerHTML = opts.map((o, k) => `<button class="opt" type="button" data-k="${k}">${esc(o)}</button>`).join("");
  $("no").textContent = (i + 1) + "/" + qs.length; $("score").textContent = score; $("best").textContent = best;
}
function pick(k) {
  if (locked) return; locked = true; const { d, opts } = qs[i]; if (opts[k] === d[1]) score++;
  document.querySelectorAll(".opt").forEach((b, n) => { b.disabled = true; if (opts[n] === d[1]) b.classList.add("ok"); else if (n === k) b.classList.add("bad"); });
  if (d[4]) $("q").insertAdjacentHTML("beforeend", `<span class="note">${esc(d[4])}</span>`);
  showFlag(d, opts[k]);
  $("score").textContent = score; $("next").textContent = i === qs.length - 1 ? "결과 보기" : "다음 문제"; $("next").hidden = false;
}
function finish() {
  const full = qs.length === ROUND; let note = ""; if (full && cat === "전체" && score > best) { best = score; sv(bestKey(), best); note = " 🏆 최고 기록이에요!"; }
  $("q").innerHTML = "끝!"; $("opts").innerHTML = ""; $("next").hidden = true;
  $("res").innerHTML = `<b>${qs.length}문제 중 ${score}개 정답</b><p class="muted">${score >= qs.length * .9 ? "박사님이시네요! 🎓" : score >= qs.length * .6 ? "잘했어요 👍" : "조금만 더 힘내요 💪"}${note}</p><button class="btn" id="again" type="button" style="margin-top:10px;width:100%">다시 하기</button>`;
  $("res").hidden = false; $("best").textContent = best; $("again").onclick = start;
}
$("opts").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) pick(+b.dataset.k); });
$("cats").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b) { cat = b.dataset.c; start(); } });
$("next").onclick = () => { if (i === qs.length - 1) finish(); else { i++; show(); } };
start();
</script>
