<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>약 복용 체크표</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(200 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(200 22% 86%);--accent:hsl(200 65% 46%);--accent-fg:#fff;--soft:hsl(200 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(200 22% 10%);--surface:hsl(200 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(200 16% 25%);--accent:hsl(200 75% 68%);--accent-fg:#10131c;--soft:hsl(200 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
select,input[type=date],input[type=time]{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;min-width:0}
.f{display:grid;gap:4px}.f>label,.lb{font-size:.88rem;color:var(--muted);font-weight:700}.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}.x{background:none;border:0;color:var(--muted);font-size:1.15rem;padding:4px 8px}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700;background:var(--soft)}.tag.ok{background:color-mix(in srgb,var(--ok) 22%,var(--surface))}.tag.bad{background:color-mix(in srgb,var(--bad) 22%,var(--surface))}.tag.wn{background:color-mix(in srgb,#e0a100 25%,var(--surface))}
.btn.sm{padding:7px 14px;font-size:.95rem}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.92rem}.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.num{font-family:var(--font-display);font-size:1.9rem;color:var(--accent);line-height:1.2}.note{font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>약 복용 체크표 💊</h1>
  <div class="card"><div class="g2" style="grid-template-columns:auto 1fr auto;align-items:center"><button class="x" id="prev" type="button" aria-label="전날">◀</button><b class="center" id="dl"></b><button class="x" id="next" type="button" aria-label="다음날">▶</button></div></div>
  <div id="banner"></div>
  <div class="card" id="today"></div>
  <div class="card" id="wk"></div>
  <details class="card" id="alm" open><summary><b>⏰ 복용 알림 · 달력 등록</b></summary><div id="alarm" style="display:grid;gap:10px;margin-top:10px"></div></details>
  <details class="card"><summary><b>➕ 약 등록·관리</b></summary><div id="mgr" style="display:grid;gap:10px;margin-top:10px"></div></details>
  <p class="muted">약 이름과 먹는 시간을 등록하고 먹을 때마다 체크해요. 지난 7일간 잘 챙겼는지도 볼 수 있어요. 복용 방법은 의사·약사의 안내를 따르세요. 이 폰에만 저장돼요.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "med-check-v1";

const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayS = () => ymd(new Date());
const dnum = s => { const [y, m, d] = s.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
const addDays = (s, n) => { const [y, m, d] = s.split("-").map(Number); return ymd(new Date(y, m - 1, d + n)); };
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const wdOf = s => WD[new Date(s + "T00:00:00").getDay()];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const SL = [["m", "아침"], ["n", "점심"], ["e", "저녁"], ["b", "자기 전"]];
let S = Object.assign({ meds: [], log: {}, al: { on: false, rep: 10, cal2: false, t: { m: "08:00", n: "12:30", e: "18:30", b: "22:00" } }, rung: {}, exp: null }, ld(KEY) || {});
S.al = Object.assign({ on: false, rep: 10, cal2: false }, S.al); S.al.t = Object.assign({ m: "08:00", n: "12:30", e: "18:30", b: "22:00" }, S.al.t);
let day = todayS(), editId = null;
const save = () => sv(KEY, S);
function due(d) { const a = []; S.meds.forEach(m => { if ((m.since || "0000") > d) return; SL.forEach(([k]) => { if (m.t.includes(k)) a.push(m.id + "|" + k); }); }); return a; }
function render() {
  $("dl").textContent = `${day.slice(5).replace("-", "/")} (${wdOf(day)})${day === todayS() ? " · 오늘" : ""}`; $("next").disabled = day >= todayS();
  const lg = S.log[day] || {}, items = due(day);
  $("today").innerHTML = S.meds.length ? SL.map(([k, nm]) => { const ms = S.meds.filter(m => m.t.includes(k) && (m.since || "0000") <= day); if (!ms.length) return ""; return `<div><div class="lb">${nm}</div>${ms.map(m => { const key = m.id + "|" + k, on = lg[key]; return `<div class="li"><span><b>${esc(m.n)}</b>${m.memo ? `<br><span class="note">${esc(m.memo)}</span>` : ""}</span><button type="button" class="chip${on ? " on" : ""}" data-k="${key}">${on ? "✅ 먹었어요" : "아직"}</button></div>`; }).join("")}</div>`; }).join("") + `<div class="note">${items.filter(k => lg[k]).length}/${items.length} 복용</div>` : '<p class="muted">아래 "약 등록·관리"에서 약을 먼저 등록해 주세요.</p>';
  const days = Array.from({ length: 7 }, (_, i) => addDays(todayS(), i - 6));
  $("wk").innerHTML = `<b>📅 최근 7일</b><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center">${days.map(d => { const it = due(d), done = it.filter(k => (S.log[d] || {})[k]).length, p = it.length ? done / it.length : null; return `<div><div class="note">${wdOf(d)}</div><div style="font-size:1.3rem">${p === null ? "·" : p === 1 ? "🟢" : p > 0 ? "🟡" : (d === todayS() ? "⚪" : "🔴")}</div><div class="note">${it.length ? done + "/" + it.length : ""}</div></div>`; }).join("")}</div><div class="note">🟢 모두 복용 · 🟡 일부 · 🔴 안 먹음</div>`;
  const em = S.meds.find(m => m.id === editId) || null;
  $("mgr").innerHTML = S.meds.map(m => `<div class="li"><span><b>${esc(m.n)}</b> <span class="note">${SL.filter(([k]) => m.t.includes(k)).map(x => x[1]).join("·")}${m.memo ? " · " + esc(m.memo) : ""}</span></span><span style="display:flex;gap:2px"><button class="x" data-em="${m.id}" type="button" aria-label="수정">✏️</button><button class="x" data-dm="${m.id}" type="button" aria-label="삭제">✕</button></span></div>`).join("")
    + `<div class="lb">${em ? "✏️ 약 수정하기" : "➕ 새 약 등록"}</div><div class="f"><label for="mn">약 이름</label><input type="text" id="mn" maxlength="20" placeholder="예: 혈압약" value="${em ? esc(em.n) : ""}"></div><div class="f"><label>먹는 시간</label><div class="chips" id="mt">${SL.map(([k, n]) => `<button type="button" class="chip${em && em.t.includes(k) ? " on" : ""}" data-t="${k}">${n}</button>`).join("")}</div></div><div class="f"><label for="mm">메모(선택)</label><input type="text" id="mm" maxlength="30" placeholder="예: 식후 30분" value="${em ? esc(em.memo || "") : ""}"></div><div class="g2"><button class="btn sm" id="am" type="button">${em ? "수정 저장" : "등록하기"}</button>${em ? '<button class="btn ghost sm" id="ac" type="button">취소</button>' : ""}</div>`;
  $("mt").onclick = e => { const b = e.target.closest("[data-t]"); if (b) b.classList.toggle("on"); };
  $("am").onclick = () => { const n = $("mn").value.trim(), t = [...document.querySelectorAll("#mt .on")].map(b => b.dataset.t); if (!n || !t.length) { (n ? $("mt") : $("mn")).focus && (n ? 0 : $("mn").focus()); return; } if (em) { em.n = n; em.t = t; em.memo = $("mm").value.trim(); editId = null; } else S.meds.push({ id: uid(), n, t, memo: $("mm").value.trim(), since: todayS() }); save(); render(); alarmUi(); banners(); };
  if ($("ac")) $("ac").onclick = () => { editId = null; render(); };
  $("mgr").querySelectorAll("[data-em]").forEach(b => b.onclick = () => { editId = b.dataset.em; render(); $("mn").focus(); });
  $("mgr").querySelectorAll("[data-dm]").forEach(b => b.onclick = () => { if (confirm("이 약을 삭제할까요?")) { S.meds = S.meds.filter(m => m.id !== b.dataset.dm); if (editId === b.dataset.dm) editId = null; save(); render(); banners(); } });
  $("today").querySelectorAll("[data-k]").forEach(b => b.onclick = () => { const l = S.log[day] || (S.log[day] = {}); if (l[b.dataset.k]) delete l[b.dataset.k]; else l[b.dataset.k] = 1; save(); render(); });
}
$("prev").onclick = () => { day = addDays(day, -1); render(); };
$("next").onclick = () => { if (day < todayS()) { day = addDays(day, 1); render(); } };

// ───── 알림 ─────
const perm = () => ("Notification" in window) ? Notification.permission : "unsupported";
function pending(slot, d) { const lg = S.log[d] || {}; return S.meds.filter(m => m.t.includes(slot) && (m.since || "0000") <= d && !lg[m.id + "|" + slot]); }
function beep() { try { const A = window.AudioContext || window.webkitAudioContext, c = new A(); [0, .35, .7].forEach(t => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.2, c.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + t + .25); o.start(c.currentTime + t); o.stop(c.currentTime + t + .27); }); } catch (e) {} }
async function notify(title, body) {
  try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
  if (perm() !== "granted") return;
  try { const r = await navigator.serviceWorker.getRegistration(); if (r) { await r.showNotification(title, { body, tag: "med", renotify: true, icon: "icon-192.png", vibrate: [300, 150, 300] }); return; } } catch (e) {}
  try { new Notification(title, { body, icon: "icon-192.png" }); } catch (e) {}
}
function banners() {
  const d = todayS(), now = pad(new Date().getHours()) + ":" + pad(new Date().getMinutes()), out = [];
  SL.forEach(([k, nm]) => { if (S.al.t[k] <= now) { const ps = pending(k, d); if (ps.length) out.push([k, nm, ps]); } });
  $("banner").innerHTML = staleBanner() + out.map(([k, nm, ps]) => `<div class="card" style="border-color:var(--accent)"><b>💊 ${nm} 약 아직이에요 (${S.al.t[k]})</b><div>${ps.map(m => esc(m.n)).join(", ")}</div><button class="btn sm" data-ok="${k}" type="button">먹었어요 ✅</button></div>`).join("");
  if ($("sync")) $("sync").onclick = () => { $("astart") && ($("astart").value = todayS()); if (ics()) banners(); };
  $("banner").querySelectorAll("[data-ok]").forEach(b => b.onclick = () => { const k = b.dataset.ok, l = S.log[d] || (S.log[d] = {}); pending(k, d).forEach(m => { l[m.id + "|" + k] = 1; }); save(); day = d; render(); banners(); });
}
function tick() {
  const dt = new Date(), nm0 = dt.getHours() * 60 + dt.getMinutes(), now = pad(dt.getHours()) + ":" + pad(dt.getMinutes()), d = todayS();
  Object.keys(S.rung).forEach(k => { if (!k.startsWith(d)) delete S.rung[k]; });
  if (S.al.on) SL.forEach(([k, nm]) => { const [h, m] = S.al.t[k].split(":").map(Number), diff = nm0 - (h * 60 + m), key = d + k + now;
    if (diff < 0 || diff > 180 || S.rung[key]) return; const rep = +S.al.rep || 0; if (!(diff === 0 || (rep > 0 && diff % rep === 0))) return;
    S.rung[key] = 1; save(); const ps = pending(k, d); if (ps.length) { notify((diff ? "💊 (다시 알림) " : "💊 ") + nm + " 약 먹을 시간이에요", ps.map(x => x.n).join(", ") + (diff ? " · 먹었으면 체크해 주세요" : "")); beep(); banners(); } });
}
const sig = () => JSON.stringify([S.meds.map(m => [m.id, m.n, m.t]), S.al.t, S.al.cal2 ? S.al.rep : 0]);
function ics() {
  const dt = new Date(), stamp = ymd(dt).replace(/-/g, "") + "T" + pad(dt.getHours()) + pad(dt.getMinutes()) + pad(dt.getSeconds()), seq = Math.floor(Date.now() / 1000);
  const first = ($("astart") && $("astart").value) || todayS(), prev = (S.exp && S.exp.slots) || [], usedSlots = [];
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//family-games//med//KO", "CALSCALE:GREGORIAN"];
  const fs = first.replace(/-/g, ""), days = Array.from({ length: 7 }, (_, i) => addDays(first, i));
  SL.forEach(([k, nm]) => {
    const per = days.map(d => ({ d, ms: S.meds.filter(m => m.t.includes(k) && (m.since || "0000") <= d) })), any = per.some(x => x.ms.length);
    if (!any && !prev.includes(k)) return; if (any) usedSlots.push(k);
    const names = [...new Set(per.flatMap(x => x.ms.map(m => m.n)))].join(", "), [hh, mm] = S.al.t[k].split(":").map(Number), step = +S.al.rep || 10, nmax = S.al.cal2 ? 3 : 1;
    const skip = per.filter(x => !x.ms.length || (x.d === todayS() && x.ms.every(m => ((S.log[x.d] || {})[m.id + "|" + k])))).map(x => x.d);
    for (let r = 0; r < Math.max(nmax, (S.exp && S.exp.n) || 1); r++) { const tm = hh * 60 + mm + r * step; if (tm >= 1440) break; const hm = pad(Math.floor(tm / 60)) + pad(tm % 60) + "00", off = !any || r >= nmax;
      L.push("BEGIN:VEVENT", "UID:med-" + fs + "-" + k + (r ? "-r" + r : "") + "@yoonseongduk.github.io", "SEQUENCE:" + seq, "DTSTAMP:" + stamp, "DTSTART:" + fs + "T" + hm, "DURATION:PT10M", "RRULE:FREQ=DAILY;COUNT=7");
      skip.forEach(d => L.push("EXDATE:" + d.replace(/-/g, "") + "T" + hm));
      L.push("SUMMARY:💊 " + (r ? "(다시 알림) " : "") + nm + " 약: " + (names || "-"), "DESCRIPTION:약 먹을 시간이에요 - " + names);
      if (off) L.push("STATUS:CANCELLED"); else L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:약 먹을 시간이에요", "TRIGGER:PT0M", "END:VALARM");
      L.push("END:VEVENT"); } });
  L.push("END:VCALENDAR");
  if (!usedSlots.length) return false;
  S.exp = { sig: sig(), until: addDays(first, 6), slots: [...new Set(usedSlots)], n: S.al.cal2 ? 3 : 1 }; save();
  const blob = new Blob([L.join("\r\n")], { type: "text/calendar;charset=utf-8" }), a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "med-alarm-" + first + ".ics"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return true;
}
function staleBanner() {
  let m = ""; const e = S.exp;
  if (e && e.sig !== sig()) m = "약이나 시간이 바뀌었어요. 달력 일정이 예전 내용 그대로예요.";
  else if (e && e.until < addDays(todayS(), 1)) m = "달력에 등록한 알람이 곧 끝나요.";
  else if (!e && S.meds.length && S.al.on === false) return "";
  return m ? `<div class="card" style="border-color:var(--bad)"><b>📅 달력 알람 업데이트 필요</b><div class="note">${m}</div><button class="btn sm" id="sync" type="button">지금 상태로 달력 일정 업데이트</button></div>` : "";
}
function alarmUi() {
  const p = perm(), pt = p === "granted" ? "✅ 허용됨" : p === "denied" ? "⛔ 차단됨 (브라우저 설정에서 허용 필요)" : p === "unsupported" ? "이 브라우저는 알림을 지원하지 않아요" : "아직 허용 안 함";
  $("alarm").innerHTML = `<div class="lb" style="color:var(--fg)">① 앱 알림 <span class="note">(앱이 열려 있을 때만 울려요)</span></div>
    <label class="opt" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="aon"${S.al.on ? " checked" : ""}> 시간이 되면 알림·진동·소리로 알려 주기</label>
    <div class="f"><label for="arep">안 먹었으면 다시 알려 주기 (체크할 때까지, 최대 3시간)</label><select id="arep">${[[0, "다시 알리지 않기"], [5, "5분마다"], [10, "10분마다"], [15, "15분마다"], [30, "30분마다"]].map(([v, t]) => `<option value="${v}"${+S.al.rep === v ? " selected" : ""}>${t}</option>`).join("")}</select></div>
    <div class="g2">${SL.map(([k, n]) => `<div class="f"><label for="at${k}">${n} 시간</label><input type="time" id="at${k}" value="${S.al.t[k]}"></div>`).join("")}</div>
    <div class="f"><label>알림 권한: ${pt}</label><div class="g2"><button class="btn ghost sm" id="ap" type="button">🔔 알림 허용</button><button class="btn ghost sm" id="atest" type="button">🔊 테스트</button></div></div>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <div class="lb" style="color:var(--fg)">② 폰 시계 앱 알람 <span class="note">(앱이 꺼져 있어도 울려요)</span></div>
    ${/Android/i.test(navigator.userAgent) ? `<div class="f"><label>⏰ 폰 기본 시계 앱 알람으로 만들기 (알람 화면이 열려요)</label><div class="g2">${SL.map(([k, n]) => `<button class="btn ghost sm" data-clk="${k}" type="button">${n} ${S.al.t[k]}</button>`).join("")}</div><div class="note">누르면 시계 앱의 알람 만들기 화면이 시간·이름이 채워진 채로 열려요. <b>반복 요일을 '매일'로 켜고 저장</b>하면 끝! 기종·브라우저에 따라 안 열릴 수 있어요.</div></div>` : ""}
    ${/Android/i.test(navigator.userAgent) ? "" : `<div class="note">안드로이드 폰에서만 보여요.</div>`}
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <div class="lb" style="color:var(--fg)">③ 📅 폰 달력에 등록 <span class="note">(앱이 꺼져 있어도 울려요)</span></div>
    <div class="note">위 ①의 시간대로 <b>일주일치 일정 파일</b>을 만들어요. 받은 파일을 열면 삼성 달력 등에 일정이 추가되고, 아침·점심·저녁마다 <b>"7일 반복 일정" 하나씩</b>만 만들어져서, 달력에서 일정을 열어 <b>"모든 일정"</b>을 고치거나 지우면 한 번에 끝나요. 일정 이름은 "💊"로 시작해요.</div>
    <label class="opt" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="acal2"${S.al.cal2 ? " checked" : ""}> '다시 알림' 일정도 2번 더 넣기 (위 간격으로)</label>
    <div class="f"><label for="astart">시작일 (이 날부터 7일치)</label><input type="date" id="astart" value="${todayS()}"></div>
    <button class="btn" id="aics" type="button">📅 달력에 등록하기 (일정 파일 받기)</button>
    <div class="note">버튼을 누르면 <b>med-alarm-날짜.ics</b> 파일이 받아져요. 알림창이나 "내 파일/다운로드"에서 그 파일을 눌러 <b>삼성 캘린더</b>(또는 구글 캘린더)로 열면 일정이 들어가요. 약이나 시간을 바꾼 뒤에는 이 버튼을 다시 눌러 새 파일을 여세요. 오늘 이미 먹은 약은 그날만 빼고 담겨요. 없앤 약의 일정은 "취소" 표시로 담겨요 (달력 앱에 따라 안 지워질 수 있어요).</div>
    <div class="note">⚠️ 달력·시계 앱 알람은 앱이 "먹었는지" 모르기 때문에 먹어도 멈추지 않고 정해진 횟수만 울려요. ①의 앱 알림은 앱을 완전히 닫으면 울리지 못해요.</div>`;
  $("aon").onchange = () => { S.al.on = $("aon").checked; save(); if (S.al.on && perm() === "default") $("ap").click(); };
  $("arep").onchange = () => { S.al.rep = +$("arep").value; save(); };
  $("acal2").onchange = () => { S.al.cal2 = $("acal2").checked; save(); };
  SL.forEach(([k]) => { $("at" + k).onchange = () => { S.al.t[k] = $("at" + k).value || S.al.t[k]; save(); banners(); }; });
  $("ap").onclick = async () => { try { await Notification.requestPermission(); } catch (e) {} alarmUi(); };
  $("atest").onclick = () => { notify("💊 알림 테스트", "이 알림이 보이면 잘 동작해요"); beep(); };
  $("alarm").querySelectorAll("[data-clk]").forEach(b => b.onclick = () => { const k = b.dataset.clk, nm = SL.find(x => x[0] === k)[1], [h, m] = S.al.t[k].split(":").map(Number), names = S.meds.filter(x => x.t.includes(k)).map(x => x.n).join(", "); location.href = `intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${h};i.android.intent.extra.alarm.MINUTES=${m};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent("💊 " + nm + " 약" + (names ? ": " + names : ""))};b.android.intent.extra.alarm.VIBRATE=true;end`; });
  $("aics").onclick = () => { if (!ics()) $("aics").textContent = "먼저 약을 등록해 주세요"; };
}
render(); alarmUi(); banners(); tick();
setInterval(tick, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); banners(); } });

</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<script src="wrong-hook.js"></script>
</body>
</html>
