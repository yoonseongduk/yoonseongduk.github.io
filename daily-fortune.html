    + `<div class="dc"><b>🗓 내 생일 정보</b><p>양력 <span class="lk">${bi.solar.y}년 ${bi.solar.m}월 ${bi.solar.d}일</span>${bi.lunar ? ` · 음력 <span class="lk">${bi.lunar.y}년 ${bi.lunar.leap ? "윤" : ""}${bi.lunar.m}월 ${bi.lunar.d}일</span>` : ""}</p><p>태어난 날의 일주 <span class="lk">${mine.txt}(${mine.han})</span> · ${ELEM[mine.s]} 기운${bi.tm !== null ? ` · 태어난 시 <span class="lk">${BRANCH[bi.tm]}시</span> (시주 ${STEM[((mine.s % 5) * 2 + bi.tm) % 10] + BRANCH[bi.tm]})` : ""}</p><p class="muted">오늘의 일진은 <span class="lk">${today.txt}일</span>(${ELEM[today.s]} 기운)이에요. 나와 비교하면 <b>${REL[rel][0]}</b> — ${REL[rel][2]}</p></div>`
    + `<div class="dc"><b>👤 나는 어떤 사람일까요?</b><p><span class="lk">${z[0]}</span> (${z[1]}) — ${z[2]}</p><p><span class="lk">${an[0]}</span> (음력 설 기준) — ${an[1]}</p></div>`
    + row("✨ 종합 운세", total, "total") + row("💰 금전운", money, "money") + row("💪 건강운", health, "health") + row("📚 학습·일 운", study, "study") + row("💞 인간관계·사랑 운", love, "love")
    + `<div class="dc"><b>⏰ 시간대별 운세</b>${times}</div>`
    + `<div class="dc"><b>🍀 행운 정보</b><p>행운의 시간 <span class="lk">${pick(LUCKTIME)}</span></p><p>행운의 방향 <span class="lk">${pick(DIR)}</span></p><p>행운의 음식 <span class="lk">${pick(FOOD)}</span></p><p>조심할 것 <span class="lk">${pick(BEWARE)}</span></p></div>`
    + `<div class="dc"><b>✅ 오늘의 행운 실천</b><ul>${tips}</ul></div><p class="muted">운세는 재미로만 봐 주세요. 오늘도 좋은 하루 보내세요 😊</p>`;
  document.querySelectorAll(".top").forEach(e => e.hidden = true); $("det").hidden = false; scrollTo(0, 0);
  $("back").onclick = () => { $("det").hidden = true; document.querySelectorAll(".top").forEach(e => e.hidden = false); scrollTo(0, 0); };
}

$("lm").innerHTML = Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}">${i + 1}월</option>`).join(""); $("ld").innerHTML = Array.from({ length: 30 }, (_, i) => `<option value="${i + 1}">${i + 1}일</option>`).join("");
const syncCal = () => { const L = $("cal").value === "lunar"; $("lpw").hidden = !L; $("lw").hidden = !L; $("bd").hidden = L; if (!L) $("leap").checked = false; }; $("cal").onchange = syncCal;
let saved = ld(KEY); if (typeof saved === "string") saved = { v: saved, cal: "solar", leap: false, tm: null };
if (saved) { $("bd").value = saved.v || ""; $("cal").value = saved.cal || "solar"; $("leap").checked = !!saved.leap; $("tm").value = saved.tm === null || saved.tm === undefined ? "" : String(saved.tm); if (saved.lun && saved.lun[0]) { $("ly").value = saved.lun[0]; $("lm").value = saved.lun[1]; $("ld").value = saved.lun[2]; } syncCal(); }
$("go").onclick = show; if (saved && (saved.cal === "lunar" ? saved.lun && saved.lun[0] : saved.v)) show();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
