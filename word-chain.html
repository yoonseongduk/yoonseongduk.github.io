// 쉬움: 제한 20초, 컴퓨터는 내가 이을 말이 많은 단어를 골라 줘요. 보통: 12초, 컴퓨터는 내가 이을 말이 적은 단어를 일부러 골라요
const LV = { easy: { sec: 20, label: "쉬움", hint: "20초 · 컴퓨터가 봐줘요" }, normal: { sec: 12, label: "보통", hint: "12초 · 컴퓨터가 노려요" } };

const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };

/* 두음법칙: 끝 글자가 '리'이면 '이'로도 시작할 수 있다 */
function dueum(ch) {
  const c = ch.charCodeAt(0) - 0xAC00; if (c < 0 || c > 11171) return ch;
  const cho = Math.floor(c / 588), jung = Math.floor((c % 588) / 28), jong = c % 28;
  const iy = [2, 6, 12, 17, 20, 7].includes(jung);                    // ㅑ ㅕ ㅛ ㅠ ㅣ ㅖ 계열
  if (cho === 5) return String.fromCharCode(0xAC00 + (iy ? 11 : 2) * 588 + jung * 28 + jong);        // ㄹ → ㅇ 또는 ㄴ
  if (cho === 2 && iy) return String.fromCharCode(0xAC00 + 11 * 588 + jung * 28 + jong);             // ㄴ → ㅇ
  return ch;
}

const canFollow = (prev, word) => starters(prev[prev.length - 1]).includes(word[0]);
const isHangul = w => /^[가-힣]{2,12}$/.test(w);

function newGame() {

  const first = starts[Math.floor(Math.random() * starts.length)]; push(first, "cpu"); startTimer(); render(); $("w").value = ""; $("w").focus();
}
function push(w, who) { chain.push({ w, who }); used.add(w); }
function startTimer() { clearInterval(timer); endAt = Date.now() + LV[lv].sec * 1000 * tempo; timer = setInterval(() => { const left = Math.max(0, endAt - Date.now()), total = LV[lv].sec * 1000 * tempo; $("bar").style.width = (left / total * 100) + "%"; if (!left) lose("시간이 다 됐어요 ⏰"); }, 100); }
const options = w => WORDS.filter(x => !used.has(x) && x !== w && starters(w[w.length - 1]).includes(x[0]));      // w 다음에 이을 수 있는 말들

  const last = chain[chain.length - 1].w, st = starters(last[last.length - 1]);
  const c = WORDS.filter(w => !used.has(w) && st.includes(w[0])); if (!c.length) return null;
  const scored = c.map(w => ({ w, n: options(w).length }));
  if (lv === "easy") { const nice = scored.filter(x => x.n >= 3); const pool = nice.length ? nice : scored; return pool[Math.floor(Math.random() * pool.length)].w; }
  const min = Math.min(...scored.map(x => x.n)), pool = scored.filter(x => x.n === min); return pool[Math.floor(Math.random() * pool.length)].w;      // 보통: 이을 말이 가장 적은 단어
}
function hintWords() { const prev = chain[chain.length - 1].w; return WORDS.filter(w => !used.has(w) && canFollow(prev, w)).sort(() => Math.random() - .5).slice(0, 3); }
function submit() {
  if (over) return; const w = $("w").value.replace(/\s+/g, ""), prev = chain[chain.length - 1].w;
  if (!isHangul(w)) return say("한글 2글자 이상으로 써 주세요.", true);
  if (!DICT.has(w) && canFollow(prev, w) && !used.has(w)) return say("컴퓨터 사전에 없는 말이에요. 다른 말을 써 보세요. (💡 힌트)", true);
  if (!canFollow(prev, w)) return say(`"${starters(prev[prev.length - 1]).join('" 또는 "')}"(으)로 시작해야 해요.`, true);
  if (used.has(w)) return say("이미 나온 단어예요!", true);
  push(w, "me"); $("w").value = ""; say("", false);
  const reply = cpuWord();
  if (!reply) return win(); push(reply, "cpu"); startTimer(); render();
}
function say(t, bad) { $("msg").textContent = t; $("msg").className = "msg" + (bad ? " bad" : ""); }
function finish(text, good) {
  over = true; clearInterval(timer); const mine = chain.filter(x => x.who === "me").length; let note = "";
  if (mine > best) { best = mine; sv(KEY, best); note = " 🏆 최고 기록이에요!"; }
  $("inp").hidden = true; $("res").innerHTML = `<b>${text}</b><p class="muted">내가 이은 말 ${mine}개${note}</p>`; $("res").hidden = false; $("again").hidden = false; render();
}
const lose = t => finish(t, false);
const win = () => finish("🎉 컴퓨터가 더 이을 말이 없어요! 내가 이겼어요", true);
function render() {
  const last = chain[chain.length - 1].w, st = starters(last[last.length - 1]);
  $("hint").innerHTML = over ? "" : `<b>${st[0]}</b>${st[1] ? ` <span class="muted">(또는 ${st[1]})</span>` : ""}(으)로 시작하는 단어는?`;
  $("list").innerHTML = [...chain].reverse().map(x => `<li class="${x.who}"><span class="who">${x.who === "me" ? "나" : "컴퓨터"}</span><span class="w">${x.w}</span></li>`).join("");
  $("cnt").textContent = chain.filter(x => x.who === "me").length; $("best").textContent = best;
  $("lv").innerHTML = Object.keys(LV).map(k => `<button type="button" class="${k === lv ? "on" : ""}" data-l="${k}" role="radio" aria-checked="${k === lv}">${LV[k].label}<small>제한 ${LV[k].hint}</small></button>`).join("");
}
$("go").onclick = submit; $("again").onclick = newGame;
$("tip").onclick = () => { if (over) return; const h = hintWords(); say(h.length ? "💡 예: " + h.join(", ") : "이을 수 있는 말이 더 없어요!", false); };
$("w").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); submit(); } });
$("lv").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b && b.dataset.l !== lv) { lv = b.dataset.l; sv(LKEY, lv); newGame(); } });
newGame();
</script>
