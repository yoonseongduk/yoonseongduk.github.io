<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>속담 퀴즈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 점수 줄, 빈칸이 뚫린 속담, 네 개의 보기 버튼. 고르면 바로 정답과 완성된 속담을 보여 준다 */
:root{--bg:#f4f1ec;--surface:#fff;--fg:#2a2420;--muted:#76695f;--line:#e0d8cf;--accent:#c4552b;--accent-fg:#fff;--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a1613;--surface:#262019;--fg:#f2ebe5;--muted:#aa9d92;--line:#3b332b;--accent:#ff8a5f;--accent-fg:#1a1613;--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:12px;font-family:var(--font-display);font-size:1.3rem}
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 16px;text-align:center;font-family:var(--font-display);font-size:clamp(1.5rem,7vw,2rem);line-height:1.5;overflow-wrap:anywhere}
.q .blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);color:var(--accent);margin:0 2px}
.q.done .blank{color:var(--ok);border-color:var(--ok)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;min-height:58px;padding:8px;font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt:disabled{cursor:default}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:.95rem}.exp b{font-family:var(--font-display);font-weight:400;font-size:1.05rem;color:var(--accent)}.exp p{margin:0}.exp .eg{background:var(--soft);border-radius:10px;padding:8px 10px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
</style>
</head>
<body>
<main>
  <h1>속담 퀴즈 📜</h1>
  <div class="stats"><div class="stat"><small>문제</small><b id="no">0/10</b></div><div class="stat"><small>맞힌 수</small><b id="score">0</b></div><div class="stat"><small>최고</small><b id="best">0</b></div></div>
  <div class="q" id="q"></div>
  <div class="opts" id="opts"></div>
  <div class="exp" id="exp" hidden></div>
  <div class="res" id="res" hidden></div>
  <button class="btn" id="next" type="button" hidden>다음 문제</button>
  <p class="muted">빈칸에 들어갈 말을 골라 속담을 완성해 보세요. 10문제를 풀면 결과가 나와요.</p>
</main>
<script>
// [앞부분, 빈칸 정답, 뒷부분, 틀린 보기 3개, 뜻풀이, 쓰이는 상황 예시]
const D = [
["가는 말이 고와야 오는 말이 ","곱다","",["거칠다","빠르다","많다"],"내가 남에게 좋게 말해야 남도 나에게 좋게 말한다는 뜻이에요.","친구에게 먼저 \"고마워\"라고 말했더니 친구도 다정하게 대해 줬어요. 가는 말이 고와야 오는 말이 곱다더니 맞는 말이네요."],["낮말은 새가 듣고 밤말은 ","쥐가"," 듣는다",["고양이가","개가","바람이"],"아무도 없는 곳에서 한 말도 누군가 들을 수 있으니 말조심을 하라는 뜻이에요.","없는 친구 흉을 봤는데 그 친구가 알게 됐어요. 낮말은 새가 듣고 밤말은 쥐가 듣는다더니!"],["호랑이도 제 말 하면 ","온다","",["웃는다","운다","떠난다"],"그 사람이 없는 곳에서 이야기하면 마침 그 사람이 나타난다는 뜻이에요.","\"민수 어디 갔지?\" 하는데 민수가 들어왔어요. 호랑이도 제 말 하면 온다더니!"],
["티끌 모아 ","태산","",["바다","부자","보석"],"작은 것도 꾸준히 모으면 나중에 큰 것이 된다는 뜻이에요.","매일 500원씩 저금통에 넣었더니 몇 달 만에 만 원이 넘었어요. 티끌 모아 태산이네요."],["백지장도 맞들면 ","낫다","",["가볍다","찢어진다","깨끗하다"],"쉬운 일도 힘을 합치면 훨씬 더 쉬워진다는 뜻이에요.","혼자 옮기던 책상을 친구와 같이 드니 금방 옮겼어요. 백지장도 맞들면 낫다더니!"],["소 잃고 ","외양간"," 고친다",["마구간","대문","지붕"],"일이 잘못된 뒤에 뒤늦게 대비해 봐야 소용없다는 뜻이에요.","시험이 끝난 뒤에야 공부 계획을 세웠어요. 소 잃고 외양간 고치기예요."],
["우물 안 ","개구리","",["두꺼비","올챙이","물고기"],"넓은 세상을 모르고 자기가 아는 것만 전부라고 생각하는 사람을 뜻해요.","우리 반에서 1등이라고 자랑하던 친구가 전국 대회에 나가 보고 놀랐어요. 우물 안 개구리였던 거예요."],["원숭이도 ","나무","에서 떨어진다",["바위","지붕","하늘"],"아무리 잘하는 사람도 가끔은 실수할 수 있다는 뜻이에요.","요리사인 아빠가 국에 소금을 두 번 넣었어요. 원숭이도 나무에서 떨어진다더니!"],["세 살 버릇 ","여든","까지 간다",["마흔","쉰","예순"],"어릴 때 몸에 밴 버릇은 어른이 되어서도 고치기 어렵다는 뜻이에요.","어릴 때부터 늦잠 자던 동생이 지금도 늦잠을 자요. 세 살 버릇 여든까지 간다더니!"],
["하늘이 무너져도 ","솟아날"," 구멍이 있다",["숨을","도망갈","올라갈"],"아무리 어려운 상황에서도 해결할 방법은 반드시 있다는 뜻이에요.","시험을 망쳐서 걱정했지만 다음 시험에서 만회했어요. 하늘이 무너져도 솟아날 구멍이 있다더니!"],["열 길 물속은 알아도 한 길 ","사람"," 속은 모른다",["바다","하늘","땅"],"사람의 마음은 겉으로 봐서는 알기 어렵다는 뜻이에요.","늘 웃던 친구가 사실 고민이 많았다는 걸 오늘 알았어요. 열 길 물속은 알아도 한 길 사람 속은 모른다더니!"],["누워서 ","떡"," 먹기",["밥","과자","죽"],"하기 매우 쉬운 일을 가리키는 말이에요.","그 문제는 이미 풀어 본 적이 있어서 누워서 떡 먹기였어요."],
["고래 싸움에 ","새우"," 등 터진다",["물고기","멸치","조개"],"강한 사람들끼리 싸우는 바람에 아무 상관 없는 약한 사람이 피해를 본다는 뜻이에요.","형과 누나가 싸우다가 옆에 있던 내가 혼났어요. 고래 싸움에 새우 등 터진 거예요."],["말 한마디로 ","천 냥"," 빚을 갚는다",["만 냥","백 냥","열 냥"],"말을 잘하면 어려운 일도 풀 수 있다는 뜻이에요.","\"죄송해요, 제가 잘못했어요.\" 진심으로 말했더니 선생님이 용서해 주셨어요. 말 한마디로 천 냥 빚을 갚는다더니!"],["가재는 ","게"," 편",["새우","물고기","조개"],"처지가 비슷한 사람끼리 서로 편이 되어 준다는 뜻이에요.","같은 동네 친구라서 서로 편을 들었어요. 가재는 게 편이라더니!"],
["사공이 많으면 배가 ","산으로"," 간다",["바다로","하늘로","집으로"],"여러 사람이 서로 자기 의견만 내세우면 일이 엉뚱한 방향으로 간다는 뜻이에요.","모둠 발표를 준비하는데 모두 자기 방식만 고집해서 엉망이 됐어요. 사공이 많으면 배가 산으로 간다더니!"],["돌다리도 두들겨 보고 ","건너라","",["뛰어라","던져라","부숴라"],"잘 아는 일이라도 꼼꼼하게 확인하고 조심하라는 뜻이에요.","잘 아는 길이었지만 신호등을 다시 확인하고 건넜어요. 돌다리도 두들겨 보고 건너라고 했으니까요."],["아니 땐 굴뚝에 ","연기"," 나랴",["불","구름","눈"],"원인이 있어야 결과가 생긴다는 뜻이에요. 소문에는 그럴 만한 이유가 있다는 말로도 써요.","둘이 사귄다는 소문이 돌더니 정말이었어요. 아니 땐 굴뚝에 연기 나랴."],
["천 리 길도 ","한 걸음","부터",["두 걸음","첫 발","한 시간"],"아무리 큰 일도 첫걸음부터 시작된다는 뜻이에요.","책 한 권을 다 읽는 게 막막했지만 한 쪽부터 읽기 시작했어요. 천 리 길도 한 걸음부터예요."],["콩 심은 데 콩 나고 팥 심은 데 ","팥"," 난다",["쌀","콩","깨"],"원인에 따라 결과가 나온다는 뜻이에요. 노력한 대로 결과가 나온다는 말로도 써요.","매일 연습한 만큼 실력이 늘었어요. 콩 심은 데 콩 나고 팥 심은 데 팥 난다더니!"],["비 온 뒤에 ","땅","이 굳는다",["길","집","산"],"어려운 일을 겪고 나면 오히려 더 단단해진다는 뜻이에요.","친구와 크게 다투고 화해한 뒤 더 친해졌어요. 비 온 뒤에 땅이 굳는다더니!"],
["믿는 도끼에 ","발등"," 찍힌다",["손등","머리","무릎"],"믿었던 사람에게 배신당하거나 해를 입는다는 뜻이에요.","가장 믿던 친구가 내 비밀을 말해 버렸어요. 믿는 도끼에 발등 찍혔어요."],["꿩 대신 ","닭","",["오리","참새","비둘기"],"꼭 맞는 것이 없을 때 비슷한 다른 것으로 대신한다는 뜻이에요.","소고기가 없어서 닭고기로 요리했어요. 꿩 대신 닭이죠."],["윗물이 맑아야 ","아랫물","이 맑다",["바닷물","냇물","빗물"],"윗사람이 바르게 행동해야 아랫사람도 따라서 바르게 행동한다는 뜻이에요.","반장이 먼저 청소를 하니 친구들도 따라 했어요. 윗물이 맑아야 아랫물이 맑다더니!"],
["그림의 ","떡","",["꽃","밥","집"],"보기만 할 뿐 가질 수 없거나 쓸 수 없는 것을 뜻해요.","갖고 싶은 비싼 장난감이 진열장에 있지만 살 수 없어요. 그림의 떡이에요."],["될성부른 나무는 ","떡잎","부터 알아본다",["뿌리","가지","열매"],"잘될 사람은 어릴 때부터 남다른 모습이 보인다는 뜻이에요.","어릴 때부터 그림을 잘 그리던 친구가 화가가 되었어요. 될성부른 나무는 떡잎부터 알아본다더니!"],["바늘 도둑이 ","소 도둑"," 된다",["큰 도둑","말 도둑","돼지 도둑"],"작은 나쁜 짓도 계속하면 큰 잘못으로 이어진다는 뜻이에요.","처음엔 작은 지우개를 몰래 가져갔는데 점점 큰 물건에도 손을 댔어요. 바늘 도둑이 소 도둑 된다더니!"],
["우물에 가 ","숭늉"," 찾는다",["물","차","국"],"일의 순서도 모르고 성급하게 서두른다는 뜻이에요.","씨앗을 심자마자 열매가 열리기를 바라는 건 우물에 가 숭늉 찾는 격이에요."],["제 눈에 ","안경","",["거울","보석","눈물"],"남이 보기에는 별로여도 자기 눈에는 좋아 보인다는 뜻이에요.","친구가 만든 서툰 그림이 나는 너무 멋져 보였어요. 제 눈에 안경이니까요."],["목마른 사람이 ","우물","을 판다",["샘","강","연못"],"급하고 필요한 사람이 먼저 나서서 일을 한다는 뜻이에요.","발표 자료가 필요했던 내가 직접 만들었어요. 목마른 사람이 우물을 판다고 하잖아요."],
["병 주고 ","약"," 준다",["밥","돈","꽃"],"해를 끼치고 나서 도와주는 척하는 사람을 뜻해요.","동생을 울려 놓고 사탕을 주는 형을 보고 엄마가 \"병 주고 약 주는구나\" 하셨어요."],["꼬리가 길면 ","밟힌다","",["잘린다","빠진다","떨어진다"],"나쁜 짓도 계속하면 결국 들키게 된다는 뜻이에요.","몇 번이나 몰래 숙제를 베끼다 결국 들켰어요. 꼬리가 길면 밟힌다더니!"],["작은 고추가 더 ","맵다","",["크다","빨갛다","쓰다"],"겉모습이 작아도 속은 야무지고 능력이 뛰어나다는 뜻이에요.","키는 작지만 달리기가 제일 빠른 친구예요. 작은 고추가 더 맵다더니!"],
["앓던 ","이"," 빠진 것 같다",["손톱","머리카락","발톱"],"오래 괴롭히던 걱정거리가 사라져 속이 시원하다는 뜻이에요.","몇 주 동안 걱정하던 시험이 끝나서 앓던 이 빠진 것 같아요."],["공든 ","탑","이 무너지랴",["집","산","담"],"정성을 다해 만든 것은 쉽게 무너지거나 헛되지 않는다는 뜻이에요.","몇 달 동안 열심히 준비한 발표가 대성공이었어요. 공든 탑이 무너지랴!"],["낫 놓고 ","기역"," 자도 모른다",["니은","디귿","리을"],"글자를 전혀 모를 만큼 아주 무식하다는 뜻이에요. 기역은 'ㄱ'을 말해요.","낫처럼 생긴 ㄱ자를 보고도 글자를 모른다는 뜻으로, 아주 무식한 사람을 놀릴 때 쓰던 말이에요."]
];
const $ = id => document.getElementById(id), KEY = "proverb-best-v1";
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let qs = [], i = 0, score = 0, best = ld(KEY) || 0, locked = false;

function start() { qs = shuf(D).slice(0, 10).map(d => ({ d, opts: shuf([d[1], ...d[3]]) })); i = 0; score = 0; $("res").hidden = true; show(); }
function show() {
  const { d, opts } = qs[i]; locked = false; $("next").hidden = true; $("exp").hidden = true;
  $("q").className = "q"; $("q").innerHTML = `${esc(d[0])}<span class="blank">&nbsp;?&nbsp;</span>${esc(d[2])}`;
  $("opts").innerHTML = opts.map((o, k) => `<button class="opt" type="button" data-k="${k}">${esc(o)}</button>`).join("");
  $("no").textContent = (i + 1) + "/10"; $("score").textContent = score; $("best").textContent = best;
}
function pick(k) {
  if (locked) return; locked = true; const { d, opts } = qs[i], ok = opts[k] === d[1];
  if (ok) score++;
  document.querySelectorAll(".opt").forEach((b, n) => { b.disabled = true; if (opts[n] === d[1]) b.classList.add("ok"); else if (n === k) b.classList.add("bad"); });
  $("q").className = "q done"; $("q").innerHTML = `${esc(d[0])}<span class="blank">${esc(d[1])}</span>${esc(d[2])}`;
  $("exp").innerHTML = `<div><b>📖 뜻풀이</b><p>${esc(d[4])}</p></div><div><b>💬 이럴 때 써요</b><p class="eg">${esc(d[5])}</p></div>`; $("exp").hidden = false;
  $("score").textContent = score; $("next").textContent = i === 9 ? "결과 보기" : "다음 문제"; $("next").hidden = false;
}
function finish() {
  let note = ""; if (score > best) { best = score; sv(KEY, best); note = " 🏆 최고 기록이에요!"; }
  $("q").innerHTML = "끝!"; $("opts").innerHTML = ""; $("exp").hidden = true; $("next").hidden = true;
  $("res").innerHTML = `<b>10문제 중 ${score}개 정답</b><p class="muted">${score >= 9 ? "속담 박사님! 🎓" : score >= 6 ? "잘했어요 👍" : "조금만 더 힘내요 💪"}${note}</p><button class="btn" id="again" type="button" style="margin-top:10px;width:100%">다시 하기</button>`;
  $("res").hidden = false; $("best").textContent = best; $("again").onclick = start;
}
$("opts").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) pick(+b.dataset.k); });
$("next").onclick = () => { if (i === 9) finish(); else { i++; show(); } };
start();
</script>
</body>
</html>
