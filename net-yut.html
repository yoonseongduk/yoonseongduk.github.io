<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(25 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(25 22% 86%);--accent:hsl(25 65% 46%);--accent-fg:#fff;--soft:hsl(25 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(25 22% 10%);--surface:hsl(25 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(25 16% 25%);--accent:hsl(25 75% 68%);--accent-fg:#10131c;--soft:hsl(25 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.qr{display:block;width:100%;max-width:300px;margin:0 auto;image-rendering:pixelated;border-radius:8px;background:#fff}
.lb{font-size:.88rem;color:var(--muted);font-weight:700}.note{font-size:.85rem;color:var(--muted)}.btn.sm{padding:9px 14px;font-size:1rem}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--muted);margin-right:6px}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,300px);margin:0 auto}
.ttt button{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-family:var(--font-display);font-size:3rem;line-height:1}
.ttt button.w{background:color-mix(in srgb,var(--ok) 30%,var(--surface))}
#scan{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#scan video{width:100%;max-width:440px;border-radius:12px}#scan p{color:#fff;text-align:center}
#flash{position:fixed;inset:0;z-index:60;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:2rem;text-align:center;padding:16px}
textarea.code{min-height:70px;font-size:.75rem;word-break:break-all}.inhub body{padding:4px 0 8px;background:transparent}.inhub h1{display:none}.inhub main{max-width:none}
.note{font-size:.85rem;color:var(--muted)}.btn.sm{padding:9px 14px;font-size:1rem}
.grid8{display:grid;gap:3px;width:min(100%,340px);margin:0 auto}.grid8 button{aspect-ratio:1;border-radius:6px;border:0;padding:0;font-size:1.3rem;line-height:1}
.big{font-family:var(--font-display);font-size:clamp(2rem,12vw,3.4rem);text-align:center;line-height:1.2}
.choice{display:grid;gap:8px}.choice button{padding:14px 8px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-family:var(--font-display);font-size:1.3rem}.choice button[disabled]{opacity:.4}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}
.yb{width:100%;max-width:360px;margin:0 auto;display:block;touch-action:manipulation}.yb .yl{fill:none;stroke:var(--line);stroke-width:4;stroke-linejoin:round}
.yb .yc{fill:var(--surface);stroke:var(--fg);stroke-width:1.6}.yb .yc.big{fill:color-mix(in srgb,var(--accent) 20%,var(--surface));stroke-width:2.4}.yb .yc.hl{fill:color-mix(in srgb,#2e9d5b 40%,var(--surface));stroke:#2e9d5b;stroke-width:4;cursor:pointer;animation:ypulse .8s infinite alternate}
@keyframes ypulse{to{stroke-width:2}}
.yb .yn{font-size:9px;fill:var(--muted);pointer-events:none;font-family:var(--font-body)}.yb .yn.s{font-size:7.5px}.yb .yt{pointer-events:none}.yb .ytn{font-size:15px;font-weight:800;fill:#fff;pointer-events:none}
.sticks{font-size:2rem;display:flex;justify-content:center;gap:10px;min-height:1.4em}.sticks .sf{color:#c78a3b}.sticks .sr{color:#8a5a22}.sticks .mk{outline:2px dashed #d6453a;outline-offset:2px;border-radius:4px}
.sticks{min-height:0}.ycard{height:190px;width:auto;max-width:100%;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:ythrow .65s cubic-bezier(.2,.9,.3,1.2)}
@keyframes ythrow{0%{transform:translateY(-70px) rotate(-14deg) scale(.55);opacity:0}55%{transform:translateY(8px) rotate(3deg) scale(1.06);opacity:1}100%{transform:none}}
.yth{height:56px;width:auto;border-radius:6px;display:block}
@media(prefers-reduced-motion:reduce){.ycard{animation:none}}
.pcsb{display:grid;gap:6px}.pcsb button{text-align:left;line-height:1.35}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin:4px 0}.tbl td{padding:3px 4px;border-bottom:1px solid var(--line)}
details summary{cursor:pointer;font-weight:700}.note{font-size:.85rem;color:var(--muted);line-height:1.6}
@media(prefers-reduced-motion:reduce){.yb .yc.hl{animation:none}}

</style>

<body>
<main>
  <h1>윷놀이 (같이 하기) 🪵</h1>
  <div class="card"><p class="center" id="st"></p><div id="brd"></div><div class="center"><div class="sticks" id="sticks">🥢🥢🥢🥢</div><p class="big center" id="res" style="font-size:1.8rem;min-height:1.3em"></p></div><p class="center note" id="pnl"></p><div class="pcsb" id="pick" hidden></div><button class="btn" id="th" type="button" hidden>🥢 윷 던지기</button><div id="rules"></div><p class="center note" id="sc"></p><button class="btn ghost sm" id="again" type="button" hidden>새 판</button></div>
  <p class="muted">일반 규칙 윷놀이예요. 말 4개를 먼저 모두 도착시키면 이겨요. 지름길(5번·10번·가운데), 업기, 빽도, 잡기가 있고 윷·모·잡기는 한 번 더 던져요. 던지고 나면 움직일 말을 골라요(초록 칸을 눌러도 돼요). 규칙은 화면 맨 아래에 있어요.</p>
</main>
<script src="yut-core.js"></script>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "net-yut-v1";

// 같이 하기 화면과 말 주고받기. 혼자 열면 안내만 보여요.
const NET = (() => {
  const inHub = window.parent !== window, cb = { init: [], msg: [], roster: [] }; let info = null;
  const post = m => { try { window.parent.postMessage(m, "*"); } catch (e) {} };
  addEventListener("message", e => { if (e.source !== window.parent) return; const m = e.data || {};
    if (m.fg === "init") { info = m; cb.init.forEach(f => f(m)); } else if (m.fg === "roster" && info) { info.players = m.players; cb.roster.forEach(f => f(m.players)); } else if (m.fg === "msg") cb.msg.forEach(f => f(m.from, m.d)); });
  // 높이는 내용(main) 기준으로 재요. 문서 전체 높이는 화면 칸보다 작아지지 않아서, 짧은 게임으로 바꿔도 줄지 않거든요.
  const fit = () => { const m = document.querySelector("main"); post({ fg: "h", h: Math.ceil((m ? m.getBoundingClientRect().bottom : document.body.scrollHeight) + 12) }); };
  if (inHub) { document.documentElement.classList.add("inhub"); try { new ResizeObserver(fit).observe(document.body); } catch (e) { setInterval(fit, 500); } addEventListener("load", () => post({ fg: "ready" })); }
  return { inHub, get info() { return info; }, on: (k, f) => cb[k].push(f), send: (to, d) => post({ fg: "send", to, d }) };
})();
const nameOf = id => { const p = (NET.info && NET.info.players || []).find(x => x.id === id); return p ? p.name : "?"; };
if (!NET.inHub) document.addEventListener("DOMContentLoaded", () => { document.querySelector("main").insertAdjacentHTML("afterbegin", '<div class="card"><p>이 게임은 <b>👫 같이 하기</b> 화면 안에서 폰 여러 대를 연결해 해요.</p><a class="btn" style="text-align:center;text-decoration:none" href="play-together.html">같이 하기 열기</a></div>'); });

let me = null, isHost = false, P = null;
const H = {};
const amPlayer = () => !!P && (me === P.a || me === P.b);
const oppOf = id => id === P.a ? P.b : P.a;
const nm = id => id === me ? "나" : id === P.a ? P.na : P.nb;
function round(keep) {
  const a = P ? P.a : "host", b = P ? P.b : null, opt = P ? P.opt : {}, sc = keep && P ? P.sc : {}, first = keep && P && b ? (P.first === a ? b : a) : a;
  Object.keys(H).forEach(k => delete H[k]); P = { a, b, opt, sc, first, win: null, ph: "wait" }; if (b) Object.assign(P, newRound());
}
function pickB(ps) { if (P.b && ps.some(p => p.id === P.b)) return false; const nx = ps.find(p => p.id !== "host"); P.b = nx ? nx.id : null; round(false); return true; }
// afterPush(있으면): 상태를 보낸 뒤 할 일(예: 각자 비밀 패 보내기). privTo: 한 사람에게만 보내는 말(받는 쪽 onPriv)
function pushS() { if (!isHost) return; P.na = nameOf(P.a); P.nb = P.b ? nameOf(P.b) : ""; NET.send("*", { t: "state", P }); render(); if (typeof afterPush === "function") afterPush(); }
const privTo = (id, d) => { d.t = "priv"; if (id === me) onPriv(d); else NET.send(id, d); };
function finish(w) { P.ph = "end"; P.win = w; P.sc[w] = (P.sc[w] || 0) + 1; }
const act = d => { if (isHost) { if (P && (P.a === "host" || P.b === "host")) onAct("host", d); } else NET.send("host", d); };
NET.on("init", m => { me = m.me.id; isHost = m.isHost; if (isHost) { round(false); pickB(m.players); pushS(); } else NET.send("host", { t: "hello" }); render(); });
NET.on("roster", ps => { if (isHost && P) { pickB(ps); pushS(); } else render(); });
NET.on("msg", (from, d) => { if (isHost) { if (d.t === "hello") pushS(); else if (P && (from === P.a || from === P.b)) onAct(from, d); } else if (d.t === "state") { const was = P && P.ph; P = d.P; changed(was); render(); } else if (d.t === "priv" && typeof onPriv === "function") onPriv(d); });
const scoreLine = () => P && P.b ? `${P.na} ${P.sc[P.a] || 0} : ${P.sc[P.b] || 0} ${P.nb}${P.sc.D ? " · 무승부 " + P.sc.D : ""}` : "";
const endText = () => P.win === "D" ? "비겼어요!" : P.win === me ? "🎉 이겼어요!" : amPlayer() ? "😢 졌어요… 다음 판에 다시!" : `🎉 ${nm(P.win)} 승리!`;
function common() { $("again").hidden = !(amPlayer() && P.ph === "end"); $("sc").textContent = scoreLine(); }
$("again").onclick = () => act({ t: "again" });

const Y = window.YutCore, YCOL = ["#3b6fd6", "#d6453a"];
// 말판 그리기. sides = [{s: 편 상태, c: 색}], hl = 도착할 수 있는 칸 목록(눌러서 고르기)
function yBoard(sides, hl) {
  const X = Y.XY, hs = new Set(hl || []);
  const L = (a, b) => `<line x1="${X[a][0]}" y1="${X[a][1]}" x2="${X[b][0]}" y2="${X[b][1]}" class="yl"/>`;
  let h = `<polygon points="${[0, 5, 10, 15].map(i => X[i].join(",")).join(" ")}" class="yl"/>` + L(5, 22) + L(22, 15) + L(10, 22) + L(22, 0);
  for (let n = 0; n < 29; n++) {
    const big = Y.CORNER[n], r = big ? 17 : 11, on = hs.has(n) ? " hl" : "";
    h += `<circle cx="${X[n][0]}" cy="${X[n][1]}" r="${r}" class="yc${big ? " big" : ""}${on}" data-to="${n}"/>`;
    h += n === 0 ? `<text x="${X[n][0]}" y="${X[n][1] - 1}" class="yn s" text-anchor="middle">출발</text><text x="${X[n][0]}" y="${X[n][1] + 8}" class="yn s" text-anchor="middle">도착</text>` : `<text x="${X[n][0]}" y="${X[n][1] + 3}" class="yn" text-anchor="middle">${n === 22 ? "중앙" : n}</text>`;
  }
  sides.forEach((sd, i) => sd.s.stacks.forEach(st => { const [x, y] = X[st.at];
    h += `<g class="yt" data-to="${st.at}"><circle cx="${x}" cy="${y}" r="14" fill="${sd.c}" stroke="#fff" stroke-width="2.5"/>${st.n > 1 ? `<text x="${x}" y="${y + 5}" text-anchor="middle" class="ytn">${st.n}</text>` : ""}</g>`; }));
  return `<svg class="yb" viewBox="0 0 320 320" role="img" aria-label="윷놀이 말판">${h}</svg>`;
}
const yNode = n => n === 0 ? "출발점" : n === 22 ? "가운데(22번)" : (n === 5 || n === 10 || n === 15 ? n + "번(모서리)" : n + "번 칸");
const yTo = t => t === Y.END ? "도착! 🏁" : t === Y.HOME ? "출발 전으로 돌아가요" : yNode(t);
function yOpt(m, sd) { // 움직임 하나를 글로: "3번 칸의 말 2개(업은 말) → 8번 칸 · 잡기!"
  const from = m.from < 0 ? "출발 전 말 1개" : yNode(sd.stacks[m.from].at) + "의 말 " + m.n + "개" + (m.n > 1 ? "(업은 말)" : "");
  return from + " → " + yTo(m.to) + (m.cap ? " · 잡기! (" + m.cap + "개)" : "") + (m.stack ? " · 업기" : "");
}
const YIMG = { "-1": "backdo", 1: "do", 2: "gae", 3: "geol", 4: "yut", 5: "mo" };   // 결과 카드 그림: yut-img/yut_*.svg (사용자가 만든 그림)
Object.values(YIMG).forEach(k => { const im = new Image(); im.src = "yut-img/yut_" + k + ".svg"; });   // 던질 때 늦게 뜨지 않게 미리 불러와요
const yCard = n => YIMG[n] ? `<img class="ycard" src="yut-img/yut_${YIMG[n]}.svg" alt="${Y.NAMES[n]}" draggable="false">` : "🥢🥢🥢🥢";
function yPanel(sd, mark) { return `${mark} 출발 전 ${sd.w} · 도착 ${sd.done}/4` + (sd.stacks.length ? " · 판 위 " + sd.stacks.map(s => yNode(s.at) + (s.n > 1 ? " ×" + s.n : "")).join(", ") : ""); }
const yRules = () => `<details open><summary>📘 윷놀이 규칙 (일반 규칙)</summary><div class="note" style="margin-top:6px">
  <b>목표</b>: 내 말 <b>4개</b>를 먼저 모두 한 바퀴 돌려 <b>도착</b>시키면 이겨요.<br>
  <b>윷 던지기</b>: 가락 4개의 평평한 면(▬)이 몇 개인지 봐요.
  <table class="tbl"><tbody><tr><td><img class="yth" src="yut-img/yut_do.svg" alt="도"></td><td>평평한 면 1개</td><td><b>도</b> 1칸</td></tr><tr><td><img class="yth" src="yut-img/yut_gae.svg" alt="개"></td><td>2개</td><td><b>개</b> 2칸</td></tr><tr><td><img class="yth" src="yut-img/yut_geol.svg" alt="걸"></td><td>3개</td><td><b>걸</b> 3칸</td></tr><tr><td><img class="yth" src="yut-img/yut_yut.svg" alt="윷"></td><td>4개</td><td><b>윷</b> 4칸 · 한 번 더</td></tr><tr><td><img class="yth" src="yut-img/yut_mo.svg" alt="모"></td><td>0개(모두 둥글어요)</td><td><b>모</b> 5칸 · 한 번 더</td></tr><tr><td><img class="yth" src="yut-img/yut_backdo.svg" alt="빽도"></td><td>도인데 ✖ 표시 가락이 평평</td><td><b>빽도</b> 뒤로 1칸</td></tr></tbody></table>
  <b>말판</b>: 바깥 길을 반시계 방향으로 출발점(0)에서 시작해 19번 칸을 지나면 도착이에요. 말은 던진 칸 수만큼 움직여요. 도착은 출발점을 정확히 밟거나 지나가면 돼요.<br>
  <b>🔀 지름길</b>: 모서리 <b>5번</b>이나 <b>10번</b>에 <b>서 있다가</b> 다음에 움직이면 안쪽 길로 들어가요. 그냥 지나가기만 하면 바깥 길이에요.<br>
  &nbsp;&nbsp;• 5번에서 시작: 20→21→<b>가운데(22)</b>→23→24→15번으로 나와 바깥 길(15 이후)을 이어 가요.<br>
  &nbsp;&nbsp;• 10번에서 시작: 25→26→<b>가운데(22)</b>→27→28→바로 도착! (가장 빨라요)<br>
  &nbsp;&nbsp;• 가운데(22)에 서 있다가 움직이면 27→28→도착 쪽으로 나가요.<br>
  <b>🤝 업기</b>: 내 말이 있는 칸에 내 다른 말이 도착하면 한 덩어리가 돼서 <b>함께 움직여요</b>(숫자로 표시). 이동할 때도, 잡힐 때도 같이예요.<br>
  <b>⚔️ 잡기</b>: 상대 말이 있는 칸에 서면 그 칸의 상대 말을 <b>모두 잡아</b> 출발 전으로 돌려보내요. 잡으면 <b>한 번 더</b> 던져요.<br>
  <b>↩️ 빽도</b>: 뒤로 한 칸(온 길을 따라). 출발 전 말은 움직일 수 없고, 1번 칸의 말은 출발 전으로 돌아가요. 움직일 말이 없으면 차례가 넘어가요.<br>
  <b>한 번 더</b>: 윷·모가 나오거나 상대 말을 잡았을 때예요.<br>

function newRound() { return { ph: "play", s: { [P.a]: Y.newSide(), [P.b]: Y.newSide() }, turn: P.first, roll: null, msg: "", tf: null, tn: "", tr: 0, tk: 0 }; }
const mk = id => id === P.a ? "🔵" : "🔴", colOf = id => id === P.a ? YCOL[0] : YCOL[1];
function optsOf(id, r) { return Y.options(P.s[id], P.s[oppOf(id)], r); }
function resolveNet(from, r, k) {
  const o = oppOf(from), ops = optsOf(from, r), mv = ops[k]; if (!mv) return false;
  const text = yOpt(mv, P.s[from]), res = Y.apply(P.s[from], P.s[o], mv, r); P.roll = null;
  P.msg = `${nameOf(from)}: ${text}` + (res.cap ? " → 상대 말을 잡았어요!" : "") + (res.fin ? ` (${res.fin}개 도착)` : "");
  if (Y.won(P.s[from])) finish(from); else if (res.extra) P.msg += " · 한 번 더 던져요!"; else P.turn = o;
  return true;
}
function onAct(from, d) {
  if (P.ph === "end" && d.t === "again") { round(true); pushS(); return; }
  if (P.ph !== "play" || from !== P.turn) return;
  const o = oppOf(from);
  if (d.t === "throw" && P.roll === null) {
    const t = Y.toss(); P.tf = t.flat; P.tn = t.name; P.tr = t.n; P.tk = (P.tk || 0) + 1; const ops = optsOf(from, t.n);
    if (!ops.length) { P.msg = `${nameOf(from)}: ${t.name}! 움직일 수 있는 말이 없어서 차례가 넘어가요`; P.turn = o; }
    else if (ops.length === 1) resolveNet(from, t.n, 0);
    else { P.roll = t.n; P.msg = `${nameOf(from)}: ${t.name}! 움직일 말을 골라요`; }
  } else if (d.t === "move" && P.roll !== null) { if (!resolveNet(from, P.roll, +d.k)) return; }
  else return;
  pushS();
}
function changed(was) {}
let shownK = -1;
function render() {
  if (!P || !P.s) { $("st").textContent = !P ? "연결을 기다리는 중…" : "상대가 들어오면 시작해요"; $("brd").innerHTML = ""; $("th").hidden = true; $("pick").hidden = true; $("pnl").textContent = ""; if (!$("rules").firstChild) $("rules").innerHTML = yRules(); if (P) common(); return; }
  const pl = amPlayer(), can = P.ph === "play" && P.turn === me, mine = can && P.roll !== null, ops = mine ? optsOf(me, P.roll) : [];
  $("st").textContent = P.ph === "end" ? endText() : (P.msg ? P.msg + " · " : "") + (!pl ? `구경 중 · ${mk(P.turn)} ${nm(P.turn)} 차례` : can ? (P.roll !== null ? `${Y.NAMES[P.roll]}! 움직일 말을 골라요` : "내 차례! 윷을 던져요") : "상대 차례예요…");
  $("brd").innerHTML = yBoard([{ s: P.s[P.a], c: YCOL[0] }, { s: P.s[P.b], c: YCOL[1] }], [...new Set(ops.filter(m => typeof m.to === "number").map(m => m.to))]);
  if (!P.tr) { $("sticks").innerHTML = yCard(0); shownK = -1; } else if (shownK !== P.tk) { $("sticks").innerHTML = yCard(P.tr); shownK = P.tk; }   // 새로 던졌을 때만 다시 그려서 튀어나오는 동작이 한 번만 보이게
  $("res").textContent = P.tn || "";
  $("pnl").innerHTML = [P.a, P.b].map(id => esc(mk(id) + " " + nm(id) + ": " + yPanel(P.s[id], "").trim())).join("<br>");
  $("th").hidden = !(can && P.roll === null); $("pick").hidden = !mine;
  $("pick").innerHTML = mine ? ops.map((m, k) => `<button class="btn ghost sm" type="button" data-k="${k}">${esc(yOpt(m, P.s[me]))}</button>`).join("") : "";
  if (!$("rules").firstChild) $("rules").innerHTML = yRules(); common();
}
$("th").onclick = () => act({ t: "throw" });
$("pick").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) act({ t: "move", k: +b.dataset.k }); });
$("brd").addEventListener("click", e => { const c = e.target.closest("[data-to]"); if (!c || !P || !P.s || P.turn !== me || P.roll === null) return; const k = optsOf(me, P.roll).findIndex(m => m.to === +c.dataset.to); if (k >= 0) act({ t: "move", k }); });
render();
