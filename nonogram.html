let genLoaded = false;   // 프로그램이 만든 그림(data/nonogram-gen.json)을 불러왔는지. 못 불러와도 직접 디자인한 그림으로 계속 돼요
try { fetch("data/nonogram-gen.json").then(r => (r.ok ? r.json() : null)).then(d => { if (!d) return; Object.keys(d).forEach(k => { if (PICS[k]) PICS[k] = PICS[k].slice(0, HAND[k]).concat(d[k]); }); genLoaded = true; }).catch(() => {}); } catch (e) {}
let pic = null, picNo = 0; const lastK = {};   // pic = 이번 판의 숨은 그림 {n 이름, e 이모지, g 줄 목록}. 크기별로 방금 한 그림은 바로 다시 안 나와요
function makePuzzle() {            // 숨은 그림(직접 디자인한 그림, 정답이 하나뿐인 것만)을 하나 골라 칠할 칸으로 바꾼다
  const list = PICS[n]; let k;   // 직접 디자인한 그림을 35%, 나머지는 프로그램이 만든 그림(불러왔을 때)에서 고른다
  do { k = genLoaded && list.length > HAND[n] && Math.random() > .35 ? HAND[n] + Math.floor(Math.random() * (list.length - HAND[n])) : Math.floor(Math.random() * HAND[n]); } while (list.length > 1 && k === lastK[n]);
  lastK[n] = k; pic = list[k]; picNo = k + 1; return pic.g.map(r => [...r].map(ch => (ch === "." ? 0 : 1)));
}
function newGame() {
  zoomIn = true; if (mode === "move") mode = "fill"; clearInterval(timer); n = LV[lv].n; sol = makePuzzle(); cur = Array.from({ length: n }, () => Array(n).fill(0)); t0 = 0; done = false; revealed = false; $("time").textContent = "0:00"; $("res").hidden = true; render();
}
function startTimer() { if (t0 || done) return; t0 = Date.now(); timer = setInterval(() => { $("time").textContent = fmt(Math.floor((Date.now() - t0) / 1000)); }, 500); }
const rowClues = () => sol.map(r => runs(r)), colClues = () => sol[0].map((_, x) => runs(sol.map(r => r[x])));
function solvedNow() { const rc = rowClues(), cc = colClues(); return cur.every((_, y) => same(runs(rowOf(cur, y)), rc[y])) && sol[0].every((_, x) => same(runs(colOf(cur, x)), cc[x])); }
function set(y, x, v) { if (done || cur[y][x] === v) return; startTimer(); cur[y][x] = v; render(); if (solvedNow()) win(); }
function win() {
  done = true; zoomIn = false; clearInterval(timer); const s = Math.max(1, Math.floor((Date.now() - t0) / 1000)); let t = `${fmt(s)} 만에 완성했어요.`;
  if (!revealed && (!best[lv] || s < best[lv])) { best[lv] = s; sv(KEY, best); t += " 🏆 최고 기록이에요!"; }
  $("res").innerHTML = `<b>🎉 완성!</b><div style="font-size:2.6rem;line-height:1.2;margin:2px 0">${pic.e}</div><p style="margin:0"><span style="font-weight:700">${pic.n}</span> 그림이 나타났어요!</p><p class="muted" style="margin:0">그림 ${picNo} / ${PICS[n].length}</p><p class="muted">${t}</p>`; $("res").hidden = false; render();
}
function render() {
  const rc = rowClues(), cc = colClues(), rows = cur.map((_, y) => runs(rowOf(cur, y))), cols = sol[0].map((_, x) => runs(colOf(cur, x)));
  const side = Math.max(...rc.map(r => r.length)), big = n > 10 && zoomIn;   // 15×15는 확대(칸 26px, 밀어서 이동) 또는 한눈에 보기(작은 칸)
  $("board").style.gridTemplateColumns = big ? `${Math.max(34, side * 15)}px repeat(${n}, 26px)` : `${Math.max(34, side * (n > 10 ? 15 : 17))}px repeat(${n}, 1fr)`; $("board").style.width = big ? "max-content" : "";
  let h = `<div></div>` + cc.map((c, x) => `<div class="cc">${c.map(v => `<span class="${same(cols[x], c) ? "d" : ""}">${v}</span>`).join("")}</div>`).join("");
  for (let y = 0; y < n; y++) {
    h += `<div class="rc">${rc[y].map(v => `<span class="${same(rows[y], rc[y]) ? "d" : ""}">${v}</span>`).join("")}</div>`;
    for (let x = 0; x < n; x++) h += `<button type="button" class="c ${done ? (sol[y][x] ? "f" : "") : cur[y][x] === 1 ? "f" : cur[y][x] === 2 ? "m" : ""} ${(x + 1) % 5 === 0 && x < n - 1 ? "b5" : ""} ${(y + 1) % 5 === 0 && y < n - 1 ? "r5" : ""}" data-y="${y}" data-x="${x}"${done && sol[y][x] ? ` style="background:${PAL[pic.g[y][x]]};border-color:${PAL[pic.g[y][x]]};box-shadow:0 0 0 .6px ${PAL[pic.g[y][x]]};--d:${(x + y) * 28}ms"` : ""} aria-label="${y + 1}행 ${x + 1}열 ${cur[y][x] === 1 ? "칠함" : cur[y][x] === 2 ? "표시" : "빈칸"}"></button>`;
  }
  $("board").className = "board" + (done ? " pic" : "") + (n > 10 ? " n15" : "") + (mode === "move" ? " mv" : ""); $("bw").className = "bwrap" + (big ? " scroll" : ""); $("mMove").hidden = $("zoom").hidden = n <= 10; $("ctlrow").style.gridTemplateColumns = n > 10 ? "repeat(4,1fr)" : "1fr 1fr"; $("zoom").textContent = zoomIn ? "🔍 한눈에" : "🔍 크게"; $("mMove").className = "btn " + (mode === "move" ? "on" : "ghost"); $("board").innerHTML = h; $("best").textContent = best[lv] ? fmt(best[lv]) : "-";
  $("lv").innerHTML = Object.keys(LV).map(k => `<button type="button" class="${+k === lv ? "on" : ""}" data-l="${k}" role="radio" aria-checked="${+k === lv}">${LV[k].label}<small>${LV[k].hint}</small></button>`).join("");
  $("mFill").className = "btn " + (mode === "fill" ? "on" : "ghost"); $("mMark").className = "btn " + (mode === "mark" ? "on" : "ghost");
}
const target = () => (mode === "fill" ? 1 : 2);
const cellAt = e => { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.closest && el.closest("[data-y]"); };
$("board").addEventListener("pointerdown", e => { if (mode === "move") return; const c = e.target.closest("[data-y]"); if (!c || done) return; e.preventDefault(); const y = +c.dataset.y, x = +c.dataset.x; paint = cur[y][x] === target() ? 0 : target(); set(y, x, paint); });
$("board").addEventListener("pointermove", e => { if (paint === null) return; const c = cellAt(e); if (c) set(+c.dataset.y, +c.dataset.x, paint); });
["pointerup", "pointercancel"].forEach(ev => document.addEventListener(ev, () => { paint = null; }));
$("mFill").onclick = () => { mode = "fill"; render(); }; $("mMark").onclick = () => { mode = "mark"; render(); }; $("mMove").onclick = () => { mode = mode === "move" ? "fill" : "move"; render(); };
$("zoom").onclick = () => { zoomIn = !zoomIn; if (mode === "move" && !zoomIn) mode = "fill"; render(); };
$("clear").onclick = () => { if (done) return; cur = cur.map(r => r.map(() => 0)); render(); };
$("reveal").onclick = () => { if (done) return; revealed = true; cur = sol.map(r => r.map(v => (v ? 1 : 0))); done = true; zoomIn = false; clearInterval(timer); $("res").innerHTML = `<b>정답이에요</b><div style="font-size:2.6rem;line-height:1.2;margin:2px 0">${pic.e}</div><p style="margin:0">숨은 그림: <span style="font-weight:700">${pic.n}</span></p><p class="muted">정답을 봐서 기록은 남지 않아요.</p>`; $("res").hidden = false; render(); };
$("newGame").onclick = newGame;
$("lv").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b && +b.dataset.l !== lv) { lv = +b.dataset.l; sv(LKEY, lv); newGame(); } });
newGame();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<script src="med-notify.js" defer></script>
<script src="home.js" defer></script>
</body>
