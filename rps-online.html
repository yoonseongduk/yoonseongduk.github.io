<title>가족 가위바위보 온라인</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 한 화면에 한 가지 일만. 입장 → 대기실 → 대진표 → 경기 → 우승 → 누적 기록 */
:root {
  --bg: #eef1f7;
  --surface: #ffffff;
  --fg: #1b2236;
  --muted: #5f6a85;
  --line: #d6dcea;
  --accent: #2f5bea;
  --accent-fg: #ffffff;
  --win: #1f9d62;
  --lose: #d6453a;
  --gold: #e8a90f;
  --pa: #e4572e;
  --pb: #2b78d6;
  --font-display: "Do Hyeon", "Noto Sans KR", sans-serif;
  --font-body: "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12172a; --surface: #1c2340; --fg: #eaeefb; --muted: #9aa5c7; --line: #2f3a62;
    --accent: #7b9bff; --accent-fg: #12172a; --win: #4cc98a; --lose: #ff7a6e; --gold: #f5c542;
    --pa: #ff8a5f; --pb: #6aa8ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12172a; --surface: #1c2340; --fg: #eaeefb; --muted: #9aa5c7; --line: #2f3a62;
  --accent: #7b9bff; --accent-fg: #12172a; --win: #4cc98a; --lose: #ff7a6e; --gold: #f5c542;
  --pa: #ff8a5f; --pb: #6aa8ff; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.5;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 2rem; margin: 0; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); font-size: 0.9rem; }
.center { text-align: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 14px; padding: 14px; font-family: var(--font-display); font-size: 1.35rem; letter-spacing: .03em; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-family: var(--font-body); font-size: 1rem; padding: 11px; }
.row { display: flex; gap: 8px; align-items: center; min-width: 0; }
.row > * { min-width: 0; }
.hdr { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tog { flex: none; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: .9rem; }
input[type=text] { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font: inherit; }
input.codein { text-align: center; font-family: var(--font-display); font-size: 1.6rem; letter-spacing: .3em; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg button { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; font-weight: 700; }
.seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.err { color: var(--lose); font-weight: 700; font-size: .9rem; }
.code { text-align: center; font-family: var(--font-display); font-size: 3.2rem; letter-spacing: .25em; padding-left: .25em; color: var(--accent); }
.plist { display: flex; flex-direction: column; gap: 6px; }
.prow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); text-align: left; width: 100%; }
.prow.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.prow span:first-child { overflow-wrap: anywhere; font-weight: 700; }
.tag { font-size: .8rem; color: var(--muted); flex: none; }
.prow.on .tag { color: var(--accent); font-weight: 700; }

.slot { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.slot.now { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.slot.wait { opacity: .6; }
.slot h3 { margin: 0; font-size: .8rem; letter-spacing: .1em; color: var(--muted); }
.vs { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.who { display: flex; align-items: center; gap: 6px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.who.won { color: var(--win); }
.who.lost { color: var(--muted); font-weight: 400; text-decoration: line-through; }

.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.score b { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; display: block; overflow-wrap: anywhere; }
.pips { letter-spacing: .15em; font-size: 1.1rem; }
.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pick { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; color: var(--fg); }
.pick span { font-size: clamp(2.4rem, 14vw, 3.6rem); line-height: 1.1; }
.pick:active { transform: scale(.96); border-color: var(--accent); }
.clash { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; gap: 6px; }
.clash .hand { font-size: clamp(3.4rem, 22vw, 5.4rem); line-height: 1.1; animation: pop .35s ease-out; }
.clash small { display: block; color: var(--muted); }
@keyframes pop { from { transform: scale(.3) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
.verdict { text-align: center; font-family: var(--font-display); font-size: 1.8rem; }
.verdict.win { color: var(--win); } .verdict.tie { color: var(--muted); }
.waitbox { text-align: center; padding: 26px 16px; gap: 10px; }
.waitbox .big { font-size: 3rem; }
.trophy { text-align: center; font-size: 4rem; line-height: 1.1; }
.champ { text-align: center; font-family: var(--font-display); font-size: 2.4rem; color: var(--gold); overflow-wrap: anywhere; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-size: .75rem; letter-spacing: .06em; font-weight: 700; }
td.name { text-align: left; font-weight: 700; white-space: normal; overflow-wrap: anywhere; }
tr.top td { color: var(--gold); }
@media (prefers-reduced-motion: reduce) { .clash .hand { animation: none; } }
</style>

<main id="app"></main>

<script>
/* 구조 요약
   - 방장(방을 만든 사람)의 기기가 "심판" 역할을 한다. 대진표·점수·기록은 방장만 쓰고, 나머지는 읽기만 한다.
   - 각 선수는 자기 선택(picks/내id)만 쓴다. 두 선택이 모이면 방장이 결과를 계산해서 state에 적는다.
   - 모든 기기는 같은 문서를 구독해서 화면을 그린다. */
const HANDS = [{ e: "✊", n: "바위" }, { e: "✌️", n: "가위" }, { e: "✋", n: "보" }];
const beats = (a, b) => (a - b + 3) % 3 === 2;          // a가 b를 이기면 true
const STAGE = ["준결승 1", "준결승 2", "결승"];
const MS = { reveal: 3200, win: 4800, bot: 1400 };       // 결과 보여주는 시간, 가상끼리 대결 대기
const LAST_KEY = "rps-online-last-v1";
const app = document.getElementById("app");
const $ = id => document.getElementById(id);

const lget = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lset = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rand = n => Math.floor(Math.random() * n);
const cl = o => JSON.parse(JSON.stringify(o));
const pips = (n, target) => "●".repeat(n) + "○".repeat(Math.max(0, target - n));

let db = null, uid = null, ready = false;
let view = "entry", code = "", myName = "", codeInput = "", err = "", busy = false;
let room = null, state = null, statsDoc = { p: {} }, players = {}, picks = {};
let unsubs = [], isHost = false;
let sel = [], seenIds = new Set(), target = 2;
let advTimer = 0, resolvingKey = "", advanceKey = "", lastHtml = "", statsLoaded = false;

const saved = lget(LAST_KEY) || {};
myName = saved.name || ""; codeInput = saved.code || "";

(async () => {
  try {
    db = window.claude && (await window.claude.use("db"));
    const user = window.claude && (await window.claude.use("user"));
    uid = user ? await user.id() : null;
  } catch (e) {}
  ready = true; render();
})();

/* ---------- 입장 / 퇴장 ---------- */
const roomPath = c => "rooms/" + c;
async function enter(create) {
  myName = ($("name").value || "").trim(); codeInput = ($("code").value || "").trim();
  if (!myName) { err = "이름을 입력해 주세요."; return render(); }
  if (!create && !/^\d{4}$/.test(codeInput)) { err = "방 번호는 숫자 4자리예요."; return render(); }
  busy = true; err = ""; render();
  try {
    let c = codeInput;
    if (create) {
      let snap;
      do { c = String(1000 + rand(9000)); snap = await db.doc(roomPath(c)).get(); } while (snap.exists);
      await db.doc(roomPath(c)).set({ host: uid, created: Date.now() });
      await db.doc(roomPath(c) + "/data/state").set({ phase: "lobby" });
    } else {
      const snap = await db.doc(roomPath(c)).get();
      if (!snap.exists) throw new Error("그런 방이 없어요. 번호를 다시 확인해 주세요.");
    }
    await db.doc(roomPath(c) + "/players/" + uid).set({ name: myName, at: Date.now() });
    code = c; lset(LAST_KEY, { name: myName, code: c });
    subscribe(); view = "room";
  } catch (e) {
    err = e && e.message && !e.code ? e.message : "연결에 실패했어요. 잠시 후 다시 시도해 주세요.";
  }
  busy = false; render();
}

function subscribe() {
  const onErr = () => { err = "연결이 끊겼어요. 나갔다가 다시 입장해 주세요."; render(); };
  const base = roomPath(code);
  unsubs = [
    db.doc(base).onSnapshot(s => { room = s.exists ? s.data() : null; isHost = !!room && room.host === uid; render(); hostTick(); }, onErr),
    db.doc(base + "/data/state").onSnapshot(s => { state = s.exists ? s.data() : null; render(); hostTick(); }, onErr),
    // 방장은 기록을 직접 계산해서 쓰는 쪽이라, 처음 한 번만 서버 값을 받고 이후에는 자기 값을 믿는다
    db.doc(base + "/data/stats").onSnapshot(s => {
      if (!(isHost && statsLoaded)) statsDoc = s.exists ? s.data() : { p: {} };
      statsLoaded = true; render();
    }, onErr),
    db.collection(base + "/players").onSnapshot(q => {
      players = {}; q.docs.forEach(d => { players[d.id] = d.data(); });
      Object.keys(players).sort((a, b) => players[a].at - players[b].at).forEach(id => {
        if (!seenIds.has(id)) { seenIds.add(id); if (sel.length < 4) sel.push(id); }
      });
      sel = sel.filter(id => players[id]);
      render();
    }, onErr),
    db.collection(base + "/picks").onSnapshot(q => {
      picks = {}; q.docs.forEach(d => { picks[d.id] = d.data(); });
      render(); hostTick();
    }, onErr)
  ];
}

function leave() {
  unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = [];
  clearTimeout(advTimer); advTimer = 0; resolvingKey = ""; advanceKey = "";
  room = state = null; statsDoc = { p: {} }; statsLoaded = false; players = {}; picks = {}; sel = []; seenIds = new Set(); isHost = false;
  view = "entry"; err = ""; render();
}

/* ---------- 방장(심판) 로직 ---------- */
const curKey = () => state.tid + "-" + state.stage + "-" + state.roundNo;
const pickOf = (id, key) => (picks[id] && picks[id].key === key ? picks[id].choice : null);
const mk = (a, b) => ({ a, b, sa: 0, sb: 0, winner: null });

async function writeState(s) { state = s; await db.doc(roomPath(code) + "/data/state").set(s); }
async function writeStats() { await db.doc(roomPath(code) + "/data/stats").set(statsDoc); }

async function startTournament() {
  if (!sel.length) return;
  const seats = sel.map(id => ({ id, name: players[id].name, cpu: false }));
  for (let n = 1; seats.length < 4; n++) seats.push({ id: "bot" + n, name: "가상 " + n, cpu: true });
  for (let i = seats.length - 1; i > 0; i--) { const j = rand(i + 1); [seats[i], seats[j]] = [seats[j], seats[i]]; }  // 대진 추첨
  await writeState({
    phase: "bracket", tid: Math.random().toString(36).slice(2, 8), target, seats,
    matches: [mk(0, 1), mk(2, 3)], stage: 0, roundNo: 0, round: null, champion: null, runnerUp: null
  });
}
async function startMatch() {
  const s = cl(state); s.phase = "match"; s.roundNo = 1; s.round = null;
  await writeState(s); hostTick();
}
async function backToLobby() { await writeState({ phase: "lobby" }); }
async function replaceWithBot(idx) { const s = cl(state); s.seats[idx].cpu = true; await writeState(s); hostTick(); }

function hostTick() {
  if (!isHost || !state || state.phase !== "match") return;
  const key = curKey();
  if (state.round) {                               // 결과 화면 중: 일정 시간 뒤 자동으로 다음으로
    if (advanceKey !== key) { advanceKey = key; clearTimeout(advTimer); advTimer = setTimeout(() => advance(key), MS.reveal); }
    return;
  }
  if (resolvingKey === key) return;
  const mt = state.matches[state.stage], A = state.seats[mt.a], B = state.seats[mt.b];
  if ((A.cpu ? 0 : pickOf(A.id, key)) == null || (B.cpu ? 0 : pickOf(B.id, key)) == null) return;
  resolvingKey = key;
  setTimeout(() => resolve(key), A.cpu && B.cpu ? MS.bot : 0);
}

async function resolve(key) {
  if (!isHost || !state || state.phase !== "match" || state.round || curKey() !== key) return;
  const s = cl(state), mt = s.matches[s.stage], A = s.seats[mt.a], B = s.seats[mt.b];
  const a = A.cpu ? rand(3) : pickOf(A.id, key), b = B.cpu ? rand(3) : pickOf(B.id, key);
  if (a == null || b == null) { resolvingKey = ""; return; }
  const res = beats(a, b) ? 1 : beats(b, a) ? -1 : 0;
  s.round = { a, b, res };
  if (res === 1) mt.sa++;
  if (res === -1) mt.sb++;
  const st = cl(statsDoc);
  const P = seat => {                               // 사람만 기록한다 (가상 선수는 제외)
    if (seat.cpu) return null;
    const p = st.p[seat.id] || (st.p[seat.id] = { name: seat.name, champ: 0, mWin: 0, mLoss: 0, rWin: 0 });
    p.name = seat.name; return p;
  };
  if (res === 1 && P(A)) P(A).rWin++;
  if (res === -1 && P(B)) P(B).rWin++;
  if (mt.sa >= s.target) mt.winner = mt.a; else if (mt.sb >= s.target) mt.winner = mt.b;
  if (mt.winner != null) {
    const w = mt.winner === mt.a ? A : B, l = mt.winner === mt.a ? B : A;
    if (P(w)) P(w).mWin++;
    if (P(l)) P(l).mLoss++;
  }
  advanceKey = key; clearTimeout(advTimer);
  advTimer = setTimeout(() => advance(key), mt.winner != null ? MS.win : MS.reveal);
  statsDoc = st;
  await writeState(s); await writeStats();
}

async function advance(key) {
  if (!isHost || !state || !state.round || curKey() !== key || advanceKey !== key) return;
  advanceKey = ""; clearTimeout(advTimer);
  const s = cl(state), mt = s.matches[s.stage];
  s.round = null;
  if (mt.winner == null) s.roundNo++;
  else if (s.stage === 2) {
    s.phase = "champion"; s.champion = mt.winner; s.runnerUp = mt.winner === mt.a ? mt.b : mt.a;
    const seat = s.seats[s.champion];
    if (!seat.cpu) {
      const st = cl(statsDoc);
      const p = st.p[seat.id] || (st.p[seat.id] = { name: seat.name, champ: 0, mWin: 0, mLoss: 0, rWin: 0 });
      p.champ++; statsDoc = st; await writeStats();
    }
  } else {
    s.stage++;
    if (s.stage === 2) s.matches.push(mk(s.matches[0].winner, s.matches[1].winner));
    s.phase = "bracket"; s.roundNo = 0;
  }
  await writeState(s);
}

/* ---------- 내 선택 ---------- */
async function submitPick(choice) {
  if (!state || state.phase !== "match" || state.round) return;
  const key = curKey();
  try { await db.doc(roomPath(code) + "/picks/" + uid).set({ key, choice, at: Date.now() }); }
  catch (e) { err = "선택을 보내지 못했어요. 다시 눌러 주세요."; render(); }
}

/* ---------- 화면 ---------- */
const seatLabel = (s, i) => (s.cpu ? "🤖 " : "") + esc(s.name) + (s.id === uid ? " (나)" : "");

function vEntry() {
  if (!ready) return `<h1>가족 가위바위보 🌐</h1><p class="muted">연결하는 중…</p>`;
  if (!db || !uid) return `<h1>가족 가위바위보 🌐</h1><div class="card"><h2>온라인 기능을 쓸 수 없어요</h2>
    <p class="muted">이 게임은 claude.ai에 로그인한 상태에서, 공유받은 링크로 열어야 기기끼리 연결돼요. 저장해 둔 파일로 열면 동작하지 않아요.</p></div>`;
  return `<h1>가족 가위바위보 🌐</h1>
    <p class="muted">같은 방 번호로 들어오면 서로의 기기가 연결돼요.</p>
    <div class="card"><h2>내 이름</h2>
      <input type="text" id="name" maxlength="6" value="${esc(myName)}" placeholder="예: 아빠" autocomplete="off"></div>
    <div class="card"><h2>방 만들기</h2><p class="muted">내가 방장이 되고, 4자리 방 번호가 만들어져요.</p>
      <button class="btn" data-act="create" ${busy ? "disabled" : ""}>방 만들기</button></div>
    <div class="card"><h2>방 들어가기</h2>
      <input type="text" id="code" class="codein" inputmode="numeric" maxlength="4" value="${esc(codeInput)}" placeholder="0000" autocomplete="off">
      <button class="btn" data-act="join" ${busy ? "disabled" : ""}>입장</button></div>
    ${err ? `<p class="err">${esc(err)}</p>` : ""}`;
}

function roomHead() {
  return `<div class="hdr"><h1>방 ${esc(code)}</h1><div class="row">
    <button class="tog" data-act="board">🏅 기록</button><button class="tog" data-act="leave">나가기</button></div></div>
    <p class="muted">${esc(myName)} 님${isHost ? " · 👑 방장" : ""}</p>${err ? `<p class="err">${esc(err)}</p>` : ""}`;
}

function vLobby() {
  const ids = Object.keys(players).sort((a, b) => players[a].at - players[b].at);
  const rows = ids.map(id => {
    const on = sel.includes(id), nm = esc(players[id].name) + (id === uid ? " (나)" : "");
    return isHost
      ? `<button class="prow ${on ? "on" : ""}" data-act="sel" data-id="${esc(id)}"><span>${nm}</span><span class="tag">${on ? "✔ 참가" : "쉬기"}</span></button>`
      : `<div class="prow ${on ? "on" : ""}"><span>${nm}</span><span class="tag">${on ? "✔ 참가" : ""}</span></div>`;
  }).join("");
  const host = isHost ? `
    <div class="card"><h2>경기 방식</h2><div class="seg">${[[1, "1판"], [2, "3판 2선승"], [3, "5판 3선승"]].map(([v, l]) =>
      `<button data-act="target" data-v="${v}" class="${target === v ? "on" : ""}">${l}</button>`).join("")}</div>
      <p class="muted">참가자가 4명보다 적으면 빈자리는 🤖 가상 선수가 채워요. 최대 4명까지 고를 수 있어요.</p></div>
    <button class="btn" data-act="start" ${sel.length ? "" : "disabled"}>대회 시작</button>`
    : `<div class="card waitbox"><div class="big">⏳</div><p class="muted">방장이 대회를 시작하길 기다리는 중이에요.</p></div>`;
  return `<div class="card"><h2>방 번호</h2><div class="code">${esc(code)}</div>
    <p class="muted center">가족에게 이 번호를 알려 주세요.</p></div>
    <div class="card"><h2>들어온 사람 (${ids.length})</h2><div class="plist">${rows}</div>
      ${isHost ? `<p class="muted">눌러서 참가/쉬기를 바꿀 수 있어요.</p>` : ""}</div>${host}`;
}

function slot(i) {
  const mt = state.matches[i];
  if (!mt) return `<div class="slot wait"><h3>${STAGE[i]}</h3><p class="muted">준결승 승자끼리 붙어요</p></div>`;
  const cls = idx => mt.winner != null ? (mt.winner === idx ? "won" : "lost") : "";
  const now = i === state.stage && state.phase !== "champion";
  return `<div class="slot ${now ? "now" : ""}"><h3>${STAGE[i]}${mt.winner != null ? " · 끝" : now ? " · 다음 경기" : ""}</h3>
    <div class="vs"><span class="who ${cls(mt.a)}">${seatLabel(state.seats[mt.a])}</span><span class="muted">vs</span>
    <span class="who ${cls(mt.b)}">${seatLabel(state.seats[mt.b])}</span></div>
    ${mt.winner != null || now ? `<p class="muted">${mt.sa} : ${mt.sb}</p>` : ""}</div>`;
}
function vBracket() {
  const mt = state.matches[state.stage], mine = state.seats[mt.a].id === uid || state.seats[mt.b].id === uid;
  return `<h2>대진표</h2>${slot(0)}${slot(1)}${slot(2)}
    <p class="muted">${state.target === 1 ? "1판 승부" : (state.target * 2 - 1) + "판 " + state.target + "선승제"}${mine ? " · 🔥 다음 경기는 내 차례예요" : ""}</p>
    ${isHost ? `<button class="btn" data-act="match">${STAGE[state.stage]} 시작</button>`
      : `<div class="card waitbox"><p class="muted">방장이 경기를 시작하길 기다리는 중이에요.</p></div>`}`;
}

function matchHead() {
  const mt = state.matches[state.stage], A = state.seats[mt.a], B = state.seats[mt.b];
  return `<div class="hdr"><h2>${STAGE[state.stage]}</h2><span class="muted">${state.target === 1 ? "1판 승부" : state.target + "선승"}</span></div>
    <div class="card"><div class="score">
      <div><b style="color:var(--pa)">${seatLabel(A)}</b><span class="pips">${pips(mt.sa, state.target)}</span></div>
      <span class="muted">vs</span>
      <div><b style="color:var(--pb)">${seatLabel(B)}</b><span class="pips">${pips(mt.sb, state.target)}</span></div>
    </div></div>`;
}
function vMatch() {
  const mt = state.matches[state.stage], A = state.seats[mt.a], B = state.seats[mt.b];
  if (state.round) {
    const r = state.round, ha = HANDS[r.a], hb = HANDS[r.b];
    const verdict = r.res === 0 ? `<p class="verdict tie">비겼어요! 다시 한 판</p>`
      : `<p class="verdict win">${esc((r.res === 1 ? A : B).name)} 님 승!</p>`;
    const fin = mt.winner != null ? `<p class="verdict win">🎉 ${esc((mt.winner === mt.a ? A : B).name)} 님이 경기에서 이겼어요!</p>` : "";
    const skip = isHost ? `<button class="btn ghost" data-act="skip">바로 다음으로</button>` : "";
    return matchHead() + `<div class="card"><div class="clash">
      <div><div class="hand">${ha.e}</div><small>${ha.n}</small></div><span class="muted">vs</span>
      <div><div class="hand">${hb.e}</div><small>${hb.n}</small></div></div></div>${verdict}${fin}${skip}`;
  }
  const key = curKey(), meSeat = state.seats.findIndex(s => s.id === uid);
  const playing = meSeat === mt.a || meSeat === mt.b;
  let body;
  if (playing && pickOf(uid, key) == null) {
    body = `<p class="verdict">무엇을 낼까요?</p><div class="picks">${HANDS.map((h, i) =>
      `<button class="pick" data-act="pick" data-v="${i}"><span>${h.e}</span>${h.n}</button>`).join("")}</div>`;
  } else if (playing) {
    const h = HANDS[pickOf(uid, key)];
    body = `<div class="card waitbox"><div class="big">${h.e}</div><p><b>${h.n}</b>을(를) 냈어요. 상대를 기다리는 중…</p>
      <p class="muted">상대 선택은 아직 보이지 않아요.</p></div>`;
  } else {
    body = `<div class="card waitbox"><div class="big">👀</div><p class="muted">${A.cpu && B.cpu ? "가상 선수끼리 대결 중이에요." : "경기를 구경하는 중이에요."}</p></div>`;
  }
  let help = "";
  if (isHost) {
    const slow = [[mt.a, A], [mt.b, B]].filter(([, s]) => !s.cpu && pickOf(s.id, key) == null);
    help = slow.map(([i, s]) => `<button class="btn ghost" data-act="bot" data-i="${i}">${esc(s.name)} 님 대신 🤖가 하기</button>`).join("");
    if (help) help += `<p class="muted center">선수가 응답이 없을 때만 눌러 주세요.</p>`;
  }
  return matchHead() + body + help;
}

function vChampion() {
  const c = state.seats[state.champion], r = state.seats[state.runnerUp];
  return `<div class="trophy">🏆</div><p class="muted center">이번 대회 우승</p>
    <p class="champ">${seatLabel(c)}</p><p class="muted center">준우승 ${seatLabel(r)}</p>
    <button class="btn" data-act="board">누적 기록 보기</button>
    ${isHost ? `<button class="btn ghost" data-act="lobby">새 대회 준비하기</button>`
      : `<p class="muted center">방장이 새 대회를 준비할 때까지 기다려 주세요.</p>`}`;
}

function vBoard() {
  const rows = Object.keys(statsDoc.p || {}).map(id => {
    const r = statsDoc.p[id]; return { ...r, name: (players[id] && players[id].name) || r.name, me: id === uid };
  }).sort((a, b) => b.champ - a.champ || b.mWin - a.mWin || b.rWin - a.rWin);
  const body = rows.length ? `<div class="tablewrap"><table>
      <tr><th>순위</th><th style="text-align:left">이름</th><th>우승</th><th>경기 승-패</th><th>판 승</th></tr>
      ${rows.map((r, i) => `<tr class="${i === 0 && r.champ ? "top" : ""}"><td>${i + 1}</td>
        <td class="name">${i === 0 && r.champ ? "👑 " : ""}${esc(r.name)}${r.me ? " (나)" : ""}</td>
        <td>${r.champ}</td><td>${r.mWin}-${r.mLoss}</td><td>${r.rWin}</td></tr>`).join("")}</table></div>
      <p class="muted">순위는 우승 횟수, 경기 승수, 판 승수 순서로 정해요. 가상 선수는 기록하지 않아요.</p>`
    : `<p class="muted">아직 기록이 없어요. 대회를 한 번 열어 보세요.</p>`;
  return `<h1>누적 기록 🏅</h1><p class="muted">방 ${esc(code)} 의 기록이에요. 같은 방 번호를 계속 쓰면 기록이 쌓여요.</p>
    <div class="card">${body}</div><button class="btn" data-act="back">방으로 돌아가기</button>`;
}

function vRoom() {
  if (!state) return roomHead() + `<p class="muted">방 정보를 불러오는 중…</p>`;
  let inner;
  if (state.phase === "lobby") inner = vLobby();
  else if (state.phase === "bracket") inner = vBracket();
  else if (state.phase === "match") inner = vMatch();
  else inner = vChampion();
  return roomHead() + inner;
}

function render() {
  const html = view === "entry" ? vEntry() : view === "board" ? vBoard() : vRoom();
  if (html === lastHtml) return;
  const switched = !lastHtml || (html.slice(0, 40) !== lastHtml.slice(0, 40));
  lastHtml = html; app.innerHTML = html;
  if (switched) window.scrollTo(0, 0);
}

/* ---------- 입력 처리 ---------- */
app.addEventListener("input", e => {
  if (e.target.id === "name") myName = e.target.value;
  if (e.target.id === "code") codeInput = e.target.value.replace(/\D/g, "");
});
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const d = el.dataset;
  switch (d.act) {
    case "create": enter(true); break;
    case "join": enter(false); break;
    case "leave": leave(); break;
    case "board": view = "board"; render(); break;
    case "back": view = "room"; render(); break;
    case "sel": sel = sel.includes(d.id) ? sel.filter(x => x !== d.id) : (sel.length < 4 ? [...sel, d.id] : sel); render(); break;
    case "target": target = Number(d.v); render(); break;
    case "start": startTournament(); break;
    case "match": startMatch(); break;
    case "pick": submitPick(Number(d.v)); break;
    case "skip": advance(curKey()); break;
    case "bot": replaceWithBot(Number(d.i)); break;
    case "lobby": backToLobby(); break;
  }
});
render();
</script>
