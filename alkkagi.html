<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>알까기</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 점수·최고·상태 줄, 가운데 게임 판(캔버스, 손가락으로 조작), 아래 설명. 시작과 끝은 판 위의 안내 화면에서 */
:root{--bg:hsl(28 30% 94%);--surface:#fff;--fg:#1b2133;--muted:#5f6881;--line:hsl(28 22% 84%);--field:hsl(28 40% 16%);--accent:hsl(28 75% 50%);--accent-fg:#fff;--ok:#2fb36a;--bad:#e8453c;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(28 25% 9%);--surface:hsl(28 20% 15%);--fg:#e8ecf8;--muted:#95a0c0;--line:hsl(28 20% 24%);--field:hsl(28 40% 7%);--accent:hsl(28 85% 66%);--accent-fg:#10131c;--ok:#4cd486;--bad:#ff6b5e;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.88rem}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.35rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:var(--field);touch-action:none;aspect-ratio:300/420}
canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;background:rgba(5,8,20,.58);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
.ov b{font-family:var(--font-display);font-weight:400;font-size:1.9rem;line-height:1.2}.ov p{color:#e4e8f6}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:10px 24px;font-family:var(--font-display);font-size:1.3rem}
</style>
</head>
<body>
<main>
  <h1>알까기 ⚫</h1>
  <div class="stats"><div class="stat"><small>점수</small><b id="score">0</b></div><div class="stat"><small>최고</small><b id="best">0</b></div><div class="stat"><small>내 돌 : 적 돌</small><b id="info">-</b></div></div>
  <div class="wrap" id="wrap"><canvas id="cv" aria-label="알까기 게임 판"></canvas><div class="ov" id="ov"></div></div>
  <p class="muted">내 돌(파랑)을 <b>누른 채 뒤로 끌었다가 놓으면</b> 튕겨 나가요. 끌수록 세게 날아가요! 상대 돌(빨강)을 부딪혀서 <b>판 밖으로 떨어뜨리면</b> 점수! 내 돌이 떨어지면 안 돼요. 내 돌 5개, 컴퓨터 돌 5개로 시작해요. (일시정지: 창을 벗어나면 자동, 컴퓨터는 P 키)</p>
</main>
<script>
const W = 300, H = 420, KEY = "alkkagi-best-v1";
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1));
const cv = $("cv"), ctx = cv.getContext("2d");
let score = 0, best = ld(KEY) || 0, state = "ready", info = "", newBest = false, last = 0, keys = { l: 0, r: 0, u: 0, d: 0 }, C = {};
function readColors() { const css = getComputedStyle(document.documentElement); for (const k of ["fg", "surface", "line", "muted", "accent", "ok", "bad", "field"]) C[k] = css.getPropertyValue("--" + k).trim(); }
function setScore(n) { score = n; $("score").textContent = score; }
function addScore(n) { setScore(score + n); }
function setInfo(s) { info = s; $("info").textContent = s; }
function end() { if (state !== "play") return; state = "over"; if (score > best) { best = score; sv(KEY, best); newBest = true; } ui(); }
function start() { if (state === "ready" || state === "over") { setScore(0); newBest = false; reset(); } state = "play"; last = performance.now(); ui(); }
function pause() { if (state === "play") { state = "paused"; ui(); } }
function ui() {
  $("best").textContent = best; $("score").textContent = score; $("info").textContent = info; const ov = $("ov"); ov.hidden = state === "play";
  ov.innerHTML = state === "ready" ? `<b>알까기</b><p>상대 돌을 모두 판 밖으로 밀어내세요</p><button class="btn" data-a="go" type="button">시작</button>`
    : state === "paused" ? `<b>일시정지</b><button class="btn" data-a="go" type="button">계속하기</button>`
    : `<b>게임 오버</b><p>${score}점${newBest ? "<br>🏆 최고 기록!" : ""}</p><button class="btn" data-a="go" type="button">다시 하기</button>`;
}
function frame(t) {
  const dt = Math.min(.033, (t - last) / 1000 || 0); last = t; if (state === "play") update(dt);
  const w = cv.clientWidth, dpr = window.devicePixelRatio || 1; if (w) { const pw = Math.round(w * dpr); if (cv.width !== pw) { cv.width = pw; cv.height = Math.round(pw * H / W); } ctx.setTransform(cv.width / W, 0, 0, cv.width / W, 0, 0); ctx.clearRect(0, 0, W, H); draw(ctx); }
  requestAnimationFrame(frame);
}
const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
$("wrap").addEventListener("pointerdown", e => { if (e.target.closest("[data-a]")) return; if (state === "play") { e.preventDefault(); pointer("down", ...pos(e)); } });
$("wrap").addEventListener("pointermove", e => { if (state === "play") pointer("move", ...pos(e)); });
["pointerup", "pointercancel", "pointerleave"].forEach(ev => $("wrap").addEventListener(ev, e => { if (state === "play") pointer("up", ...pos(e)); }));
$("ov").addEventListener("click", e => { if (e.target.closest("[data-a=go]")) start(); });
document.addEventListener("keydown", e => {
  const m = { ArrowLeft: "l", ArrowRight: "r", ArrowUp: "u", ArrowDown: "d", a: "l", d: "r", w: "u", s: "d" }[e.key];
  if (m) { keys[m] = 1; e.preventDefault(); if (state === "play" && typeof key === "function") key("down", m); }
  else if (e.key === " ") { e.preventDefault(); if (state === "ready" || state === "over" || state === "paused") start(); else if (typeof key === "function") key("down", "space"); }
  else if (e.key === "p" || e.key === "P") { state === "play" ? pause() : state === "paused" && start(); }
});
document.addEventListener("keyup", e => { const m = { ArrowLeft: "l", ArrowRight: "r", ArrowUp: "u", ArrowDown: "d", a: "l", d: "r", w: "u", s: "d" }[e.key]; if (m) keys[m] = 0; });
document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
readColors(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);
let st, turn, moving, sel, aim, wait, nMe, nCp;
const R = 15, L = 8;
function reset() { st = []; for (let i = 0; i < 5; i++) { st.push({ x: 40 + i * 55, y: 330, vx: 0, vy: 0, o: 0 }); st.push({ x: 40 + i * 55, y: 90, vx: 0, vy: 0, o: 1 }); } turn = 0; moving = false; sel = null; aim = null; wait = 0; updInfo(); }
function updInfo() { nMe = st.filter(s => s.o === 0).length; nCp = st.filter(s => s.o === 1).length; setInfo(nMe + " : " + nCp); }
function pointer(t, x, y) { if (turn !== 0 || moving) return; if (t === "down") { sel = st.filter(s => s.o === 0).find(s => Math.hypot(s.x - x, s.y - y) < R + 10) || null; if (sel) aim = { x, y }; } else if (t === "move" && sel) { aim = { x, y }; } else if (t === "up" && sel) { const dx = sel.x - aim.x, dy = sel.y - aim.y, d = Math.hypot(dx, dy); if (d > 10) { const sp = Math.min(d, 110) * 5.2; sel.vx = dx / d * sp; sel.vy = dy / d * sp; moving = true; } sel = null; aim = null; } }
function update(dt) {
  if (!moving && turn === 1) { wait -= dt; if (wait <= 0) { const cs = st.filter(s => s.o === 1), ps = st.filter(s => s.o === 0); if (cs.length && ps.length) { let bestS = null, bd = 1e9; for (const c of cs) for (const p of ps) { const d = Math.hypot(c.x - p.x, c.y - p.y); if (d < bd + Math.random() * 60) { bd = d; bestS = [c, p]; } } const [c, p] = bestS, a = Math.atan2(p.y - c.y, p.x - c.x) + (Math.random() - .5) * .22, sp = rand(330, 520); c.vx = Math.cos(a) * sp; c.vy = Math.sin(a) * sp; moving = true; } } }
  if (!moving) return;
  const sub = 3; for (let q = 0; q < sub; q++) { const h = dt / sub; for (const s of st) { s.x += s.vx * h; s.y += s.vy * h; }
    for (let i = 0; i < st.length; i++) for (let j = i + 1; j < st.length; j++) { const a = st[i], b = st[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy); if (d < 2 * R && d > 0) { const nx = dx / d, ny = dy / d, ov = 2 * R - d; a.x -= nx * ov / 2; a.y -= ny * ov / 2; b.x += nx * ov / 2; b.y += ny * ov / 2; const va = a.vx * nx + a.vy * ny, vb = b.vx * nx + b.vy * ny, diff = vb - va; if (diff < 0) { a.vx += diff * nx * .95; a.vy += diff * ny * .95; b.vx -= diff * nx * .95; b.vy -= diff * ny * .95; } } } }
  const f = Math.pow(.14, dt); for (const s of st) { s.vx *= f; s.vy *= f; if (Math.hypot(s.vx, s.vy) < 6) { s.vx = s.vy = 0; } }
  for (let k = st.length - 1; k >= 0; k--) { const s = st[k]; if (s.x < L || s.x > W - L || s.y < L || s.y > H - L) { if (s.o === 1) addScore(10); st.splice(k, 1); } }
  updInfo();
  if (st.every(s => !s.vx && !s.vy)) { moving = false; if (!nCp) { addScore(30); return end(); } if (!nMe) return end(); turn = 1 - turn; wait = .9; }
}
function draw(c) {
  c.fillStyle = "#d9b27c"; c.fillRect(L, L, W - 2 * L, H - 2 * L); c.strokeStyle = "#5a3b1a"; c.lineWidth = 3; c.strokeRect(L, L, W - 2 * L, H - 2 * L); c.strokeStyle = "rgba(90,59,26,.35)"; c.lineWidth = 1; for (let i = 1; i < 8; i++) { c.beginPath(); c.moveTo(L, L + i * (H - 2 * L) / 8); c.lineTo(W - L, L + i * (H - 2 * L) / 8); c.stroke(); }
  for (const s of st) { c.fillStyle = "rgba(0,0,0,.25)"; c.beginPath(); c.arc(s.x + 2, s.y + 3, R, 0, 7); c.fill(); c.fillStyle = s.o ? "#d6453a" : "#2f6fdf"; c.beginPath(); c.arc(s.x, s.y, R, 0, 7); c.fill(); c.fillStyle = "rgba(255,255,255,.35)"; c.beginPath(); c.arc(s.x - 4, s.y - 5, R * .4, 0, 7); c.fill(); }
  if (sel && aim) { c.strokeStyle = C.accent; c.lineWidth = 3; c.setLineDash([6, 5]); c.beginPath(); c.moveTo(sel.x, sel.y); c.lineTo(sel.x + (sel.x - aim.x), sel.y + (sel.y - aim.y)); c.stroke(); c.setLineDash([]); }
  c.font = "700 14px sans-serif"; c.fillStyle = C.fg; c.textAlign = "center"; c.fillText(turn === 0 && !moving ? "내 차례: 파란 돌을 끌었다 놓으세요" : turn === 1 && !moving ? "컴퓨터 차례..." : "", W / 2, H / 2);
}
reset(); ui(); requestAnimationFrame(frame);
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
