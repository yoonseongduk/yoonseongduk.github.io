<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가위바위보 연승</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 연승·최고 기록 줄, 컴퓨터와 내가 낸 손, 세 개의 큰 선택 버튼. 이기면 연승이 이어지고, 지면 연승이 끝나요 */
:root{--bg:#f2eff8;--surface:#fff;--fg:#241f35;--muted:#6a6382;--line:#ddd7ec;--accent:#7b4fd6;--accent-fg:#fff;--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14111f;--surface:#1f1a31;--fg:#ece8f8;--muted:#a199bd;--line:#352e4f;--accent:#a483ff;--accent-fg:#14111f;--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stage{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;min-height:170px;gap:6px}
.stage .h{font-size:clamp(3.4rem,20vw,5rem);line-height:1.1}.stage small{display:block;color:var(--muted)}.stage .vs{color:var(--muted);font-family:var(--font-display)}
.stage.win{border-color:var(--ok)}.stage.lose{border-color:var(--bad)}
.verdict{text-align:center;font-family:var(--font-display);font-size:1.6rem;min-height:1.8em}.verdict.win{color:var(--ok)}.verdict.lose{color:var(--bad)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700}.pick span{font-size:clamp(2.4rem,14vw,3.4rem);line-height:1.1}.pick:active{transform:scale(.96);border-color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:12px;font-family:var(--font-display);font-size:1.3rem}
</style>
</head>
<body>
<main>
  <h1>가위바위보 연승 ✊</h1>
  <div class="stats"><div class="stat"><small>현재 연승</small><b id="streak">0</b></div><div class="stat"><small>최고 연승</small><b id="best">0</b></div><div class="stat"><small>전적(승-무-패)</small><b id="rec">0-0-0</b></div></div>
  <div class="stage" id="stage"><div><div class="h" id="mine">❔</div><small>나</small></div><div class="vs">VS</div><div><div class="h" id="cpu">❔</div><small>컴퓨터</small></div></div>
  <div class="verdict" id="verdict" aria-live="polite">아래에서 하나를 내세요!</div>
  <div class="picks" id="picks"></div>
  <button class="btn" id="reset" type="button" style="background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:.95rem;font-weight:700">기록 지우기</button>
  <p class="muted">컴퓨터와 가위바위보를 해서 <b>이기면 연승이 하나씩 늘고</b>, 비기면 그대로, <b>지면 연승이 0으로 돌아가요.</b> 최고 연승을 노려 보세요!</p>
</main>
<script>
const HANDS = [{ e: "✊", n: "바위" }, { e: "✌️", n: "가위" }, { e: "✋", n: "보" }], KEY = "rpsstreak-v1";
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const beats = (a, b) => (a - b + 3) % 3 === 2;                 // 바위(0) > 가위(1) > 보(2) > 바위
let st = ld(KEY) || { streak: 0, best: 0, w: 0, d: 0, l: 0 }, locked = false;

function play(me) {
  if (locked) return; const cpu = Math.floor(Math.random() * 3); let res;
  if (me === cpu) { res = "draw"; st.d++; } else if (beats(me, cpu)) { res = "win"; st.w++; st.streak++; if (st.streak > st.best) st.best = st.streak; } else { res = "lose"; st.l++; st.streak = 0; }
  sv(KEY, st); show(me, cpu, res);
}
function show(me, cpu, res) {
  $("mine").textContent = HANDS[me].e; $("cpu").textContent = HANDS[cpu].e; $("stage").className = "stage " + (res === "win" ? "win" : res === "lose" ? "lose" : "");
  $("verdict").className = "verdict " + res; $("verdict").textContent = res === "win" ? `🎉 이겼어요! ${st.streak}연승` : res === "lose" ? "😢 졌어요. 연승이 끝났어요" : "🤝 비겼어요. 다시!";
  stats();
}
function stats() { $("streak").textContent = st.streak; $("best").textContent = st.best; $("rec").textContent = `${st.w}-${st.d}-${st.l}`; }
$("picks").innerHTML = HANDS.map((h, i) => `<button class="pick" type="button" data-p="${i}"><span>${h.e}</span>${h.n}</button>`).join("");
$("picks").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (b) play(+b.dataset.p); });
$("reset").onclick = () => { st = { streak: 0, best: 0, w: 0, d: 0, l: 0 }; sv(KEY, st); $("mine").textContent = $("cpu").textContent = "❔"; $("stage").className = "stage"; $("verdict").className = "verdict"; $("verdict").textContent = "기록을 지웠어요. 다시 시작!"; stats(); };
stats();
</script>
</body>
</html>
