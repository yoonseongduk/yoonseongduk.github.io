<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라이츠 아웃</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 5×5 불빛 판. 한 칸을 누르면 그 칸과 상하좌우가 함께 켜지고 꺼진다. 모두 끄면 성공 */
:root{--bg:#e9ecf5;--surface:#fff;--fg:#1b2033;--muted:#5f6881;--line:#d2d8e8;--off:#3a4466;--on:#ffd23f;--on2:#ffb300;--hint:#3fd0a3;--accent:#e8643f;--accent-fg:#fff;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1220;--surface:#191e33;--fg:#e8ecf8;--muted:#95a0c0;--line:#2a3252;--off:#2a3150;--on:#ffd84d;--on2:#ffb938;--hint:#3fd0a3;--accent:#ff7f5a;--accent-fg:#0f1220;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}
p{margin:0}.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.5rem}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:var(--line);padding:8px;border-radius:18px}
.l{aspect-ratio:1;border:0;border-radius:14px;background:var(--off);transition:background .12s,box-shadow .12s;padding:0}
.l.on{background:radial-gradient(circle at 35% 30%,var(--on),var(--on2));box-shadow:0 0 14px 2px rgba(255,200,40,.55)}
.l.hint{outline:4px solid var(--hint);outline-offset:-4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}
.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:12px;font-family:var(--font-display);font-size:1.3rem}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}
@media(prefers-reduced-motion:reduce){.l{transition:none}}
</style>
</head>
<body>
<main>
  <h1>라이츠 아웃 💡</h1>
  <div class="stats"><div class="stat"><small>이동</small><b id="moves">0</b></div><div class="stat"><small>켜진 불</small><b id="lit">0</b></div><div class="stat"><small>최고(이동)</small><b id="best">-</b></div></div>
  <div class="board" id="board"></div>
  <div class="res" id="res" hidden></div>
  <div class="seg" id="levels" role="radiogroup" aria-label="난이도"></div>
  <div class="row"><button class="btn ghost" id="hint" type="button">💡 힌트</button><button class="btn" id="newGame" type="button">새 판</button></div>
  <p class="muted">칸을 누르면 <b>그 칸과 위·아래·왼쪽·오른쪽</b> 불이 함께 켜지거나 꺼져요. 모든 불을 끄면 성공! 힌트는 눌러야 할 칸 하나를 초록색 테두리로 알려 줘요. (힌트를 쓰면 기록은 남지 않아요)</p>
</main>
<script>
const N = 5, LV = { easy: { n: 4, label: "쉬움", hint: "4번 눌러서 섞음" }, normal: { n: 9, label: "보통", hint: "9번 눌러서 섞음" }, hard: { n: 16, label: "어려움", hint: "16번 눌러서 섞음" } };
const BEST = "lightsout-best-v1", LVKEY = "lightsout-level-v1";
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let level = (ld(LVKEY) in LV) ? ld(LVKEY) : "normal", g = [], moves = 0, done = false, hintCell = -1, hinted = false, best = ld(BEST) || {};

const around = i => { const r = Math.floor(i / N), c = i % N, o = [i]; if (r > 0) o.push(i - N); if (r < N - 1) o.push(i + N); if (c > 0) o.push(i - 1); if (c < N - 1) o.push(i + 1); return o; };
const press = (a, i) => { around(i).forEach(j => { a[j] ^= 1; }); };
// 모두 꺼진 판에서 시작해 무작위로 눌러서 섞는다. 그래서 항상 풀 수 있다. (같은 칸을 두 번 누르면 원래대로라 서로 다른 칸만 뽑는다)
function shuffled(n) {
  let a;
  do { a = Array(N * N).fill(0); const cells = Array.from({ length: N * N }, (_, i) => i); for (let k = 0; k < n; k++) { const j = k + Math.floor(Math.random() * (cells.length - k)); [cells[k], cells[j]] = [cells[j], cells[k]]; press(a, cells[k]); } } while (a.every(v => !v));
  return a;
}
// 힌트: 가우스 소거법(0과 1의 덧셈)으로 '눌러야 할 칸의 집합'을 구한다. 그 집합의 칸을 하나 알려 주면 된다.
function solve(a) {
  const M = N * N, rows = Array.from({ length: M }, (_, r) => { const row = Array(M + 1).fill(0); around(r).forEach(j => { row[j] = 1; }); row[M] = a[r]; return row; });
  const piv = []; let r = 0;
  for (let c = 0; c < M && r < M; c++) {
    let p = -1; for (let k = r; k < M; k++) if (rows[k][c]) { p = k; break; } if (p < 0) continue;
    [rows[r], rows[p]] = [rows[p], rows[r]];
    for (let k = 0; k < M; k++) if (k !== r && rows[k][c]) for (let j = c; j <= M; j++) rows[k][j] ^= rows[r][j];
    piv.push(c); r++;
  }
  for (let k = r; k < M; k++) if (rows[k][M]) return null;
  const x = Array(M).fill(0); piv.forEach((c, i) => { x[c] = rows[i][M]; }); return x;
}
function newGame() { g = shuffled(LV[level].n); moves = 0; done = false; hintCell = -1; hinted = false; $("res").hidden = true; render(); }
function tap(i) {
  if (done) return; press(g, i); moves++; hintCell = -1;
  if (g.every(v => !v)) {
    done = true; let t = `${moves}번 만에 모두 껐어요.`;
    if (!hinted && (!best[level] || moves < best[level])) { best[level] = moves; sv(BEST, best); t += " 🏆 최고 기록이에요!"; } else if (hinted) t += " (힌트를 써서 기록은 남지 않아요)";
    $("res").innerHTML = `<b>🎉 성공!</b><p class="muted">${t}</p>`; $("res").hidden = false;
  }
  render();
}
function hint() {
  if (done) return; const x = solve(g); if (!x) return;
  const opts = x.map((v, i) => v ? i : -1).filter(i => i >= 0); if (!opts.length) return;
  hintCell = opts[Math.floor(Math.random() * opts.length)]; hinted = true; render();
}
function render() {
  $("board").innerHTML = g.map((v, i) => `<button type="button" class="l ${v ? "on" : ""} ${i === hintCell ? "hint" : ""}" data-i="${i}" aria-label="${v ? "켜짐" : "꺼짐"}" aria-pressed="${!!v}" ${done ? "disabled" : ""}></button>`).join("");
  $("moves").textContent = moves; $("lit").textContent = g.filter(v => v).length; $("best").textContent = best[level] ? best[level] + "번" : "-";
  $("levels").innerHTML = Object.keys(LV).map(k => `<button type="button" class="${k === level ? "on" : ""}" data-l="${k}" role="radio" aria-checked="${k === level}">${LV[k].label}<small>${LV[k].hint}</small></button>`).join("");
  $("hint").disabled = done;
}
$("board").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) tap(+b.dataset.i); });
$("levels").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (!b || b.dataset.l === level) return; level = b.dataset.l; sv(LVKEY, level); newGame(); });
$("hint").onclick = hint; $("newGame").onclick = newGame;
newGame();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
