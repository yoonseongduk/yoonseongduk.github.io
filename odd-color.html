<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다른 색 찾기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 시간 막대와 점수 줄, 같은 색 칸들 사이에 살짝 다른 색 하나가 숨어 있는 정사각형 판. 단계가 오르면 칸이 늘고 색 차이는 줄어든다 */
:root{--bg:#f1f3f8;--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:#d8deea;--accent:#e8643f;--accent-fg:#fff;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10131c;--surface:#1a1f2e;--fg:#e9edf7;--muted:#97a1b9;--line:#2c3448;--accent:#ff7f5a;--accent-fg:#10131c;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .2s linear}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:6px;touch-action:manipulation;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.c{aspect-ratio:1;border:0;border-radius:10px;padding:0}.c.bad{outline:4px solid var(--bad)}.c.ok{outline:4px solid #fff;box-shadow:0 0 0 7px var(--accent)}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.5rem}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>다른 색 찾기 👀</h1>
  <div class="bar"><i id="bar"></i></div>
  <div class="stats"><div class="stat"><small>남은 시간</small><b id="time">30</b></div><div class="stat"><small>단계</small><b id="stage">1</b></div><div class="stat"><small>최고 단계</small><b id="best">0</b></div></div>
  <div class="grid" id="grid"></div>
  <div class="res" id="res" hidden></div>
  <button class="btn" id="start" type="button">시작</button>
  <p class="muted">같은 색 칸들 사이에서 <b>색이 살짝 다른 칸 하나</b>를 누르세요. 맞히면 다음 단계(칸이 늘어나고 색 차이는 줄어요). 30초 안에 최대한 높은 단계까지 가 보세요. 틀리면 시간이 3초 줄어요.</p>
</main>
<script>
const DUR = 30, KEY = "oddcolor-best-v1";
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let stage = 1, odd = 0, endAt = 0, timer = 0, state = "idle", best = ld(KEY) || 0, hue = 0, lock = false;

// 단계가 오를수록 칸이 늘고(2×2 → 최대 8×8) 색 차이가 줄어든다 (밝기 차이 24% → 최소 3%)
const size = s => Math.min(8, 2 + Math.floor((s + 1) / 2));
const diff = s => Math.max(3, 24 - s * 1.8);
function nextRound() {
  const n = size(stage), cells = n * n; odd = Math.floor(Math.random() * cells); hue = Math.floor(Math.random() * 360);
  const sat = 55 + Math.floor(Math.random() * 20), light = 50, d = diff(stage), oddL = light + (Math.random() < .5 ? d : -d);
  $("grid").style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  $("grid").innerHTML = Array.from({ length: cells }, (_, i) => `<button class="c" type="button" data-i="${i}" style="background:hsl(${hue} ${sat}% ${i === odd ? oddL : light}%)" aria-label="칸 ${i + 1}"></button>`).join("");
  $("stage").textContent = stage; lock = false;
}
function tick() { const left = Math.max(0, (endAt - Date.now()) / 1000); $("time").textContent = Math.ceil(left); $("bar").style.width = (left / DUR * 100) + "%"; if (!left) finish(); }
function start() { $("grid").style.opacity = 1; stage = 1; state = "play"; endAt = Date.now() + DUR * 1000; $("res").hidden = true; $("start").hidden = true; clearInterval(timer); timer = setInterval(tick, 100); nextRound(); tick(); }
function pick(i, el) {
  if (state !== "play" || lock) return;
  if (i === odd) { stage++; nextRound(); }
  else { lock = true; endAt -= 3000; el.classList.add("bad"); document.querySelector(`[data-i="${odd}"]`).classList.add("ok"); setTimeout(() => { if (state === "play") nextRound(); }, 450); tick(); }
}
function finish() {
  clearInterval(timer); state = "over"; $("bar").style.width = "0%"; $("time").textContent = 0; const reached = stage; let note = "";
  if (reached > best) { best = reached; sv(KEY, best); note = " 🏆 최고 기록이에요!"; } $("best").textContent = best;
  $("res").innerHTML = `<b>${reached}단계까지 갔어요!</b><p class="muted">${reached >= 20 ? "눈이 정말 좋아요 🦅" : reached >= 12 ? "대단해요 👏" : "한 번 더 도전해 볼까요?"}${note}</p>`; $("res").hidden = false; $("start").hidden = false; $("start").textContent = "다시 하기";
}
$("grid").addEventListener("pointerdown", e => { const c = e.target.closest("[data-i]"); if (c) { e.preventDefault(); pick(+c.dataset.i, c); } });
$("start").onclick = start; $("best").textContent = best; nextRound(); $("grid").style.opacity = .55;       // 시작 전에는 흐리게 보여 준다
</script>
</body>
</html>
