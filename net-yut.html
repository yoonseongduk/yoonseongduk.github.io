.ystk.k1{--x:-58px;--r:560deg}.ystk.k2{--x:-20px;--r:-640deg;animation-delay:.04s}.ystk.k3{--x:20px;--r:700deg;animation-delay:.08s}.ystk.k4{--x:58px;--r:-600deg;animation-delay:.02s}

<body>
<main>
  <h1>윷놀이 (같이 하기) <img src="yut-img/yut_icon.svg" alt="" style="height:1.1em;vertical-align:-.15em;border-radius:4px"></h1>
  <div class="card"><p class="center" id="st"></p><div id="brd"></div><div class="center"><div class="sticks" id="sticks"><img class="yready" src="yut-img/yut_ready.svg" alt="윷가락 네 개" draggable="false"></div><p class="big center" id="res" style="font-size:1.8rem;min-height:1.3em"></p></div><p class="center note" id="pnl"></p><div class="pcsb" id="pick" hidden></div><button class="btn" id="th" type="button" hidden>윷 던지기</button><button class="btn" id="go" type="button" hidden>▶ 시작하기</button><p class="center note" id="sc"></p><div id="rules"></div></div>
  <p class="muted">일반 규칙 윷놀이예요. 2~4명이 각자 말 4개를 가지고, 먼저 모두 도착시키면 이겨요. 방장이 ▶ 시작하기를 눌러요. 지름길(5번·10번·가운데), 업기, 빽도, 잡기가 있고 윷·모·잡기는 한 번 더 던져요. 던지고 나면 움직일 말을 골라요(초록 칸을 눌러도 돼요). 규칙은 화면 맨 아래에 있어요.</p>
</main>
<script src="yut-core.js"></script>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "net-yut-v1";

// 같이 하기 화면과 말 주고받기. 혼자 열면 안내만 보여요.
const NET = (() => {
  const inHub = window.parent !== window, cb = { init: [], msg: [], roster: [] }; let info = null;
  const post = m => { try { window.parent.postMessage(m, "*"); } catch (e) {} };
  addEventListener("message", e => { if (e.source !== window.parent) return; const m = e.data || {};
    if (m.fg === "init") { info = m; cb.init.forEach(f => f(m)); } else if (m.fg === "roster" && info) { info.players = m.players; cb.roster.forEach(f => f(m.players)); } else if (m.fg === "msg") cb.msg.forEach(f => f(m.from, m.d)); });
  // 높이는 내용(main) 기준으로 재요. 문서 전체 높이는 화면 칸보다 작아지지 않아서, 짧은 게임으로 바꿔도 줄지 않거든요.
  const fit = () => { const m = document.querySelector("main"); post({ fg: "h", h: Math.ceil((m ? m.getBoundingClientRect().bottom : document.body.scrollHeight) + 12) }); };
  if (inHub) { document.documentElement.classList.add("inhub"); try { new ResizeObserver(fit).observe(document.body); } catch (e) { setInterval(fit, 500); } addEventListener("load", () => post({ fg: "ready" })); }
  return { inHub, get info() { return info; }, on: (k, f) => cb[k].push(f), send: (to, d) => post({ fg: "send", to, d }) };
})();
const nameOf = id => { const p = (NET.info && NET.info.players || []).find(x => x.id === id); return p ? p.name : "?"; };
if (!NET.inHub) document.addEventListener("DOMContentLoaded", () => { document.querySelector("main").insertAdjacentHTML("afterbegin", '<div class="card"><p>이 게임은 <b>👫 같이 하기</b> 화면 안에서 폰 여러 대를 연결해 해요.</p><a class="btn" style="text-align:center;text-decoration:none" href="play-together.html">같이 하기 열기</a></div>'); });

let me = null, isHost = false, P = null, players = [];
const H = {};
function pushS() { if (!isHost) return; P.nm = Object.fromEntries(players.map(p => [p.id, p.name])); NET.send("*", { t: "state", P }); render(); if (typeof afterPush === "function") afterPush(); }
const act = d => { if (isHost) onAct("host", d); else NET.send("host", d); };
const privTo = (id, d) => { d.t = "priv"; if (id === me) onPriv(d); else NET.send(id, d); };
const pn = id => id === me ? "나" : (P && P.nm && P.nm[id]) || "?";
const ids = () => players.map(p => p.id);
NET.on("init", m => { me = m.me.id; isHost = m.isHost; players = m.players; if (isHost) { P = initState(); pushS(); } else NET.send("host", { t: "hello" }); render(); });
NET.on("roster", ps => { players = ps; if (isHost && P) { onRoster(); pushS(); } else render(); });
NET.on("msg", (from, d) => { if (isHost) { if (d.t === "hello") pushS(); else onAct(from, d); } else if (d.t === "state") { const was = P; P = d.P; changed(was); render(); } else if (d.t === "priv") onPriv(d); });
const buzzV = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

const Y = window.YutCore, YCOL = ["#3b6fd6", "#d6453a", "#2f9d62", "#8a4fc2"];   // 1~4번째 편 색(파랑·빨강·초록·보라)
// 말판 그리기(한지 바탕에 붉은 테두리, 카드 그림과 같은 분위기). sides = [{s: 편 상태, c: 색, nm: 이름}], hl = 도착할 수 있는 칸 목록(눌러서 고르기)
function yBoard(sides, hl) {
  const X = Y.XY, hs = new Set(hl || []), ex = sides.length > 2 ? 44 : 0;   // 3~4명이면 아래 칸을 두 줄로 늘려요
  const L = (a, b, c) => `<line x1="${X[a][0]}" y1="${X[a][1]}" x2="${X[b][0]}" y2="${X[b][1]}" class="yl${c || ""}"/>`;
  let h = `<defs><radialGradient id="ygB" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#FBF3E1"/><stop offset="1" stop-color="#EBD9B0"/></radialGradient></defs>`
    + `<rect x="2" y="2" width="316" height="${356 + ex}" rx="24" fill="#8E1F1F"/><rect x="8" y="8" width="304" height="${344 + ex}" rx="19" fill="url(#ygB)"/><rect x="13" y="13" width="294" height="${334 + ex}" rx="15" fill="none" stroke="#C9A56A" stroke-width="1" stroke-dasharray="2 4"/>`
    + `<polygon points="${[0, 5, 10, 15].map(i => X[i].join(",")).join(" ")}" class="yl"/>` + L(5, 22, " d") + L(22, 15, " d") + L(10, 22, " d") + L(22, 0, " d")
    + `<polygon points="291,150 283,168 299,168" fill="#8E1F1F"/><text x="291" y="184" class="yn s" text-anchor="middle" fill="#8E1F1F">출발</text>`;   // 출발 방향(위쪽으로 올라가요)
  for (let n = 0; n < 29; n++) {
    const big = Y.CORNER[n], r = big ? 18 : 11, on = hs.has(n) ? " hl" : "";
    h += `<circle cx="${X[n][0]}" cy="${X[n][1]}" r="${r}" class="yc${big ? " big" : ""}${n === 0 ? " go" : ""}${on}" data-to="${n}"/>`;
    h += n === 0 ? `<text x="${X[n][0]}" y="${X[n][1] - 2}" class="yn s w" text-anchor="middle">출발</text><text x="${X[n][0]}" y="${X[n][1] + 8}" class="yn s w" text-anchor="middle">도착</text>` : `<text x="${X[n][0]}" y="${X[n][1] + (big ? 4 : 3)}" class="yn${big ? " b" : ""}" text-anchor="middle">${n === 22 ? "중앙" : n}</text>`;
  }
  sides.forEach(sd => sd.s.stacks.forEach(st => { const [x, y] = X[st.at];
    h += `<g class="yt" data-to="${st.at}"><circle cx="${x}" cy="${y}" r="14" fill="${sd.c}" stroke="#fff" stroke-width="2.5"/><circle cx="${x - 4}" cy="${y - 5}" r="5" fill="#fff" opacity=".35"/>${st.n > 1 ? `<text x="${x}" y="${y + 5}" text-anchor="middle" class="ytn">${st.n}</text>` : ""}</g>`; }));
  h += `<line x1="22" y1="296" x2="298" y2="296" stroke="#C9A56A" stroke-width="1.2"/>`;   // 아래 칸: 출발 전 말(대기)과 도착 수
  const many = sides.length > 2;
  sides.forEach((sd, i) => { const left = many ? i % 2 === 0 : i === 0, w = sd.s.w, row = many ? Math.floor(i / 2) : 0, cy = 318 + row * 44, gap = many ? 24 : 28, r = many ? 9 : 11;
    for (let k = 0; k < 4; k++) { const x = left ? 34 + k * gap : 286 - k * gap, on = k < w;
      h += `<circle cx="${x}" cy="${cy}" r="${r}" fill="${on ? sd.c : "none"}" stroke="${on ? "#fff" : sd.c}" stroke-width="${on ? 2.5 : 1.5}" ${on ? "" : 'stroke-dasharray="3 3" opacity=".6"'}/>${on ? `<circle cx="${x - 3}" cy="${cy - 4}" r="${r * .36}" fill="#fff" opacity=".35"/>` : ""}`; }
    h += `<text x="${left ? 24 : 296}" y="${cy + 25}" class="yn s l" text-anchor="${left ? "start" : "end"}">${esc(sd.nm || "")} · ${many ? "전" : "출발 전"} ${w} · 도착 ${sd.s.done}/4</text>`; });
  return `<svg class="yb" viewBox="0 0 320 ${360 + ex}" role="img" aria-label="윷놀이 말판">${h}</svg>`;
}
const y2 = v => v - 4;
const yNode = n => n === 0 ? "출발·도착 칸" : n === 22 ? "가운데(22번)" : (n === 5 || n === 10 || n === 15 ? n + "번(모서리)" : n + "번 칸");
const yTo = t => t === Y.END ? "도착! 🏁" : t === 0 ? "출발·도착 칸에 멈춰요 (다음에 움직이면 도착)" : t === Y.HOME ? "출발 전으로 돌아가요" : yNode(t);
function yOpt(m, sd) { // 움직임 하나를 글로: "3번 칸의 말 2개(업은 말) → 8번 칸 · 잡기!"
  const from = m.from < 0 ? "출발 전 말 1개" : yNode(sd.stacks[m.from].at) + "의 말 " + m.n + "개" + (m.n > 1 ? "(업은 말)" : "");

}
const YIMG = { "-1": "backdo", 1: "do", 2: "gae", 3: "geol", 4: "yut", 5: "mo" };   // 결과 카드 그림: yut-img/yut_*.svg (사용자가 만든 그림)
Object.values(YIMG).forEach(k => { const im = new Image(); im.src = "yut-img/yut_" + k + ".svg"; });   // 던질 때 늦게 뜨지 않게 미리 불러와요
const yCard = n => YIMG[n] ? `<span class="ythrowbox"><span class="ystk k1"></span><span class="ystk k2"></span><span class="ystk k3"></span><span class="ystk k4"></span><img class="ycard" src="yut-img/yut_${YIMG[n]}.svg" alt="${Y.NAMES[n]}" draggable="false"></span>` : `<img class="yready" src="yut-img/yut_ready.svg" alt="윷가락 네 개" draggable="false">`;
function yPanel(sd, mark) { return `${mark} 출발 전 ${sd.w} · 도착 ${sd.done}/4` + (sd.stacks.length ? " · 판 위 " + sd.stacks.map(s => yNode(s.at) + (s.n > 1 ? " ×" + s.n : "")).join(", ") : ""); }
const yRules = () => `<details open><summary>📘 윷놀이 규칙 (일반 규칙)</summary><div class="note" style="margin-top:6px">
  <b>목표</b>: 내 말 <b>4개</b>를 먼저 모두 한 바퀴 돌려 <b>도착</b>시키면 이겨요.<br>
  <b>윷 던지기</b>: 가락 4개의 평평한 면(▬)이 몇 개인지 봐요.
  <table class="tbl"><tbody><tr><td><img class="yth" src="yut-img/yut_do.svg" alt="도"></td><td>평평한 면 1개</td><td><b>도</b> 1칸</td></tr><tr><td><img class="yth" src="yut-img/yut_gae.svg" alt="개"></td><td>2개</td><td><b>개</b> 2칸</td></tr><tr><td><img class="yth" src="yut-img/yut_geol.svg" alt="걸"></td><td>3개</td><td><b>걸</b> 3칸</td></tr><tr><td><img class="yth" src="yut-img/yut_yut.svg" alt="윷"></td><td>4개</td><td><b>윷</b> 4칸 · 한 번 더</td></tr><tr><td><img class="yth" src="yut-img/yut_mo.svg" alt="모"></td><td>0개(모두 둥글어요)</td><td><b>모</b> 5칸 · 한 번 더</td></tr><tr><td><img class="yth" src="yut-img/yut_backdo.svg" alt="빽도"></td><td>도인데 ✖ 표시 가락이 평평</td><td><b>빽도</b> 뒤로 1칸</td></tr></tbody></table>
  <b>말판</b>: 바깥 길을 반시계 방향으로 출발·도착 칸(0)에서 시작해 한 바퀴 돌아요. 말은 던진 칸 수만큼 움직여요.<br>&nbsp;&nbsp;• <b>출발·도착 칸에 정확히 서면</b> 말은 그 칸에 <b>남아 있어요</b>(상대가 정확히 서면 잡힐 수도 있어요). 다음에 그 말을 움직이면 몇 칸이든 <b>도착</b>이에요.<br>&nbsp;&nbsp;• 그 칸을 <b>넘어가면</b> 바로 도착이에요. (예: 가운데에서 걸=3칸이면 출발·도착 칸에 멈추고, 윷=4칸이면 도착)<br>
  <b>🔀 지름길</b>: 모서리 <b>5번</b>이나 <b>10번</b>에 <b>서 있다가</b> 다음에 움직이면 안쪽 길로 들어가요. 그냥 지나가기만 하면 바깥 길이에요.<br>
  &nbsp;&nbsp;• 5번에서 시작: 20→21→<b>가운데(22)</b>→23→24→15번으로 나와 바깥 길(15 이후)을 이어 가요.<br>
  &nbsp;&nbsp;• 10번에서 시작: 25→26→<b>가운데(22)</b>→27→28→출발·도착 칸 (가장 빨라요)<br>
  &nbsp;&nbsp;• 가운데(22)에 서 있다가 움직이면 27→28→출발·도착 칸 쪽으로 나가요.<br>
  <b>🤝 업기</b>: 내 말이 있는 칸에 내 다른 말이 도착하면 한 덩어리가 돼서 <b>함께 움직여요</b>(숫자로 표시). 이동할 때도, 잡힐 때도 같이예요.<br>
  <b>⚔️ 잡기</b>: 상대 말이 있는 칸에 서면 그 칸의 상대 말을 <b>모두 잡아</b> 출발 전으로 돌려보내요. 잡으면 <b>한 번 더</b> 던져요.<br>
  <b>↩️ 빽도</b>: 뒤로 한 칸(온 길을 따라). 출발 전 말은 움직일 수 없고, 1번 칸의 말은 출발 전으로 돌아가요. 움직일 말이 없으면 차례가 넘어가요.<br>
  <b>한 번 더</b>: 윷·모가 나오거나 상대 말을 잡았을 때예요.<br>
  <b>이 앱의 약속</b>: 던진 결과는 <b>바로 사용</b>해요(모아 두지 않아요). 움직일 수 있는 말이 하나뿐이면 자동으로 움직여요.</div></details>`;

const MK = ["🔵", "🔴", "🟢", "🟣"];
function initState() { return { ph: "wait", rno: 0, ord: [], s: {}, turn: null, roll: null, msg: "", tf: null, tn: "", tr: 0, tk: 0, win: null, sc: {} }; }
const nmOf = id => { const p = players.find(q => q.id === id); return p ? p.name : (P && P.nm && P.nm[id]) || "?"; };
const ixOf = id => (P && P.ord ? P.ord.indexOf(id) : -1), mk = id => MK[ixOf(id)] || "⚪";
const amPlayer = () => !!P && !!P.ord && P.ord.includes(me);
const oppsOf = id => P.ord.filter(x => x !== id).map(x => P.s[x]);
const nextOf = id => P.ord[(P.ord.indexOf(id) + 1) % P.ord.length];
const optsOf = (id, r) => Y.options(P.s[id], oppsOf(id), r);
function canStart(min, max) { const n = ids().length; if (n < min) { alert(min + "명 이상 연결돼야 해요."); return null; } return ids().slice(0, max); }
function onRoster() { if (P.ph === "play" && P.ord.some(id => !ids().includes(id))) { P.ph = "wait"; P.msg = "참가자가 나가서 이번 판을 멈췄어요. 방장이 새 판을 시작해 주세요."; } }
function resolveNet(from, r, k) {
  const ops = optsOf(from, r), mv = ops[k]; if (!mv) return false;
  const text = yOpt(mv, P.s[from]), res = Y.apply(P.s[from], oppsOf(from), mv, r); P.roll = null;
  P.msg = `${mk(from)} ${nmOf(from)}: ${text}` + (res.cap ? " → 상대 말을 잡았어요!" : "") + (res.fin ? ` (${res.fin}개 도착)` : "");
  if (Y.won(P.s[from])) { P.ph = "end"; P.win = from; P.sc[from] = (P.sc[from] || 0) + 1; } else if (res.extra) P.msg += " · 한 번 더 던져요!"; else P.turn = nextOf(from);
  return true;
}
function onAct(from, d) {
  if (d.t === "start" && from === "host" && P.ph !== "play") { const ps = canStart(2, 4); if (!ps) return; P.rno++;
    Object.assign(P, { ph: "play", ord: ps, s: Object.fromEntries(ps.map(id => [id, Y.newSide()])), turn: ps[(P.rno - 1) % ps.length], roll: null, msg: "", tf: null, tn: "", tr: 0, tk: 0, win: null }); pushS(); return; }
  if (P.ph !== "play" || from !== P.turn) return;
  if (d.t === "throw" && P.roll === null) {
    const t = Y.toss(); P.tf = t.flat; P.tn = t.name; P.tr = t.n; P.tk = (P.tk || 0) + 1; const ops = optsOf(from, t.n);
    if (!ops.length) { P.msg = `${mk(from)} ${nmOf(from)}: ${t.name}! 움직일 수 있는 말이 없어서 차례가 넘어가요`; P.turn = nextOf(from); }
    else if (ops.length === 1) resolveNet(from, t.n, 0);
    else { P.roll = t.n; P.msg = `${mk(from)} ${nmOf(from)}: ${t.name}! 움직일 말을 골라요`; }
  } else if (d.t === "move" && P.roll !== null) { if (!resolveNet(from, P.roll, +d.k)) return; }
  else return;
  pushS();
}
function changed(was) {}
function onPriv() {}
let shownK = -1;
function render() {
  const go = $("go");
  if (!P) { $("st").textContent = "연결을 기다리는 중…"; return; }
  go.hidden = !isHost || P.ph === "play"; go.textContent = P.rno ? `🔁 새 판 시작 (지금 ${ids().length}명)` : `▶ 시작하기 (지금 ${ids().length}명)`;
  if (!$("rules").firstChild) $("rules").innerHTML = yRules();
  if (P.ph === "wait") { $("st").textContent = (P.msg ? P.msg + " · " : "") + (isHost ? "2~4명이 할 수 있어요. ▶ 시작하기를 눌러요" : "방장이 시작하기를 기다려요…"); $("brd").innerHTML = ""; $("th").hidden = true; $("pick").hidden = true; $("pnl").textContent = ""; $("sc").textContent = scoreLine(); return; }
  const pl = amPlayer(), can = P.ph === "play" && P.turn === me, mine = can && P.roll !== null, ops = mine ? optsOf(me, P.roll) : [];
  $("st").textContent = P.ph === "end" ? (P.win === me ? "🎉 이겼어요!" : `🎉 ${mk(P.win)} ${pn(P.win)} 승리!`) : (P.msg ? P.msg + " · " : "") + (!pl ? `구경 중 · ${mk(P.turn)} ${pn(P.turn)} 차례` : can ? (P.roll !== null ? `${Y.NAMES[P.roll]}! 움직일 말을 골라요` : "내 차례! 윷을 던져요") : `${mk(P.turn)} ${pn(P.turn)} 차례예요…`);
  $("brd").innerHTML = yBoard(P.ord.map((id, i) => ({ s: P.s[id], c: YCOL[i], nm: pn(id) })), [...new Set(ops.filter(m => typeof m.to === "number").map(m => m.to))]);
  if (!P.tr) { $("sticks").innerHTML = yCard(0); shownK = -1; } else if (shownK !== P.tk) { $("sticks").innerHTML = yCard(P.tr); shownK = P.tk; }   // 새로 던졌을 때만 다시 그려서 튀어나오는 동작이 한 번만 보이게
  $("res").textContent = P.tn || "";
  $("pnl").innerHTML = P.ord.map(id => esc(mk(id) + " " + pn(id) + ": " + yPanel(P.s[id], "").trim())).join("<br>");
  $("th").hidden = !(can && P.roll === null && P.ph === "play"); $("pick").hidden = !mine;
  $("pick").innerHTML = mine ? ops.map((m, k) => `<button class="btn ghost sm" type="button" data-k="${k}">${esc(yOpt(m, P.s[me]))}</button>`).join("") : "";
  $("sc").textContent = scoreLine();
}
const scoreLine = () => P && P.ord && P.ord.length && Object.keys(P.sc).length ? "승리 · " + P.ord.map(id => `${pn(id)} ${P.sc[id] || 0}`).join(" · ") : "";
$("go").onclick = () => act({ t: "start" });
$("th").onclick = () => act({ t: "throw" });
$("pick").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) act({ t: "move", k: +b.dataset.k }); });
$("brd").addEventListener("click", e => { const c = e.target.closest("[data-to]"); if (!c || !P || !P.s || P.turn !== me || P.roll === null) return; const k = optsOf(me, P.roll).findIndex(m => m.to === +c.dataset.to); if (k >= 0) act({ t: "move", k }); });
render();
