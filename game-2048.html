<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 점수 칸 위, 정사각형 판 가운데, 새 게임 버튼 아래. 판 위에서 밀면(스와이프) 타일이 움직인다 */
:root{--bg:#f3efe6;--surface:#fffdf8;--fg:#2b2620;--muted:#7a7164;--line:#ddd5c6;--board:#b9ad9a;--cell:#cdc3b1;--accent:#e8643f;--accent-fg:#fff;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1814;--surface:#27221c;--fg:#f1ebe0;--muted:#a89f90;--line:#3a342b;--board:#3a342b;--cell:#2c2720;--accent:#ff7f5a;--accent-fg:#1b1814;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2.4rem;margin:0;line-height:1.1}
p{margin:0}.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scores{display:flex;gap:8px}
.sc{background:var(--board);color:#fff;border-radius:10px;padding:4px 14px;text-align:center;min-width:76px}
.sc small{display:block;font-size:.7rem;letter-spacing:.06em;opacity:.85}.sc b{font-family:var(--font-display);font-weight:400;font-size:1.3rem;font-variant-numeric:tabular-nums}
.board{position:relative;width:100%;aspect-ratio:1;background:var(--board);border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;touch-action:none}
.t{border-radius:10px;background:var(--cell);display:grid;place-items:center;font-family:var(--font-display);font-size:clamp(1.5rem,9vw,2.4rem);line-height:1;min-width:0;color:#4a4036}
.t.new{animation:pop .15s ease-out}.t.mg{animation:pulse .18s ease-out}
@keyframes pop{from{transform:scale(.3)}}@keyframes pulse{50%{transform:scale(1.15)}}
.v2{background:#eee4da}.v4{background:#ede0c8}.v8{background:#f2b179;color:#fff}.v16{background:#f59563;color:#fff}.v32{background:#f67c5f;color:#fff}.v64{background:#f65e3b;color:#fff}
.v128{background:#edcf72;color:#fff;font-size:clamp(1.3rem,8vw,2.1rem)}.v256{background:#edcc61;color:#fff;font-size:clamp(1.3rem,8vw,2.1rem)}.v512{background:#edc850;color:#fff;font-size:clamp(1.3rem,8vw,2.1rem)}
.v1024{background:#edc53f;color:#fff;font-size:clamp(1.1rem,6.5vw,1.8rem)}.v2048{background:#edc22e;color:#fff;font-size:clamp(1.1rem,6.5vw,1.8rem)}.vbig{background:#3c3a32;color:#fff;font-size:clamp(1rem,6vw,1.6rem)}
.over{position:absolute;inset:0;border-radius:14px;background:rgba(243,239,230,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
@media(prefers-color-scheme:dark){.over{background:rgba(27,24,20,.85)}}
.over b{font-family:var(--font-display);font-weight:400;font-size:2rem}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:10px 18px;font-family:var(--font-display);font-size:1.2rem}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){.t.new,.t.mg{animation:none}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>2048</h1><div class="scores"><div class="sc"><small>점수</small><b id="score">0</b></div><div class="sc"><small>최고</small><b id="best">0</b></div></div></div>
  <p class="muted">숫자 타일을 <b>밀어서(스와이프)</b> 같은 숫자끼리 합치세요. 2048을 만들면 성공! (컴퓨터는 화살표 키)</p>
  <div class="board" id="board" aria-label="2048 판"></div>
  <button class="btn" id="newGame" type="button">새 게임</button>
</main>
<script>
const N = 4, KEY = "game2048-v1", BEST = "game2048-best-v1";
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let b, score = 0, best = ld(BEST) || 0, won = false, keep = false, fx = {}, dead = false;

// 한 줄을 왼쪽으로 밀어 합친다. 합쳐서 생긴 칸은 다시 합치지 않는다. (예: 2 2 2 2 → 4 4 0 0)
function slide(line) {
  const v = line.filter(x => x), out = []; let gained = 0, merged = [];
  for (let i = 0; i < v.length; i++) {
    if (v[i] === v[i + 1]) { out.push(v[i] * 2); gained += v[i] * 2; merged.push(out.length - 1); i++; } else out.push(v[i]);
  }
  while (out.length < N) out.push(0);
  return { out, gained, merged };
}
// 방향별로 줄을 뽑는 좌표. 0 왼쪽, 1 위, 2 오른쪽, 3 아래
const coords = (d, k) => Array.from({ length: N }, (_, i) => d === 0 ? [k, i] : d === 2 ? [k, N - 1 - i] : d === 1 ? [i, k] : [N - 1 - i, k]);
function move(d) {
  if (dead) return false;
  let moved = false, gained = 0; fx = {};
  for (let k = 0; k < N; k++) {
    const cs = coords(d, k), line = cs.map(([r, c]) => b[r][c]), res = slide(line);
    res.out.forEach((v, i) => { const [r, c] = cs[i]; if (b[r][c] !== v) moved = true; b[r][c] = v; });
    res.merged.forEach(i => { const [r, c] = cs[i]; fx[r + "," + c] = "mg"; });
    gained += res.gained;
  }
  if (!moved) return false;
  score += gained; if (score > best) { best = score; sv(BEST, best); }
  spawn();
  if (!won && b.flat().includes(2048)) { won = true; }
  dead = !canMove(); save(); render(); return true;
}
function spawn() {
  const e = []; b.forEach((row, r) => row.forEach((v, c) => { if (!v) e.push([r, c]); }));
  if (!e.length) return; const [r, c] = e[Math.floor(Math.random() * e.length)];
  b[r][c] = Math.random() < 0.9 ? 2 : 4; fx[r + "," + c] = "new";
}
function canMove() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const v = b[r][c]; if (!v) return true; if (c < N - 1 && b[r][c + 1] === v) return true; if (r < N - 1 && b[r + 1][c] === v) return true; }
  return false;
}
const cls = v => !v ? "" : v <= 2048 ? "v" + v : "vbig";
function render() {
  $("score").textContent = score; $("best").textContent = best;
  let h = b.map((row, r) => row.map((v, c) => `<div class="t ${cls(v)} ${fx[r + "," + c] || ""}">${v || ""}</div>`).join("")).join("");
  if (dead) h += `<div class="over"><b>게임 오버</b><p>점수 ${score}</p><button class="btn" data-a="new" type="button">다시 하기</button></div>`;
  else if (won && !keep) h += `<div class="over"><b>🎉 2048 달성!</b><div class="row"><button class="btn" data-a="keep" type="button">계속하기</button><button class="btn ghost" data-a="new" type="button">새 게임</button></div></div>`;
  $("board").innerHTML = h;
}
function save() { sv(KEY, { b, score, won, keep, dead }); }
function newGame() { b = Array.from({ length: N }, () => Array(N).fill(0)); score = 0; won = false; keep = false; dead = false; fx = {}; spawn(); spawn(); save(); render(); }

document.addEventListener("keydown", e => { const d = { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3 }[e.key]; if (d === undefined) return; e.preventDefault(); if (!(won && !keep)) move(d); });
let sx = 0, sy = 0;
$("board").addEventListener("touchstart", e => { sx = e.changedTouches[0].clientX; sy = e.changedTouches[0].clientY; }, { passive: true });
$("board").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (!(won && !keep)) move(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 0 : 2) : (dy < 0 ? 1 : 3));
});
$("board").addEventListener("click", e => { const a = e.target.closest("[data-a]"); if (!a) return; if (a.dataset.a === "new") newGame(); else { keep = true; save(); render(); } });
$("newGame").onclick = newGame;
const s = ld(KEY);
if (s && Array.isArray(s.b) && s.b.length === N && s.b.every(r => Array.isArray(r) && r.length === N)) { b = s.b; score = s.score || 0; won = !!s.won; keep = !!s.keep; dead = !!s.dead; render(); } else newGame();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
