<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파이프 연결</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4552b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 게임">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-48.png">

<style>
/* 레이아웃: 제목 아래에 설정과 결과 카드를 위에서 아래로 쌓는다. 버튼은 크게, 결과는 눈에 띄게 */
:root{--bg:hsl(190 30% 95%);--surface:#fff;--fg:#1c2233;--muted:#626b82;--line:hsl(190 22% 86%);--accent:hsl(190 65% 46%);--accent-fg:#fff;--soft:hsl(190 45% 92%);--ok:#1f9d62;--bad:#d6453a;--font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:hsl(190 22% 10%);--surface:hsl(190 18% 15%);--fg:#e9edf7;--muted:#97a1b9;--line:hsl(190 16% 25%);--accent:hsl(190 75% 68%);--accent-fg:#10131c;--soft:hsl(190 20% 20%);--ok:#4cc98a;--bad:#ff7b68;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0}h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:0}p{margin:0}.muted{color:var(--muted);font-size:.9rem}.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;line-height:1.3}.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px;font-family:var(--font-display);font-size:1.3rem}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--font-body);font-size:1rem;font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step div{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:1.4rem;line-height:1}.step b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:center}
input[type=text],input[type=number],textarea{width:100%;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;user-select:text;-webkit-user-select:text}textarea{resize:vertical;min-height:96px}
.res{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.res b{font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.big{font-family:var(--font-display);font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pgrid{display:grid;gap:3px;background:var(--line);padding:3px;border-radius:12px;max-width:380px;margin:0 auto;width:100%}.pp{position:relative;aspect-ratio:1;background:var(--surface);border:0;border-radius:6px;padding:0;min-width:0}.pp i{position:absolute;background:var(--muted);display:none}.pp i.u,.pp i.r,.pp i.d,.pp i.l{display:block}.pp i.u{left:42%;width:16%;top:0;height:50%}.pp i.d{left:42%;width:16%;bottom:0;height:50%}.pp i.l{top:42%;height:16%;left:0;width:50%}.pp i.r{top:42%;height:16%;right:0;width:50%}.pp s{position:absolute;left:38%;top:38%;width:24%;height:24%;border-radius:50%;background:var(--muted)}.pp.wet i,.pp.wet s{background:#2f8fe0}.pp.wet{background:color-mix(in srgb,#2f8fe0 12%,var(--surface))}.src{position:absolute;z-index:2;left:2px;top:0;font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>파이프 연결 🔧</h1>
  <div class="seg" id="lv" style="--n:3"><button type="button" data-n="4" class="on">4×4<small>쉬움</small></button><button type="button" data-n="5">5×5<small>보통</small></button><button type="button" data-n="6">6×6<small>어려움</small></button></div>
  <div class="stats"><div class="stat"><small>돌린 횟수</small><b id="moves">0</b></div><div class="stat"><small>연결</small><b id="conn">0</b></div><div class="stat"><small>최소 기록</small><b id="best">-</b></div></div>
  <div class="pgrid" id="grid"></div>
  <div class="res" id="res" hidden></div>
  <button class="btn ghost" id="again" type="button">새 판</button>
  <p class="muted">파이프 조각을 <b>눌러서 돌려</b> 왼쪽 위 💧 물 나오는 곳에서 모든 파이프가 이어지도록 만드세요. 물이 닿은 파이프는 파랗게 변해요. 모든 파이프가 파랗게 되면 성공!</p>
</main>
<script>
const $ = id => document.getElementById(id);
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = "pipeconnect-best-v1";
// 조각의 연결 방향을 비트로: 1 위, 2 오른쪽, 4 아래, 8 왼쪽
let N = 4, mask = [], SOL = [], moves = 0, done = false, best = ld(KEY) || {};
const rot = m => ((m << 1) | (m >> 3)) & 15;
function gen() {
  const adj = Array(N * N).fill(0), seen = new Set([0]), st = [0];                       // 무작위 신장 트리로 파이프 길을 만든다
  while (seen.size < N * N) { const a = [...seen][ri(0, seen.size - 1)], r = Math.floor(a / N), c = a % N, nb = [[r - 1, c, 1, 4], [r, c + 1, 2, 8], [r + 1, c, 4, 1], [r, c - 1, 8, 2]].filter(([y, x]) => y >= 0 && y < N && x >= 0 && x < N && !seen.has(y * N + x)); if (!nb.length) continue; const [y, x, d1, d2] = nb[ri(0, nb.length - 1)]; adj[a] |= d1; adj[y * N + x] |= d2; seen.add(y * N + x); }
  return adj;
}
function newGame() { const sol = gen(); SOL = sol; mask = sol.map(m => { let t = m; for (let k = ri(0, 3); k > 0; k--) t = rot(t); return t; }); if (wet().size === N * N) return newGame(); moves = 0; done = false; $("res").hidden = true; $("grid").style.gridTemplateColumns = `repeat(${N}, 1fr)`; render(); }
function wet() { const w = new Set([0]), st = [0]; while (st.length) { const a = st.pop(), r = Math.floor(a / N), c = a % N; for (const [y, x, d1, d2] of [[r - 1, c, 1, 4], [r, c + 1, 2, 8], [r + 1, c, 4, 1], [r, c - 1, 8, 2]]) { if (y < 0 || y >= N || x < 0 || x >= N) continue; const b = y * N + x; if ((mask[a] & d1) && (mask[b] & d2) && !w.has(b)) { w.add(b); st.push(b); } } } return w; }
function render() {
  const w = wet(); $("grid").innerHTML = mask.map((m, k) => `<button type="button" class="pp${w.has(k) ? " wet" : ""}" data-k="${k}" aria-label="파이프 ${k + 1}">${k === 0 ? '<b class="src">💧</b>' : ""}<i class="${m & 1 ? "u" : ""}"></i><i class="${m & 2 ? "r" : ""}"></i><i class="${m & 4 ? "d" : ""}"></i><i class="${m & 8 ? "l" : ""}"></i><s></s></button>`).join("");
  $("moves").textContent = moves; $("conn").textContent = w.size + "/" + N * N; $("best").textContent = best[N] || "-";
}
function turn(k) {
  if (done) return; mask[k] = rot(mask[k]); moves++; render();
  if (wet().size === N * N) { done = true; const nb = !best[N] || moves < best[N]; if (nb) { best[N] = moves; sv(KEY, best); } $("res").innerHTML = `<b>🎉 모두 연결! ${moves}번</b><p class="muted">${nb ? "신기록이에요!" : "최소 기록 " + best[N] + "번"}</p>`; $("res").hidden = false; render(); }
}
$("grid").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) turn(+b.dataset.k); });
$("lv").addEventListener("click", e => { const b = e.target.closest("[data-n]"); if (!b) return; document.querySelectorAll("#lv button").forEach(x => x.classList.toggle("on", x === b)); N = +b.dataset.n; newGame(); });
$("again").onclick = newGame; newGame();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
